# Nginx edge for the RunPod single-Pod deployment.
#
# Derived from deploy/nginx/nginx.conf + app-locations.conf, with two
# differences and no others:
#
#   1. NO :443 SERVER AND NO CERTIFICATE. RunPod's proxy terminates TLS at
#      https://<POD_ID>-80.proxy.runpod.net and forwards plaintext to this
#      listener. A second, self-signed TLS layer inside the Pod would have to
#      be distrusted-but-accepted by everything upstream of it for no gain.
#      X-Forwarded-Proto is therefore pinned to "https" rather than taken
#      from $scheme -- the client's scheme IS https, and it is the proxy, not
#      this server, that knows it.
#
#   2. A LITERAL upstream address, not a variable. The upstream/variable
#      dance in deploy/nginx/app-locations.conf exists because Compose hands
#      a recreated container a NEW IP and nginx caches an `upstream` name for
#      the process lifetime. Here the app is a sibling process on loopback:
#      the address 127.0.0.1:8000 cannot change, and there is no DNS in the
#      path at all, so `resolver` is unnecessary and would have nothing to
#      resolve.
#
# Rate limiting, security headers and the HSTS map (P1-7,
# p1-hardening-plan.md §3 step 9) are NOT a third difference: the same zones,
# the same three headers and the same per-location directives as
# deploy/nginx/app-locations.conf are reproduced below verbatim (there is
# nothing to `include` across two files here -- this Pod has exactly one
# server block already). One nuance specific to THIS topology: RunPod's own
# proxy sits in front of this nginx and is what actually terminates TLS the
# browser sees, so `$host`/`Host` here reflect whatever RunPod's proxy
# forwards -- verify that is the real public hostname before relying on it
# for `$hsts_header` below (docs/deploy-runpod.md §8.3, custom domain).

user  www-data;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Correlation + JSON access log (capacity 0.6) ──────────────────────
    # The edge is the FIRST hop of every request, so it is the only place that
    # can guarantee a correlation id exists at all -- the app can mint one for
    # itself, but a line it mints is a line nginx never saw, and «سطرُ الحافّة
    # والتطبيق والعامل باستعلامٍ واحد» (0.6's acceptance criterion) needs all
    # three to say the SAME id.
    #
    # `$request_id` is nginx's own per-request 32-hex identifier, unique per
    # request and generated for free. It is used for two DIFFERENT things on
    # purpose:
    #
    #   $request_id            -- used as-is, and never taken from the client:
    #                             it names exactly ONE hop through exactly ONE
    #                             nginx, and a caller that could set it could
    #                             make two unrelated hops indistinguishable in
    #                             the store.
    #   $aizzak_correlation_id -- the client's `X-Correlation-Id` when it sent
    #                             one, `$request_id` otherwise. Client-settable
    #                             BY DESIGN: it is what lets a mobile app tie a
    #                             retry to its original attempt, and it is the
    #                             id 03 §0 already returns on every response and
    #                             in every problem body. The app honours the
    #                             same header for the same reason.
    #
    # ⚠️ The trust here is bounded and deliberate. A correlation id is a LABEL,
    # never an authorisation input: nothing in the platform reads it to decide
    # anything, so a client that sends a duplicate or a nonsense value pollutes
    # its own search results and nothing else. `escape=json` below is what keeps
    # that harmless -- see the log format.
    map $http_x_correlation_id $aizzak_correlation_id {
        default   $http_x_correlation_id;
        ""        $request_id;
    }

    # `escape=json` is LOAD-BEARING, not a nicety. `$http_user_agent` and the
    # request line are attacker-controlled; without it a user agent containing a
    # quote or a backslash produces a line that is not valid JSON, and the
    # collector's parse stage drops it -- so the one request an attacker cared
    # about is the one request missing from the store. With it nginx escapes
    # every variable to JSON string rules itself.
    log_format aizzak_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"level":"INFO",'
        '"logger":"nginx.access",'
        '"message":"http_request",'
        '"correlation_id":"$aizzak_correlation_id",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"duration_s":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"forwarded_for":"$http_x_forwarded_for"'
        '}';
    #
    # `"path":"$uri"` and NOT `$request_uri`: `$uri` is the path with the query
    # string stripped. Query strings on this API carry pagination cursors and
    # OAuth `code`/`state` values (`integrations_public` router), and a log
    # store is exactly where an authorisation code must not be durably indexed.
    # The same reasoning as `redaction.py`, applied to the one field the app's
    # own formatter never sees.
    #
    # `upstream_time`/`upstream_status` are quoted because nginx writes a BARE
    # HYPHEN for them when no upstream was contacted at all (a 404 answered
    # here, a `limit_req` rejection) -- unquoted, that hyphen is not valid JSON
    # and the line is lost precisely when it describes a rejection.
    access_log  /dev/stdout  aizzak_json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    # Uploads go DIRECTLY to MinIO via a presigned PUT, so no request body of
    # consequence passes through here. A small ceiling is the correct posture
    # for a JSON API.
    client_max_body_size 2m;

    # "upgrade" only when the client actually asked for one, "close"
    # otherwise. A blanket `Connection: upgrade` breaks keep-alive for
    # ordinary traffic, which is why this is a map and not a constant.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate limiting (P1-7) -- see deploy/nginx/nginx.conf for the full
    # reasoning (key choice, values, the DNAT/hairpin caveat that motivated
    # verifying $binary_remote_addr live before trusting it). Reproduced here
    # rather than shared because this file has no `include`d sibling.
    limit_req_zone  $binary_remote_addr zone=api_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ── Security headers (P1-7) ─────────────────────────────────────────────
    # ⚠️ NOT declared here — CORRECTED after shipping broken (docs/log/3.88.md's
    # correction section). An earlier version put the three headers HERE, at
    # `http` level, and `Strict-Transport-Security` alone inside the `server`
    # block below. nginx inherits `add_header` from a parent context INTO a
    # child ONLY IF the child declares NONE of its own -- the `server` block
    # DOES declare one (HSTS), so it silently lost all three headers declared
    # here, on EVERY request through this Pod's one and only server block.
    # Verified live: a throwaway `nginx:1.27 --rm` container proxying the
    # exact broken config sent zero of the three headers. The fix: all four
    # `add_header` directives now live TOGETHER inside the `server` block
    # below, next to `Strict-Transport-Security` -- one declaration site.

    # ── HSTS (P1-7) -- same mechanism as deploy/nginx/nginx.conf: a REAL
    # `map`, empty (hence header ABSENT, `add_header` omits an empty value
    # outright) until an operator names a real, STABLE hostname of their own
    # (docs/deploy-runpod.md §8.3). RunPod's own `<POD_ID>-80.proxy.runpod.net`
    # is EPHEMERAL and reused across unrelated future Pods -- pinning HSTS to
    # it would poison that shared hostname for whoever gets the Pod ID next,
    # the same class of harm as poisoning `localhost` (§3.76). Never add an
    # entry for the bare `proxy.runpod.net` address; only for a domain you
    # actually own and control the lifetime of.
    map $host $hsts_header {
        default "";
    }

    # Keep this allow-list identical to the Compose edge. Empty means the
    # origin is not permitted and nginx emits no Allow-Origin header.
    map $http_origin $cors_allow_origin {
        default "";
        "http://localhost:5173" $http_origin;
        "https://aizzak-agent.web.app" $http_origin;
        "https://aizzak-agent.firebaseapp.com" $http_origin;
    }

    server {
        listen 80 default_server;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Pinned, not $scheme -- see (1) at the top of this file.
        proxy_set_header X-Forwarded-Proto https;
        # Capacity 0.6 -- the two ids the app binds onto every log line it emits for
        # this request (`api/main.py`'s correlation middleware). Set HERE, in the
        # shared include, so :80 and :443 cannot drift: an id present on one scheme
        # and absent on the other is a store in which half the traffic is unjoinable.
        #
        # `$aizzak_correlation_id` is the client's own header when it sent one and
        # `$request_id` otherwise (the `map` in nginx.conf) -- so this line REPLACES a
        # client-supplied value with itself, and supplies one when the client did not.
        # The app's `request.headers.get(CORRELATION_HEADER) or new_uuid7()` then never
        # reaches its fallback behind this edge, which is the point: the fallback exists
        # for a direct `app:8000` call, not for production traffic.
        proxy_set_header X-Correlation-Id $aizzak_correlation_id;
        proxy_set_header X-Request-Id     $request_id;

        # All four `add_header` directives together, here, and ONLY here --
        # see the corrected "Security headers" comment above (before the
        # rate-limiting section) for why they moved out of `http`.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 600 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Liveness/readiness, unauthenticated and at the root (03-api-spec).
        # Kept out of the access log: a 10s probe would otherwise be nearly
        # all of it.
        #
        # ⚠️ DELIBERATELY NO `limit_req`/`limit_conn` HERE (P1-7) -- same
        # reasoning as deploy/nginx/app-locations.conf: rate-limiting the
        # probe the orchestrator polls every 10s starves the probe, not an
        # attacker.
        location /health {
            access_log off;
            proxy_pass http://127.0.0.1:8000;
        }

        # `/metrics` (P1-3, p1-hardening-plan.md §3 step 10) -- deliberately
        # UNREACHABLE through this edge, same reasoning as
        # deploy/nginx/app-locations.conf: answered locally with a plain 404,
        # never `proxy_pass`ed to the app. A scraper reaches it over
        # 127.0.0.1:8000 directly, from inside the Pod, never through RunPod's
        # own public proxy.
        location /metrics {
            return 404;
        }

        # WebSocket streaming. Three things a plain proxy_pass does not give:
        #   1. HTTP/1.1 + the Upgrade/Connection pair, or the handshake is
        #      answered as an ordinary request and the client sees a 400.
        #   2. A read timeout longer than the silence between frames --
        #      nginx's 60s default closes an idle-but-live socket, which
        #      surfaces to the user as a stream that dies mid-thought.
        #   3. Buffering off, so tokens leave as they arrive.
        #
        # ⚠️ RunPod's HTTP proxy sits in FRONT of this and enforces its own
        # ~100s ceiling. For long-lived sockets, expose a TCP port instead
        # and connect past the proxy -- docs/deploy-runpod.md §5.3.
        #
        # NO `limit_req` (P1-7, same reasoning as app-locations.conf): the
        # handshake is one request, then the socket stays open for the
        # session. `limit_conn` bounds concurrent sockets per IP instead.
        location /api/v1/ws {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
            limit_conn ws_conn 100;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            # SSE (`Accept: text/event-stream`) shares this location: agent
            # invocation streams over plain HTTP. Buffering on would hold
            # events until the buffer filled, turning a live stream into a
            # batch delivery.
            proxy_buffering     off;
            proxy_read_timeout  300s;
            # `limit_req` (P1-7) admits/rejects at request START, before
            # proxying begins -- an already-admitted SSE response keeps
            # streaming regardless. Same values as app-locations.conf.
            limit_req zone=api_req burst=40 nodelay;
        }
    }
}
