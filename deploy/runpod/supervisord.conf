; AIZZAK process supervision inside a single RunPod Pod.
;
; This file is what docker-compose.yml's `depends_on` + healthchecks become
; when the target platform gives you one container instead of twelve.
; Supervisor has no dependency graph and no health conditions, so the
; ordering is expressed in two mechanisms instead:
;
;   priority=      start order WITHIN a tier
;   autostart=false + `supervisorctl start` from bootstrap.sh
;                  the application tier does not start until the bootstrap
;                  has actually verified the data plane and run the
;                  migrations. Priorities alone could not express that:
;                  supervisor starts the next program as soon as the previous
;                  one has been RUNNING for `startsecs`, which says nothing
;                  about whether it is ready.
;
; Every program logs to the container's stdout/stderr so the RunPod log
; viewer (and `docker logs`) shows one interleaved stream. maxbytes=0 turns
; off supervisor's rotation, which /dev/stdout must not have.
;
; ⚠️ Values that contain a literal `%` must never be written into this file:
; supervisor runs `%(...)s` expansion over it. Passwords therefore arrive
; only as pre-composed URLs exported by entrypoint.sh.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ═══════════════════════════ tier 0 — access ═══════════════════════════════
; Started first and independently of everything else: when the stack fails to
; boot, this is the process that lets you find out why.

[program:sshd]
command=/usr/sbin/sshd -D -e
user=root
priority=5
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ═══════════════════════════ tier 1 — data plane ═══════════════════════════
; All of these bind 127.0.0.1 except MinIO, which must be reachable by a
; BROWSER: presigned URLs are signed against its public host with SigV4 and
; cannot be repointed afterwards.

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /workspace/data/postgres
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --appendonly yes --dir /workspace/data/redis --bind 127.0.0.1 --port 6379
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /workspace/data/minio --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
command=/opt/qdrant/qdrant
directory=/opt/qdrant
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=5
environment=QDRANT__SERVICE__HOST="127.0.0.1",QDRANT__SERVICE__HTTP_PORT="6333",QDRANT__STORAGE__STORAGE_PATH="/workspace/data/qdrant",QDRANT__TELEMETRY_DISABLED="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; PERSISTENT `file` storage (release-blockers-plan.md §3 step 1), not `-dev`.
; `-dev` kept KV, Transit and the AppRole entirely in memory -- a Pod restart
; wiped them, and a REGENERATED Transit key cannot decrypt tenant credentials
; encrypted under the old one. `deploy/vault/start.sh` starts `vault server`
; itself and drives it through `operator init`/`operator unseal` in the SAME
; process before `vault status` (aizzak-bootstrap.sh's own readiness probe)
; can ever report success. Still single-Pod-only: there is no KMS here to
; auto-unseal against, so the unseal key + root token live in a plain file
; under $DATA/vault-init (0600) -- see start.sh's header and
; docs/deploy-runpod.md §8.1 before storing anything you cannot re-enter.
[program:vault]
command=sh /app/deploy/vault/start.sh
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The GPU tenant. On a GPU Pod this is what the GPU is for; on a CPU Pod it
; still runs, just slowly.
[program:ollama]
command=/usr/local/bin/ollama serve
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=5
environment=HOME="/home/aizzak",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="/workspace/data/ollama"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ONE model load per process (services/embedding/app.py's own docstring):
; scale by replicas, never by raising --workers, which would load the model N
; times in one container for no benefit. PYTHONPATH is /app here, not
; /app/src -- this service is imported as `services.embedding.app`.
[program:embedding]
command=/opt/venv-emb/bin/uvicorn services.embedding.app:app --host 127.0.0.1 --port 8080 --workers 1
directory=/app
user=aizzak
priority=20
autostart=true
autorestart=true
startsecs=10
environment=PYTHONPATH="/app",EMBEDDING_MODEL="sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2",EMBEDDING_DIM="384",EMB_BATCH="8",HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1",HF_HOME="/opt/hf-cache",SENTENCE_TRANSFORMERS_HOME="/opt/hf-cache"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ═══════════════════════ tier 2 — the boot sequence ════════════════════════
; Runs once, exits 0, and starts tier 3 itself. autorestart=false because a
; second concurrent run is not a repair; if it fails, the log says where and
; the Pod is restarted.

[program:bootstrap]
command=/usr/local/bin/aizzak-bootstrap.sh
directory=/app
user=root
priority=50
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ══════════════════════ tier 3 — the application plane ═════════════════════
; autostart=false for ALL of them. bootstrap.sh starts them, in this order:
;   worker -> outbox-relay -> app -> nginx
; The first edge is load-bearing on a brand-new stream (consumer groups are
; created at the stream tail); the last one means the edge only opens once
; /health answers, so RunPod's proxy never fronts a dead app.

; ⚠️ WORKER=memory is the only value that boots today. `knowledge` needs
; DocumentContentResolver and `media` needs MediaGenerator -- both are
; tracked debt, and either one here crash-loops forever and makes a healthy
; stack look broken. entrypoint.sh's own `WORKER="${WORKER:-memory}"` names
; the same default this comment describes, and docker-compose.yml's `worker`
; service now agrees too (release-blockers-plan.md §3, step 3) -- it used to
; default to `knowledge` and crash-loop there while this path stayed correct.
[program:worker]
command=/opt/venv/bin/python -m app.workers.main
directory=/app
user=aizzak
priority=100
autostart=false
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:outbox-relay]
command=/opt/venv/bin/python -m app.workers.outbox_relay
directory=/app
user=aizzak
priority=110
autostart=false
autorestart=true
startsecs=10
environment=DATABASE_URL="%(ENV_RELAY_DATABASE_URL)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The trailing `()` is how GUNICORN spells "this is a factory, call it" --
; `--factory` is uvicorn's flag and gunicorn rejects it outright. Binds
; loopback: nginx is the only thing that talks to it.
[program:app]
command=/opt/venv/bin/gunicorn app.api.main:create_production_app() --worker-class uvicorn.workers.UvicornWorker --bind 127.0.0.1:8000 --workers %(ENV_WEB_CONCURRENCY)s --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -
directory=/app
user=aizzak
priority=120
autostart=false
autorestart=true
startsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
priority=130
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ⚠️ NO [group:...] section, deliberately. Grouping would rename these
; programs to `aizzak:app`, `aizzak:nginx`, ... and every `supervisorctl
; start app` in bootstrap.sh would fail with "no such process".
