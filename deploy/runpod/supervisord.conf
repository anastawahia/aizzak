; AIZZAK process supervision inside a single RunPod Pod.
;
; This file is what docker-compose.yml's `depends_on` + healthchecks become
; when the target platform gives you one container instead of twelve.
; Supervisor has no dependency graph and no health conditions, so the
; ordering is expressed in two mechanisms instead:
;
;   priority=      start order WITHIN a tier
;   autostart=false + `supervisorctl start` from bootstrap.sh
;                  the application tier does not start until the bootstrap
;                  has actually verified the data plane and run the
;                  migrations. Priorities alone could not express that:
;                  supervisor starts the next program as soon as the previous
;                  one has been RUNNING for `startsecs`, which says nothing
;                  about whether it is ready.
;
; Every program logs to the container's stdout/stderr so the RunPod log
; viewer (and `docker logs`) shows one interleaved stream. maxbytes=0 turns
; off supervisor's rotation, which /dev/stdout must not have.
;
; ⚠️ Values that contain a literal `%` must never be written into this file:
; supervisor runs `%(...)s` expansion over it. Passwords therefore arrive
; only as pre-composed URLs exported by entrypoint.sh.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info
; ── The descriptor budget, RunPod's half (capacity 3.1) ──────────────────────
; The Compose stack gives `app` its number through `ulimits: nofile:`; there is
; no Compose here, and gunicorn has no setting of its own -- so on this path the
; number has to come from whatever launches it, and that is supervisord.
;
; `minfds` is not documentation: supervisord calls setrlimit(RLIMIT_NOFILE) with
; it before forking anything, so every program below inherits it. Its DEFAULT is
; 1024 -- the same 1024 that was measured refusing WebSockets on the Compose
; path, one gunicorn worker pinned at exactly its soft limit while its sibling
; held 946, with no log line and no metric to say so.
;
; ⚠️ AND THIS ONE CAN REFUSE TO BOOT, which is deliberate and is the reason it
; is written here rather than left to the Pod: supervisord EXITS if the hard
; limit cannot accommodate `minfds`. A Pod too small to hold §0's sockets now
; says so at start-up instead of shedding a third of them into 502s an hour
; later. The Compose stack's hard limit is already 1,048,576 (measured), and a
; RunPod container is a normal Docker container with the same default.
minfds=65536

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ═══════════════════════════ tier 0 — access ═══════════════════════════════
; Started first and independently of everything else: when the stack fails to
; boot, this is the process that lets you find out why.

[program:sshd]
command=/usr/sbin/sshd -D -e
user=root
priority=5
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ═══════════════════════════ tier 1 — data plane ═══════════════════════════
; All of these bind 127.0.0.1 except MinIO, which must be reachable by a
; BROWSER: presigned URLs are signed against its public host with SigV4 and
; cannot be repointed afterwards.

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /workspace/data/postgres
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; capacity 5.2 (ح-10 · ق-4) -- TWO servers here as well, and NOT because the
; Pod needs the isolation: it is because a topology that differs from
; docker-compose.yml in which server holds `auth:revoked:<sub>` is a topology
; where a security control is tested in one deployment and not the other.
; A single-instance Pod would have taken the CACHE_REDIS_URL fallback
; (`env_settings.py`) and been correct-but-unsplit; the second server costs a
; process with no disk, so it is cheaper to be the same everywhere.
;
; The ceilings are a tenth of Compose's (§6 sizes a 32 vCPU / 64 GB host; a Pod
; is not that), and the ratio between them is kept: the instance that refuses
; writes when full gets the larger share.
[program:redis-stream]
command=/usr/bin/redis-server --appendonly yes --dir /workspace/data/redis --bind 127.0.0.1 --port 6379 --maxmemory 512mb --maxmemory-policy noeviction
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; No `--dir` and no persistence: this one keeps nothing across a restart by
; design (every value behind it is reconstructible), so it needs no directory
; under /workspace and cannot compete for the disk the AOF above uses.
[program:redis-cache]
command=/usr/bin/redis-server --save '' --appendonly no --bind 127.0.0.1 --port 6380 --maxmemory 256mb --maxmemory-policy allkeys-lru
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /workspace/data/minio --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
command=/opt/qdrant/qdrant
directory=/opt/qdrant
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=5
environment=QDRANT__SERVICE__HOST="127.0.0.1",QDRANT__SERVICE__HTTP_PORT="6333",QDRANT__STORAGE__STORAGE_PATH="/workspace/data/qdrant",QDRANT__TELEMETRY_DISABLED="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; PERSISTENT `file` storage (release-blockers-plan.md §3 step 1), not `-dev`.
; `-dev` kept KV, Transit and the AppRole entirely in memory -- a Pod restart
; wiped them, and a REGENERATED Transit key cannot decrypt tenant credentials
; encrypted under the old one. `deploy/vault/start.sh` starts `vault server`
; itself and drives it through `operator init`/`operator unseal` in the SAME
; process before `vault status` (aizzak-bootstrap.sh's own readiness probe)
; can ever report success. Still single-Pod-only: there is no KMS here to
; auto-unseal against, so the unseal key + root token live in a plain file
; under $DATA/vault-init (0600) -- see start.sh's header and
; docs/deploy-runpod.md §8.1 before storing anything you cannot re-enter.
[program:vault]
command=sh /app/deploy/vault/start.sh
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The GPU tenant. On a GPU Pod this is what the GPU is for; on a CPU Pod it
; still runs, just slowly.
[program:ollama]
command=/usr/local/bin/ollama serve
user=aizzak
priority=10
autostart=true
autorestart=true
startsecs=5
environment=HOME="/home/aizzak",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="/workspace/data/ollama"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ONE model load per process (services/embedding/app.py's own docstring):
; scale by replicas, never by raising --workers, which would load the model N
; times in one container for no benefit. PYTHONPATH is /app here, not
; /app/src -- this service is imported as `services.embedding.app`.
[program:embedding]
command=/opt/venv-emb/bin/uvicorn services.embedding.app:app --host 127.0.0.1 --port 8080 --workers 1
directory=/app
user=aizzak
priority=20
autostart=true
autorestart=true
startsecs=10
environment=PYTHONPATH="/app",EMBEDDING_MODEL="sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2",EMBEDDING_DIM="384",EMB_BATCH="8",HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1",HF_HOME="/opt/hf-cache",SENTENCE_TRANSFORMERS_HOME="/opt/hf-cache"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ═══════════════════════ tier 2 — the boot sequence ════════════════════════
; Runs once, exits 0, and starts tier 3 itself. autorestart=false because a
; second concurrent run is not a repair; if it fails, the log says where and
; the Pod is restarted.

[program:bootstrap]
command=/usr/local/bin/aizzak-bootstrap.sh
directory=/app
user=root
priority=50
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ══════════════════════ tier 3 — the application plane ═════════════════════
; autostart=false for ALL of them. bootstrap.sh starts them, in this order:
;   worker -> outbox-relay -> app -> nginx
; The first edge is load-bearing on a brand-new stream (consumer groups are
; created at the stream tail); the last one means the edge only opens once
; /health answers, so RunPod's proxy never fronts a dead app.

; ⚠️ ONE [program:worker] here means ONE of the three Streams consumers, so
; this path must choose; Compose no longer does (docs/log/3.133.md split its
; single `worker` service into `worker-memory`/`worker-knowledge`/
; `worker-media`, and runs the first two together). `WORKER=memory` is the
; choice because it has the longest measured container record
; (docs/log/3.83.md, then 138 s idle with 0 restarts in docs/log/3.105.md).
; `knowledge` is now measured too (≥ 5 min, 0 restarts, same log) and `media`
; is wired since step 20 of docs/deferred-adapters-plan.md but has still never
; been booted once. No value crash-loops on a missing adapter today.
; entrypoint.sh's own `WORKER="${WORKER:-memory}"` names the same default this
; comment describes; tests/unit/test_deploy_worker_default.py fails on drift.
;
; 📌 Running all three here would mean three more [program:] blocks, not a
; different WORKER value -- a separate decision, unmade.
[program:worker]
command=/opt/venv/bin/python -m app.workers.main
directory=/app
user=aizzak
priority=100
autostart=false
autorestart=true
startsecs=10
; ⚠️ THE SAME NESTING DEFECT 3.3 FOUND ON `app`, ON THE OTHER PUBLISHER AND ON
; THE OTHER PROCESS (capacity 5.1, invariant 4). This block carried no
; `stopwaitsecs` at all, so supervisor's default of 10 applied -- and capacity
; 5.1 gives the worker a 30s DRAIN in which to finish the messages it has
; already taken out of the stream. An inner window three times the outer one
; means the drain is never once allowed to complete on this deployment: SIGKILL
; arrives at 10s, mid-handler, on every restart, and every message in flight is
; left `pending` for the sweeper -- exactly the truncation the drain exists to
; remove, but now `WORKER_CONCURRENCY` of them at a time instead of one.
;
; 45 is `WORKER_DRAIN_TIMEOUT_S` (30) plus the deregistration round trips plus
; margin, and it is deliberately `app`'s own number: two processes, one
; shutdown budget, one thing to remember.
; `tests/unit/test_worker_drain_ladder.py` fails the build if either
; publisher's outer window drops back below the drain.
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:outbox-relay]
command=/opt/venv/bin/python -m app.workers.outbox_relay
directory=/app
user=aizzak
priority=110
autostart=false
autorestart=true
startsecs=10
environment=DATABASE_URL="%(ENV_RELAY_DATABASE_URL)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The trailing `()` is how GUNICORN spells "this is a factory, call it" --
; `--factory` is uvicorn's flag and gunicorn rejects it outright. Binds
; loopback: nginx is the only thing that talks to it.
;
; ── The command line, reconciled with the Dockerfile (capacity 3.3) ──────────
; This line and the image's CMD were two different servers: this one passed
; `--timeout 120 --graceful-timeout 30`, the Dockerfile passed nothing after
; `--bind`. The full reasoning and every measurement behind the three flags is
; in the Dockerfile next to its own CMD, and is not repeated here; what is
; recorded here is what CHANGED on this path:
;
;   --timeout 120 -> 30   `--timeout` is not a request timeout under
;                         `UvicornWorker` (measured: a 300s SSE response
;                         survived intact at 30) and it does not bound worker
;                         boot either (measured: a 40s boot at `--timeout 30`
;                         was never killed). What it catches is a BLOCKED EVENT
;                         LOOP -- measured, a 90s block was killed at 30 and
;                         survived at 120 -- so 120 was four times the window a
;                         wedged worker keeps its share of §0's WebSockets, for
;                         nothing measured in return. The number came in with
;                         the initial commit carrying no recorded reason.
;   --keep-alive 65       added. THIS is the flag `deploy/runpod/nginx.conf`
;                         has been waiting for by name since 3.2, and unlike on
;                         Compose it is not inert here: this publisher pools
;                         upstream connections, and its `keepalive_timeout` is
;                         raised from 1s to 60s in the same commit as this flag,
;                         exactly as that file's comment demanded.
;   --access-logfile -    REMOVED, matching the Dockerfile, and it was inert:
;                         under `UvicornWorker` the access line comes from
;                         uvicorn's own `uvicorn.access` logger, never
;                         gunicorn's. Step 0.6 measured its removal from the
;                         image as changing the output by exactly zero lines.
;                         `--error-logfile -` stays and is NOT inert: worker
;                         lifecycle is written through it and nothing else
;                         reports that.
[program:app]
command=/opt/venv/bin/gunicorn app.api.main:create_production_app() --worker-class uvicorn.workers.UvicornWorker --bind 127.0.0.1:8000 --workers %(ENV_WEB_CONCURRENCY)s --timeout 30 --graceful-timeout 30 --keep-alive 65 --error-logfile -
directory=/app
user=aizzak
priority=120
autostart=false
autorestart=true
startsecs=15
; ⚠️ THE SHUTDOWN WINDOWS WERE NESTED THE WRONG WAY ROUND, on both publishers
; (capacity 3.3). gunicorn's graceful window is 30s -- its own default, and this
; line passed it explicitly -- while supervisord's `stopwaitsecs` DEFAULT IS 10,
; read out of supervisor's own source (`integer(get(section, 'stopwaitsecs',
; 10))`). Docker's default on the Compose path is the same 10, and that half is
; MEASURED: `docker stop` on a process that ignores SIGTERM took 10.43s.
;
; So the inner window -- gunicorn, the only process here that knows what it is
; still waiting for -- was three times the outer one, and the SIGKILL always
; came from the supervisor, which knows nothing about it. Measured consequence
; with a response in flight: the stream died at the graceful deadline with a
; `RemoteProtocolError` rather than an ending, and under a 10s outer window that
; happens to EVERY request still in flight, mid-write.
;
; 45 is 30 plus margin: the arbiter was measured exiting 30.1-30.3s after
; SIGTERM in the worst case, and 0.45s when nothing was in flight -- which is
; what a deploy costs in practice, since this window is only spent when there
; is something to wait for. `tests/unit/test_gunicorn_flags.py` fails the build
; if either publisher's outer window drops back below the inner one.
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
priority=130
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ⚠️ NO [group:...] section, deliberately. Grouping would rename these
; programs to `aizzak:app`, `aizzak:nginx`, ... and every `supervisorctl
; start app` in bootstrap.sh would fail with "no such process".
