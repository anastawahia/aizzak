# Where Grafana finds the checked-in dashboards -- Wave 0 step 0.3.
#
# `allowUiUpdates: false` on purpose. A dashboard edited in the browser and
# not written back to this repository is a dashboard that dies with the
# container's volume, and step 0.5's baseline has to be reproducible from a
# commit. Editing means editing the JSON here.
apiVersion: 1

providers:
  - name: aizzak
    orgId: 1
    folder: AIZZAK
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
