# The scraper that finally evaluates `alerts.yml` -- Wave 0 step 0.3,
# `docs/capacity-plan.md`.
#
# ── What this file changes about the rules next to it ──────────────────────
# `alerts.yml` has existed since 2026-07-30 and its own header says so
# plainly: "This is still NOT wired into any running Prometheus/Alertmanager
# service -- no such service exists in `docker-compose.yml`". Three carefully
# reasoned thresholds, none of them ever compared against a number. ت-6 is
# the measured cost of that: the DLQ gauge was reading the wrong set of
# streams for six weeks and nothing noticed, because nothing was reading the
# gauge. This file is what makes the rules ARM.
#
# ── Alertmanager since capacity 7.3 (debt د-5) ─────────────────────────────
# Until 7.3 there was none, deliberately: routing a firing alert needs a
# destination this repository cannot invent, and an Alertmanager with no
# receiver would have been one more service with nobody paged. The owner
# chose local delivery (2026-10-04) -- `deploy/alertmanager/alertmanager.yml`
# routes every notification to `alert-sink`, whose log lines Alloy ships to
# Loki -- so the gap is now the external channel, not the path.
#
# ── Scrape interval, and why the acceptance criterion depends on it ────────
# 15s, with `evaluation_interval` matched to it. Step 0.3's acceptance is
# "إسقاط `pgbouncer` يُشعل تنبيهاً خلال دقيقة" -- a minute, end to end. That
# budget is spent as: up to 15s until the first scrape that sees the failure,
# plus the rule's own `for: 30s` hysteresis, plus up to 15s until the next
# evaluation confirms it. ~45-60s, deliberately sized against the criterion
# rather than left at the 1m default that would blow it on the first term
# alone.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: aizzak

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus scrapes itself: without this, `up` exists for every target
  # EXCEPT the one process whose silence would hide all the others.
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # ⚠️ `app:8000` DIRECTLY, never through nginx, and this is enforced on both
  # sides. `deploy/nginx/app-locations.conf` answers `/metrics` with a local
  # 404 before the catch-all proxy sees it (P1-3's mzalaq #2 --
  # `src/app/api/metrics.py`'s module docstring), so the edge cannot serve
  # this path at all; the Compose-internal address is the only way in, and a
  # scraper on the internal network is precisely who is meant to use it.
  #
  # ⭐ ONE TARGET PER CONTAINER, DISCOVERED BY DNS -- capacity step 3.4, and
  # the paragraph that used to stand here was RIGHT until that step and wrong
  # the moment it shipped. It said: "One target for `WEB_CONCURRENCY` sibling
  # processes, and that is correct rather than a sampling error", because the
  # RED family is aggregated across siblings out of `PROMETHEUS_MULTIPROC_DIR`
  # and the external-state gauges are recomputed from Postgres/Redis on every
  # scrape. Both halves of that hold ACROSS SIBLINGS IN ONE CONTAINER. Neither
  # holds across three containers, and `app` now has three.
  #
  # ⚠️ WHAT A SINGLE `static_configs: ["app:8000"]` DID WITH THREE REPLICAS.
  # Docker's embedded DNS returns all three addresses and Prometheus connects
  # to one of them per scrape, so ONE time series was fed by three independent
  # counters in rotation. MEASURED on the live stack, the `/metrics` route's
  # own request counter, one sample per 15s scrape:
  #
  #     335 336   1   2   3   1   4  337 337
  #
  # Prometheus reads every drop as a counter reset and adds the new value, so
  # each hop back to the busy container manufactures a spike. Measured against
  # a truth of exactly one request per 15s (0.067/s):
  #
  #     rate(...[1m])  0.061 0.061 0.044 0.031 0.020 0.027 0.104 7.025 6.660
  #                                                              ^^^^^ 105x
  #
  # No gap, no `up == 0`, no error: the failure is a SPIKE, in the direction
  # that reads as load. Every RED panel, every histogram quantile and every
  # later step's acceptance criterion reads through this job.
  #
  # DNS A records rather than `static_configs`, because Compose assigns the
  # addresses and nothing else here knows them. `refresh_interval` matched to
  # the scrape interval so a recreated replica is discovered within one scrape.
  #
  # ⚠️ AND THE REPAIR HAS ITS OWN COST, WHICH IS PAID IN `alerts.yml` AND THE
  # DASHBOARD, NOT HERE. Splitting the target splits BOTH metric families, and
  # they need opposite aggregations:
  #
  #   * process-owned (`aizzak_http_*`, `aizzak_db_pool_*`,
  #     `aizzak_ws_connections`, ...) -- each container reports its own share,
  #     so the fleet number is `sum()`. Every panel already summed, for the
  #     multiprocess reason, and keeps reading correctly.
  #   * external state (`aizzak_dlq_depth`, `aizzak_stream_lag_seconds`,
  #     `aizzak_outbox_oldest_unpublished_age_seconds`,
  #     `aizzak_vault_authenticated`) -- every container recomputes the SAME
  #     fact from Postgres/Redis, so `sum()` multiplies it by the replica
  #     count. MEASURED: `sum(aizzak_dlq_depth)` read 90 for a real backlog of
  #     30, and `sum(max by (stream) (aizzak_dlq_depth))` read 30.
  #
  # The two families are indistinguishable by metric name, which is why
  # `tests/unit/test_metrics_topology.py` holds the list and checks every
  # query in both files against it.
  - job_name: aizzak-app
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8000
        refresh_interval: 15s

  # ح-3's direct evidence. `cl_waiting` (clients queued for a server
  # connection) and `sv_active` are the two numbers that separate "the pooler
  # is the constraint" from "the pooler is fine and something downstream is
  # slow" -- §3's connection budget is unfalsifiable without them.
  #
  # A SIDECAR and not the app, deliberately: reading them means logging into
  # pgbouncer's admin console, which `admin_users` restricts to the Postgres
  # SUPERUSER. That credential must not enter the app container, whose whole
  # design is a least-privileged `app_rw` confined by RLS. Step 0.2 deferred
  # this item for exactly that reason and named this as the shape it would
  # take.
  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]

  # TWO Redis jobs since capacity 5.2 (ح-10 · ق-4), and the split is what
  # makes the alerts on them expressible at all. `redis-stream` holds the
  # streams, the WS registry, the rate limiter's windows and the session
  # denylist under `noeviction`: an eviction there is impossible by policy, so
  # a non-zero counter means the policy was changed by hand, and filling it
  # means WRITES ARE BEING REFUSED. `redis-cache` runs `allkeys-lru`, where
  # eviction is the design working and both of those rules would be pure
  # noise. One job carrying both instances could not tell the two apart
  # without relabelling, and the alert expressions would have to encode the
  # instance address instead of its role.
  - job_name: redis-stream
    static_configs:
      - targets: ["redis-stream-exporter:9121"]

  - job_name: redis-cache
    static_configs:
      - targets: ["redis-cache-exporter:9121"]

  # ── The log pipeline (capacity 0.6) ──────────────────────────────────────
  # A collector that quietly stops shipping looks EXACTLY like a quiet
  # system -- the same failure `AizzakScrapeTargetDown` and
  # `AizzakPgbouncerDown` were written for in 0.3, now applied to the
  # pipeline that 0.6's whole acceptance criterion depends on. Both are
  # ordinary (non-`optional`) targets, so `AizzakScrapeTargetDown` covers
  # them the moment either dies.
  #
  # `alloy` also exports `loki_source_file_*` and the drop counters this
  # repo's own `stage.drop` names (`not_this_project`), which is how a
  # sudden gap in the store is told apart from a sudden quiet in the stack.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # ── The delivery path (capacity 7.3) ─────────────────────────────────────
  # Scraped so that a dead Alertmanager is an `up == 0` -- and so its own
  # `alertmanager_notifications_failed_total` says when the sink stopped
  # accepting. ⚠️ The one alert that cannot be DELIVERED is the one about
  # the deliverer: `AizzakScrapeTargetDown{job="alertmanager"}` fires in
  # Prometheus and goes nowhere. The Watchdog's five-minute line in the
  # sink's log going quiet is what says so instead.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # ── Optional target: NOT started by a default `docker compose up` ─────────
  # `tier: optional` is read by `alerts.yml`'s `AizzakScrapeTargetDown` rule,
  # which excludes it. Without that label an absent cAdvisor would hold a
  # target-down alert firing forever, and an alert that is always firing is
  # an alert nobody reads -- which would break the other four rules by
  # habituation rather than by any fault of their own.
  #
  # It is behind the `container-metrics` Compose profile because it needs the
  # Docker socket, i.e. root-equivalent access to this host. Step 0.5's
  # 8-hour soak needs per-container memory to see a leak's slope
  # (`process_resident_memory_bytes` is unavailable in multiprocess mode by
  # design), so the capability has to exist -- but it is opted into for the
  # duration of a measurement, not granted to every `up`.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          tier: optional
