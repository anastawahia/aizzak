# Alerting rules for the two P1-3 health signals (docs/p1-hardening-plan.md
# §3 step 10; 07-nfr-slo §7's "زمن دورة الـOutbox ومَلء DLQ مؤشّرا صحّة
# رئيسيان عند تفعيل المراقبة"), plus the Vault-authentication gauge added by
# ن-10 (§5-ب; the live outage is docs/log/3.94.md).
#
# ── Scope, deliberately narrow -- and it grew by exactly one ───────────────
# Exactly the metrics `GET /metrics` exposes (`src/app/api/metrics.py`'s
# `OUTBOX_AGE_METRIC`/`DLQ_DEPTH_METRIC`/`VAULT_AUTH_METRIC` -- `tests/unit/
# test_prometheus_alert_rules.py` imports those SAME constants rather than
# repeating the literals here, so this file and the endpoint cannot drift
# apart silently) and exactly one alert per metric. The file was scoped to
# TWO metrics from step 10 until 2026-07-30, when ن-10's failure mode stopped
# being theoretical and happened: the app's Vault credential expired, nothing
# detected it, and the next restart crash-looped. That is a third signal of a
# genuinely different kind -- a dependency-liveness probe, not a platform-state
# gauge -- so it earned a third rule rather than being folded into either
# existing one. The scope statement stands otherwise: one alert per metric, no
# derived/aggregate rules, and nothing here is a dashboard.
#
# This is still NOT wired into any running Prometheus/Alertmanager service --
# no such service exists in `docker-compose.yml` or the RunPod image,
# deliberately (the design brief's own decision: "لا بنية تحتيّة جديدة الآن،
# كاشط لاحقاً"). This file is the ARTIFACT a future scraper loads via
# `rule_files:`, written and reasoned about now so the numbers exist before
# the infrastructure that evaluates them does.
#
# ── Why a threshold at all, not "any() > baseline" ─────────────────────────
# Every rule carries a real number and a real `for:` duration because an
# alert with neither is exactly the "إنذارٌ يُرى لا يُستجاب له" (an alert
# seen, not acted on) the design brief explicitly rejects -- see each rule's
# own `annotations.reason` below for its specific justification, grounded in
# `07-nfr-slo.md` for the Outbox rule, in the DLQ's own recovery mechanics
# (`src/app/infrastructure/messaging/redis_streams.py`'s `dead_letter`) for
# the DLQ rule, and in a measured production outage for the Vault rule.
groups:
  - name: aizzak-outbox-dlq
    rules:
      # ── Outbox cycle time ────────────────────────────────────────────────
      # `aizzak_outbox_oldest_unpublished_age_seconds` is a LIVE gauge -- how
      # long the OLDEST still-unpublished `platform.outbox` row has been
      # waiting, `0` if none are (`SqlRedisMetricsSource`'s own docstring) --
      # not a historical percentile. Comparing it directly against
      # `07-nfr-slo.md` §2's own p99 budget for "زمن دورة الـOutبox (نشر بعد
      # الالتزام)" (3s) is therefore the correct read: under a healthy relay
      # this value sits well below 3s essentially always (the relay polls
      # every `OUTBOX_POLL_INTERVAL_MS=500ms` by default), so 2 CONSECUTIVE
      # minutes above the p99 ceiling is not a single slow cycle -- it is 240x
      # the default poll interval, which only happens if the relay is
      # genuinely stalled, crash-looping, or down (`outbox_relay.py`'s own
      # module docstring: every payload is pre-validated at PRODUCE time, so
      # the only publish failures possible are transport-level and apply to
      # the WHOLE batch, never one poisoned row -- there is no "slow but
      # otherwise healthy" steady state this threshold could mistake for an
      # outage).
      - alert: AizzakOutboxCycleTimeHigh
        expr: aizzak_outbox_oldest_unpublished_age_seconds > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox publish cycle time exceeds the p99 SLO (3s, 07-nfr-slo.md §2)"
          description: >-
            The oldest unpublished platform.outbox row has been waiting more
            than 3 seconds (the p99 budget for "زمن دورة الـOutbox") for at
            least 2 consecutive minutes. This means outbox-relay
            (docker-compose.yml's single-instance `outbox-relay` service) is
            stalled, crash-looping, or down -- every payload is pre-validated
            at produce time, so a row cannot be individually poisoned; only a
            transport-level failure (Redis unreachable) or a dead process
            explains a sustained backlog.
          reason: >-
            3s = 07-nfr-slo.md §2's own p99 target for this exact quantity;
            2m = ~240x the default 500ms poll interval, chosen so a single
            slow cycle (network jitter, one large batch) cannot false-alarm,
            while a genuine outage (which does not self-heal) is still caught
            within a couple of minutes.
          response: >-
            Check `docker compose logs outbox-relay` / the RunPod
            [program:outbox-relay] log first (08-local-runbook.md §7); the
            relay reads platform.outbox and republishes on restart, so
            restarting it (never manual data surgery) is the first repair.

      # ── DLQ depth ────────────────────────────────────────────────────────
      # A dead-lettered entry NEVER self-heals: `dead_letter`
      # (infrastructure/messaging/redis_streams.py) moves it to `<stream>.dlq`
      # and nothing in this codebase automatically drains it back -- the
      # ONLY path off the queue is an operator running `python -m app.ops.dlq
      # peek/requeue/purge` by hand (P1-4, docs/p1-hardening-plan.md §3 step
      # 7 -- "الأداة قبل المقياس": this alert's entire reason to exist is
      # that this tool is what an operator runs once it fires). Getting HERE
      # at all already means `MAX_RETRIES_BEFORE_DLQ=5` delivery attempts
      # failed, or an envelope was malformed/unroutable -- both are already
      # exceptional events, unlike a queue depth metric with ordinary
      # fluctuation. So the threshold is deliberately `> 0`, not some larger
      # "how much backlog is normal" number: there IS no normal non-zero
      # backlog for this queue.
      - alert: AizzakDlqNotEmpty
        expr: sum(aizzak_dlq_depth) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The dead-letter queue has an entry needing operator triage"
          description: >-
            At least one entry has sat on a <stream>.dlq stream for 5 minutes
            -- one per stream in the static consumer topology
            (stream.files / stream.knowledge / stream.media / stream.memory;
            the gauge's label carries which). Dead-lettered entries do not
            self-heal; each one already represents either 5 failed handler
            attempts (MAX_RETRIES_BEFORE_DLQ) or a malformed/unroutable
            envelope.
            NOTE (ت-6, 2026-08-15): this rule listed only knowledge/media
            until `aizzak_dlq_depth` itself did -- and the one entry on the
            live stack was on stream.memory.dlq, i.e. on a queue neither the
            gauge nor this text covered. The metric now derives its stream
            list from `framework/events/topology.py` instead of a literal.
          reason: >-
            Threshold is `> 0`, not a larger number, because there is no
            "normal" non-zero depth for this queue -- reaching the DLQ at all
            is already the exceptional case (5 exhausted retries, or a
            malformed envelope). 5m rules out alerting on an entry an
            automated requeue could plausibly clear near-instantly; today
            nothing does that automatically, so in practice this fires
            shortly after the first entry lands.
          response: >-
            python -m app.ops.dlq peek <stream> (P1-4, step 7) to inspect
            entries, then requeue (reinjectable=True) or purge
            (--yes, bookkeeping-only entries) -- see
            08-local-runbook.md §4.2 for the full procedure, including the
            claimed-ledger caveat requeue cannot itself detect.
            Until a scraper exists to evaluate this rule at all, the same
            fact reaches an operator as a `dlq.backlog` WARNING logged by the
            owning worker every DLQ_WATCH_INTERVAL_S
            (`infrastructure/messaging/consumers/dlq_watch.py`, ت-6) --
            carrying the depth, the oldest entry's age and its reason.
            `docker compose logs worker-memory | grep dlq.backlog`.

  # A SECOND group rather than a third rule in the one above: `aizzak-outbox-dlq`
  # names exactly what it holds, and this signal is neither an Outbox nor a DLQ
  # fact. Prometheus evaluates groups independently, so the split also means a
  # future `interval:` on the Vault group (a slower probe -- see the lockout
  # warning below) does not slow the two platform-state gauges down with it.
  - name: aizzak-vault
    rules:
      # ── Vault authentication ─────────────────────────────────────────────
      # `aizzak_vault_authenticated` is 1 when the app process can currently
      # make an authorized Vault call and 0 for every other outcome
      # (`src/app/infrastructure/monitoring/vault_health.py`: the probe is a KV
      # read of a path nobody writes, so Vault's own 404 -- a `NotFoundError`
      # -- is the HEALTHY answer, and needs no policy grant beyond the
      # `secret/data/*` read the app already holds).
      #
      # `severity: critical`, unlike the two `warning`s above, and the
      # asymmetry is deliberate. Those two describe a BACKLOG: work is delayed
      # or parked, but the platform still serves every request it can. This one
      # describes a capability that is already GONE -- Vault sits on the
      # runtime path of every `credentials`/`integrations` operation (decrypting
      # a tenant key goes through Transit on every call, not just at boot), so
      # by the time this gauge reads 0 those operations are ALREADY failing with
      # 500s. And it gets strictly worse with time rather than better: the next
      # container restart does not recover, it fails to boot at all
      # (`create_vault_client` logs in during composition), and the resulting
      # gunicorn crash loop trips Vault's user lockout -- after which even a
      # freshly minted, valid secret_id is refused. Measured, not predicted:
      # docs/log/3.94.md is the write-up of that exact sequence happening.
      #
      # `for: 5m` is noise suppression ONLY -- a Vault restart, a sealed-then-
      # unsealed window, one 5s client timeout. It is emphatically not a grace
      # period for self-healing, because this condition never self-heals: the
      # process re-logs-in with the SAME `VAULT_SECRET_ID` it was started with,
      # so an expired/revoked one stays expired until a human mints a new one.
      # Same reasoning as the DLQ rule's own `for:`, applied to a condition with
      # an even flatter recovery curve.
      - alert: AizzakVaultAuthFailing
        expr: aizzak_vault_authenticated < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The app process can no longer authenticate to Vault (ن-10)"
          description: >-
            GET /metrics has reported aizzak_vault_authenticated=0 for 5
            consecutive minutes: an expired or revoked VAULT_SECRET_ID whose
            re-login fails, a sealed/unreachable Vault, or a policy change.
            Every credentials/integrations operation that needs Transit is
            already failing, and /health/ready stays green throughout -- it
            probes no dependency by design (§3.75), which is the silence this
            alert exists to break.
          reason: >-
            Threshold is `< 1` on a 1/0 gauge -- there is no partial state to
            calibrate, the process either holds a working Vault session or it
            does not. severity=critical rather than warning because this is
            capability LOSS, not backlog: the runtime path is already 500ing
            and the next restart will not boot at all (docs/log/3.94.md).
            5m suppresses a Vault blip or a single 5s client timeout only;
            the condition never self-heals, since re-login reuses the same
            VAULT_SECRET_ID the process was started with.
          response: >-
            ⚠️ ORDER MATTERS -- doing this in the wrong order makes the correct
            fix look broken. Every failed probe is a failed AppRole login, and
            enough of them trip Vault's user lockout ("core: login attempts
            exceeded, user is locked out"), after which even a brand-new valid
            secret_id is refused with a bare 403 permission denied. So
            (1) STOP THE SCRAPER as well as the app (`docker compose stop app`)
            -- a scraper left polling keeps re-arming the lockout by itself;
            (2) unlock with the root token:
            `vault write -f sys/locked-users/<mount_accessor>/unlock/<role_id>`
            (check with `vault read sys/locked-users`);
            (3) mint a new secret_id (08-local-runbook.md §3.1 step 2);
            (4) `docker compose up -d --force-recreate --no-deps app` --
            `start` reuses the container's baked-in environment and never sees
            the updated .env. Full procedure: 08-local-runbook.md §3.1.
