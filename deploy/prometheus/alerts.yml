# Alerting rules for the two P1-3 health signals (docs/p1-hardening-plan.md
# §3 step 10; 07-nfr-slo §7's "زمن دورة الـOutbox ومَلء DLQ مؤشّرا صحّة
# رئيسيان عند تفعيل المراقبة"), plus the Vault-authentication gauge added by
# ن-10 (§5-ب; the live outage is docs/log/3.94.md).
#
# ── Scope, deliberately narrow -- and it grew by exactly one ───────────────
# Exactly the metrics `GET /metrics` exposes (`src/app/api/metrics.py`'s
# `OUTBOX_AGE_METRIC`/`DLQ_DEPTH_METRIC`/`VAULT_AUTH_METRIC` -- `tests/unit/
# test_prometheus_alert_rules.py` imports those SAME constants rather than
# repeating the literals here, so this file and the endpoint cannot drift
# apart silently) and exactly one alert per metric. The file was scoped to
# TWO metrics from step 10 until 2026-07-30, when ن-10's failure mode stopped
# being theoretical and happened: the app's Vault credential expired, nothing
# detected it, and the next restart crash-looped. That is a third signal of a
# genuinely different kind -- a dependency-liveness probe, not a platform-state
# gauge -- so it earned a third rule rather than being folded into either
# existing one. The scope statement stood until the capacity plan: 0.3 added
# rules about the scraper itself, 4.5-5.7 one or two per step, and 7.3 the
# first DERIVED rules -- error-budget burn rates, a ratio of two counters over
# two windows -- because "is the commitment eroding" is not a question any
# single gauge answers. Monitoring plan phase 2 (docs/monitoring-plan.md,
# docs/delivery/monitoring-host-postgres/) added the first rules about the
# HOST and about Postgres ITSELF: a full disk, a dead server behind a live
# pgbouncer, a lock wait, a stalled WAL archiver. Still true: every rule names
# the step that earned it, and nothing here is a dashboard.
#
# ── What evaluates it, and where a firing alert goes ───────────────────────
# Written on 2026-07-30 as an artifact for a scraper that did not exist yet.
# Capacity 0.3 (2026-09-02) added the Prometheus that evaluates it; capacity
# 7.3 (2026-10-04) added the rest of the path -- `deploy/alertmanager/` routes
# every notification to `alert-sink`, whose log lines Alloy ships to Loki,
# the local delivery the owner chose until an external channel is named.
#
# ── Capacity 7.3: every rule has a runbook, every rule has a test ──────────
# Two obligations each rule below carries, and both are guarded:
#   * `annotations.runbook_url` opens its own section of
#     docs/runbooks/alerts.md -- what it means and the ordered steps to take.
#     "An alert without a written procedure is noise that gets switched off
#     the third time" (7.3's own words);
#   * a case in `alerts.test.yml` that fires it on synthetic series and one
#     that proves the healthy shape does not. `promtool test rules` runs them
#     (08 §4.28); `tests/unit/test_prometheus_alert_rules.py` refuses a rule
#     with neither.
#
# ── Why a threshold at all, not "any() > baseline" ─────────────────────────
# Every rule carries a real number and a real `for:` duration because an
# alert with neither is exactly the "إنذارٌ يُرى لا يُستجاب له" (an alert
# seen, not acted on) the design brief explicitly rejects -- see each rule's
# own `annotations.reason` below for its specific justification, grounded in
# `07-nfr-slo.md` for the Outbox rule, in the DLQ's own recovery mechanics
# (`src/app/infrastructure/messaging/redis_streams.py`'s `dead_letter`) for
# the DLQ rule, and in a measured production outage for the Vault rule.
groups:
  - name: aizzak-outbox-dlq
    rules:
      # ── Outbox cycle time ────────────────────────────────────────────────
      # `aizzak_outbox_oldest_unpublished_age_seconds` is a LIVE gauge -- how
      # long the OLDEST still-unpublished `platform.outbox` row has been
      # waiting, `0` if none are (`SqlRedisMetricsSource`'s own docstring) --
      # not a historical percentile. Comparing it directly against
      # `07-nfr-slo.md` §2's own p99 budget for "زمن دورة الـOutبox (نشر بعد
      # الالتزام)" (3s) is therefore the correct read: under a healthy relay
      # this value sits well below 3s essentially always (the relay polls
      # every `OUTBOX_POLL_INTERVAL_MS=500ms` by default), so 2 CONSECUTIVE
      # minutes above the p99 ceiling is not a single slow cycle -- it is 240x
      # the default poll interval, which only happens if the relay is
      # genuinely stalled, crash-looping, or down (`outbox_relay.py`'s own
      # module docstring: every payload is pre-validated at PRODUCE time, so
      # the only publish failures possible are transport-level and apply to
      # the WHOLE batch, never one poisoned row -- there is no "slow but
      # otherwise healthy" steady state this threshold could mistake for an
      # outage).
      #
      # ⚠️ `max(...)` SINCE CAPACITY 3.4, and the wrapper is not cosmetic. This
      # gauge is EXTERNAL STATE: every `app` container recomputes the identical
      # number from Postgres on every scrape, and `app` now has three of them
      # behind three scrape targets. Bare, this expression matched three series
      # describing ONE outbox and fired three alert instances for it. `max()`
      # is the right collapse rather than `avg()` for the same reason
      # `multiprocess_mode="max"` is right for event-loop lag: the question is
      # whether the oldest row anywhere is past budget, and averaging is what
      # hides it. `sum()` would have been the wrong collapse in the other
      # direction -- it would treble the age and fire at a third of the
      # threshold.
      - alert: AizzakOutboxCycleTimeHigh
        expr: max(aizzak_outbox_oldest_unpublished_age_seconds) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox publish cycle time exceeds the p99 SLO (3s, 07-nfr-slo.md §2)"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakoutboxcycletimehigh"
          description: >-
            The oldest unpublished platform.outbox row has been waiting more
            than 3 seconds (the p99 budget for "زمن دورة الـOutbox") for at
            least 2 consecutive minutes. This means outbox-relay
            (docker-compose.yml's single-instance `outbox-relay` service) is
            stalled, crash-looping, or down -- every payload is pre-validated
            at produce time, so a row cannot be individually poisoned; only a
            transport-level failure (Redis unreachable) or a dead process
            explains a sustained backlog.
          reason: >-
            3s = 07-nfr-slo.md §2's own p99 target for this exact quantity;
            2m = ~240x the default 500ms poll interval, chosen so a single
            slow cycle (network jitter, one large batch) cannot false-alarm,
            while a genuine outage (which does not self-heal) is still caught
            within a couple of minutes.
          response: >-
            Check `docker compose logs outbox-relay` / the RunPod
            [program:outbox-relay] log first (08-local-runbook.md §7); the
            relay reads platform.outbox and republishes on restart, so
            restarting it (never manual data surgery) is the first repair.

      # ── DLQ depth ────────────────────────────────────────────────────────
      # A dead-lettered entry NEVER self-heals: `dead_letter`
      # (infrastructure/messaging/redis_streams.py) moves it to `<stream>.dlq`
      # and nothing in this codebase automatically drains it back -- the
      # ONLY path off the queue is an operator running `python -m app.ops.dlq
      # peek/requeue/purge` by hand (P1-4, docs/p1-hardening-plan.md §3 step
      # 7 -- "الأداة قبل المقياس": this alert's entire reason to exist is
      # that this tool is what an operator runs once it fires). Getting HERE
      # at all already means `MAX_RETRIES_BEFORE_DLQ=5` delivery attempts
      # failed, or an envelope was malformed/unroutable -- both are already
      # exceptional events, unlike a queue depth metric with ordinary
      # fluctuation. So the threshold is deliberately `> 0`, not some larger
      # "how much backlog is normal" number: there IS no normal non-zero
      # backlog for this queue.
      #
      # ⚠️ `sum(max by (stream) (...))` SINCE CAPACITY 3.4, and the inner
      # `max by (stream)` is what makes the outer `sum` mean what it says. The
      # sum across STREAMS is the intent -- one alert for the whole DLQ, the
      # ت-6 correction -- but with three `app` replicas each reporting the same
      # per-stream depth, a bare `sum()` adds the same entries once per
      # container. MEASURED on the live stack: a real backlog of 30 read as 90.
      # This rule's `> 0` threshold survives that (three times zero is still
      # zero, and it fires either way when there is anything at all), but the
      # DESCRIPTION an operator reads carries the number, and so does the
      # dashboard panel next to it. `max by (stream)` collapses the replicas
      # and keeps the streams.
      - alert: AizzakDlqNotEmpty
        expr: sum(max by (stream) (aizzak_dlq_depth)) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The dead-letter queue has an entry needing operator triage"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakdlqnotempty"
          description: >-
            At least one entry has sat on a <stream>.dlq stream for 5 minutes
            -- one per stream in the static consumer topology
            (stream.files / stream.knowledge / stream.media / stream.memory;
            the gauge's label carries which). Dead-lettered entries do not
            self-heal; each one already represents either 5 failed handler
            attempts (MAX_RETRIES_BEFORE_DLQ) or a malformed/unroutable
            envelope.
            NOTE (ت-6, 2026-08-15): this rule listed only knowledge/media
            until `aizzak_dlq_depth` itself did -- and the one entry on the
            live stack was on stream.memory.dlq, i.e. on a queue neither the
            gauge nor this text covered. The metric now derives its stream
            list from `framework/events/topology.py` instead of a literal.
          reason: >-
            Threshold is `> 0`, not a larger number, because there is no
            "normal" non-zero depth for this queue -- reaching the DLQ at all
            is already the exceptional case (5 exhausted retries, or a
            malformed envelope). 5m rules out alerting on an entry an
            automated requeue could plausibly clear near-instantly; today
            nothing does that automatically, so in practice this fires
            shortly after the first entry lands.
          response: >-
            python -m app.ops.dlq peek <stream> (P1-4, step 7) to inspect
            entries, then requeue (reinjectable=True) or purge
            (--yes, bookkeeping-only entries) -- see
            08-local-runbook.md §4.2 for the full procedure, including the
            claimed-ledger caveat requeue cannot itself detect.
            Until a scraper exists to evaluate this rule at all, the same
            fact reaches an operator as a `dlq.backlog` WARNING logged by the
            owning worker every DLQ_WATCH_INTERVAL_S
            (`infrastructure/messaging/consumers/dlq_watch.py`, ت-6) --
            carrying the depth, the oldest entry's age and its reason.
            `docker compose logs worker-memory | grep dlq.backlog`.

  # A SECOND group rather than a third rule in the one above: `aizzak-outbox-dlq`
  # names exactly what it holds, and this signal is neither an Outbox nor a DLQ
  # fact. Prometheus evaluates groups independently, so the split also means a
  # future `interval:` on the Vault group (a slower probe -- see the lockout
  # warning below) does not slow the two platform-state gauges down with it.
  - name: aizzak-vault
    rules:
      # ── Vault authentication ─────────────────────────────────────────────
      # `aizzak_vault_authenticated` is 1 when the app process can currently
      # make an authorized Vault call and 0 for every other outcome
      # (`src/app/infrastructure/monitoring/vault_health.py`: the probe is a KV
      # read of a path nobody writes, so Vault's own 404 -- a `NotFoundError`
      # -- is the HEALTHY answer, and needs no policy grant beyond the
      # `secret/data/*` read the app already holds).
      #
      # `severity: critical`, unlike the two `warning`s above, and the
      # asymmetry is deliberate. Those two describe a BACKLOG: work is delayed
      # or parked, but the platform still serves every request it can. This one
      # describes a capability that is already GONE -- Vault sits on the
      # runtime path of every `credentials`/`integrations` operation (decrypting
      # a tenant key goes through Transit on every call, not just at boot), so
      # by the time this gauge reads 0 those operations are ALREADY failing with
      # 500s. And it gets strictly worse with time rather than better: the next
      # container restart does not recover, it fails to boot at all
      # (`create_vault_client` logs in during composition), and the resulting
      # gunicorn crash loop trips Vault's user lockout -- after which even a
      # freshly minted, valid secret_id is refused. Measured, not predicted:
      # docs/log/3.94.md is the write-up of that exact sequence happening.
      #
      # `for: 5m` is noise suppression ONLY -- a Vault restart, a sealed-then-
      # unsealed window, one 5s client timeout. It is emphatically not a grace
      # period for self-healing, because this condition never self-heals: the
      # process re-logs-in with the SAME `VAULT_SECRET_ID` it was started with,
      # so an expired/revoked one stays expired until a human mints a new one.
      # Same reasoning as the DLQ rule's own `for:`, applied to a condition with
      # an even flatter recovery curve.
      - alert: AizzakVaultAuthFailing
        expr: aizzak_vault_authenticated < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The app process can no longer authenticate to Vault (ن-10)"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakvaultauthfailing"
          description: >-
            GET /metrics has reported aizzak_vault_authenticated=0 for 5
            consecutive minutes: an expired or revoked VAULT_SECRET_ID whose
            re-login fails, a sealed/unreachable Vault, or a policy change.
            Every credentials/integrations operation that needs Transit is
            already failing, and /health/ready stays green throughout -- it
            probes no dependency by design (§3.75), which is the silence this
            alert exists to break.
          reason: >-
            Threshold is `< 1` on a 1/0 gauge -- there is no partial state to
            calibrate, the process either holds a working Vault session or it
            does not. severity=critical rather than warning because this is
            capability LOSS, not backlog: the runtime path is already 500ing
            and the next restart will not boot at all (docs/log/3.94.md).
            5m suppresses a Vault blip or a single 5s client timeout only;
            the condition never self-heals, since re-login reuses the same
            VAULT_SECRET_ID the process was started with.
          response: >-
            ⚠️ ORDER MATTERS -- doing this in the wrong order makes the correct
            fix look broken. Every failed probe is a failed AppRole login, and
            enough of them trip Vault's user lockout ("core: login attempts
            exceeded, user is locked out"), after which even a brand-new valid
            secret_id is refused with a bare 403 permission denied. So
            (1) STOP THE SCRAPER as well as the app (`docker compose stop app`)
            -- a scraper left polling keeps re-arming the lockout by itself;
            (2) unlock with the root token:
            `vault write -f sys/locked-users/<mount_accessor>/unlock/<role_id>`
            (check with `vault read sys/locked-users`);
            (3) mint a new secret_id (08-local-runbook.md §3.1 step 2);
            (4) `docker compose up -d --force-recreate --no-deps app` --
            `start` reuses the container's baked-in environment and never sees
            the updated .env. Full procedure: 08-local-runbook.md §3.1.

  # ── A THIRD group, added by Wave 0 step 0.3 (docs/capacity-plan.md) ───────
  # The two rules here are of a kind the file could not hold before
  # 2026-09-02, and the reason is the same fact that makes this whole file
  # different now: until step 0.3 there was no Prometheus, so there were no
  # `up` series and no exporters to have opinions about. Every rule above
  # thresholds a number `GET /metrics` emits; these two threshold whether the
  # measurement apparatus ITSELF is intact. That is a genuinely separate
  # concern -- a stalled Outbox is a platform fact, a dead scrape target is
  # the absence of any fact at all -- so it earns its own group rather than
  # widening `aizzak-outbox-dlq` past what its name says.
  #
  # ⚠️ WHAT WAS NOT HERE UNTIL 7.3, AND WHY: no error-rate rule and no
  # `cl_waiting` threshold, even though step 0.2 added the metrics and the
  # dashboard plots them. Every such rule needs a number, and the only honest
  # source for it was step 0.5's measured baseline, which did not exist yet;
  # an alert calibrated against a guess either never fires or always does, and
  # both look like a working alert from the outside (م-8). The baseline exists
  # since 2026-09-26 (docs/capacity-baseline.md), and the groups at the end of
  # this file are calibrated on it. Latency still has no rule: 07 §2's budgets
  # are p95 targets, not a failure ratio with a budget to burn, and the
  # error-budget rules already fire when slowness turns into 500s.
  - name: aizzak-scrape
    rules:
      # ── Target down ──────────────────────────────────────────────────────
      # `up` is Prometheus's own synthetic per-target gauge: 1 if the last
      # scrape succeeded, 0 if it did not. A 0 here means this rules file has
      # stopped being able to evaluate ANY rule about that target -- not that
      # something is wrong with the target's numbers, but that there are no
      # numbers. The three gauges above would all read "no data", which
      # Prometheus does NOT treat as an alertable condition: a rule whose
      # expression matches no series is simply inactive. So without this rule
      # the failure mode is total silence, indistinguishable from health.
      #
      # `tier!="optional"` excludes cAdvisor, which is behind the
      # `container-metrics` Compose profile and therefore absent from a
      # default `up` on purpose (`prometheus.yml`'s own note). An alert that
      # fires permanently in the normal case trains its reader to ignore the
      # rest of the file.
      #
      # `for: 30s` rather than the 15s below: losing sight of a target is not
      # itself an outage, and a target legitimately disappears for a few
      # seconds whenever an operator recreates a container. Two consecutive
      # failed evaluations is the smallest window that still refuses to fire
      # on one.
      - alert: AizzakScrapeTargetDown
        expr: up{tier!="optional"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "A Prometheus scrape target has stopped answering ({{ $labels.job }})"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakscrapetargetdown"
          description: >-
            Prometheus could not scrape {{ $labels.job }} at
            {{ $labels.instance }} for at least 30 seconds. Every alert rule
            about that target is now inactive rather than firing -- an
            expression matching no series does not alert -- so this rule is
            the only thing standing between a dead exporter and silence that
            reads exactly like health.
          reason: >-
            Threshold is `== 0` on Prometheus's own synthetic `up` gauge;
            there is no partial state to calibrate. 30s = two consecutive
            failed evaluations at the 15s evaluation_interval, the smallest
            window that does not fire on a single container recreate.
            `tier!="optional"` excludes the cAdvisor target, which the
            `container-metrics` profile leaves stopped by default.
          response: >-
            `docker compose ps` for the target's own service, then
            `docker compose logs prometheus` -- a target that is UP but
            unscrapeable is usually a changed port or a metrics_path, not a
            dead process. The scrape configuration is
            `deploy/prometheus/prometheus.yml`; the targets and their last
            error are at http://prometheus:9090/targets inside the Compose
            network (the service is `expose`-only, so reach it with
            `docker compose exec prometheus wget -qO- 127.0.0.1:9090/...`
            or through the Grafana container, never a published port).

      # ── PgBouncer unreachable ────────────────────────────────────────────
      # `pgbouncer_up` is the exporter's own 1/0 verdict on whether it could
      # log into the pooler's admin console for THIS scrape. It is not `up`:
      # the exporter is a separate container that keeps answering scrapes
      # perfectly well while the pooler behind it is gone, which is precisely
      # why the rule above cannot cover this case and why both exist.
      #
      # `severity: critical`, and this is the platform's shortest path to a
      # total outage. Every DATABASE_URL in docker-compose.yml names
      # `pgbouncer:6432` -- the app, all four workers, the relay, the
      # migrator, and `/metrics`'s own metrics_reader connection. Postgres
      # itself is reachable only through it. So a dead pooler is not degraded
      # service, it is every request that touches data failing at once, and
      # unlike the Outbox and DLQ backlogs above there is no queue quietly
      # holding the work for later.
      #
      # `for: 15s` -- half the window of the rule above, because there is
      # nothing to wait out. The pooler does not have a slow-but-recovering
      # state this could false-alarm on: the exporter either completed an
      # admin-console login in the last scrape or it did not. This is also
      # step 0.3's own acceptance criterion, sized against its clock:
      # ≤15s to the first failing scrape + 15s of `for` + ≤15s to the
      # confirming evaluation = under a minute in the worst case.
      - alert: AizzakPgbouncerDown
        expr: pgbouncer_up == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "PgBouncer is not answering its admin console -- every DB path is down"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakpgbouncerdown"
          description: >-
            The pgbouncer-exporter sidecar could not log into
            pgbouncer:6432's admin console for 15 consecutive seconds. Every
            DATABASE_URL in this deployment routes through that pooler (app,
            worker-memory/knowledge/media, outbox-relay, migrate, and the
            metrics_reader connection behind GET /metrics); Postgres is not
            reachable any other way. Expect 500s on every data path, not
            degradation.
          reason: >-
            Threshold is `== 0` on the exporter's own 1/0 login verdict, not
            on `up` -- the exporter is a separate container and keeps
            answering scrapes while the pooler behind it is gone, so
            AizzakScrapeTargetDown cannot see this failure at all. 15s is
            deliberately half that rule's window: a pooler has no
            slow-but-recovering state to wait out, and step 0.3's acceptance
            criterion budgets one minute end to end for exactly this alert.
          response: >-
            `docker compose ps pgbouncer` first. If it is down,
            `docker compose up -d pgbouncer` -- it holds no state of its own.
            If it is UP and this is still firing, the failure is the admin
            login rather than the pooler: check that POSTGRES_SUPERUSER /
            POSTGRES_SUPERUSER_PASSWORD still match, since `admin_users` in
            the generated pgbouncer.ini is that superuser and the exporter
            authenticates as it. Verify by hand with
            `docker compose exec pgbouncer psql -h 127.0.0.1 -p 6432 -U
            "$DB_USER" -d pgbouncer -c 'SHOW POOLS;'`. A healthy pooler that
            refuses the exporter is a credential problem, and the platform
            itself is fine -- the app authenticates through AUTH_QUERY, a
            different path entirely.

      # capacity-plan 4.5 -- the ONE signal that an embedding-model change
      # shipped without its corpus migration. Every process reads and writes
      # the collection its own regime built, so a deployment that changed
      # EMB_MODEL/EMB_MAX_SEQ_LEN/dimensions and skipped
      # `python -m app.ops.embedding_migration build` keeps serving perfectly:
      # retrieval answers from the corpus nobody is writing to any more, and
      # indexing writes into a corpus nobody searches. Latency is normal,
      # error rates are zero, /health is green, and every document indexed
      # since the deploy is invisible. Nothing else in this file can see it.
      #
      # `for: 10m` is what separates the accident from the PROCEDURE. A
      # `build` run deliberately produces shadow writes for as long as it
      # takes, and an operator is watching it; ten minutes is long enough not
      # to page during a short one and short enough that an unattended
      # deployment is caught inside a working day rather than a quarter.
      # A long build fires this too -- correctly: it is the same state, and
      # "expected right now" is a thing the operator knows and Prometheus
      # cannot.
      - alert: AizzakVectorShadowWrites
        expr: increase(aizzak_vector_corpus_total{op="write",corpus="shadow"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Indexing is writing into a corpus nothing searches (capacity 4.5)"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakvectorshadowwrites"
          description: >-
            This deployment's embedding regime owns no corpus for at least one
            workspace, so indexed documents are landing in a collection
            retrieval does not read. Expected while
            `app.ops.embedding_migration build` runs. Outside that, it means
            the model, its dimensions or EMB_MAX_SEQ_LEN changed and the
            corpus migration never ran -- and every document indexed since is
            unreachable by search, with no error anywhere.
          reason: >-
            Threshold is `> 0` over ten minutes rather than a rate: a single
            shadow write is already the whole finding, and the counter cannot
            move at all under a deployment whose corpus matches its regime.
            The metric's `corpus` label has exactly three values, so this
            costs one series.
          response: >-
            `docker compose exec app python -m app.ops.embedding_migration
            status --json` names the workspaces and this deployment's
            revision. If a build is in flight, this is the procedure working.
            If not, either finish the migration (`build` then `verify`, then
            redeploy onto the new regime) or put the previous
            EMB_MODEL/EMB_MAX_SEQ_LEN back -- the previous corpus is still
            standing until someone runs `drop`, which is what makes the
            rollback complete. Documents indexed into the shadow are not
            lost; a later `build` sweeps them.

      # ── capacity 5.2 (ح-10 · ق-4) — the two rules the split makes possible ──
      #
      # Before 5.2 there was one Redis at `maxmemory 0`, and neither of these
      # could have been written: with no ceiling there is no "80% of" anything,
      # and on a shared instance an eviction is ambiguous between "the cache is
      # working" and "a stream entry was just silently deleted".
      #
      # `redis_memory_max_bytes` is the exporter's name for `maxmemory`. Both
      # expressions are scoped `job="redis-stream"` and that scope is
      # load-bearing, not decoration -- the same two expressions against
      # `redis-cache` would fire continuously by design.
      - alert: AizzakRedisStreamMemoryHigh
        expr: >-
          redis_memory_used_bytes{job="redis-stream"}
          / redis_memory_max_bytes{job="redis-stream"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "redis-stream is at 80% of maxmemory -- at 100% it refuses writes"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakredisstreammemoryhigh"
          description: >-
            The `noeviction` instance is four fifths full. What happens at the
            ceiling is not slow-down and not eviction: every write to that
            server starts failing with OOM, and that server holds the event
            streams, the WebSocket session registry, the per-user and
            per-workspace rate-limit windows and the `auth:revoked:` session
            denylist. A single tenant's DLQ storm therefore surfaces as
            refused WebSocket connections and failed rate-limit accounting.
          reason: >-
            80% and `for: 5m` because the thing to catch is a TREND with hours
            of runway, not a spike. The declared worst case of the bounded
            keys is roughly 500 MB against a 2 GB ceiling (four streams at
            STREAM_MAXLEN=100000 at ~1 KB per entry, MEASURED on this stack's
            own entries, plus ~540k sliding-window members at the §0 peak),
            so reaching 1.6 GB means something UNBOUNDED is growing. The
            candidate is named: `dead_letter` issues its XADD with no `maxlen`
            on purpose, since quarantined events must never be dropped to make
            room.
          response: >-
            `docker compose exec redis-stream redis-cli INFO memory` for the
            total, then `redis-cli --memkeys` or
            `docker compose exec redis-stream redis-cli XLEN stream.<m>.dlq`
            for the three DLQs -- they are the only unbounded keys on this
            instance. Drain them with `python -m app.ops.dlq` (peek, then
            requeue or drop). If the growth is in the primary streams instead,
            a consumer group is stalled: `XINFO GROUPS stream.<m>` and 08 §4.2.
            Raising `maxmemory` buys time and fixes nothing.

      # This one can never fire on a correctly configured instance, and that
      # is exactly its value: `maxmemory-policy noeviction` makes the counter
      # unmovable, so any increase at all means somebody ran `CONFIG SET` on a
      # live server -- silently converting the streams, the WS registry and the
      # session denylist into evictable data. `ح-10`'s own words for that:
      # "silent data loss, no error, no alert, no trace in any log".
      - alert: AizzakRedisStreamEvicted
        expr: increase(redis_evicted_keys_total{job="redis-stream"}[10m]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "redis-stream evicted a key -- its policy is no longer noeviction"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakredisstreamevicted"
          description: >-
            A key was discarded to make room on the instance whose entire
            reason for existing is that it does not do that. Anything on it
            may now vanish without an error: an unconsumed stream entry, a
            WebSocket session record, a rate-limit window, or an
            `auth:revoked:<sub>` denylist entry -- and an evicted denylist
            entry means a revoked token works again until it expires.
          reason: >-
            `> 0` with no `for:` window, unlike every other rule in this file.
            There is no benign amount of this: the counter is structurally
            pinned at zero by the policy `docker-compose.yml` sets, so the
            first increment is the whole finding and waiting to confirm it
            only extends the window in which data is being lost.
          response: >-
            `docker compose exec redis-stream redis-cli CONFIG GET
            maxmemory-policy` -- it must say `noeviction`. Put it back with
            `CONFIG SET maxmemory-policy noeviction`, then find out what was
            lost: `XPENDING`/`XLEN` per stream against the outbox, and treat
            every WebSocket session as needing reconnection. If the policy is
            already `noeviction`, the container was restarted with a different
            `command:` -- compare against `docker-compose.yml` before
            anything else.

      # ── capacity 5.5 (ح-17) — the stream trim, its backstop, and the loss ──
      #
      # Since 5.5 `outbox-relay` trims every published stream below its
      # slowest reader (`XTRIM MINID ~`), and `XADD ... MAXLEN ~` stays only as
      # a BACKSTOP: the one mechanism left that can delete an entry a group
      # has not read. These two rules watch it from both sides -- before it
      # bites, and if it ever does. All four gauges are external state that
      # every `app` replica recomputes, hence `max` everywhere.
      - alert: AizzakStreamBackstopHigh
        expr: >-
          max by (stream) (aizzak_stream_length)
          / scalar(max(aizzak_stream_maxlen)) > 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A stream is at 70% of its MAXLEN backstop -- past 100% XADD deletes unread entries ({{ $labels.stream }})"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakstreambackstophigh"
          description: >-
            The trim keeps a stream down to what its slowest consumer group
            still needs, so a stream this long means a group has stopped
            reading -- a stopped worker, a wedged one, or a group nobody will
            ever read again -- or the trim itself is not running. At the
            backstop, every new event deletes the oldest entry whether or not
            that group has read it: the silent loss `ح-17` names.
          reason: >-
            70% is capacity 5.5's own number. The backstop is sized at three
            times the peak arrival on the busiest stream over the longest
            outage 5.5 calls acceptable (08 §4.21: 100,000 entries against
            ~12,000 for a 20-minute outage at 200 events/min, plus the trim
            margin), so reaching 70% is already far outside anything
            tolerable -- and `for: 5m` because the length only climbs, it
            never spikes.
          response: >-
            `docker compose exec -T app python -m app.ops.stream_trim status`
            names the group that bounds the trim and how long it has held it.
            A worker's group (`cg.knowledge`/`cg.media`/`cg.memory`): bring
            its worker back -- nothing is lost yet. A group nothing will ever
            read again: destroy it (`redis-cli XGROUP DESTROY <stream>
            <group>`, 08 §4.21). Every group caught up and the stream still
            long: the trim is not running -- `STREAM_TRIM_INTERVAL_S` and the
            `stream_trim.*` lines in `outbox-relay`'s log. Raising
            STREAM_MAXLEN buys time against a memory ceiling that is not
            yours to spend (08 §4.19).

      # The loss itself, counted by Redis. `entries-added - entries-read -
      # lag` is the number of entries removed before a group read them; it is
      # structurally zero while only the 5.5 trim runs (it never cuts below a
      # group's position), so -- like `AizzakRedisStreamEvicted` above -- the
      # first non-zero value is the whole finding and there is nothing to
      # debounce. Redis re-estimates `entries-read` once the group reads past
      # the gap, so the number is only visible while the group is still
      # behind it; a `for:` window could let a recovering consumer erase the
      # evidence before the alert ever fired.
      - alert: AizzakStreamEntriesLost
        expr: max by (stream, group) (aizzak_stream_unread_trimmed_entries) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Stream entries were deleted before a consumer group read them ({{ $labels.stream }} / {{ $labels.group }})"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakstreamentrieslost"
          description: >-
            Events were removed from {{ $labels.stream }} while
            {{ $labels.group }} had not yet read them. Their outbox rows are
            already stamped published, so nothing will redeliver them: the
            work they asked for (an indexing job, a media job, a memory item)
            will not happen, and no other signal says so.
          reason: >-
            `> 0` with no `for:` window. The 5.5 trim cannot produce this, so
            any value means the MAXLEN backstop bit into unread history or
            someone ran XTRIM by hand. The gauge also disappears once the
            group reads past the gap, so waiting to confirm it can only lose
            the evidence.
          response: >-
            `python -m app.ops.stream_trim status` for the group and the size
            of the gap. Then find what was lost: the entry ids between the
            group's cursor and the stream's first entry are gone, but their
            payloads are still rows in `platform.outbox` (published in that
            window, same stream). Re-publishing them is 5.6's replay tool;
            until it exists, requeue by hand and let `processed_events` absorb
            anything that did get through. Then fix why the group stalled
            long enough for the backstop to reach it.

  # ── capacity 5.7 — the scheduled tasks, and the failure that is silence ──
  #
  # 5.7's own warning: «مهمّةٌ مجدولةٌ تفشل صامتةً أسوأُ من غياب المهمّة». A
  # task that is not scheduled is a known gap; one that is scheduled and has
  # quietly stopped is a gap everybody believes is closed. So every scheduled
  # task records its passes in one ledger (`framework/ports/task_ledger.py`),
  # `/metrics` reports it, and these two rules read it: one for a task that
  # stopped succeeding, one for a task nothing ever started. All five gauges
  # are external state every `app` replica recomputes, hence `max by (task)`.
  #
  # ⚠️ The label is `task`. `job` is the label Prometheus writes with the
  # scrape job's name, and an exposed `job` label is renamed `exported_job`
  # on ingestion -- `max by (job)` here would have grouped the whole ledger
  # into one series called `aizzak-app`.
  - name: aizzak-ops-tasks
    rules:
      - alert: AizzakOpsTaskOverdue
        # The last success -- or, for a task that never succeeded, the moment
        # it was armed -- is older than two cycles plus the longest one run
        # may take. `or` takes the success where there is one and the arming
        # only where there is none; a task switched off (cycle 0) has no
        # deadline series and cannot match.
        expr: >-
          time() - (
            max by (task) (aizzak_ops_task_last_success_timestamp_seconds)
            or max by (task) (aizzak_ops_task_armed_timestamp_seconds)
          ) > max by (task) (aizzak_ops_task_max_success_age_seconds)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled task {{ $labels.task }} has not succeeded in two cycles"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakopstaskoverdue"
          description: >-
            {{ $labels.task }} last succeeded (or, if it never has, was first
            armed) longer ago than two of its cycles plus one run. Its runner
            is either not running it or running it and failing every time --
            `aizzak_ops_task_last_failure_timestamp_seconds` newer than the
            last success says which. Either way the thing it maintains is
            drifting: the backup shelf ages, the ledgers grow, the WAL spool
            fills, the Transit key's old versions stay in use.
          reason: >-
            "Two cycles" is capacity 5.7's own threshold, written as a number
            by the runner itself (`max_success_age = 2 x interval +
            max_runtime`), so a daily job is late at 48 h plus its allowed
            run time and the 60-second trimmer at two minutes -- one rule for
            every cadence. One missed cycle is a retry; two in a row is a
            task that has stopped. `for: 5m` only debounces a scrape; the
            deadline already carries the slack.
          response: >-
            `docker compose exec ops-scheduler python -m app.ops.scheduler
            status` prints every task's state, last success and last error
            (the error text is in the ledger, and the full output is in the
            runner's own log: `docker compose logs ops-scheduler` for the
            nightly tools, `outbox-relay` for stream_trim, `app` for
            notify_groups, the named worker for dlq_watch:*). Fix the cause,
            then run it once by hand through the same path:
            `python -m app.ops.scheduler run-once <task> --yes` (08 §4.23).
            A `purge` refused because `backup` did not succeed is the backup's
            problem, not purge's.

      - alert: AizzakOpsTaskNeverArmed
        # A task in the catalog that no runner has ever declared -- its
        # service was never deployed, or its loop never started. The overdue
        # rule cannot see this: with neither a success nor an arming there is
        # no clock to be late against.
        expr: >-
          max by (task) (aizzak_ops_task_expected)
          unless max by (task) (aizzak_ops_task_armed_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled task {{ $labels.task }} is expected but nothing has ever run it"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakopstaskneverarmed"
          description: >-
            {{ $labels.task }} is in the platform's task catalog
            (`SCHEDULED_TASKS`) but no runner has written a single line about
            it to the task ledger. The service that should run it is missing,
            has never finished starting, or was built from an image older
            than capacity 5.7.
          reason: >-
            An absent record looks exactly like an absent obligation, so the
            catalog is reported whether or not anything wrote to it, and this
            rule is the difference. `for: 30m` covers a stack still booting;
            every runner arms its tasks within its first minute.
          response: >-
            `docker compose ps` for the runner `python -m app.ops.scheduler
            status` names (ops-scheduler for the nightly tools). If it is
            running, check its log for `scheduled_task.ledger_write_failed`
            or `ops_scheduler.tick_failed` -- the ledger lives on
            redis-stream. If the key was flushed with the rest of Redis, the
            next pass re-arms it by itself.


  # ══ capacity 7.3 — the rules the plan names, calibrated on the baseline ══
  #
  # 7.3's list, against what was already here: pool saturation, stream lag,
  # DLQ depth (AizzakDlqNotEmpty, since P1-3), 5xx rate, 429 rate, Redis
  # memory (AizzakRedisStreamMemoryHigh, since 5.2), a sealed Vault
  # (AizzakVaultAuthFailing -- a sealed Vault refuses the probe's login like
  # an expired secret does, so one rule covers both), event-loop lag and
  # `cl_waiting`. The six that were missing are below, plus the two Redis
  # liveness rules AizzakPgbouncerDown's reasoning always implied, the 6.1
  # circuit, and the Watchdog.
  #
  # Every number is from docs/capacity-baseline.md (2026-09-26) or from this
  # stack's own 15 days of series, read on 2026-10-04 -- the rule's `reason`
  # says which. ⚠️ And a consequence worth stating once: a load run past the
  # knee (150 rps on this host) WILL fire the saturation and error-budget
  # rules. That is them working. Silence them for the run from Grafana's
  # Alertmanager datasource, never by editing a threshold.

  # ── The error budget: burn rates, not thresholds (7.3's own ⚠️) ─────────
  # 07 §2 promises the synchronous API 99.9% a month, and plan §7 item 4
  # writes the same commitment as "error rate < 0.1%" -- 429 excluded, since
  # an intended refusal is not an error. So the budget is 0.1% of requests,
  # and the question worth waking someone for is how fast it is being spent.
  #
  # The two pairs are the SRE workbook's multi-window multi-burn-rate shape,
  # at the two rates 7.3 names. 14.4x for an hour spends 2% of a month's
  # budget; 6x for six hours spends 5%. Each pairs its long window with a
  # short one (1/12 of it) that must ALSO be burning, so the alert stops
  # within minutes of the errors stopping rather than an hour later.
  #
  # `route!~"/metrics|/health.*"`: Prometheus's own scrapes and Docker's
  # healthchecks are requests nobody made. Left in, they pad the denominator
  # on a quiet stack -- three healthchecks and a scrape every few seconds
  # -- and a real outage of the API reads as a fraction of its true rate.
  - name: aizzak-error-budget
    rules:
      - alert: AizzakApiErrorBudgetBurnFast
        expr: >-
          (
            sum(rate(aizzak_http_requests_total{status=~"5..",route!~"/metrics|/health.*"}[1h]))
            / sum(rate(aizzak_http_requests_total{route!~"/metrics|/health.*"}[1h]))
          ) > (14.4 * 0.001)
          and
          (
            sum(rate(aizzak_http_requests_total{status=~"5..",route!~"/metrics|/health.*"}[5m]))
            / sum(rate(aizzak_http_requests_total{route!~"/metrics|/health.*"}[5m]))
          ) > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The API is spending its monthly error budget 14.4x too fast"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakapierrorbudgetburnfast"
          description: >-
            More than 1.44% of API requests answered 5xx over the last hour,
            and still over the last five minutes. At this rate the 0.1% a
            month that 07 §2 allows (99.9%) is gone in about two days.
          reason: >-
            14.4x the 0.1% budget (07 §2; plan §7 item 4) over 1h AND 5m is
            the workbook's fast-burn page: 2% of the month in one hour. On
            this stack's 15 days of series the 5m ratio crossed it for 173
            minutes, every one of them inside a load run past the knee
            (capacity-baseline: 1.9% 5xx at 200 rps, 13.8% at 300). `for: 2m`
            stops one bad scrape from paging.
          response: >-
            Which route and which status: `sum by (route, status)
            (rate(aizzak_http_requests_total{status=~"5.."}[5m]))` in
            Grafana. Then the cause, most likely first: PgBouncer and the
            app's pool (AizzakDbPoolSaturated / AizzakPgbouncerClientsWaiting
            firing beside this means requests time out waiting for a
            connection -- 500 after DB_POOL_TIMEOUT_S), then the app's own
            log (`{service="app", level="error"}` in the aizzak-logs
            dashboard). If a load run is in progress, this is the run.

      - alert: AizzakApiErrorBudgetBurnSlow
        expr: >-
          (
            sum(rate(aizzak_http_requests_total{status=~"5..",route!~"/metrics|/health.*"}[6h]))
            / sum(rate(aizzak_http_requests_total{route!~"/metrics|/health.*"}[6h]))
          ) > (6 * 0.001)
          and
          (
            sum(rate(aizzak_http_requests_total{status=~"5..",route!~"/metrics|/health.*"}[30m]))
            / sum(rate(aizzak_http_requests_total{route!~"/metrics|/health.*"}[30m]))
          ) > (6 * 0.001)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The API is spending its monthly error budget 6x too fast"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakapierrorbudgetburnslow"
          description: >-
            More than 0.6% of API requests answered 5xx over the last six
            hours, and still over the last thirty minutes. Not an outage --
            a steady leak that empties the month's budget in about five
            days if nobody looks.
          reason: >-
            6x the 0.1% budget over 6h AND 30m is the workbook's slow-burn
            rule, the second rate 7.3 names: 5% of the month in six hours.
            It catches what the fast rule is built to ignore -- one route
            failing a few requests in a hundred, all day. `for: 15m` because
            nothing about a six-hour trend changes in a minute.
          response: >-
            Same first query as the fast burn, over 6h:
            `sum by (route, status) (increase(aizzak_http_requests_total{status=~"5.."}[6h]))`.
            A slow burn is usually ONE route; its error lines are in the
            aizzak-logs dashboard filtered by that path. Fix or roll back the
            change that introduced it (08 §4.15 for the rollback).

  # ── Saturation: the resources the baseline saw run out ──────────────────
  - name: aizzak-saturation
    rules:
      # The app's own pool, per container. `in_use` and `capacity` are both
      # `livesum` across the container's gunicorn siblings, so the ratio is
      # the container's; no aggregation across containers, because one
      # replica saturating behind an uneven balancer is the case to see.
      - alert: AizzakDbPoolSaturated
        expr: aizzak_db_pool_in_use / aizzak_db_pool_capacity > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "An app container has used 90% of its database pool ({{ $labels.instance }})"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakdbpoolsaturated"
          description: >-
            {{ $labels.instance }} has more than 90% of its connections
            checked out for two minutes. The next requests queue for a
            connection, and any that waits DB_POOL_TIMEOUT_S (5s) is
            answered 500 -- the baseline's whole failure mode past 200 rps.
          reason: >-
            capacity-baseline §3: at the knee (150 rps) the fleet held 46 of
            360 connections (13%); at 200 rps it held 352 (98%) and 1.9% of
            requests failed. 90% sits between the two with no measured case
            near it, so it fires on the way to the cliff, not on a busy
            minute. 15 days of series: 100 minutes at or above it, all inside
            load runs.
          response: >-
            Look at AizzakPgbouncerClientsWaiting first: if PgBouncer is
            queueing too, the pool is not the limit, Postgres is
            (08 §2-ب, max_connections). If only this container is full, the
            load is uneven -- `sum by (instance) (rate(aizzak_http_requests_total[5m]))`.
            If all three are full, the platform is past its measured
            capacity: shed load (the 1.2 ceilings), or add capacity per
            08 §2-ب -- never raise DB_POOL_SIZE alone, which only moves the
            queue to PgBouncer.

      # ح-3's own number. Bimodal on this stack's 15 days of series: zero
      # outside load runs, above a hundred inside them, and 4 at the knee.
      - alert: AizzakPgbouncerClientsWaiting
        expr: >-
          sum by (database) (pgbouncer_pools_client_waiting_connections{database!="pgbouncer"}) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Clients are queueing at PgBouncer for a server connection ({{ $labels.database }})"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakpgbouncerclientswaiting"
          description: >-
            More than ten client connections have been waiting for a
            Postgres server connection for two minutes (`cl_waiting`). Every
            one of them is a request or a job standing still, and the
            baseline's saturation runs held 255.
          reason: >-
            `cl_waiting` is ح-3's direct evidence and plan §3's connection
            budget in one number. Measured: 4 at the knee (150 rps), 258 at
            200 rps, and on this stack's 15 days either 0 or past 100 --
            nothing in between, so the threshold could be anywhere from 5 to
            50 and would have fired on the same minutes. 10 is above the
            knee's 4 with room.
          response: >-
            `docker compose exec -T pgbouncer sh -c 'PGPASSWORD="$DB_PASSWORD"
            psql -h 127.0.0.1 -p 6432 -U "$DB_USER" -d pgbouncer -c "SHOW
            POOLS;"'` -- which pool (user) is waiting. Then Postgres: `SELECT count(*) FROM
            pg_stat_activity` against max_connections (300); a long
            transaction holding servers shows in `pg_stat_activity` ordered
            by `xact_start`. The ledger of who may hold how many is 08 §2-ب.

      # The gauge is each 5s window's WORST stall, sampled once per 15s
      # scrape, so a loop that stalls for two seconds every ten would be
      # missed by two scrapes in three. `max_over_time(...[1m])` asks
      # instead whether each minute held at least one stall, and `for: 5m`
      # whether five minutes in a row did. Per container, never summed --
      # one blocked loop is the finding (test_metrics_topology.py).
      - alert: AizzakEventLoopBlocked
        expr: max_over_time(aizzak_event_loop_lag_seconds[1m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An app process's event loop keeps stalling for more than a second ({{ $labels.instance }})"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakeventloopblocked"
          description: >-
            Every minute for five minutes, a process in {{ $labels.instance }}
            could not run its own timer for over a second. Everything that
            process serves -- requests, WebSocket messages, health probes --
            waits for as long as the loop is blocked: ح-5's shape.
          reason: >-
            On this stack's 15 days the gauge's median was 1.7 ms and its
            90th percentile 7.4 ms; one second is two orders of magnitude
            past healthy and nearly seven times 07 §2's 150 ms read budget.
            The minutes above it (168 of 6,173) were the load runs past the
            knee, where a blocked loop is the truth.
          response: >-
            Is it load or a bug: if AizzakDbPoolSaturated or the error
            budget is firing beside it, the process is overloaded and the
            fix is the load. If it fires on a quiet stack, something
            synchronous is running on the loop -- the app's log around the
            stall (aizzak-logs, that container), and the request that was in
            flight. A rolling restart (08 §4.15) clears the symptom; it does
            not find the call.

      # The queue's own clock, not `aizzak_stream_lag_seconds`: after a
      # quiet spell the first entry of a burst puts that one at the length
      # of the QUIET SPELL (the gap to the last delivered id), so it would
      # fire every morning. `queue_wait` is how long the oldest undelivered
      # entry has actually waited (capacity 5.3, the port's own docstring).
      - alert: AizzakStreamQueueWaitHigh
        expr: max by (stream, group) (aizzak_stream_queue_wait_seconds) > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Work on {{ $labels.stream }} has waited more than two minutes for {{ $labels.group }}"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakstreamqueuewaithigh"
          description: >-
            The oldest entry {{ $labels.group }} has not yet been handed has
            been waiting more than 120 seconds, for five minutes. Documents
            are not being indexed, media not processed, or memory not
            written as fast as they arrive. On stream.knowledge the API is
            already answering new uploads 429 (capacity 5.3).
          reason: >-
            120s is plan §7 item 5 ("تأخّرُ المجاري مستقرٌّ دون دقيقتين") and
            the same QUEUE_LAG_CEILING_S the indexing queue refuses at. Over
            it for five minutes is a queue that is not draining, not a burst.
          response: >-
            `docker compose ps` for the group's worker (cg.knowledge ->
            worker-knowledge, cg.media -> worker-media, cg.memory ->
            worker-memory). Running: its log for the handler that is slow or
            failing, and `XINFO GROUPS <stream>` on redis-stream for pending
            counts. Stopped: start it -- nothing is lost while the entries
            wait (5.5's trim keeps them). Sustained load above what the
            workers can do: 08 §4.18 (WORKER_CONCURRENCY) and §4.0.

      # 429 is not an error (plan §7 item 4) and is not in the budget above.
      # It IS the platform turning people away, and 7.3 names its rate.
      # Counted by the app only: nginx's own `limit_req` 429s at the edge
      # never reach it, and are in the edge's access log instead.
      - alert: AizzakRateLimitedShareHigh
        expr: >-
          sum(rate(aizzak_rate_limit_rejections_total[10m]))
          / sum(rate(aizzak_http_requests_total{route!~"/metrics|/health.*"}[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than one request in twenty is being refused with 429"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakratelimitedsharehigh"
          description: >-
            Over 5% of API requests were answered 429 for ten minutes. Each
            refusal is deliberate (a per-user or per-workspace ceiling, the
            in-flight cap, a full provider, a full indexing queue), so this
            is not a fault -- it is the platform saying no to a share of its
            users large enough to be a capacity conversation.
          reason: >-
            5% for 10m: high enough that one user hammering a retry loop
            does not reach it on a busy stack, low enough that a tenant at
            its workspace ceiling (1.2) or a provider at its concurrency cap
            (6.1) does. A share rather than a count, so the threshold means
            the same thing at 10 rps and at 300.
          response: >-
            Which ceiling: `sum by (reason) (rate(aizzak_rate_limit_rejections_total[10m]))`,
            and for the API ceilings `sum by (outcome) (rate(aizzak_api_rate_limit_total[10m]))`.
            One workspace at its ceiling is that tenant's conversation (08
            §2-د); `llm.*` is a provider at its cap (08 §4.25); the indexing
            queue is AizzakStreamQueueWaitHigh. Raising a ceiling is a
            decision about who gets the capacity, not a fix.

      # The two Redis instances, each through its own exporter -- the reason
      # AizzakPgbouncerDown exists, applied to Redis: the exporter keeps
      # answering scrapes while the server behind it is gone, so `up` stays 1
      # and only `redis_up` falls. Two rules rather than one with a templated
      # severity, because the two failures are different in kind.
      - alert: AizzakRedisStreamDown
        expr: redis_up{job="redis-stream"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "redis-stream is not answering -- events, WebSockets and rate limits are down"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakredisstreamdown"
          description: >-
            The redis-stream exporter could not reach its server for 30
            seconds. That server holds the event streams, the WebSocket
            session registry, the rate-limit windows and the session
            denylist (08 §4.19): uploads are accepted and never indexed,
            WebSockets fail, and the ceilings fail OPEN.
          reason: >-
            `== 0` on the exporter's own 1/0 verdict, not on `up`, for the
            reason AizzakPgbouncerDown gives. 30s rather than 15s: a Redis
            restart (AOF replay) takes seconds, and the outbox holds every
            event until it is back -- nothing is lost while it is away.
          response: >-
            `docker compose ps redis-stream`, then `docker compose up -d
            redis-stream`. On restart it replays its AOF; check that the
            streams came back (`docker compose exec redis-stream redis-cli
            XLEN stream.knowledge`). If they did not, 08 §4.22 republishes
            them from the outbox.

      - alert: AizzakRedisCacheDown
        expr: redis_up{job="redis-cache"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "redis-cache is not answering -- the platform runs uncached"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakrediscachedown"
          description: >-
            The redis-cache exporter could not reach its server for a
            minute. Nothing is lost -- everything on it is rebuilt on demand
            -- but every authenticated request pays the database round trips
            1.1 removed, and every RAG question is embedded again (4.3).
            Expect higher latency and pool pressure, not errors.
          reason: >-
            warning, not critical: every reader of this server fails open by
            design (`unavailable` outcomes on the cache counters), so the
            platform keeps serving. `for: 1m` lets a restart finish first.
          response: >-
            `docker compose ps redis-cache`, then `docker compose up -d
            redis-cache`. It starts empty and fills itself; nothing to
            restore. If it keeps dying, `docker compose logs redis-cache` --
            its memory ceiling is 1 GB with allkeys-lru, so an OOM kill means
            the container limit is below maxmemory.

      # capacity 6.1's circuit, which until now was visible in /metrics and
      # Grafana and lit nothing. `livemax` per container; any container's
      # open circuit is users failing, so `max by (provider)`.
      - alert: AizzakLlmCircuitOpen
        expr: max by (provider) (aizzak_llm_circuit_open) == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "The circuit to the {{ $labels.provider }} model provider has been open for two minutes"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakllmcircuitopen"
          description: >-
            Calls to {{ $labels.provider }} kept failing, so the guard
            stopped making them: chats on that provider answer 502 at once,
            or -- for a cloud provider with LLM_FALLBACK_ROUTE set -- the
            local model answers them instead and the user is told (6.4).
          reason: >-
            The circuit opens after repeated transient failures and probes
            again after its cool-down (08 §4.25), so a single open-close
            cycle is the guard working. Open for two minutes is past one
            cool-down: the provider is unreachable, the key is wrong, or the
            quota is spent.
          response: >-
            `docker compose logs app | grep llm_guard` for the failure the
            circuit counted. A cloud provider: its status page and the
            platform key's quota. `ollama`: `docker compose ps
            ollama-bridge` and the host's Ollama. The circuit closes by
            itself once a probe succeeds; there is nothing to reset.

  # ── The host (monitoring plan phase 2, row 1) ──────────────────────────
  - name: aizzak-host
    rules:
      - alert: AizzakHostDiskHigh
        expr: >-
          1 - node_filesystem_avail_bytes{job="node", mountpoint="/", fstype!~"tmpfs|overlay|9p"}
            / node_filesystem_size_bytes{job="node", mountpoint="/", fstype!~"tmpfs|overlay|9p"}
          > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The host's root filesystem is {{ $value | humanizePercentage }} full"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakhostdiskhigh"
          description: >-
            `/` holds Docker's whole data root: Postgres, the WAL spool,
            Prometheus and Loki. Postgres stops writing at 100%. The Windows
            drive (C:, /mnt/c) is NOT monitored (Q-2), and the virtual disk
            file on it can fill first.
          reason: >-
            80% is the monitoring plan's number. `1 - avail/size`: blocks
            reserved for root count as used, because Postgres runs as uid 999
            and cannot write into them. `for: 10m` (Q-7): a disk fills over
            hours, and ten minutes ignores the spike of a base-backup spool.
            Excluding tmpfs|overlay|9p here is a belt over the exporter's own
            exclusion.
          response: >-
            `df -h /`, then `docker system df`, then `docker compose exec -T
            ops-scheduler python -m app.ops.backup status` for the spool
            depth. NEVER the volume-prune, system-prune or `down -v` commands.

  # ── Postgres itself (monitoring plan phase 2, row 2) ───────────────────
  - name: aizzak-postgres
    rules:
      - alert: AizzakPostgresDown
        expr: pg_up{job="postgres"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "postgres-exporter cannot reach Postgres -- every data path is down"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakpostgresdown"
          description: >-
            The exporter is alive but has not been able to log in to the
            server for 30 seconds. AizzakPgbouncerDown cannot see this: the
            pooler's admin console is answered by the pooler itself.
          reason: >-
            `== 0` on the exporter's own verdict, not on `up` (the
            AizzakPgbouncerDown logic). 30s: a deliberate restart of a healthy
            cluster finishes inside it; the same `for` as AizzakRedisStreamDown.
          response: >-
            `docker compose ps postgres`. If it runs: `docker compose logs
            --since 10m postgres-exporter`. A line `password authentication
            failed for user "metrics_exporter"` means the role or its password,
            not the server -- the fix is 08-local-runbook §3.3-ج step ①.
            Restarting `postgres` is a human decision.
      - alert: AizzakPostgresLockWaitHigh
        expr: pg_lock_wait_longest_seconds{job="postgres"} > 60
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "A session has waited on a lock for over a minute"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakpostgreslockwaithigh"
          description: >-
            A session in the platform database has waited more than a minute
            for a lock. Usually an open transaction or a hand-run
            ALTER/VACUUM FULL.
          reason: >-
            > 60s is the plan's number. `pg_locks.waitstart` measures the wait
            itself, not the transaction's age. `for: 30s` makes the effective
            threshold 60-90s, so one sample cannot fire it.
          response: >-
            `SELECT pid, pg_blocking_pids(pid), wait_event, now()-xact_start,
            left(query,120) FROM pg_stat_activity WHERE wait_event_type =
            'Lock';`. `pg_cancel_backend` is a human decision. Silence planned
            work from Grafana; do not edit the threshold.
      - alert: AizzakPostgresArchiveStalled
        expr: pg_archive_ready_oldest_age_seconds{job="postgres"} > 900
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A finished WAL segment has waited over 15 minutes to be archived"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakpostgresarchivestalled"
          description: >-
            `.ready` segments are piling up: the server is not copying WAL to
            the spool. The disk fills, and point-in-time recovery stops at the
            last archived segment.
          reason: >-
            Built on `.ready` files, not `failed_count`, which stays 0 when
            archive_command cannot even be run (src/app/ops/backup.py), and
            not on `last_archive_age`, because a quiet cluster completes no
            segments. 900s = 3 x archive_timeout (Q-7). `for: 1m` absorbs a
            WSL2 clock jump.
          response: >-
            `SELECT * FROM pg_stat_archiver;`, then `docker compose logs
            --since 30m postgres | grep -i "archive command failed"`, then
            `docker compose exec -T postgres ls -ld
            /var/lib/postgresql/wal-archive`, then `df -h /`.

  # ── The pipeline's own heartbeat ────────────────────────────────────────
  # Always firing, by construction. Every rule above can only speak if
  # Prometheus evaluates, Alertmanager routes and the sink records; none of
  # them can say that the path itself is broken, because the message would
  # travel the broken path. So this one says the opposite, continuously:
  # `alertmanager.yml` repeats it every five minutes, and the sink's log
  # going quiet for longer is the alert.
  - name: aizzak-meta
    rules:
      - alert: AizzakWatchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "The alert pipeline is alive (always firing by design)"
          runbook_url: "https://github.com/anastawahia/aizzak/blob/master/docs/runbooks/alerts.md#aizzakwatchdog"
          description: >-
            Not a problem. This alert fires forever so that its five-minute
            line in alert-sink's log proves Prometheus, Alertmanager and the
            sink all still work. The problem is when the lines STOP.
          reason: >-
            A dead man's switch: an alerting path cannot report its own
            death through itself, so its health is the presence of a
            heartbeat rather than the absence of an alert.
          response: >-
            Nothing while it arrives. If alert-sink's log has no
            AizzakWatchdog line in the last ten minutes: `docker compose ps
            prometheus alertmanager alert-sink`, and start whichever is
            stopped with `docker compose up -d <service>`.
