# The proxy surface, INCLUDED by both the :80 and the :443 server block
# (7.3). Included rather than copied, and that is the whole point: two server
# blocks holding two hand-maintained copies of the same three locations is
# the drift shape this repository keeps paying for -- an OpenAPI contract
# declaring five paginated operations against an implementation with three
# (§3.71), grants listed in one place and tables in another (§3.75). A
# WebSocket timeout raised on :443 and forgotten on :80 is the same bug with
# a different costume.
#
# ⚠️ NO `upstream` BLOCK, and that is load-bearing (found live in 7.1, §3.75
# decision (ط)). nginx resolves a name inside an `upstream` block ONCE at
# config load and caches it for the process lifetime; Compose hands a
# recreated container a NEW IP, so the first `docker compose up -d app` after
# any code change leaves nginx proxying at an address nothing is listening on
# -- every request 502s until nginx itself is restarted, while `docker compose
# ps` cheerfully reports the app healthy. Naming the destination in a VARIABLE
# forces per-request resolution through `resolver`; `$request_uri` must then
# be appended explicitly, because a variable in `proxy_pass` stops nginx
# passing the matched URI automatically.

set $aizzak_app "app:8000";

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $scheme, not a literal: this file is included by both server blocks, so the
# app is told "http" on :80 and "https" on :443 from the same line. Hard-coding
# it is how a redirect built from X-Forwarded-Proto ends up pointing at the
# wrong scheme.
proxy_set_header X-Forwarded-Proto $scheme;

# ── Security headers + HSTS (P1-7) — declared HERE, and ONLY here ─────────
# ⚠️ THE `add_header` INHERITANCE TRAP, PAID FOR LIVE (docs/log/3.88.md's
# correction section). nginx inherits `add_header` from a parent context INTO
# a child ONLY IF the child declares NONE of its own -- declaring even ONE
# `add_header` in a child REPLACES the whole inherited set, it does not merge
# with it. The first version of this file put the three headers below in
# `nginx.conf`'s `http` block and the `Strict-Transport-Security` line ALONE
# inside the `:443 server` block -- which gave `:443` (the actual production
# path) an `add_header` of its own and silently wiped the other three off of
# EVERY response that mattered. Verified live with a throwaway `nginx:1.27
# --rm` container proxying that exact config: all three headers arrived on
# :80, NONE arrived on :443. `deploy/runpod/nginx.conf` had the identical
# shape with only ONE server block total -- so it lost all three on every
# single request, not just the production path.
#
# The fix is this file: all four `add_header` directives, TOGETHER, in ONE
# place -- included at `server` level by BOTH :80 and :443 below, and by
# neither location overriding them (none of the three locations in this file
# declares an `add_header` of its own, so all four reach every response
# through both server blocks unchanged).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# $hsts_header: a `map $host ...` defined in nginx.conf's `http` block (`map`
# is only legal there -- only the directive that CONSUMES the map moved here,
# not the map itself). Empty for every host not explicitly named, so this
# ships NOTHING at all -- `add_header` omits a header outright when its value
# is empty -- for `localhost`/every other not-yet-named host, on :80 AND on a
# not-yet-named :443. Present on :80 too, not just :443: harmless (RFC 6797
# §8.1 -- a browser MUST ignore this header received over a non-secure
# transport) and one line cheaper than a second declaration site to keep in
# sync, which is exactly the mistake this section exists to not repeat.
add_header Strict-Transport-Security $hsts_header always;

# CORS is enforced at the edge because every browser API request bears an
# Authorization header and therefore requires a preflight. `$cors_allow_origin`
# is an explicit allow-list defined in nginx.conf's `http` block; it is blank
# for untrusted origins, never a reflected wildcard.
add_header Access-Control-Allow-Origin $cors_allow_origin always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Max-Age 600 always;

if ($request_method = OPTIONS) {
    return 204;
}

# Liveness/readiness, unauthenticated and at the root (03-api-spec). Kept out
# of the access log: a 10s healthcheck would otherwise be nearly all of it.
#
# ⚠️ DELIBERATELY NO `limit_req`/`limit_conn` HERE (P1-7). A rate limit on the
# healthcheck the ORCHESTRATOR itself polls every 10s does not slow an
# attacker -- it starves the probe, and this container's own edge healthcheck
# (docker-compose.yml's `nginx` service) has already gone unhealthy from a
# 504 on this exact path once before (§3.76). Nothing below may add either
# directive to this location.
location /health {
    access_log off;
    proxy_pass http://$aizzak_app$request_uri;
}

# `/metrics` (P1-3, p1-hardening-plan.md §3 step 10) is deliberately
# UNREACHABLE through this edge -- Prometheus text about the Outbox/DLQ
# internals is operator information, not a public surface, the SAME trust
# boundary the embedding service already draws with `expose:` instead of
# `ports:` (docker-compose.yml, release-blockers-plan.md's rejected-port
# precedent, n-3). `location /` below would otherwise proxy it to the world
# exactly like every other path it does not itself intercept -- answered
# locally HERE instead, never `proxy_pass`ed to the app, so a probe against
# this edge cannot even confirm the path exists (404, not 403). A real
# Prometheus scraper reaches this path over the Compose-internal network
# directly (`app:8000/metrics`), never through nginx.
location /metrics {
    return 404;
}

# WebSocket streaming (/api/v1/ws). Three things this needs that a plain
# proxy_pass does not give:
#   1. HTTP/1.1 + the Upgrade/Connection pair, or the handshake is answered
#      as an ordinary request and the client sees a 400.
#   2. A read timeout longer than the silence between frames -- nginx's 60s
#      default closes an idle-but-live socket, which surfaces to the user as
#      a stream that dies mid-thought.
#   3. Buffering off, so tokens leave as they arrive.
#
# ⚠️ NO `limit_req` (P1-7): the handshake is one HTTP request, then the
# connection stays open for the whole session -- a long-lived connection is
# not a repeated request, and metering it as one would either do nothing (one
# request charged, ever) or throttle legitimate reconnect traffic
# indistinguishably from an attack. `limit_conn` is the right primitive here
# instead: it bounds how many sockets one IP may hold open AT ONCE, which is
# a real, current gap this edge has today (P1-8/step 11 of this plan is the
# separate, per-USER, post-auth version of this same cap, still open).
location /api/v1/ws {
    proxy_pass http://$aizzak_app$request_uri;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
    limit_conn ws_conn 100;
}

location / {
    proxy_pass http://$aizzak_app$request_uri;
    # SSE (`Accept: text/event-stream`) shares this location: agent invocation
    # streams over plain HTTP. Buffering on would hold events until the buffer
    # filled, turning a live stream into a batch delivery.
    proxy_buffering     off;
    proxy_read_timeout  300s;
    # `limit_req` (P1-7) admits/rejects at the START of a request, before
    # proxying begins -- it never cuts a stream already in flight, so an SSE
    # response admitted under this limit keeps flowing for its whole
    # `proxy_read_timeout` regardless of what arrives after it. `burst=40
    # nodelay` absorbs a page load's cluster of near-simultaneous requests
    # instead of queueing (`nodelay`) or rejecting (`burst`) the first few.
    limit_req zone=api_req burst=40 nodelay;
}
