# The proxy surface, INCLUDED by both the :80 and the :443 server block
# (7.3). Included rather than copied, and that is the whole point: two server
# blocks holding two hand-maintained copies of the same three locations is
# the drift shape this repository keeps paying for -- an OpenAPI contract
# declaring five paginated operations against an implementation with three
# (§3.71), grants listed in one place and tables in another (§3.75). A
# WebSocket timeout raised on :443 and forgotten on :80 is the same bug with
# a different costume.
#
# ⚠️ NO `upstream` BLOCK, and that is load-bearing (found live in 7.1, §3.75
# decision (ط)). nginx resolves a name inside an `upstream` block ONCE at
# config load and caches it for the process lifetime; Compose hands a
# recreated container a NEW IP, so the first `docker compose up -d app` after
# any code change leaves nginx proxying at an address nothing is listening on
# -- every request 502s until nginx itself is restarted, while `docker compose
# ps` cheerfully reports the app healthy. Naming the destination in a VARIABLE
# forces per-request resolution through `resolver`; `$request_uri` must then
# be appended explicitly, because a variable in `proxy_pass` stops nginx
# passing the matched URI automatically.
#
# ⭐ RE-CONFIRMED LIVE IN CAPACITY 3.2, because that step exists to buy upstream
# keepalive and `keepalive` is legal ONLY inside an `upstream` block -- so this
# decision had to be re-earned rather than inherited. Two throwaway edges were
# run side by side against this stack's own `app`, one with this file's shape
# and one with `upstream { server app:8000; keepalive 64; }`:
#
#   * a plain `docker compose up -d --force-recreate app` left the container on
#     172.18.0.3 and BOTH edges answered 200. The failure does not reproduce on
#     demand.
#   * with the freed address held by another container, the recreated app landed
#     on 172.18.0.26 and, with no edge restarted: variable edge 200, `upstream`
#     edge 502.
#
# ⚠️ AND THE FIRST BULLET IS THE WORSE HALF. A configuration that fails EVERY
# time gets caught by the first smoke run; this one fails only when Docker's
# IPAM happens to hand the address elsewhere, so an `upstream` block would pass
# every test this repository runs and then 502 permanently, days later, on a
# deploy nobody was watching -- the edge healthcheck would catch it (that is
# what it is for, 7.3) but nothing restarts an unhealthy container.
#
# ⚠️ THE PRICE IS NOT ZERO AND IS NO LONGER UNQUANTIFIED. MEASURED at 300 rps
# through otherwise-identical edges: p95 1.99ms without a pool, 1.02ms with one
# (-49%), and 15,782 TIME_WAIT sockets against 10. The latency half is 0.97ms on
# a same-host bridge and is accepted; the SOCKET half was the real bill and is
# paid in docker-compose.yml's `nginx` sysctls instead, where it can be paid
# without giving this decision up.

set $aizzak_app "app:8000";

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $scheme, not a literal: this file is included by both server blocks, so the
# app is told "http" on :80 and "https" on :443 from the same line. Hard-coding
# it is how a redirect built from X-Forwarded-Proto ends up pointing at the
# wrong scheme.
proxy_set_header X-Forwarded-Proto $scheme;

# Capacity 0.6 -- the two ids the app binds onto every log line it emits for
# this request (`api/main.py`'s correlation middleware). Set HERE, in the
# shared include, so :80 and :443 cannot drift: an id present on one scheme
# and absent on the other is a store in which half the traffic is unjoinable.
#
# `$aizzak_correlation_id` is the client's own header when it sent one and
# `$request_id` otherwise (the `map` in nginx.conf) -- so this line REPLACES a
# client-supplied value with itself, and supplies one when the client did not.
# The app's `request.headers.get(CORRELATION_HEADER) or new_uuid7()` then never
# reaches its fallback behind this edge, which is the point: the fallback exists
# for a direct `app:8000` call, not for production traffic.
proxy_set_header X-Correlation-Id $aizzak_correlation_id;
proxy_set_header X-Request-Id     $request_id;

# ── Security headers + HSTS (P1-7) — declared HERE, and ONLY here ─────────
# ⚠️ THE `add_header` INHERITANCE TRAP, PAID FOR LIVE (docs/log/3.88.md's
# correction section). nginx inherits `add_header` from a parent context INTO
# a child ONLY IF the child declares NONE of its own -- declaring even ONE
# `add_header` in a child REPLACES the whole inherited set, it does not merge
# with it. The first version of this file put the three headers below in
# `nginx.conf`'s `http` block and the `Strict-Transport-Security` line ALONE
# inside the `:443 server` block -- which gave `:443` (the actual production
# path) an `add_header` of its own and silently wiped the other three off of
# EVERY response that mattered. Verified live with a throwaway `nginx:1.27
# --rm` container proxying that exact config: all three headers arrived on
# :80, NONE arrived on :443.
#
# The fix is this file: all four `add_header` directives, TOGETHER, in ONE
# place -- included at `server` level by BOTH :80 and :443 below, and by
# neither location overriding them (none of the locations in this file
# declares an `add_header` of its own, so all four reach every response
# through both server blocks unchanged).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# $hsts_header: a `map $host ...` defined in nginx.conf's `http` block (`map`
# is only legal there -- only the directive that CONSUMES the map moved here,
# not the map itself). Empty for every host not explicitly named, so this
# ships NOTHING at all -- `add_header` omits a header outright when its value
# is empty -- for `localhost`/every other not-yet-named host, on :80 AND on a
# not-yet-named :443. Present on :80 too, not just :443: harmless (RFC 6797
# §8.1 -- a browser MUST ignore this header received over a non-secure
# transport) and one line cheaper than a second declaration site to keep in
# sync, which is exactly the mistake this section exists to not repeat.
add_header Strict-Transport-Security $hsts_header always;

# CORS is enforced at the edge because every browser API request bears an
# Authorization header and therefore requires a preflight. `$cors_allow_origin`
# is an explicit allow-list defined in nginx.conf's `http` block; it is blank
# for untrusted origins, never a reflected wildcard.
add_header Access-Control-Allow-Origin $cors_allow_origin always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Max-Age 600 always;

if ($request_method = OPTIONS) {
    return 204;
}

# Liveness/readiness, unauthenticated and at the root (03-api-spec). Kept out
# of the access log: a 10s healthcheck would otherwise be nearly all of it.
#
# ⚠️ DELIBERATELY NO `limit_req`/`limit_conn` HERE (P1-7). A rate limit on the
# healthcheck the ORCHESTRATOR itself polls every 10s does not slow an
# attacker -- it starves the probe, and this container's own edge healthcheck
# (docker-compose.yml's `nginx` service) has already gone unhealthy from a
# 504 on this exact path once before (§3.76). Nothing below may add either
# directive to this location.
location /health {
    access_log off;
    proxy_pass http://$aizzak_app$request_uri;
}

# `/health/drain` (capacity 7.2) is deliberately UNREACHABLE through this
# edge, the SAME trust boundary `/metrics` draws below and for a sharper
# reason: this one is a verb. It takes a replica out of rotation and closes
# every WebSocket it holds, unauthenticated, and it has to stay
# unauthenticated because the caller is a deploy script that runs before any
# credential is in scope. Answered locally with 404 -- not 403 -- so a probe
# through this edge cannot even learn the path exists.
#
# ⚠️ AND A PROXIED VERSION WOULD BE WRONG EVEN IF IT WERE SAFE. The edge load
# balances across every replica, and this endpoint must address exactly ONE:
# proxied, "drain replica 2" would drain whichever replica the round robin
# happened to pick. `deploy/rolling-deploy.sh` reaches it over loopback inside
# the target container, which is the only address that names one replica.
#
# ⚠️ It is LONGER than `/health` above, and nginx picks the longest matching
# prefix regardless of order -- so this wins even though it is written second.
# `tests/unit/test_rolling_deploy.py` asserts that rather than trusting it.
location /health/drain {
    return 404;
}

# `/metrics` (P1-3, p1-hardening-plan.md §3 step 10) is deliberately
# UNREACHABLE through this edge -- Prometheus text about the Outbox/DLQ
# internals is operator information, not a public surface, the SAME trust
# boundary the embedding service already draws with `expose:` instead of
# `ports:` (docker-compose.yml, release-blockers-plan.md's rejected-port
# precedent, n-3). `location /` below would otherwise proxy it to the world
# exactly like every other path it does not itself intercept -- answered
# locally HERE instead, never `proxy_pass`ed to the app, so a probe against
# this edge cannot even confirm the path exists (404, not 403). A real
# Prometheus scraper reaches this path over the Compose-internal network
# directly (`app:8000/metrics`), never through nginx.
location /metrics {
    return 404;
}

# WebSocket streaming (/api/v1/ws). Three things this needs that a plain
# proxy_pass does not give:
#   1. HTTP/1.1 + the Upgrade/Connection pair, or the handshake is answered
#      as an ordinary request and the client sees a 400.
#   2. A read timeout longer than the silence between frames -- nginx's 60s
#      default closes an idle-but-live socket, which surfaces to the user as
#      a stream that dies mid-thought.
#   3. Buffering off, so tokens leave as they arrive.
#
# ⚠️ NO `limit_req` (P1-7): the handshake is one HTTP request, then the
# connection stays open for the whole session -- a long-lived connection is
# not a repeated request, and metering it as one would either do nothing (one
# request charged, ever) or throttle legitimate reconnect traffic
# indistinguishably from an attack. `limit_conn` is the right primitive here
# instead: it bounds how many sockets one IP may hold open AT ONCE, which is
# a real, current gap this edge has today (P1-8/step 11 of this plan is the
# separate, per-USER, post-auth version of this same cap, still open).
location /api/v1/ws {
    proxy_pass http://$aizzak_app$request_uri;
    # ⚠️ THE `add_header` INHERITANCE TRAP AGAIN, ON A DIFFERENT DIRECTIVE --
    # FOUND LIVE IN CAPACITY 3.2, and it had been shipping. `proxy_set_header`
    # obeys the SAME array-inheritance rule this file documents for
    # `add_header` a hundred lines up: a location that declares even ONE
    # replaces the entire inherited set. This location declared two (Upgrade
    # and Connection), so every WebSocket handshake reached the app having lost
    # all six declared above. MEASURED against THIS file, unmodified, proxied
    # to a header-echoing upstream:
    #
    #   location /          host=aizzak.test  xff=127.0.0.1  corr=1631279815...
    #   location /api/v1/ws host=app:8000     xff=(absent)   corr=(absent)
    #
    # `Host` fell back to nginx's default `$proxy_host` -- the literal upstream
    # address -- and X-Real-IP, X-Forwarded-For, X-Forwarded-Proto,
    # X-Correlation-Id and X-Request-Id were simply not sent.
    #
    # ⚠️ AND IT DEFEATED CAPACITY 0.6 EXACTLY WHERE 0.6 MATTERS MOST. That step
    # puts the id here, at the edge, on the argument that «the edge is the FIRST
    # hop of every request, so it is the only place that can guarantee a
    # correlation id exists at all». On this path it guaranteed nothing: the
    # app's `request.headers.get(CORRELATION_HEADER) or new_uuid7()` fallback
    # ran for every WebSocket session, minting an id nginx had never seen, so
    # the edge line and the app line for the same 1,500-socket population could
    # not be joined -- the one thing 0.6's acceptance criterion asks for.
    #
    # ⚠️ AND A TEST WAS WATCHING AND COULD NOT SEE IT.
    # `test_the_edge_passes_both_ids_upstream` asserts that the
    # `proxy_set_header X-Correlation-Id ...` LINE IS IN THIS FILE. It was, and
    # is, and passed the whole time -- a line's presence in a file is not the
    # same claim as nginx applying it to a request. The guard that replaced it
    # compares this location's header set against the shared one.
    #
    # Repeated in full below rather than reduced: nginx offers no way to add to
    # an inherited `proxy_set_header` set from a nested level. The list must
    # stay identical to the one at the top of this file, and
    # `tests/unit/test_edge_capacity.py` fails the build when it drifts.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $aizzak_correlation_id;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
    # ── 100 → 500 (capacity 3.1). MEASURED EXACTLY, on this stack: 150
    # simultaneous upgrades offered from ONE address were answered 100 × 101
    # and 50 × 429. The limiter does precisely what it says, and what it says
    # is too small for the shape §0 describes -- 500 users × up to 3 tabs
    # behind one office NAT is 1,500 sockets from one address, and 100 of them
    # is roughly 33 users before the 34th is refused.
    #
    # ⚠️ AND THE COST IS REAL, so it is stated rather than implied: this is a
    # PRE-AUTH ceiling, and `websocket/streaming.py` accepts a TOKENLESS
    # handshake and gives it `_AUTH_WINDOW_S = 10s` to send its `auth` message.
    # So one address may now hold 500 unauthenticated sockets for ten seconds
    # instead of 100 -- a five-fold rise in the pre-auth socket budget, bounded
    # by that window and by nothing else at this layer. It is the right trade
    # at §0's target and it is not free; the thing that would make it free is a
    # shorter window or a per-address budget that counts UNAUTHENTICATED
    # sockets separately, and neither exists today.
    limit_conn ws_conn 500;
}

# ── Presigned object URLs (server-gpu-plan.md 6.2) ──────────────────────────
# On a server, install.sh writes MINIO_PUBLIC_ENDPOINT=<the --domain> and
# MINIO_PUBLIC_SECURE=true, so the app signs every upload and download URL for
# the public name -- https://<domain>/workspace-files/<workspace>/<file>?X-Amz-...
# -- and those requests arrive HERE, through Cloudflare, and are passed to
# MinIO inside the Compose network. MinIO's own ports stay on 127.0.0.1.
#
# On the dev box the URLs name localhost:19000 and never come here. A request
# that does (localhost/workspace-files/...) now reaches MinIO instead of the
# app, and still needs a valid signature: the one local difference, a narrow
# exception to the plan's rule 1 (public-file-links Q-7).
#
# ⚠️ THE OWNER'S DECISIONS (public-file-links Q-1, Q-2), which
# tests/unit/test_public_file_links_edge.py guards:
#   * Host is the client's own. Cloudflare keeps it, so there is no map
#     here, and a client's X-Forwarded-Host is dropped, never read.
#   * GET, HEAD and PUT only, and the bucket root is answered 404 right here.
#     The app presigns GetObject, PutObject and UploadPart (one part of a
#     multipart upload, INC0-Q-3) and nothing else, so listing, bucket
#     settings and DELETE stay unreachable from the internet even with a
#     valid signature. A part is an ordinary PUT to this location. The other
#     calls of a multipart upload are on the object key, and the app makes them
#     server-side, app -> minio:9000 on the internal network, never presigned
#     for this name. Creating and completing (POST <key>?uploads, POST
#     <key>?uploadId=) and aborting (DELETE <key>?uploadId=) are refused HERE,
#     by method, whatever their signature. ListParts (GET <key>?uploadId=) is a
#     GET, so it passes this location's method filter: only MinIO's signature
#     check stops it, because SigV4 signs the query and the app never presigns
#     a ListParts URL. Copying a part (x-amz-copy-source) stays refused below.
#   * MinIO's own Strict-Transport-Security and X-Content-Type-Options are
#     hidden, so the four headers at the top of this file are the only ones.
#     MEASURED in the 6.2 container harness: MinIO sends
#     `Strict-Transport-Security: max-age=31536000; includeSubDomains` on every
#     object response, which would bypass the per-host map in nginx.conf (6.1).
#   * The destination is a NAME resolved per request (the warning at the top
#     of this file).
location = /workspace-files/ {
    return 404;
}

location ^~ /workspace-files/ {
    # Per-request resolution, like $aizzak_app: the edge boots and answers
    # /health while MinIO is down, this path answers 502, and the first
    # request after MinIO is back succeeds within the resolver's valid=10s.
    set $aizzak_minio "minio:9000";
    # $request_uri, not $uri: SigV4 signed the path and the query exactly as
    # sent, so nothing may be decoded or normalised on the way. The location
    # match uses the normalised path, so a `..` cannot walk out of this
    # prefix into another bucket, and MinIO refuses any `..` it is sent.
    proxy_pass http://$aizzak_minio$request_uri;

    limit_except GET PUT {
        deny all;
    }

    # ⚠️ NEVER LET THE HEADERS THAT TURN A PUT INTO ANOTHER S3 OPERATION REACH
    # MinIO (public-file-links SR-1, confirmed live in the security review).
    # A presigned URL signs the method, path, query and `host` ONLY
    # (SignedHeaders=host in minio-py), so every other request header is
    # unsigned and the client is free to add it. `x-amz-copy-source` makes a PUT
    # a CopyObject: MinIO, signed with the root credential, copies ANY object of
    # ANY bucket onto the caller's own key, and the caller downloads it with
    # their own presigned GET -- another tenant's file, or the aizzak-backups
    # dumps. The wave-8 restricted signing identity does not close this for the
    # copy between tenants INSIDE the app bucket, so this edge guard stays
    # after it. Answered 403 here, before MinIO, with no add_header (the
    # inherited set is kept). `!= ""`, not a bare variable: nginx reads the
    # value "0" as false. Also refused: the snowball auto-extract headers, which
    # make MinIO unpack a tar into arbitrary keys of the bucket.
    # Judged harmless (they only change the caller's OWN object): x-amz-meta-*,
    # x-amz-tagging, x-amz-acl, x-amz-storage-class, x-amz-server-side-
    # encryption*, x-amz-checksum-*, x-amz-website-redirect-location. The
    # *-directive and copy-source-* headers act only together with a copy.
    if ($http_x_amz_copy_source != "") {
        return 403;
    }
    if ($http_x_amz_copy_source_range != "") {
        return 403;
    }
    if ($http_x_amz_meta_snowball_auto_extract != "") {
        return 403;
    }
    if ($http_x_minio_extract != "") {
        return 403;
    }

    # Repeated in full: a level that declares one proxy_set_header replaces
    # the whole inherited list (the trap the WebSocket location above
    # documents). $http_host, not $host: SigV4 signed the host and any
    # non-default port, and $host drops the port.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  "";

    # CORS stays with the allow-list at the top of this file and its OPTIONS
    # 204. MEASURED: MinIO answers a request that carries Origin with its own
    # Allow-Origin (the origin echoed), Allow-Credentials: true and an
    # Expose-Headers list, and a browser refuses a response that carries two
    # Allow-Origin. All three are hidden below. There is NO
    # add_header here: one would replace the whole inherited set
    # (tests/unit/test_edge_hardening.py).
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;

    # A single PUT is capped by Limits.max_single_put_bytes (50 MiB,
    # framework/settings/settings.py): a presigned PUT carries no size of its
    # own and CompleteUpload does not read the object, so THIS is the ceiling
    # on the bytes of one request. Raise both together, and never above
    # Cloudflare's 100 MB request limit on the free plan. The registration
    # endpoint's max_upload_bytes (1 GiB) is the size of the whole FILE, which
    # reaches the bucket as parts of Limits.multipart_part_bytes (16 MiB) -- each
    # one a request under this ceiling -- so it is not what this number tracks.
    client_max_body_size    50m;
    # Stream both ways: a 50 MB body is never spooled to /var/cache/nginx.
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;
    # The same zone and burst as the catch-all below (P1-7, capacity 3.1).
    limit_req zone=api_req burst=400 nodelay;
}

location / {
    proxy_pass http://$aizzak_app$request_uri;
    # SSE (`Accept: text/event-stream`) shares this location: agent invocation
    # streams over plain HTTP. Buffering on would hold events until the buffer
    # filled, turning a live stream into a batch delivery.
    proxy_buffering     off;
    proxy_read_timeout  300s;
    # `limit_req` (P1-7) admits/rejects at the START of a request, before
    # proxying begins -- it never cuts a stream already in flight, so an SSE
    # response admitted under this limit keeps flowing for its whole
    # `proxy_read_timeout` regardless of what arrives after it. `burst=400
    # nodelay` absorbs a page load's cluster of near-simultaneous requests
    # instead of queueing (`nodelay`) or rejecting (`burst`) the first few.
    #
    # 40 → 400 with the zone's 20r/s → 200r/s (capacity 3.1): the burst is
    # deliberately kept at twice the rate, the ratio the original pair chose.
    # Raising the rate and leaving the burst at 40 would have made the edge
    # LESS tolerant of the one thing a burst is for -- the cluster of requests
    # a single page load fires at once.
    limit_req zone=api_req burst=400 nodelay;
}
