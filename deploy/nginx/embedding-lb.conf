# The internal load balancer in front of `embedding` -- capacity step 4.2
# (docs/capacity-plan.md §5 wave 4). Not an edge: it listens on the Compose
# network only (`expose`, never `ports`, the same trust boundary `embedding`
# itself draws) and it serves exactly one client, the adapter
# `src/app/infrastructure/ai_providers/embedding/external_embedding.py`.
#
# ⭐ WHY IT EXISTS AT ALL, in 4.2's own words: «`ExternalEmbeddingProvider`
# يستخدم `httpx.AsyncClient` بـkeep-alive افتراضيّ، فيثبت على **أوّل** عنوان IP
# حلّه. رفعُ النسخ إلى ثلاثٍ بلا هذه الخطوة يترك نسختين خاملتين تماماً — عطبٌ
# صامتٌ يبدو كأنّه فشلُ توسّع.» A pooled httpx connection resolves the name ONCE,
# at connect time, and then stays on that address for as long as the pool keeps
# it. Three replicas behind one DNS name and a client that holds connections is
# not a fleet; it is one replica and two spares that never see a request, while
# every dashboard reports three healthy containers. That is why 4.2 blocks 4.1
# from counting as done rather than merely preceding it.
#
# The alternative 4.2 names -- `httpx.Limits(max_keepalive_connections=0)` --
# was not taken: it moves the fix into the caller (three composition sites:
# the API root and both workers), pays a TCP handshake on every embed call, and
# still leaves the distribution decision to whatever order Docker's DNS happens
# to return. This file makes ONE process responsible for the spread, and that
# process writes down where each request went (`$upstream_addr` below), which
# is the only reason 4.2's acceptance criterion can be checked at all.

worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Not the edge's 16384, and the arithmetic is the reason. This proxies ONE
    # kind of request, made by three application services whose adapters open
    # at most a few connections each, and each request occupies its slot for
    # ~a second (a batch of 8 real Arabic chunks measured 0.95s on a
    # 1.0-vCPU replica with its threads pinned, and 1.8s before the pin)
    # rather than milliseconds. 1024 slots is ~512 proxied pairs against a
    # stack measured at 2.87 requests/second in total.
    worker_connections  1024;
}

http {
    default_type  application/json;

    # ── The distribution ledger (4.2's acceptance criterion) ───────────────
    # «سجلّات النسخ الثلاث تُظهر توزّعاً متقارباً تحت الحمل.» The replicas' own
    # uvicorn access logs answer that, but only after three `docker logs` runs
    # and a count each. `$upstream_addr` answers it HERE, in one file, per
    # request -- and it is the only place that can also show a request that was
    # retried onto a second replica (nginx writes both addresses, comma-
    # separated, when `proxy_next_upstream` moves it).
    log_format embedding_lb
        '{"ts":"$time_iso8601",'
        '"upstream":"$upstream_addr",'
        '"status":$status,'
        '"upstream_status":"$upstream_status",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"path":"$uri"}';
    access_log  /var/log/nginx/access.log  embedding_lb;

    sendfile      on;
    tcp_nodelay   on;
    server_tokens off;

    # MEASURED on this stack: one `/embed` call carrying a batch of 8 realistic
    # Arabic chunks is 13,611 request bytes and 64,293 response bytes (384
    # floats per text, as JSON). Both numbers decide a default:
    #
    #   * `client_max_body_size` (default 1m) is not reached by a batch of 8,
    #     but `EMB_BATCH` is a knob and the adapter's batch is another; 4m
    #     states the ceiling instead of leaving it to be discovered as a 413.
    #   * `proxy_buffers` (default 8 x 4k = 32k) IS reached, by twice over.
    #     Over the default, nginx spools every single response to a temporary
    #     FILE on disk and says so once per request in the error log --
    #     turning a pure-CPU service's answer into an I/O round trip nobody
    #     asked for. 16 x 16k = 256k holds a batch four times this size in
    #     memory.
    client_max_body_size 4m;
    proxy_buffer_size    16k;
    proxy_buffers        16 16k;

    # Docker's embedded DNS, and the reason this is a `resolver` + a VARIABLE
    # destination rather than an `upstream` block is `deploy/nginx/app-
    # locations.conf`'s header, argued there in full and re-confirmed live in
    # capacity 3.2: nginx resolves a name inside an `upstream` block ONCE at
    # config load and keeps it for the process lifetime, so the first
    # `docker compose up -d embedding` after any image change leaves this
    # proxying at addresses nothing is listening on -- and it fails only when
    # Docker's IPAM happens to hand those addresses elsewhere, which is worse
    # than failing always.
    #
    # ⚠️ AND HERE THAT DECISION BUYS THE BALANCING TOO, which at the edge it
    # merely came with. `valid=10s` bounds how long a dead or new replica's
    # address can persist in this cache, and nginx spreads requests across ALL
    # the addresses the name resolves to -- so three replicas share the load
    # without any of them being named in this file.
    #
    # MEASURED, not reasoned from nginx's internals, because that spread is
    # the entire deliverable of 4.2: 50 / 50 / 41 requests over three replicas
    # at eight concurrent connections, and 10 / 15 / 8 at ONE -- against
    # 33 / 0 / 0 for the same single connection with this proxy taken out.
    # (The count above is this file's own log; the three replicas' uvicorn
    # logs answered 50 / 50 / 41 for the same run, which is the other half of
    # 4.2's acceptance criterion and the check that this log is telling the
    # truth.) The full table is in docs/capacity-status.md §2-هـ.
    #
    # ⚠️ WHAT THIS SPREAD IS NOT is `least_conn`, which is what an upstream
    # that serves exactly ONE request at a time actually wants: requests are
    # dealt out without regard to which replica is still busy with a
    # three-second encode. `least_conn` is legal only inside an `upstream`
    # block -- i.e. only at the price above -- so the cost is paid here and
    # written down instead: three replicas returned 2.42x-2.73x a single
    # replica's throughput over three runs, not 3x. Most of that gap is the
    # host's five physical cores rather than this choice
    # (docs/capacity-status.md §2-هـ decomposes it).
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8080;
        server_name _;

        # `$embedding` is a variable ON PURPOSE -- see the resolver note above.
        # `$request_uri` must be appended explicitly, because a variable in
        # `proxy_pass` stops nginx passing the matched URI automatically.
        set $embedding "embedding:8080";

        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        # 2s against a MEASURED sub-millisecond connect on the container
        # bridge -- the edge's own number, for the edge's own reason: a
        # replica that Compose removed is a BLACK HOLE, not a refusal, and
        # without this the wait is nginx's 60s default.
        proxy_connect_timeout 2s;

        # ⚠️ 60s IS DELIBERATELY LONGER THAN THE CALLER'S OWN BUDGET, and that
        # is the whole of the timeout-ladder discipline in 08 §2-ج applied to
        # one more hop: `EmbeddingServiceSettings.timeout_s` is 15s, so the
        # ADAPTER is the clock that must fire first. A shorter timeout here
        # would replace the adapter's own typed timeout -- retried twice, and
        # translated into an error the app knows how to talk about -- with a
        # bare 504 minted by a proxy that cannot name a correlation id. The
        # only thing this number exists to stop is a wait with no end at all.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # ⚠️ WHAT THIS DOES AND DOES NOT RETRY, and the asymmetry is the point.
        # A `/embed` call is pure -- same texts, same model, same vectors --
        # so retrying one costs nothing but time. But nginx does NOT resend a
        # POST whose body it has already forwarded unless `non_idempotent` is
        # listed, and it is deliberately NOT listed here: a replica that
        # ACCEPTED the request and then went quiet is one that may be three
        # seconds into an encode, and re-sending that work to a sibling is how
        # a slow fleet becomes a saturated one. So this covers the case that
        # matters -- a connection REFUSED or timed out before the body was
        # sent, i.e. a replica that went away -- and leaves the rest to the
        # adapter's own retry budget, which is where a duplicate is a decision
        # rather than an accident.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        location / {
            proxy_pass http://$embedding$request_uri;
        }
    }
}
