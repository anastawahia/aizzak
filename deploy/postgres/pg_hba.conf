# Client authentication for the `postgres` service (capacity step 2.5).
#
# WHY THIS FILE EXISTS AT ALL. `pg_basebackup` opens a PHYSICAL REPLICATION
# connection, and in pg_hba.conf the database column keyword `all` does not
# match one -- only the literal keyword `replication` does. The file initdb
# generates carries `replication` lines for the Unix socket and 127.0.0.1
# only, so a base backup taken from ANY other container answers:
#
#     FATAL:  no pg_hba.conf entry for replication connection from host
#             "172.x.x.x", user "backup_operator", no encryption
#
# and there is no way to add the line from the environment: the generated
# file lives inside the data volume and is written ONCE, by initdb, on a
# fresh volume. `hba_file` in the server's `command:` points here instead, so
# the rule is a reviewed artifact in the repository rather than a hand edit
# inside a volume that no fresh deployment would ever reproduce.
#
# THE FIRST FOUR LINES ARE NOT NEW. They reproduce, exactly, what
# `postgres:16`'s own initdb + entrypoint produce for this stack today
# (`POSTGRES_HOST_AUTH_METHOD` unset => scram-sha-256 for host connections,
# trust for the container's own loopback and socket, which is what
# `docker compose exec postgres psql` and every initdb script use). Changing
# any of them is not part of step 2.5, and a diff that does is a security
# change wearing a backup change's clothes.
#
# ⚠️ `local`/loopback `trust` is inherited, not endorsed. It is trust INSIDE
# the container -- reachable only by a process that already runs as the
# postgres user in the postgres container -- and it is what the initdb
# scripts and every `docker compose exec` rely on. Narrowing it belongs to
# the network-segmentation work (`ح-19`), together with the missing
# `networks:` section, not here.

# TYPE  DATABASE        USER                ADDRESS         METHOD

local   all             all                                 trust
host    all             all                 127.0.0.1/32    trust
host    all             all                 ::1/128         trust
local   replication     all                                 trust
host    replication     all                 127.0.0.1/32    trust
host    replication     all                 ::1/128         trust

# The one line step 2.5 adds: the backup role, and only the backup role, may
# open a replication connection from inside the Compose network. Named
# explicitly rather than `all` -- every other role in this cluster has no
# business speaking the replication protocol, and `backup_operator` is the
# only one created with the REPLICATION attribute in the first place
# (deploy/postgres/initdb/10-roles.sh).
host    replication     backup_operator     all             scram-sha-256

# Everything else, password-authenticated. Last, so the specific rules above
# win: pg_hba is first-match-wins, and a broad rule placed earlier would
# swallow them.
host    all             all                 all             scram-sha-256
