# ── Postgres tuning for production — capacity step 2.1 ───────────────────────
# docs/capacity-plan.md §5 wave 2. Every value here is calibrated on §6's
# REFERENCE HOST (32 vCPU / 64 GB), not on the machine you are reading this on.
#
# ⭐ WHY THIS IS A FILE AND NOT A LONGER `command:` — and why the `command:`
# SURVIVES IT. Step 2.1's own wording asks the config file to "take the place
# of that `command`". It must not, and the reason is `م-8` itself. Three
# CLASSES of setting reach this server, and they have opposite reversibility
# requirements:
#
#   0.4 — the instrument   `shared_preload_libraries` · `pg_stat_statements.*`
#   2.5 — durability       `archive_mode` · `archive_command` · `hba_file`
#   2.1 — tuning           everything in this file
#
# Only the third is what `م-8` covers. A baseline measured on a server with
# `shared_buffers=8GB` cannot answer "did the tuning help?"; a baseline
# measured on a server that does not archive its WAL is a baseline of a
# deployment nobody would operate, and one measured without pg_stat_statements
# cannot be read at all. Folding all three into one file gives them ONE switch,
# and turning the tuning off would then also turn off archiving and the
# instrument. So they stay in `command:` — where, because command-line `-c`
# outranks a configuration file, they also keep winning. MEASURED: with this
# file selected, `pg_settings.source` reads `configuration file` for the eight
# knobs below and `command line` for `shared_preload_libraries`.
#
# ⭐ THE `م-8` OFF SWITCH IS `POSTGRES_CONFIG_FILE`. Point it at the data
# directory's own postgresql.conf and this file is not read at all — the
# server comes up on image defaults, which is the state the 0.5 baseline has
# to be measured in. That is the same shape every other `م-8` subject in this
# repository already ships with (`API_RATE_LIMIT_ENABLED=false` builds no
# limiter, `AUTH_PRINCIPAL_CACHE_TTL_S=0` builds no cache,
# `MAX_IN_FLIGHT_REQUESTS=0` installs nothing): the optimisation ships, and
# the measurement that judges it can still be taken. `م-8` was a blocker for
# as long as this step had no switch; it is a switch now.
#
# ⚠️ THE FIRST LINE IS LOAD-BEARING. `config_file` REPLACES the data
# directory's postgresql.conf outright rather than layering over it, and that
# file carries what initdb decided for this cluster — `listen_addresses`,
# `lc_messages`, `dynamic_shared_memory_type`, the locale collation. Without
# the include, this file would be the whole configuration and those would
# silently revert to compiled-in defaults. MEASURED: with the include,
# `pg_settings.sourcefile` for `listen_addresses` still reads
# /var/lib/postgresql/data/postgresql.conf while the knobs below read this
# path. Later assignments win, so ordering — include first, overrides after —
# is what makes this an override file.
include '/var/lib/postgresql/data/postgresql.conf'

# ── Connections ─────────────────────────────────────────────────────────────
# The pooler's backstop, not the platform's budget. MEASURED demand behind the
# pooler at step 2.2's `DEFAULT_POOL_SIZE=100` is 161 backends
# (tests/unit/test_connection_budget.py); `superuser_reserved_connections` is
# 3, so 297 of these are reachable by the three application roles. The margin
# is deliberate: this is the ceiling that refuses LOUDLY ("sorry, too many
# clients already") when the pooler's own per-database ceiling has been
# mis-set, and a backstop sized to demand is not a backstop.
max_connections = 300

# ── Memory ──────────────────────────────────────────────────────────────────
# ⚠️ MEASURED: THIS SERVER STARTS ON A HOST THAT CANNOT HOLD IT, IN SILENCE.
# `shared_buffers = 8GB` on the 12.67 GB development host this was written on
# came up READY IN 3 SECONDS with VmRSS at 205 MiB, because the segment is
# mapped and committed page by page as it is touched. Prewarming 1,172 MB of
# one table moved the host's `Shmem` from 219,956 kB to 1,420,816 kB — 1:1
# with what was read, and nothing warned at any point. A cluster configured
# for a host twice its size therefore passes every start-up check it has and
# fails later, under exactly the load a capacity plan exists to survive. The
# container memory limit does not catch it either: `deploy.resources.limits`
# for this service is 18g on a 12.67 GB host, so the HOST's OOM killer arrives
# first and the cgroup never fires. That is `د-25`, sharpened.
shared_buffers = 8GB

# Pure planner arithmetic — it allocates nothing, and describes the OS page
# cache Postgres expects to find its data in. 24 GB of §6's 64.
effective_cache_size = 24GB

# ⚠️ NOT A PER-CONNECTION BOUND, AND `300 × 16MB` IS A FLOOR RATHER THAN A
# CEILING. `work_mem` is granted PER MEMORY-CONSUMING NODE, and again per
# parallel worker under each Gather. MEASURED on one ordinary two-join query:
# four simultaneous nodes in a single backend (top-N heapsort 25 kB,
# quicksort 16,017 kB — a full grant on its own — hash 55 kB, HashAggregate
# 129 kB), and with parallelism enabled the same shape became SIX grants for
# ONE connection (two sort nodes × leader + 2 workers).
#
# What keeps this bounded is not `max_connections` but `max_worker_processes`
# (8, the default): parallel multiplication is capped server-wide, so the
# realistic bound is `backends × work_mem × nodes` plus a small parallel term,
# not `max_connections × work_mem`. At the 161 backends 2.2 permits and two
# full grants per query that is 5.03 GB — which is what the 18g container
# limit is derived from, and what 3.4's `300 × 16 MB = 4.8` arrived at by a
# coincidence rather than by this reasoning.
work_mem = 16MB

# ⚠️ MEASURED: THIS IS 1 GB FOUR TIMES OVER, NOT ONCE. `autovacuum_work_mem`
# is -1 on this server, which means "use maintenance_work_mem", and
# `autovacuum_max_workers` is 3 — so raising this knob from 64 MB to 1 GB
# raises the autovacuum daemon's own standing worst case from 192 MB to 3 GB,
# before the operator's manual VACUUM asks for its own. Neither §6's 20 GB nor
# 3.4's 14 GB counted that term at all. 18g does.
#
# It also makes step 2.8's `/dev/shm` sizing operative, and 2.8's stated RULE
# for it is wrong in the safe direction. 2.8 wrote "the segment is sized to
# maintenance_work_mem, so shm_size > maintenance_work_mem + headroom".
# MEASURED at this value with `shm_size=64m`: parallel VACUUM on a 460 MB heap
# with three indexes asked for 105,858,080 bytes — 101 MB, not 1 GB. The
# segment is sized to `min(maintenance_work_mem, ≈1798 bytes × relpages)`, so
# the real bound is on TABLE SIZE: `shm_size: 1gb` holds until a heap passes
# roughly 4.5 GB, and 2.8's rule reads as if the shipped value were safe at
# any size. See 08-local-runbook §2-هـ.
maintenance_work_mem = 1GB

# ── Storage and checkpoints ─────────────────────────────────────────────────
# NVMe: a random page costs very nearly what a sequential one costs, and the
# 4.0 default describes a spinning disk. This is the knob that decides index
# scan versus sequential scan, so it is the one 2.4's plans were read under.
random_page_cost = 1.1

# 1 GB (the default) forces a checkpoint every ~64 WAL segments, and this
# platform's write path is the outbox: every domain event is a row. Spreading
# the same work over 4 GB and 90% of the interval is what turns a checkpoint
# from a stall into a background cost.
max_wal_size = 4GB
checkpoint_completion_target = 0.9
