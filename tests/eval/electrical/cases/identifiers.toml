# Core identifier cases for M-04 (FR-EVAL-01). Every format of SRS Appendix A, plus the
# same forms in other spellings and the malformed forms that must be FLAGGED, not dropped.
# `source`: appendix-a | vendor-c (FR-ID-14, not claimed) | extra | invalid | invalid-or-prose.
# `kind = "none"` means "no identifier at all". Absent optional fields mean none/empty.
# `select` (D-36, optional) is a table of RuleSelection field names (`conventions`,
# `cross_reference_format`, `extra_ansi_suffixes`): the case is parsed with the rules narrowed
# by it. A case without `select` is parsed with the packaged, unnarrowed rules. The cases from
# c193 on are F2 (KKS, ANSI, digits-first terminals), all with invented examples.

