# Alembic configuration (06 §6, 08-local-runbook §5).
# Migrations connect through the configured DATABASE_URL (async, asyncpg).
# The DB URL is resolved at runtime from Settings in migrations/env.py — it is
# intentionally NOT stored here (DD-11: no config outside infrastructure/config).

[alembic]
script_location = migrations
prepend_sys_path = src
# newline (not the OS path separator) keeps this file portable between the
# WSL/Linux and Windows hosts this repo is developed on (08-local-runbook).
path_separator = newline

# v1 baseline chain lives under versions/platform. Per-module chains
# (versions/<module>/) are added in Phase 3 as they are built, one location
# per line.
version_locations =
    %(here)s/migrations/versions/platform
    %(here)s/migrations/versions/knowledge
    %(here)s/migrations/versions/media
    %(here)s/migrations/versions/integrations
    %(here)s/migrations/versions/usage
    %(here)s/migrations/versions/workspace
    %(here)s/migrations/versions/access
    %(here)s/migrations/versions/credentials
    %(here)s/migrations/versions/conversations
    %(here)s/migrations/versions/memory
    %(here)s/migrations/versions/files
    %(here)s/migrations/versions/spaces

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
