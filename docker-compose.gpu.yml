# GPU overlay (server-gpu-plan.md 2.5): everything that needs an NVIDIA GPU, in
# ONE file a GPU server adds to COMPOSE_FILE -- leave it out and the same
# docker-compose.yml runs on CPU. Five entries, and only these keys
# (tests/unit/test_compose_gpu_overlay.py):
#   ollama     the LLM on the GPU (only with COMPOSE_PROFILES=local-llm)
#   embedding  the CUDA image, ONE replica, on the GPU
#   app        `utility` only: nvidia-smi for the System Monitor page, no compute
#   prometheus ONE mount (the scrape job for the exporter below, 4.2) and the
#              `gpu-metrics` network, so it can reach the exporter (SR-1)
#   nvidia-gpu-exporter  the card's numbers for Prometheus (4.2, only with
#              COMPOSE_PROFILES=monitoring), alone on `gpu-metrics` with Prometheus
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#   COMPOSE_PROFILES=local-llm,monitoring
#   EMBEDDING_CUDA_IMAGE_REPO=anastawahia/aizzak
#   EMBEDDING_CUDA_IMAGE_TAG=embedding-cuda-<YYYY.M.N>
#
# Prerequisites -- NVIDIA driver, NVIDIA Container Toolkit configured for
# Docker, Compose >= 2.20 -- are what deploy/gpu-preflight.sh checks
# (docs/deploy-server.md). Without the toolkit every service below fails to
# start with "could not select device driver".
#
# ⚠️ NEVER together with docker-compose.build.yml: that overlay builds
# `embedding` from requirements.txt (CPU torch) and would tag the result with
# the CUDA name below. The CUDA image comes from deploy/release/build-push.sh
# (or the one buildx command in docs/stack-commands.md), and EMB_REQUIRE_CUDA
# makes a CPU build under this name refuse to start rather than run slowly.
#
# Not for this WSL development machine before the toolkit is installed: that
# is docker-compose.wsl-gpu.yml, and the two are never combined.
#
# No `count`/`device_ids`: every GPU on the host is visible to both services;
# the target server has one (decision 2). Pinning devices on a multi-GPU host
# is measured in 7.3 and recorded in 08-local-runbook §2‑ي.
services:
  ollama:
    environment:
      # B-5, measured on the RTX 4060 host (08 section 2-ya): the runner's host-side
      # prompt cache (llama.cpp --cache-ram, default 8192 MiB) grew anon memory
      # ~70 MB/s under 4 parallel ~3,000-token prompts -- 4.3 GB at the 4g limit
      # (OOM kill, HTTP 500) and 9.7 GB with the limit raised to 9g. At 256 MiB the
      # same 3-minute load peaked at 1.62 GB, 0 failures. Not measured on the CPU path.
      LLAMA_ARG_CACHE_RAM: "256"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  embedding:
    # Named only, never built here (above). Its own local default -- never the
    # CPU image's name, never a floating tag -- so a GPU host that forgot the
    # two variables fails to pull instead of running CPU torch.
    image: ${EMBEDDING_CUDA_IMAGE_REPO:-aizzak/embedding-cuda}:${EMBEDDING_CUDA_IMAGE_TAG:-dev}
    deploy:
      # ONE process on the GPU, fed by the batcher (capacity 4.3); three would
      # hold three CUDA contexts and three copies of the model (08 §2‑ي).
      # embedding-lb stays in front of it unchanged.
      replicas: 1
      resources:
        limits:
          # ⚠️ A STARTING VALUE, NOT A MEASUREMENT (FR‑19). The base file's 1280m
          # was measured for a CPU process; a CUDA process maps the CUDA libraries
          # and stages the fp32 weights in RAM before .half(). gpu-compose AC‑4.11
          # (15 minutes of 8 concurrent /embed, batches of 8 Arabic chunks) keeps
          # it if peak x 1.5 <= 3g, else replaces it with peak x 1.79 rounded up
          # to 256m -- the base file's own margin.
          memory: 3g
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      # Q‑10 (owner, 2026-10-14): refuse to start without CUDA. A missing toolkit,
      # an old driver or a CPU build under this name would otherwise run on the
      # CPU in silence -- the same vectors, far slower.
      EMB_REQUIRE_CUDA: "1"

  app:
    # `utility` and nothing else: the toolkit mounts nvidia-smi and NVML so
    # system_stats.py can read the card -- the server-side replacement for the
    # WSL overlay -- and no CUDA context is granted.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [utility]

  # 4.2 (server-gpu-plan.md): the exporter's scrape job, found by
  # prometheus.yml's `scrape_config_files` glob. Without this mount the glob
  # matches nothing and Prometheus has no `nvidia-gpu` target at all.
  # Only single `:ro` FILES are mounted under scrape.d/ (never a host directory):
  # every *.yml there becomes scrape configuration (security-review SR-7).
  # `networks` lists `default` explicitly: a list replaces the implicit network,
  # and without it Prometheus would lose every other target (SR-1).
  prometheus:
    volumes:
      - ./deploy/prometheus/scrape-gpu.yml:/etc/prometheus/scrape.d/gpu.yml:ro
    networks: [default, gpu-metrics]

  # ── GPU numbers for Prometheus (server-gpu-plan.md 4.2) ─────────────────
  # nvidia-smi read by utkuozdemir/nvidia_gpu_exporter (owner decision Q-4 (b),
  # docs/delivery/monitoring-profile/). Here only, and only with profile
  # `monitoring`: no GPU file, no exporter, no target, no alert.
  # 1.15.1 (2026-09-02) is distroless and uid 65534: no shell and no wget, so
  # the healthcheck runs the one binary the toolkit mounts -- nvidia-smi --
  # and proves the card is readable from HERE; the HTTP side is
  # AizzakScrapeTargetDown's (an ordinary target). Pinned by the multi-arch
  # index digest; same index digest on docker.io and ghcr.io; signature
  # verification: docs/deploy-server.md ث‑6.
  # (linux/amd64 manifest sha256:93b45e335c8286379e03ecd542354fa425e5ffb8e0e5761e60c1fb241212fda4).
  # `utility` only, as `app` above: nvidia-smi + NVML, no CUDA context.
  # Limits are fixed numbers, not size variables (A-4): 64m is `large`'s
  # GPU-mode headroom (Q-8). 64m stays by owner decision 2026-10-18, an accepted
  # risk: WSL peak 56.2 MiB with both flags below (54.1 without), and
  # peak x 1.5 > 64m; owner accepted, re-measure in 7.3.
  # Network: `gpu-metrics` only (internal, no egress, no route to Redis, Qdrant
  # or Vault); Prometheus joins it to scrape :9835 (SR-1).
  # YAML anchors do not cross files, so `logging` restates x-app-logging;
  # tests/unit/test_compose_gpu_overlay.py holds the two equal.
  nvidia-gpu-exporter:
    profiles: ["monitoring"]
    image: utkuozdemir/nvidia_gpu_exporter:1.15.1@sha256:7aee2d42836ad29d4adb2722b7cfdc806ec9cc8d45fd0b8971ebbad2d9f3d087
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command:
      - "--web.listen-address=:9835"
      # Background collection (the request reads the last result) and at most two
      # concurrent scrapes: no per-request nvidia-smi fan-out (SR-4). Both flags
      # exist in v1.15.1 (internal/app/app.go).
      - "--collect.interval=15s"
      - "--web.max-requests=2"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
        reservations:
          devices:
            - driver: nvidia
              capabilities: [utility]
    networks: [gpu-metrics]
    expose:
      - "9835"
    healthcheck:
      test: ["CMD", "nvidia-smi", "--query-gpu=uuid", "--format=csv,noheader"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.docker.compose.service,com.docker.compose.project"

networks:
  # Exporter <-> Prometheus only. `internal`: no route out, and the exporter is
  # not on `default`, so it cannot reach the stack's unauthenticated services.
  gpu-metrics:
    internal: true
