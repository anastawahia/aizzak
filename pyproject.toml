[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aizzak-platform"
version = "0.1.0"
description = "Multi-Agent AI Platform (AIZZAK) — Modular Monolith + Hexagonal + Plugin + Event-Driven backend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Runtime dependencies (DD-14). Lower bounds only.
#
# This line used to end "resolved in the lockfile". There is no lockfile in
# this repository and there never was -- `git ls-files` finds no lock, no
# constraints file, nothing. So `pip install -e .` in a clean environment
# resolves every one of these to whatever was released that morning, which is
# precisely how the first-ever CI run came to fail on three counts while the
# identical five gates were green locally (docs/log/3.96.md). The gate TOOLS
# are bounded in `[dev]` below for that reason; these runtime pins are
# deliberately left open, and the honest statement of the risk is here rather
# than a reference to a file that does not exist.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "minio>=7.2",
    "hvac>=2.3",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "uuid6>=2024.7.10",
    "jsonschema>=4.23",
    # P1-3 (docs/p1-hardening-plan.md §3 step 10): renders the three `/metrics`
    # gauges in the wire format Prometheus scrapes. Used only for text
    # exposition -- a fresh `CollectorRegistry` is built per request
    # (`api/metrics.py`), never the module-global default registry, which is
    # what keeps this correct under gunicorn's multi-worker default without
    # `PROMETHEUS_MULTIPROC_DIR` (see that module's docstring).
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    # The five gates' own tools carry UPPER bounds; nothing else here does.
    #
    # Without them CI installs the newest release of each on every run, so the
    # toolchain that judges a commit is never the toolchain that produced the
    # green run locally. That is not hypothetical: `ruff` shipped 0.16 while
    # this repo sat at 0.15.21, promoted `PLR0917` out of preview (7 new
    # errors under the `PL` selector) and began formatting Python inside
    # Markdown (6 design docs) -- two red gates from a release nobody here
    # made a decision about. Both are handled in `[tool.ruff]` below; the
    # bound is what stops the NEXT such release from doing it again.
    #
    # The lower bounds are raised to what has actually been exercised. A
    # floor no one has run in a year is a claim of support that no gate ever
    # checks -- the same "declared but never proven" shape as the orphan
    # `integration` marker (tests/unit/test_ci_workflow_truthfulness.py).
    # Both ends of each range below have been run: the floor is this venv,
    # the ceiling-1 is what a clean `pip install` resolved to in the CI
    # simulation, and both were green (docs/log/3.96.md).
    "ruff>=0.15.21,<0.17",
    "mypy>=2.2,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=6.0",
    # `testcontainers` was declared here through P1 step 14 -- deliberately
    # dropped (docs/p1-hardening-plan.md §3 step 14, ن-5): a repo-wide `grep`
    # found zero real `import testcontainers` anywhere in `src`/`tests`; the
    # whole integration suite runs against the local Compose infrastructure
    # (plus native WSL Ollama) gated by `pytest.mark.live_*` instead
    # (`tests/integration/conftest.py`,
    # `docs/design/09-testing-strategy.md`). Removing the package from
    # `pyproject.toml` does NOT uninstall it from an already-provisioned
    # dev venv -- see that same step's log for why the venv was
    # deliberately left untouched.
    "import-linter>=2.13,<3",
    "types-jsonschema",
    # The API-conventions guard (6.3-ج) reads `docs/design/openapi.yaml`, the
    # binding contract, and compares it with the document the app generates.
    # Declared rather than leaned on transitively: a test that silently stops
    # importing is a guard that silently stops guarding.
    "pyyaml>=6.0",
    "types-pyyaml",
]
# Document parsers (knowledge module adapters, 3.k1) — a dedicated group so
# the core app stays light; only the knowledge worker needs these.
parsers = [
    "pymupdf>=1.24",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# Ruff — format + lint (DD-14, 10-code-standards §1: line 100, double quotes).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff 0.16 began formatting Python code blocks embedded in Markdown, which
# put `ruff format --check .` in charge of six prose files -- three of them
# binding contracts under `docs/design/` whose line numbers are cited across
# `docs/log/`. Ruff's job in this repository is Python; a formatter silently
# rewriting hand-written design documents is not a gate, it is churn.
#
# `extend-exclude`, never `exclude`: the latter REPLACES ruff's defaults, so
# `exclude = ["*.md"]` drops `.venv` from the exclusion set and the formatter
# walks into site-packages (measured: 3471 files "would be reformatted").
# With the line below, ruff 0.16 checks exactly the 522 Python files ruff
# 0.15 did -- the established baseline, matched precisely.
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # comprehensions
    "PL",       # pylint subset
    "RUF",
]
ignore = [
    "PLR0913",  # many-arguments — ports/use-cases legitimately take several deps
    # Same rule, same rationale, counted differently: PLR0917 bounds the
    # POSITIONAL arguments rather than all of them. It left preview in ruff
    # 0.16 and the `PL` selector picked it up unasked, flagging 7 call sites
    # (6 in `src`, 1 in tests) that PLR0913 above already exempts on purpose.
    # Ignoring one and enforcing the other would make the pair incoherent.
    "PLR0917",  # many-positional-arguments — the PLR0913 exemption, restated
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values are fine in tests
"migrations/**" = ["E501", "PLR2004"]

# ---------------------------------------------------------------------------
# mypy — strict (DD-14, 10-code-standards §1: no implicit Any).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# Third-party libraries that ship no type stubs.
[[tool.mypy.overrides]]
module = [
    "uuid6.*",
    "hvac.*",
    "minio.*",
    "qdrant_client.*",
    "fitz.*",
    "pymupdf.*",
    "pytesseract.*",
    "pandas.*",
    "openpyxl.*",
    "PIL.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest — unit / integration / architecture pyramid (09-testing-strategy).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." (the repo root) lets the unit suite import `services.embedding.app`
# (Phase 2.10) -- a standalone deployable OUTSIDE the `app` package
# (services/embedding/app.py's own module docstring), never installed as a
# package and reached only by this one test module.
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
# Every marker below MUST be applied by at least one test. `--strict-markers`
# only rejects an APPLIED marker that was never declared -- it says nothing
# about a DECLARED marker that nothing applies, and that silent direction is
# how `integration: exercises real infrastructure via testcontainers` survived
# here unused while a CI job selected on it and collected `2272 deselected`,
# green, forever (release-blockers-plan.md §3, step 5). The integration suite
# is gated by the `live_*` markers instead: each probes its service and skips
# honestly when it is unreachable. Guarded by
# `tests/unit/test_ci_workflow_truthfulness.py`.
markers = [
    "live_db: requires the local Compose PostgreSQL 16 at 127.0.0.1:15432; auto-skips if unreachable",
    "live_redis: requires the local Compose Redis at 127.0.0.1:16379; auto-skips if unreachable",
    "live_minio: requires the local Compose MinIO at 127.0.0.1:19000; auto-skips if unreachable",
    "live_qdrant: requires the local Compose Qdrant at 127.0.0.1:16333; auto-skips if unreachable",
    "live_vault: requires the persistent local Compose Vault at 127.0.0.1:18200; auto-skips if unreachable",
    "live_ollama: requires the native WSL Ollama at 127.0.0.1:11434; auto-skips if unreachable",
    "live_embedding: requires the Compose central embedding service (2.10) published at 127.0.0.1:8080 by docker-compose.test.yml; auto-skips if unreachable",
    "live_openai: exercises the real OpenAI API; requires TEST_OPENAI_API_KEY in the environment; auto-skips otherwise",
    "live_web_search: exercises the real Exa web-search API; requires TEST_EXA_API_KEY in the environment; auto-skips otherwise",
    "live_stack_slo: P1-6 (docs/p1-hardening-plan.md §3 step 13) — drives the real ASGI app against the live docker-compose stack's Postgres/PgBouncer; requires RUN_P1_6_LOAD_TEST=1 AND the aizzak_default network (never auto-run, unlike the other live_* markers above; see tests/integration/test_conversation_get_slo_live.py)",
]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
show_missing = true
