name: CI

on:
  push:
    # This repository's default branch is `master`. It said `main` for months,
    # which means push NEVER triggered this workflow -- and a workflow that
    # never runs is indistinguishable, on the commit list, from a workflow
    # that always passes. Guarded by
    # `tests/unit/test_ci_workflow_truthfulness.py`.
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The five gates (09-testing-strategy §7): format → lint → types → imports
  # → pytest. Ordered cheapest-first so a style/boundary break fails before
  # the test run.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `parsers` is NOT optional here, whatever its name in pyproject says.
      # `tests/unit/test_knowledge_parsers.py` imports `fitz` at module level,
      # so installing `[dev]` alone ends the whole job at COLLECTION --
      # `ModuleNotFoundError: No module named 'fitz'`, "Interrupted: 1 error
      # during collection", exit 2, zero tests run. Not one test fails; the
      # suite never starts. That was true from the day this file was written
      # and nobody saw it, because the `branches: [main]` defect above meant
      # the workflow never ran at all -- the second defect hidden behind the
      # first, exactly as the block below describes for the deleted
      # integration job. Guarded now by
      # `tests/unit/test_ci_workflow_truthfulness.py`.
      #
      # Installed rather than guarded with `importorskip`: these are unit
      # tests of real parser adapters, and a test that skips itself into
      # green is the failure mode this whole workflow was rewritten to stop.
      - name: Install (editable + dev and parsers extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parsers]"

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: mypy --strict
        run: mypy src

      - name: import-linter
        run: lint-imports

      # The WHOLE suite -- unit + architecture + integration. No `-m` filter:
      # every `tests/integration/` module is gated by a `live_*` marker whose
      # fixture probes its service and skips honestly when unreachable, so on
      # a bare runner they skip instead of failing. `-rs` prints the name and
      # reason of every skip into the CI log, so the job states out loud what
      # it did NOT run instead of hiding it behind a green check.
      - name: pytest (full suite; live_* tests skip without local services)
        run: pytest -rs

# ---------------------------------------------------------------------------
# There is deliberately NO second "integration" job.
#
# There used to be one: a job gated on `quality` that selected the
# `integration` marker. That marker was declared in `pyproject.toml` and
# applied to exactly zero tests, so the job collected `2272 deselected` and
# ran nothing at all.
#
# What it did NOT do -- verified during the step-5 review, correcting the
# original diagnosis -- is go green. `pytest -m integration` collects nothing
# and exits **5**, which fails the step. The job would have been RED. It never
# was, because defect #1 above silenced the entire workflow: at the time of
# that review `gh run list` reported ZERO runs of it, ever. So the second
# defect was masked by the first, and the pair read on the commit list exactly
# like a repository whose checks have not started yet.
#
# ⚠️ That sentence has an expiry date and it has passed -- corrected here
# rather than left to mislead (docs/log/3.96.md §0). Fixing defect #1 worked:
# `branches: [master]` fires, and CI has been running since 2026-07-27. It ran
# five times before this line was written and FAILED all five -- every one of
# them dying on the FIRST gate, `ruff format --check`, so `ruff check`, mypy,
# import-linter and pytest never executed once. The `.[dev]`/`fitz` collection
# abort fixed in 3.96 was hiding behind that, unreached: a third defect masked
# by a second, which had been masked by the first. `806a92c` is the first
# green run this workflow has ever had.
# The marker is removed from `pyproject.toml`
# (release-blockers-plan.md §3, step 5); `--strict-markers` is on, and a
# declared marker with no user is exactly the trap that produced this.
#
# The real integration suite is `tests/integration/` (30 modules) behind
# `live_db` / `live_redis` / `live_minio` / `live_qdrant` / `live_vault` /
# `live_ollama` / `live_embedding` / `live_openai` / `live_web_search`.
# The `pytest` step above collects all of it; on this runner it skips.
#
# Those services are NOT stood up here, on purpose:
#   * Postgres needs the `aizzak_owner` / `app_rw` / `outbox_relay` role
#     topology from `deploy/postgres/initdb/10-roles.sh`; MinIO needs a
#     bucket-scoped service account provisioned with `mc`; Vault needs the
#     full `deploy/vault` bootstrap (transit + kv + approle). Re-expressing
#     that provisioning in this file forks it into a second place that drifts
#     from the first -- the precise failure class this repository keeps
#     paying for (see release-blockers-plan.md §4).
#   * Ollama would pull a model on every run, and the embedding service
#     (2.10) bakes its weights into the image at build time -- gigabytes per
#     run for the two markers that cannot skip-and-still-mean-something.
#
# They run on the local harness instead: `docs/quickstart.md` §6 and
# `docs/design/08-local-runbook.md`, with the live evidence recorded in
# `docs/log/` (§3.83 for the 2.10 SLO + `/search` round trip).
#
# Stated limitation, not glossed: adapter-level regressions against real
# infrastructure are caught by a developer running the live markers locally
# before pushing. This workflow does not catch them.
# ---------------------------------------------------------------------------
