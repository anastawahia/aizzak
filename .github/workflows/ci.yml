name: CI

on:
  push:
    # This repository's default branch is `master`. It said `main` for months,
    # which means push NEVER triggered this workflow -- and a workflow that
    # never runs is indistinguishable, on the commit list, from a workflow
    # that always passes. Guarded by
    # `tests/unit/test_ci_workflow_truthfulness.py`.
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The five gates (09-testing-strategy §7): format → lint → types → imports
  # → pytest. Ordered cheapest-first so a style/boundary break fails before
  # the test run.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `parsers` is NOT optional here, whatever its name in pyproject says.
      # `tests/unit/test_knowledge_parsers.py` imports `fitz` at module level,
      # so installing `[dev]` alone ends the whole job at COLLECTION --
      # `ModuleNotFoundError: No module named 'fitz'`, "Interrupted: 1 error
      # during collection", exit 2, zero tests run. Not one test fails; the
      # suite never starts. That was true from the day this file was written
      # and nobody saw it, because the `branches: [main]` defect above meant
      # the workflow never ran at all -- the second defect hidden behind the
      # first, exactly as the block below describes for the deleted
      # integration job. Guarded now by
      # `tests/unit/test_ci_workflow_truthfulness.py`.
      #
      # Installed rather than guarded with `importorskip`: these are unit
      # tests of real parser adapters, and a test that skips itself into
      # green is the failure mode this whole workflow was rewritten to stop.
      - name: Install (editable + dev and parsers extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parsers]"

      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      - name: mypy --strict
        run: mypy src

      - name: import-linter
        run: lint-imports

      # The WHOLE suite -- unit + architecture + integration. No `-m` filter:
      # every `tests/integration/` module is gated by a `live_*` marker whose
      # fixture probes its service and skips honestly when unreachable, so on
      # a bare runner they skip instead of failing. `-rs` prints the name and
      # reason of every skip into the CI log, so the job states out loud what
      # it did NOT run instead of hiding it behind a green check.
      - name: pytest (full suite; live_* tests skip without local services)
        run: pytest -rs

  # Real adapters against real infrastructure. This consumes the repository's
  # deployment entrypoints -- 10-roles.sh through the Postgres image,
  # deploy/{vault,minio}/bootstrap.sh through their one-shot services, and
  # app.ops.provision through `migrate` -- rather than restating any of that
  # provisioning here.
  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The overlay is explicit: it alone mounts the opt-in test-database
      # script. The production Compose file never provisions a test database.
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parsers]"

      - name: Prepare Compose environment
        run: |
          cp .env.example .env
          echo "MINIO_TEST_ACCOUNT_ENABLED=true" >> .env

      - name: Start infrastructure
        run: |
          docker compose up --wait --wait-timeout 180 -d \
            postgres pgbouncer redis minio qdrant vault

      - name: Provision with the deployment entrypoints
        run: |
          docker compose run --rm --no-deps vault-bootstrap
          docker compose run --rm --no-deps minio-bootstrap
          docker compose run --rm --no-deps --build migrate
          docker compose exec -T postgres \
            sh /opt/aizzak/testdb/20-test-database.sh

      - name: Generate test-harness environment
        run: |
          set -a
          . ./.env
          set +a
          vault_token="$(
            docker compose exec -T vault cat /vault/init/init.json |
              jq -er .root_token
          )"
          echo "::add-mask::$vault_token"
          umask 077
          cat > .env.test <<EOF
          TEST_DATABASE_URL=postgresql+asyncpg://aizzak_owner:${AIZZAK_OWNER_PASSWORD}@127.0.0.1:${HOST_PORT_POSTGRES}/aizzak_test
          TEST_DATABASE_URL_APP=postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@127.0.0.1:${HOST_PORT_POSTGRES}/aizzak_test
          TEST_DATABASE_URL_RELAY=postgresql+asyncpg://outbox_relay:${OUTBOX_RELAY_PASSWORD}@127.0.0.1:${HOST_PORT_POSTGRES}/aizzak_test
          TEST_DATABASE_URL_RETENTION=postgresql+asyncpg://retention_sweeper:${RETENTION_SWEEPER_PASSWORD}@127.0.0.1:${HOST_PORT_POSTGRES}/aizzak_test
          TEST_DATABASE_URL_METRICS=postgresql+asyncpg://metrics_reader:${METRICS_READER_PASSWORD}@127.0.0.1:${HOST_PORT_POSTGRES}/aizzak_test
          TEST_DATABASE_URL_TRANSIT_ROTATOR=postgresql+asyncpg://transit_rotator:${TRANSIT_ROTATOR_PASSWORD}@127.0.0.1:${HOST_PORT_POSTGRES}/aizzak_test
          TEST_DATABASE_URL_SUPERUSER=postgresql+asyncpg://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PASSWORD}@127.0.0.1:${HOST_PORT_POSTGRES}/aizzak_test
          TEST_REDIS_URL=redis://127.0.0.1:${HOST_PORT_REDIS}/0
          TEST_MINIO_ENDPOINT=127.0.0.1:${HOST_PORT_MINIO}
          TEST_MINIO_ACCESS_KEY=${MINIO_TEST_ACCESS_KEY}
          MINIO_TEST_SECRET_KEY=${MINIO_TEST_SECRET_KEY}
          TEST_MINIO_SECRET_KEY=${MINIO_TEST_SECRET_KEY}
          TEST_MINIO_BUCKET=${MINIO_TEST_BUCKET}
          TEST_QDRANT_URL=http://127.0.0.1:${HOST_PORT_QDRANT}
          TEST_VAULT_ADDR=http://127.0.0.1:${HOST_PORT_VAULT}
          TEST_VAULT_TOKEN=${vault_token}
          TEST_EMBEDDING_URL=http://127.0.0.1:8080
          TEST_OLLAMA_BASE_URL=http://127.0.0.1:11434
          EOF

      # Ollama would pull a model on every run; the embedding image bakes
      # 3.74 GB of model weights. OpenAI and Exa need paid external keys.
      # The local services not excluded here are mandatory: REQUIRE_LIVE turns
      # an unavailable dependency into a loud fixture failure.
      - name: pytest (containerised integration harness)
        env:
          REQUIRE_LIVE: "1"
        run: |
          set -a
          . ./.env.test
          set +a
          pytest -rs -m "not live_ollama and not live_embedding and not live_openai and not live_web_search"

      - name: Tear down integration infrastructure
        if: always()
        run: docker compose down -v --remove-orphans
