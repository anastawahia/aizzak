  /usage:
    get:
      tags: [usage]
      operationId: getUsage
      description: "Usage summary for the workspace. Enforcement/capture are internal inbound ports (not public API)."
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, enum: [day, month], default: month } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsageSummaryOut" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /usage/limits:
    get:
      tags: [usage]
      operationId: getUsageLimits
      responses:
        "200": { description: OK, headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/UsageLimitPage" } } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [usage]
      operationId: putUsageLimits
      description: Replace configurable quotas/budgets/limits (owner/admin).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UsageLimitsPutIn" } } } }
      responses:
        "200": { description: OK, headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/UsageLimitPage" } } } }
        default: { $ref: "#/components/responses/Problem" }

  # Health probes live outside the /api/v1 base and require no auth (03 §0, §1).
  # The per-path `servers: [{ url: / }]` override anchors them at the server root
  # instead of resolving under the global `servers: /api/v1`.
  # NOTE: The interactive WebSocket endpoint /api/v1/ws is intentionally NOT modeled
  # here — WebSocket is out of scope for OpenAPI 3.1; its protocol is specified in 03 §3.2.
  /health:
    servers: [ { url: / } ]
    get:
      tags: [health]
      operationId: getHealth
      description: Liveness probe. No authentication.
      security: []
      responses:
        "200": { description: OK, headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/HealthOut" } } } }
  /health/ready:
    servers: [ { url: / } ]
    get:
      tags: [health]
      operationId: getHealthReady
      description: Readiness probe (dependencies checked). No authentication.
      security: []
      responses:
        "200": { description: Ready, headers: { X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" } }, content: { application/json: { schema: { $ref: "#/components/schemas/HealthOut" } } } }
        "503": { description: Not ready, content: { application/json: { schema: { $ref: "#/components/schemas/HealthOut" } } } }

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    AgentKey: { name: agent_key, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }
    # spaces-backend-plan.md §3.7 — REQUIRED, not defaulted: a file, a thread and a
    # document each belong to exactly one space, so an unqualified listing is not a
    # view the data model offers. An id that names no space answers an empty page
    # rather than a 404: a listing is not an existence oracle.
    SpaceId: { name: space_id, in: query, required: true, schema: { type: string, format: uuid } }
    CorrelationId: { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
  headers:
    CorrelationId:
      description: "Request correlation id, echoed on every response (generated if absent). See 03 §0."
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: "stable machine code, e.g. files.too_large" }
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      properties: { next_cursor: { type: string, nullable: true, description: "opaque cursor; null on the last (or unbounded) page" }, limit: { type: integer } }
    MeUserOut:
      type: object
      required: [id]
      properties: { id: { type: string, format: uuid } }
    MeWorkspaceOut:
      type: object
      required: [id]
      properties: { id: { type: string, format: uuid } }
    MeContextOut:
      type: object
      required: [user, workspace, roles, permissions]
      properties:
        user: { $ref: "#/components/schemas/MeUserOut" }
        workspace: { $ref: "#/components/schemas/MeWorkspaceOut" }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    MeHeartbeatOut:
      type: object
      required: [last_seen_at]
      properties:
        last_seen_at: { type: string, format: date-time, pattern: "Z$" }
    PlatformUserOut:
      type: object
      required: [id, workspace_id, email, display_name, status, roles, last_seen_at, online, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        roles: { type: array, items: { type: string } }
        last_seen_at: { type: string, format: date-time, nullable: true, pattern: "Z$" }
        online: { type: boolean, description: "True when last_seen_at is within the server-side two-minute window." }
        created_at: { type: string, format: date-time, pattern: "Z$" }
    PlatformUserStatsOut:
      type: object
      required: [total, active, disabled, online]
      properties: { total: { type: integer }, active: { type: integer }, disabled: { type: integer }, online: { type: integer } }
    PlatformUsersPageOut:
      type: object
      required: [data, stats, limit, offset, next_offset]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PlatformUserOut" } }
        stats: { $ref: "#/components/schemas/PlatformUserStatsOut" }
        limit: { type: integer }
        offset: { type: integer }
        next_offset: { type: integer, nullable: true }
    PlatformUserStatusIn:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, disabled] }
        reason: { type: string, minLength: 3, maxLength: 500, description: "Operator-supplied audit reason." }
    PlatformUserStatusOut:
      type: object
      required: [id, workspace_id, status, changed, audit_id, changed_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        status: { type: string, enum: [active, disabled] }
        changed: { type: boolean, description: "False when the account already had the requested status; no duplicate audit row is written." }
        audit_id: { type: string, format: uuid, nullable: true }
        changed_at: { type: string, format: date-time, nullable: true, pattern: "Z$" }
    PlatformUserDeleteIn:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: "Operator-supplied audit reason." }
    PlatformUserDeletionOut:
      type: object
      required: [id, workspace_id, deleted, roles_revoked, audit_id, deleted_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        deleted: { type: boolean, description: "False when the account was already a tombstone; no duplicate audit row is written." }
        roles_revoked: { type: array, items: { type: string }, description: "Role assignments this call removed. Empty on a repeat." }
        audit_id: { type: string, format: uuid, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true, pattern: "Z$", description: "When the account became a tombstone — the ORIGINAL date, also on a repeat." }
    SystemCpuOut:
      type: object
      required: [usage_percent, cores, interval_seconds, load_average]
      properties:
        usage_percent: { type: number, description: "Busy time over elapsed time across all cores, idle and iowait both excluded." }
        cores: { type: integer }
        interval_seconds: { type: number, description: "The window `usage_percent` describes. A CPU percentage does not exist without one, so it is published rather than assumed." }
        load_average: { type: array, items: { type: number }, nullable: true, description: "1/5/15-minute run-queue length. Keeps rising after utilisation saturates at 100%, which is where it starts being the more useful number." }
    SystemMemoryOut:
      type: object
      required: [total_gb, used_gb, available_gb, cached_gb, used_percent, limit_gb]
      properties:
        total_gb: { type: number }
        used_gb: { type: number, description: "Total minus what the kernel reports as available. Reclaimable page cache is NOT counted as used — doing so shows every healthy Linux host at ~100% forever." }
        available_gb: { type: number }
        cached_gb: { type: number }
        used_percent: { type: number }
        limit_gb: { type: number, nullable: true, description: "The cgroup ceiling on the process that answered, when it has one. The other figures describe the machine — the only scope a GPU reading can have — and this is what stops that from being read as headroom the API can spend." }
    SystemGpuOut:
      type: object
      required: [index, name, utilization_percent, memory_utilization_percent, memory_total_gb, memory_used_gb, memory_used_percent, temperature_celsius, power_watts]
      properties:
        index: { type: integer }
        name: { type: string }
        utilization_percent: { type: number, description: "Compute occupancy. Routinely disagrees with memory use: a loaded model occupies memory whether or not it is computing." }
        memory_utilization_percent: { type: number }
        memory_total_gb: { type: number }
        memory_used_gb: { type: number }
        memory_used_percent: { type: number }
        temperature_celsius: { type: number, nullable: true, description: "Null where the card has no such sensor, which is normal on passively cooled datacentre parts." }
        power_watts: { type: number, nullable: true }
    SystemStatsOut:
      type: object
      required: [host, sampled_at, cpu, cpu_error, memory, memory_error, gpus, gpu_error]
      properties:
        host: { type: string, description: "The machine that took the sample. Unlike every other route here the answer depends on which replica served the request." }
        sampled_at: { type: string, format: date-time, pattern: "Z$" }
        cpu: { allOf: [{ $ref: "#/components/schemas/SystemCpuOut" }], nullable: true }
        cpu_error: { type: string, nullable: true }
        memory: { allOf: [{ $ref: "#/components/schemas/SystemMemoryOut" }], nullable: true }
        memory_error: { type: string, nullable: true }
        gpus: { type: array, items: { $ref: "#/components/schemas/SystemGpuOut" }, description: "One entry per card. Never summed or averaged: the fault this page is opened for is usually one card out of step with its siblings." }
        gpu_error: { type: string, nullable: true }
    ProviderRouteOut:
      type: object
      required: [namespace, capability, model]
      properties:
        namespace: { type: string, enum: [llm, embedding, image] }
        capability: { type: string, description: "The routing key itself — the identifier resolution takes, and always the literal 'default' in the single-route namespaces." }
        model: { type: string }
    PlatformProviderKeyOut:
      type: object
      required: [id, label, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, description: "The operator's name for the key, or the masked last four characters. Never the secret: the stored row holds a Vault ciphertext reference, so this is a property of the data model rather than a redaction applied here." }
        status: { type: string, enum: [active, revoked] }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time, pattern: "Z$" }
        updated_at: { type: string, format: date-time, pattern: "Z$" }
    PlatformProviderOut:
      type: object
      required: [provider, keyless, probeable, routes, key]
      properties:
        provider: { type: string }
        keyless: { type: boolean, description: "The adapter takes no credential at all (a local model server). A key stored for it would never be read, so storing one is refused." }
        probeable: { type: boolean, description: "False for a provider whose only routes are image ones: testing an image key means generating a billable image, which is a purchase and not a check." }
        routes: { type: array, items: { $ref: "#/components/schemas/ProviderRouteOut" }, description: "Why this provider is worth a key. A provider with no route is absent from the listing entirely." }
        key: { allOf: [{ $ref: "#/components/schemas/PlatformProviderKeyOut" }], nullable: true, description: "The platform's own key, if any. Null does not mean unusable — a workspace with its own credential still resolves." }
    PlatformProvidersOut:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PlatformProviderOut" } }
    PlatformProviderKeyIn:
      type: object
      required: [secret, reason]
      properties:
        secret: { type: string, minLength: 1, maxLength: 8192, description: "The raw provider key. It exists in the process only between this body and the Vault encrypt call, and no route ever returns it." }
        label: { type: string, maxLength: 120, nullable: true, description: "An operator's name for the key. Absent yields the masked last four characters, so a rotation stays distinguishable from the key it replaced." }
        reason: { type: string, minLength: 3, maxLength: 500, description: "Operator-supplied audit reason." }
    PlatformProviderKeyDeleteIn:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: "Operator-supplied audit reason." }
    PlatformProviderKeyChangeOut:
      type: object
      required: [provider, previous_status, changed, key, audit_id]
      properties:
        provider: { type: string }
        previous_status: { type: string, enum: [absent, active], description: "What the platform supplied before this call — which is how a rotation is told from a first key." }
        changed: { type: boolean, description: "False only on the idempotent path: revoking a provider that had no active key. No audit row is written, because the ledger records actions and nothing happened." }
        key: { allOf: [{ $ref: "#/components/schemas/PlatformProviderKeyOut" }], nullable: true }
        audit_id: { type: string, format: uuid, nullable: true }
    PlatformProviderProbeIn:
      type: object
      properties:
        secret: { type: string, minLength: 1, maxLength: 8192, nullable: true, description: "A candidate key to test before committing it; nothing is written. Omit to probe the key already stored, which is the only way to answer why a provider is failing right now." }
    PlatformProviderProbeOut:
      type: object
      required: [provider, ok, latency_ms, detail, checked_at]
      properties:
        provider: { type: string }
        ok: { type: boolean }
        latency_ms: { type: integer, description: "Measured on the monotonic clock, so an NTP step cannot make a probe appear to finish before it started." }
        detail: { type: string, nullable: true, description: "The adapter's own translated reason on a failure; null on success, where there is nothing to say beyond the latency." }
        checked_at: { type: string, format: date-time, pattern: "Z$" }
    PlatformWorkspaceRoleIn:
      type: object
      required: [role, enabled, reason]
      properties:
        role: { type: string, enum: [owner, admin, member, viewer] }
        enabled: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 500, description: "Operator-supplied audit reason." }
    PlatformAdminRoleIn:
      type: object
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 500, description: "Operator-supplied audit reason." }
    PlatformRoleOut:
      type: object
      required: [id, workspace_id, role, enabled, changed, audit_id, changed_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        role: { type: string }
        enabled: { type: boolean }
        changed: { type: boolean }
        audit_id: { type: string, format: uuid, nullable: true }
        changed_at: { type: string, format: date-time, nullable: true, pattern: "Z$" }
    HealthOut:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks: { type: object, additionalProperties: { type: string } }
    WorkspaceOut:
      type: object
      properties: { id: {type: string, format: uuid}, name: {type: string}, status: {type: string}, created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"} }
    WorkspacePatchIn:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 80 } }
    AgentOut:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
        version: {type: string}
        description: {type: string}
        capabilities: { type: array, items: {type: string} }
        required_permissions: { type: array, items: {type: string} }
    ModelOut:
      type: object
      properties:
        capability: {type: string, description: "The routing key itself — a capability or an agent key. This, not `model`, is what a caller pins."}
        provider: {type: string}
        model: {type: string}
        available: {type: boolean, description: "Keyless provider, or a credential that resolves for this caller."}
    AgentInvokeIn:
      type: object
      required: [input]
      properties:
        conversation_id: { type: string, format: uuid, nullable: true }
        space_id:
          type: string
          format: uuid
          nullable: true
          description: "The space a NEW thread is opened in. Optional because a request that names a conversation_id inherits that thread's space and must not restate it; naming NEITHER is a 422."
        input: { type: object, additionalProperties: true }
        stream: { type: boolean, default: false }
    AgentInvokeOut:
      type: object
      properties:
        conversation_id: {type: string, format: uuid}
        message: { $ref: "#/components/schemas/MessageOut" }
        usage: { $ref: "#/components/schemas/Usage" }
    Usage:
      type: object
      properties: { prompt_tokens: {type: integer}, completion_tokens: {type: integer} }
    ConversationOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        agent_key: {type: string}
        kind: {type: string, enum: [agent, workflow]}
        title: {type: string, nullable: true}
        model_route: {type: string, nullable: true, description: "Pinned D-16 routing key (a ModelOut.capability), or null to route by agent key."}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    ConversationModelIn:
      type: object
      required: [route]
      properties: { route: {type: string, nullable: true, description: "A ModelOut.capability — never a raw model name. null unpins."} }
    ConversationCreateIn:
      type: object
      required: [space_id, agent_key]
      properties: { space_id: {type: string, format: uuid, description: "The space this thread belongs to. It decides what the thread's retrieval can see, so a thread without one could see nothing."}, agent_key: {type: string}, title: {type: string, nullable: true} }
    ConversationPatchIn:
      type: object
      required: [title]
      properties: { title: {type: string, nullable: true} }
    ConversationPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/ConversationOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    MessageOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant, system, tool]}
        content: {type: object, additionalProperties: true}
        token_count: {type: integer, nullable: true}
        seq: {type: integer}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    MessageCreateIn:
      type: object
      required: [content]
      properties: { content: {type: object, additionalProperties: true}, stream: {type: boolean, default: false} }
    MessagePage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/MessageOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    ConversationFileIn:
      type: object
      required: [file_id]
      properties: { file_id: {type: string, format: uuid} }
    ConversationFileOut:
      type: object
      properties:
        file_id: {type: string, format: uuid}
        pinned_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    ConversationFilePage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/ConversationFileOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    SpaceCreateIn:
      type: object
      required: [name]
      properties: { name: {type: string, minLength: 1, maxLength: 120} }
    SpaceRenameIn:
      type: object
      required: [name]
      properties: { name: {type: string, minLength: 1, maxLength: 120} }
    SpaceOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        bytes_used: {type: integer, description: "Total size of the space's ACTIVE files - a soft-deleted file has already given its bytes back to the quota."}
        file_count: {type: integer}
        conversation_count: {type: integer}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    SpacePage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/SpaceOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    FileRegisterIn:
      type: object
      required: [space_id, name, content_type, size_bytes]
      properties: { space_id: {type: string, format: uuid, description: "The space this file belongs to. A file never moves between spaces, so this is the only moment its owner can be stated; it is also what the 1 GiB quota is charged against."}, name: {type: string, maxLength: 255}, content_type: {type: string}, size_bytes: {type: integer, minimum: 0} }
    FileRegisterOut:
      type: object
      properties: { file_id: {type: string, format: uuid}, upload_url: {type: string}, expires_in: {type: integer} }
    FileCompleteIn:
      type: object
      properties: { checksum: {type: string, nullable: true} }
    FileRenameIn:
      type: object
      required: [name]
      properties: { name: {type: string, maxLength: 255} }
    FileOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer}
        status: {type: string, enum: [uploaded, scanning, ready, quarantined]}
        download_url: {type: string, nullable: true}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    FilePage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/FileOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    KnowledgeSearchIn:
      type: object
      required: [query]
      properties: { query: {type: string}, k: {type: integer, maximum: 50, default: 5} }
    RetrievedChunkOut:
      type: object
      description: "One retrieved chunk. `file_name`/`page_number`/`section` (retrieval plan §3.1/§3.9, P-18) are the citation fields a client needs to render a source label without a second round trip — always present on the wire, `null` when the indexed point predates them or its parser never emitted one."
      properties:
        document_id: {type: string, format: uuid}
        chunk_id: {type: string, format: uuid}
        text: {type: string}
        score: {type: number}
        file_name: {type: string, nullable: true}
        page_number: {type: integer, nullable: true}
        section: {type: string, nullable: true}
    DocumentOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        file_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, indexing, indexed, failed]}
        chunk_count: {type: integer}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    DocumentPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/DocumentOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    IndexFileIn:
      type: object
      required: [file_id]
      properties:
        file_id: {type: string, format: uuid, minLength: 1}
    ReindexIn:
      type: object
      required: [document_ids]
      properties:
        document_ids: {type: array, items: {type: string, format: uuid}, minItems: 1, maxItems: 50}
    ReindexItemOut:
      type: object
      description: "One document the job is rebuilding. `document_id` is the NEW document, `source_document_id` the destroyed one it replaces (a historical id with no row behind it any more), and `status` is that new document's live ingestion status — read from the corpus, not stored on the job."
      properties:
        document_id: {type: string, format: uuid}
        file_id: {type: string, format: uuid}
        source_document_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, indexing, indexed, failed]}
    ReindexJobOut:
      type: object
      description: "`status` is derived, never stored: `cancelled` when `cancelled_at` is set (it records what happened, so it outranks the rest), `completed` when every item is terminal, `running` otherwise."
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [running, completed, cancelled]}
        total: {type: integer}
        finished: {type: integer, description: "Items in a terminal status (`indexed` or `failed`) — the numerator of `percent`."}
        percent: {type: integer, minimum: 0, maximum: 100}
        current_file_id: {type: string, format: uuid, nullable: true, description: "The file whose document is `indexing` right now, or null between documents."}
        items: { type: array, items: { $ref: "#/components/schemas/ReindexItemOut" } }
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
        cancelled_at: {type: string, format: date-time, nullable: true, pattern: "Z$"}
    SummaryIn:
      type: object
      description: "What to build. Both fields are DEFAULTED here, unlike the same pair on the read routes: this is a request to produce something, and \"the full summary, in whatever language the document is written in\" is what a caller who says nothing else means. On `GET`/`DELETE` the two values are the resource's identity, and half an identity is not a thing to default. There is no `force` — see the `POST` description."
      properties:
        kind: {type: string, enum: [overview, full], default: full, description: "`overview` reads the document's opening chunks in one call; `full` maps over all of them and reduces. The difference is how much is read, not how the prompt is worded, which is what keeps each one's cost a property of the contract."}
        lang: {type: string, enum: [auto, ar, en], default: auto, description: "`auto` is a real member, not a missing value: \"answer in the document's own language\" is a distinct instruction whose output is a distinct artefact from the same document summarised into Arabic. All three are part of the stored key for that reason."}
    SummaryOut:
      type: object
      description: "A stored summary. Keyed on `(document_id, kind, lang)` — on the DOCUMENT and not the file, because a summary is a claim about TEXT, and re-indexing destroys the document whose text it described rather than letting the claim outlive it."
      properties:
        id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        kind: {type: string, enum: [overview, full]}
        lang: {type: string, enum: [auto, ar, en]}
        text: {type: string, description: "Markdown."}
        model: {type: string, description: "Which model wrote it. Published, unlike the indexing `error` DocumentOut withholds, and the difference is what the field IS: an indexing failure's reason could carry anything a parser said, while the model behind a summary is a property of the artefact being read."}
        source_chunks: {type: integer, description: "How many of the document's chunks were actually read."}
        truncated: {type: boolean, description: "Whether the document had more than the map ceiling. A `full` summary of a prefix is a true summary of a part, and a reader who is not told will take it for the whole."}
        built_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    SummaryJobOut:
      type: object
      description: "A build's progress. Every number is stored on the row, not derived — see `GET /knowledge/summary-jobs/{id}` for why that diverges from ReindexJobOut deliberately."
      properties:
        id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        kind: {type: string, enum: [overview, full]}
        lang: {type: string, enum: [auto, ar, en]}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        total_chunks: {type: integer, description: "Measured when a worker claims the job; 0 while still queued."}
        done_chunks: {type: integer}
        percent: {type: integer, minimum: 0, maximum: 100, description: "A succeeded job is 100 unconditionally: the reduce step that turns the mapped pieces into the summary is real work `total_chunks` does not count, so a job can be at 100% of its chunks and genuinely not done."}
        error: {type: string, nullable: true, description: "Why the build ended without a summary, including when it was cancelled. A sentence written for this reader, never a provider's raw output."}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
        finished_at: {type: string, format: date-time, nullable: true, pattern: "Z$"}
        cancelled_at: {type: string, format: date-time, nullable: true, pattern: "Z$"}
    SummaryDeletedOut:
      type: object
      description: "`false` means nothing was stored under that key — a 200, not a 404: the caller asked for a state and that state now holds."
      properties:
        deleted: {type: boolean}
    MediaJobCreateIn:
      type: object
      required: [kind, prompt, agent_key]
      properties:
        kind: {type: string, enum: [image, video]}
        prompt: {type: string}
        agent_key: {type: string}
        params: {type: object, additionalProperties: true}
    MediaJobOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        result_file_id: {type: string, format: uuid, nullable: true}
        error: {type: string, nullable: true}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    WorkflowOut:
      type: object
      properties: { key: {type: string}, name: {type: string}, steps: { type: array, items: {type: string} } }
    WorkflowRunIn:
      type: object
      required: [space_id, input]
      properties: { space_id: {type: string, format: uuid, description: "The space this run's thread is opened in. Required with no nullable case: a run always opens its own thread, so it never has one to inherit a space from."}, input: {type: object, additionalProperties: true}, stream: {type: boolean, default: false} }
    WorkflowRunOut:
      type: object
      properties:
        run_id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        status: {type: string, enum: [running, succeeded, failed]}
    CredentialCreateIn:
      type: object
      required: [provider, scope, secret]
      properties:
        provider: {type: string}
        scope: {type: string, enum: [platform, user]}
        label: {type: string, nullable: true}
        secret: {type: string, writeOnly: true}
    CredentialOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        scope: {type: string}
        label: {type: string, nullable: true}
        status: {type: string, enum: [active, revoked]}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    ConnectorOut:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
        scopes: { type: array, items: {type: string} }
        auth_type: {type: string, enum: [oauth2]}
    ConnectionCreateIn:
      type: object
      required: [connector_key]
      properties:
        connector_key: {type: string}
        scopes: { type: array, items: {type: string} }
    ConnectionOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        connector_key: {type: string}
        display_name: {type: string, nullable: true}
        status: {type: string, enum: [pending, connected, revoked, error]}
        scopes: { type: array, items: {type: string} }
        expires_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$", nullable: true}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    ConnectionPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/ConnectionOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    AuthorizeOut:
      type: object
      properties: { authorize_url: {type: string}, state: {type: string} }
    McpServerCreateIn:
      type: object
      required: [name, endpoint_url]
      properties:
        name: {type: string}
        endpoint_url: {type: string, format: uri}
        transport: {type: string, enum: [http, sse], default: http}
    McpServerOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        endpoint_url: {type: string}
        transport: {type: string, enum: [http, sse]}
        status: {type: string, enum: [active, disabled, error]}
        created_at: {type: string, format: date-time, description: "UTC ISO-8601, trailing Z (DAT-06)", pattern: "Z$"}
    DiscoveredToolOut:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        source: {type: string, description: "connector:<id> | mcp:<name>"}
    UsageSummaryOut:
      type: object
      properties:
        workspace_id: {type: string, format: uuid}
        period: {type: string, enum: [day, month]}
        tokens: {type: integer}
        cost_micros: {type: integer}
        by_agent: { type: array, items: {type: object, additionalProperties: true} }
        by_provider: { type: array, items: {type: object, additionalProperties: true} }
    UsageLimitOut:
      type: object
      properties:
        id: {type: string, format: uuid}
        scope: {type: string, enum: [workspace, agent, provider]}
        scope_key: {type: string}
        metric: {type: string, enum: [tokens, cost_micros]}
        period: {type: string, enum: [day, month]}
        limit_value: {type: integer}
    UsageLimitsPutIn:
      type: object
      required: [limits]
      properties:
        limits: { type: array, items: { $ref: "#/components/schemas/UsageLimitOut" } }
    AgentPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/AgentOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    ModelPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/ModelOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    RetrievedChunkPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/RetrievedChunkOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    WorkflowPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/WorkflowOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    CredentialPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/CredentialOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    ConnectorPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/ConnectorOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    McpServerPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/McpServerOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    DiscoveredToolPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/DiscoveredToolOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
    UsageLimitPage:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/UsageLimitOut" } }, meta: { $ref: "#/components/schemas/PageMeta" } }
