# AIZZAK deployment topology (7.1 · 08-local-runbook §2, D-26).
#
# ── One Compose topology for deployment and the live test harness ─────
# The native PostgreSQL/PgBouncer/Redis/MinIO installations were removed by
# containerised-test-harness-plan-v2. Inside this network every service keeps
# its canonical name and port (`pgbouncer:6432`, `minio:9000`, ...); the
# offset HOST publications are the stable local operator/test interface.
# `docker-compose.test.yml` is an explicit opt-in overlay: it publishes the
# otherwise-internal embedding service and mounts the test-database script.
#
# ── Every image tag is pinned ──────────────────────────────────────────────
# The two pre-existing ad-hoc containers ran `:latest`. A deploy artifact
# whose components change underneath it between two `up`s is not one.
#
# ── Every service carries `deploy.resources.limits` (capacity 3.4) ─────────
# Until this step NO service had a ceiling: an indexing worker that opened a
# 50 MB file could starve Postgres on the same host. The numbers come from
# `docs/capacity-plan.md` §6, RECONCILED against what this stack was measured
# using -- because §6's table does not add up to what its own total row
# claims, and does not fit the host it names:
#
#     §6's fifteen rows sum to    34 vCPU / 67.75 GB
#     §6's own total row says    ~31 vCPU / ~59 GB
#     §6's reference host is      32 vCPU / 64 GB
#
# So the budget as written over-commits its own host by 2 vCPU and 3.75 GB,
# and the total row that would have shown it understates the rows by 3 vCPU
# and 8.75 GB. §6 also names fifteen services for a file that has TWENTY-NINE.
# The ledger this file now carries is in `08-local-runbook §2-ج`, recomputed
# from these keys by `tests/unit/test_resource_budget.py`.
#
# ⚠️ **A CPU limit and a memory limit are not the same kind of promise, and
# the ledger treats them differently.** `cpus` is a CEILING on a share the
# scheduler hands out; several services capped at 2 on a 4-core host still
# get isolation, because no one of them can take more than its cap. `memory`
# is a KILL THRESHOLD on a cgroup, and it isolates NOTHING once the sum passes
# host RAM: the kernel's OOM killer fires host-wide, by RSS, long before any
# cgroup reaches its own limit. So the standing memory total is a HARD
# requirement against the host (50.5 GB of 64) and the CPU total is reported
# as an oversubscription ratio (31.5 of 32).
#
# ⚠️ **AND DOCKER WILL NOT TELL YOU.** Measured on this machine (10 vCPU,
# 12.67 GB): `deploy.resources.limits: {cpus: "6.0", memory: 20G}` was
# accepted in full -- `HostConfig.Memory=21474836480`, `NanoCpus=6000000000`
# -- with no warning on stdout, no log line, and no failure. A budget written
# for a host you do not have looks exactly like a budget that fits.
# `deploy/resource-budget.sh` is what says it out loud.

name: aizzak

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: aizzak/app:${APP_IMAGE_TAG:-dev}

# Every process built from the ONE image shares this environment; what
# differs per process is the command and the DATABASE_URL role.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  API_PREFIX: ${API_PREFIX:-/api/v1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # capacity 2.6 -- the ONE of the four connection timeouts that is shared by
  # every process here, because it is the only one that answers to something
  # outside them: it must stay under the pooler's `client_idle_timeout`
  # (1800s), and the pooler is the same pooler for all of them. The other
  # three are the API server's alone (see the `app` service) -- the relay and
  # the three workers carry a background budget from their own constants in
  # `app/workers/bootstrap.py`.
  DB_POOL_RECYCLE_S: ${DB_POOL_RECYCLE_S:-900}
  # ح-10 · ق-4 (5.2) -- TWO URLs, and which key goes where is a wiring
  # decision made in `framework/di/composition_root.py`, not here. REDIS_URL
  # is the `noeviction` instance and stays the DEFAULT for everything: the
  # `CacheProvider` port carries a session denylist, a single-use OAuth state
  # and an abuse counter alongside the true caches, and none of those three
  # may be evicted. CACHE_REDIS_URL is the `allkeys-lru` instance, and exactly
  # two callers are pointed at it.
  #
  # Only `app` builds a cache today (the workers embed chunks, never queries
  # -- `_build_embedding`'s own docstring), so CACHE_REDIS_URL is inert in the
  # worker containers. It is set here anyway rather than per-service: the day
  # a worker does build one, the alternative is that it silently gets the
  # wrong instance.
  REDIS_URL: redis://redis-stream:6379/0
  CACHE_REDIS_URL: redis://redis-cache:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: ${MINIO_BUCKET:-workspace-files}
  MINIO_SECURE: "false"
  # The address presigned URLs are SIGNED against (7.1). `minio:9000` is
  # resolvable only inside this network; SigV4 covers the host, so the URL
  # handed to a browser has to be signed against a host the browser can
  # reach. Not cosmetic and not fixable in Nginx.
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:19000}
  MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
  QDRANT_URL: http://qdrant:6333
  # 2.10 -- the central embedding service (internal-only, the SAME trust
  # boundary as Postgres/Redis/Qdrant above: tenant text crosses the
  # internal Docker network to reach it, never the public one). Only the
  # URL is env-editable here (DD-11); model/dimensions/batch/timeout are
  # pinned adapter-side defaults that must match the image this service
  # bakes its model into (`services/embedding/Dockerfile`).
  #
  # ── `embedding` → `embedding-lb` (capacity 4.2) ─────────────────────────
  # ⚠️ THE SERVICE NAME IS NO LONGER THE RIGHT DESTINATION, and pointing this
  # back at it is a SILENT defect rather than an outage: `embedding` now has
  # three replicas, the adapter holds pooled `httpx` connections, and a pooled
  # connection resolves the name once and then stays on that one address. Two
  # replicas would sit idle at full health while throughput looked like a
  # failed scale-out -- 4.2's «عطبٌ صامتٌ يبدو كأنّه فشلُ توسّع».
  #
  # ⭐ AND IT IS ENV-EDITABLE FOR ONE REASON: it is HALF THE KILL SWITCH م-8
  # requires of every step in this plan. Back to the pre-4.1/4.2 stack, with
  # no file edited:
  #
  #     EMBEDDING_SERVICE_URL=http://embedding:8080 \
  #       docker compose up -d --scale embedding=1 app worker-knowledge
  #
  # (`--scale` is accepted alongside `deploy.replicas` -- verified in
  # `deploy/rolling-deploy.sh`'s own header.)
  #
  # ⚠️ WHICH MAKES A STALE `.env` THE TRAP: `.env` is interpolated into this
  # value, so a developer whose file still carries the old
  # `EMBEDDING_SERVICE_URL=http://embedding:8080` gets the silent defect above
  # WITHOUT choosing it. That is why `.env.example` changed in the same commit,
  # and why `GET /health` reports each replica's thread pin -- an idle fleet
  # has to be visible from somewhere.
  EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://embedding-lb:8080}
  VAULT_ADDR: http://vault:8200
  # ── Vault authentication mode (7.3 · D-22 · 05 §3.3) ───────────────────
  # THREE variables, and which of them is set decides the mode, because
  # `create_vault_client` prefers a token whenever one is present:
  #   VAULT_TOKEN set          -> token auth (local dev-mode root token)
  #   VAULT_TOKEN empty  AND
  #   VAULT_ROLE_ID + VAULT_SECRET_ID set -> AppRole login (D-22, MANDATORY
  #                                          for every non-local deployment)
  # So `VAULT_TOKEN=` (blank) in .env is not a missing value -- it is the
  # switch. Left unquoted-empty here rather than defaulted, precisely so a
  # blank .env entry survives into the container instead of being replaced.
  VAULT_TOKEN: ${VAULT_TOKEN-}
  VAULT_ROLE_ID: ${VAULT_ROLE_ID-}
  # NEVER put this in .env (05 §3.3: "the only sensitive one in the
  # environment"). It is read from the invoking shell -- Compose
  # interpolation consults the real environment too, and the shell wins.
  VAULT_SECRET_ID: ${VAULT_SECRET_ID-}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_JWKS_CACHE_TTL: ${FIREBASE_JWKS_CACHE_TTL:-3600}
  # capacity-plan wave 1 step 1.1 -- how long the authentication path may
  # reuse a resolved principal (workspace, user, roles, active). Every write
  # that changes one of those invalidates the entry explicitly, so this bounds
  # only how long an invalidation that FAILED may keep being wrong. `0` builds
  # NO cache at all, which is what a baseline run needs.
  AUTH_PRINCIPAL_CACHE_TTL_S: ${AUTH_PRINCIPAL_CACHE_TTL_S:-60}
  # capacity-plan wave 1 step 1.2 -- the two request ceilings (per user, per
  # workspace) over Redis, plus the per-process in-flight guard. `false` and
  # `0` respectively build nothing, which is what a baseline run needs. The
  # per-user number is `Limits.api_rate_per_min`: a declared 07 §4 guardrail,
  # not a deployment knob, so it is deliberately absent here.
  API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
  WORKSPACE_RATE_PER_MIN: ${WORKSPACE_RATE_PER_MIN:-2400}
  MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-64}
  # capacity-plan 4.3 -- how long a computed QUERY vector may be reused
  # (`CachingEmbeddingProvider`, wrapped around the embedding adapter by the
  # API's Composition Root and by nothing else). `0` builds no wrapper at all,
  # which is what a baseline run needs. Ceiling 3600.
  #
  # ⚠️ IT REACHES THE WORKERS TOO -- this block is shared -- AND THEY IGNORE
  # IT, deliberately. Only the API's Composition Root builds the wrapper; the
  # knowledge worker's own root (`workers/bootstrap.py`) builds the bare
  # adapter and does not read this value at all. The API embeds QUERIES (one
  # short string per search, repeated across users); the worker embeds CHUNKS
  # -- a hundred thousand per corpus, each seen exactly once -- and caching
  # those would fill Redis with entries that can never be hit while evicting
  # the ones that would. `tests/unit/test_embedding_fleet.py` guards the
  # asymmetry, since a variable present in both environments is exactly the
  # thing a later edit would "fix".
  EMBEDDING_CACHE_TTL_S: ${EMBEDDING_CACHE_TTL_S:-600}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  EVENT_STREAM_PREFIX: ${EVENT_STREAM_PREFIX:-stream.}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
  CONSUMER_BLOCK_MS: ${CONSUMER_BLOCK_MS:-5000}
  MAX_RETRIES_BEFORE_DLQ: ${MAX_RETRIES_BEFORE_DLQ:-5}
  OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-256}
  # Read COUNT for the API notify bridge's own `StreamConsumer` -- and ONLY
  # for it since capacity 5.1. The three `worker-*` processes derive their
  # count from `WORKER_CONCURRENCY` instead (`workers/bootstrap.
  # _worker_batch_count`), because a worker that reserves entries it is not
  # working on is `F-1`'s defect; the bridge, whose handler is a queue `put`,
  # genuinely wants sixteen per read and one lane.
  CONSUMER_BATCH_COUNT: ${CONSUMER_BATCH_COUNT:-16}
  # ── capacity 5.1 (`ح-6`): bounded concurrency in the consumption engine ──
  # How many messages ONE worker process handles at once. Listed in the SHARED
  # block so `.env` can move the floor for all three at once, and OVERRIDDEN
  # per service below where that worker's own facts differ -- the
  # `HEARTBEAT_MAX_AGE_S` precedent.
  #
  # ⚠️ THREE THINGS MOVE WITH IT and none of them is in this file: the
  # worker's DATABASE pool (`_worker_pool_size` = concurrency + 1, which
  # `tests/unit/test_connection_budget.py` multiplies out), its `XREADGROUP`
  # COUNT, and its peak RSS -- `concurrency` documents parsed at once is
  # `concurrency` copies of the largest one, against the `memory` limit each
  # service declares below (08 §2-ز).
  #
  # `WORKER_CONCURRENCY=1` is this step's off switch (`م-8`): it restores the
  # sequential engine byte for byte.
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  # How long a worker asked to stop keeps finishing what it already took
  # before the rest is cancelled and left `pending` (invariant 4). MUST stay
  # under `stop_grace_period` below, or `SIGKILL` arrives first and the drain
  # is decoration -- `tests/unit/test_worker_drain_ladder.py` guards the order.
  WORKER_DRAIN_TIMEOUT_S: ${WORKER_DRAIN_TIMEOUT_S:-30}
  # Retained length per stream, `XADD ... MAXLEN ~ N` (7.3). Streams are
  # append-only -- XACK does not delete -- so without this every
  # stream.<module> grows forever even with healthy consumers. 0 disables.
  STREAM_MAXLEN: ${STREAM_MAXLEN:-100000}
  # ت‑3: where the port-less processes stamp their liveness, and how stale
  # that stamp may get. Listed in the SHARED env block on purpose even though
  # only four services beat -- `app` and `migrate` ignore it, and the
  # alternative (two more per-service environment blocks) would be a second
  # place for the directory to drift out of agreement with the healthcheck
  # command that reads it.
  HEARTBEAT_DIR: ${HEARTBEAT_DIR:-/tmp/aizzak-heartbeat}
  HEARTBEAT_MAX_AGE_S: ${HEARTBEAT_MAX_AGE_S:-300}
  PROVIDER_ROUTING: ${PROVIDER_ROUTING:-{"llm":{"default":{"provider":"ollama","model":"gemma3:1b"}},"embedding":{"default":{"provider":"embedding-local","model":"sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"}}}}
  OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost}
  MCP_ALLOWED_TRANSPORTS: ${MCP_ALLOWED_TRANSPORTS:-http,sse}
  OAUTH_REFRESH_SKEW_S: ${OAUTH_REFRESH_SKEW_S:-60}
  USAGE_ROLLUP_PERIODS: ${USAGE_ROLLUP_PERIODS:-day,month}
  USAGE_DEFAULT_LIMITS: ${USAGE_DEFAULT_LIMITS:-{"tokens":{"month":5000000},"cost_micros":{"month":50000000}}}

x-app-logging: &app-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      # ── Capacity 0.6: the service name, carried INSIDE the log file ───────
      # The json-file driver stamps the named container labels onto every line
      # it writes, as `"attrs":{…}` next to `log`/`stream`/`time` (measured on
      # this host before the collector was designed around it). Compose already
      # applies both of these labels to every container it creates, so this ONE
      # line -- in the anchor every service in this file merges -- is what lets
      # `alloy` label each line with the service that wrote it while holding
      # nothing but a READ-ONLY bind of the log directory.
      #
      # ⚠️ The alternative is the published recipe: mount /var/run/docker.sock
      # into the collector so it can ask the API for container names. That is
      # root on the host, the same capability step 0.3 put `cadvisor` behind an
      # opt-in profile to avoid granting for free -- and 0.6, unlike container
      # metrics, cannot be opt-in. See `deploy/alloy/config.alloy`'s header.
      #
      # ⚠️ Changing a `logging:` option requires RECREATING a container; a
      # running one keeps the options it was created with. `docker compose up
      # -d` does that, `restart` does not -- a stack restarted rather than
      # recreated ships lines with no `attrs` and lands them all unlabelled.
      labels: "com.docker.compose.service,com.docker.compose.project"

# `host.docker.internal` -- which OLLAMA_BASE_URL defaults to above -- is a
# Docker DESKTOP convenience that does not exist on Linux Docker: the name has
# no resolver entry inside the container, so every LLM call died with
# `ConnectError [Errno -2] Name or service not known` while Ollama sat healthy
# on the host serving gemma3:1b. `host-gateway` is Docker's documented Linux
# equivalent -- it substitutes the bridge gateway address at container create.
#
# Applied to `app` and the three `worker-*` services only: they are the
# processes that call an LLM. `migrate` and `outbox-relay` share the same env
# block but reach nothing outside the Compose network, and a host route they
# never use is a hole for free.
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

# ── The three Streams consumers (08 §2/§4) ────────────────────────────────
# Everything the three `worker-*` services share. What differs per service is
# exactly one environment key (`WORKER`) and, for `media` alone, a profile.
#
# ⭐ This used to be ONE service parameterised by `WORKER`, which made the
# declared topology unreachable: `docker compose up -d worker` twice with two
# values is the SAME container recreated, so only one consumer could run at a
# time and "one module's backlog cannot starve another's" was true on paper
# only. Splitting was tracked as a deferred decision in
# docs/stream-topology-plan.md §6-أ with one named precondition -- a first
# MEASURED containerised boot of `knowledge` -- which docs/log/3.105.md met.
#
# ⚠️ The depends_on set below is deliberately WIDER than the old `worker`
# service's, which named neither `minio` nor `vault` even though every worker
# resolves its MinIO credentials out of Vault, and named no `qdrant` at all.
# That never showed on a full `docker compose up -d` (those services boot
# anyway, unasked) and only bites when an operator names ONE service on the
# command line -- which is exactly the §3.111 defect, found live in §3.110,
# where `pgbouncer` was missing here for the same reason. The `qdrant` half of
# that gap in `app` -- flagged here and left unfixed since §3.133 -- is closed
# in the `app` service below, in the same step that gave `qdrant` a
# healthcheck to depend on.
x-worker-service: &worker-service
  depends_on:
    ollama-bridge:
      condition: service_started
    # This edge was MISSING until §3.111 even though DATABASE_URL has named
    # `pgbouncer:6432` all along -- see the note on `outbox-relay`.
    #
    # `service_healthy` since ت‑3: the pooler had no healthcheck at all, so
    # `service_started` was the strongest condition expressible here, and
    # §3.111 recorded that looseness in writing ("started != accepting
    # connections", "adding a pgbouncer healthcheck is a separate decision").
    # That decision is now made, so the edge says what it always meant.
    pgbouncer:
      condition: service_healthy
    redis-stream:
      condition: service_healthy
    minio:
      condition: service_healthy
    # Likewise ت‑3: `service_started` here was never a choice either -- Qdrant
    # had no healthcheck, and a container whose HTTP port is not open yet
    # satisfies "started". Every worker writes vectors, so readiness is what
    # the edge is for.
    qdrant:
      condition: service_healthy
    vault:
      condition: service_healthy
    # `embedding-lb` and not `embedding` (capacity 4.2): the balancer is what
    # this process actually calls, and its healthcheck proxies THROUGH to a
    # real replica -- so waiting on it is the strictly stronger condition.
    embedding-lb:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    vault-bootstrap:
      condition: service_completed_successfully
  command: ["python", "-m", "app.workers.main"]
  # ⭐ CAPACITY 5.1, INVARIANT 4 -- AND THE NUMBER THE DRAIN IS MEASURED
  # AGAINST. Compose's default is 10 s: `SIGTERM`, ten seconds, `SIGKILL`. A
  # worker draining `WORKER_DRAIN_TIMEOUT_S` (30 s) of in-flight work inside a
  # 10 s grace period would be killed at a third of its own deadline every
  # single time, and the drain would be a log line rather than a behaviour --
  # so the deadline and the grace period are one decision taken in two files,
  # and `tests/unit/test_worker_drain_ladder.py` is what stops them drifting.
  # 45 s is `app`'s own value (7.2), for the same reason and with the same
  # margin: the drain, then the deregistration round trips, then the clients.
  stop_grace_period: 45s
  restart: unless-stopped

# Merged INTO `environment:` (not into the service), alongside *app-env.
x-worker-env: &worker-env
  DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-aizzak}

# ── liveness for the four processes that expose no port (ت‑3) ──────────────
# `worker-memory`/`worker-knowledge`/`worker-media`/`outbox-relay` run a
# blocking loop and listen on nothing, so there is no endpoint to curl. Each
# stamps a file once per completed cycle and `python -m app.ops.healthcheck
# <name>` reads its age -- see `framework/observability/heartbeat.py` for why
# a file rather than a port, and `HealthSettings` for why the default
# tolerance is 300 s rather than something that looks tighter.
#
# Only the TIMING is shared here; each service passes its own name, because a
# per-process file is precisely what stops a dead process from riding on a
# live sibling's beat (the ت‑7 orphan, which consumed happily from `cg.memory`
# while running deleted code).
#
# `start_period: 90s` covers the slowest of the four boots (the knowledge
# worker resolves MinIO credentials out of Vault before its first read), and
# failures inside it never count toward `retries`.
x-heartbeat-healthcheck: &heartbeat-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 90s

services:
  # ────────────────────────────── data plane ──────────────────────────────
  # A named volume's mount point is created root:root when the path does not
  # already exist inside the image -- which `/var/lib/postgresql/wal-archive`
  # does not. MEASURED on the first run of step 2.5: Postgres came up healthy,
  # `archive_mode` read `on`, and the archiver could not write a byte; the
  # only symptom would have been `pg_stat_archiver.failed_count` climbing
  # while `docker compose ps` stayed green and pg_wal grew.
  #
  # A one-shot on the SAME pinned image as the server (the `nginx-certs` /
  # `minio-bootstrap` pattern), because the postgres entrypoint chowns
  # `$PGDATA` and `/var/run/postgresql` and nothing else, and `command:`
  # cannot chown anything at all.
  wal-archive-init:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    image: postgres:16
    user: root
    volumes:
      - wal-archive:/var/lib/postgresql/wal-archive
    # 0750: the server (999) writes, the shipper (999, see `wal-shipper`)
    # deletes, and nothing else on the host or in another container reads
    # transaction logs that carry every tenant's rows.
    entrypoint:
      - sh
      - -c
      - chown 999:999 /var/lib/postgresql/wal-archive && chmod 0750 /var/lib/postgresql/wal-archive
    restart: "no"
    <<: *app-logging

  postgres:
    deploy:
      resources:
        limits:
          # §6 says 20 GB "with shared_buffers=8GB". DERIVED from 2.1's own
          # shipped knobs (deploy/postgres/postgresql.conf) instead of copied,
          # and RE-DERIVED here because 3.4's version of this sum -- 8 + 1 +
          # 300 x 16 MB = 13.8 -- was wrong in two terms at once, and 2.1 is
          # the step that makes both of them real:
          #
          #   8.00  shared_buffers
          #   3.00  autovacuum: maintenance_work_mem x autovacuum_max_workers.
          #         MEASURED: `autovacuum_work_mem` is -1 ("use
          #         maintenance_work_mem") and `autovacuum_max_workers` is 3,
          #         so 2.1's 1 GB is 3 GB standing. 3.4 counted it once; §6
          #         did not count it at all.
          #   1.00  one manual VACUUM/REINDEX on top of the daemon's three
          #   5.03  work_mem. NOT `max_connections x work_mem`: the grant is
          #         PER NODE and again per parallel worker, so that product is
          #         a floor. MEASURED: four simultaneous grants in one
          #         ordinary query, six once parallelism is on. The bound that
          #         holds is `backends x work_mem x nodes`, with the parallel
          #         term capped server-wide by `max_worker_processes` (8) --
          #         161 backends (2.2's ceiling, test_connection_budget) x
          #         16 MB x 2 full grants.
          #   0.50  ~3 MB of backend overhead x 161
          #   ----
          #  17.53 -> 18g
          #
          # MEASURED today, with 2.1 shipped but this host at 12.67 GB: the
          # server starts anyway and reports nothing (see the `shared_buffers`
          # note in the config file). The cgroup limit never fires here
          # because it is above the host's own memory -- that is `د-25`.
          cpus: "6.0"
          memory: 18g
    image: postgres:16
    depends_on:
      wal-archive-init:
        condition: service_completed_successfully
    # ── capacity step 2.8 (`ح-16`): /dev/shm, and why it is not tuning ──
    # Docker gives every container a 64 MB `/dev/shm`, and PostgreSQL's
    # `dynamic_shared_memory_type = posix` allocates every PARALLEL worker's
    # segment from it. `maintenance_work_mem` is the size parallel VACUUM asks
    # for, and its default is 64 MB -- so the request can never fit the ceiling
    # it is drawn from, at any table size large enough to recruit a worker.
    #
    # MEASURED on this stack, on `platform.outbox` at 2,000,000 rows:
    #
    #     VACUUM (ANALYZE) platform.outbox;
    #     ERROR: could not resize shared memory segment "/PostgreSQL.3044006814"
    #            to 67128960 bytes: No space left on device
    #
    # 67,128,960 = maintenance_work_mem (65,536 kB) + 20,096 bytes of header,
    # against a 64 MB tmpfs: arithmetic, not luck. The same VACUUM with
    # `max_parallel_maintenance_workers = 0` finished in 2.36 s.
    #
    # What makes this a step-2.8 blocker and not a curiosity: the failure is
    # invisible until the table is big, autovacuum is exempt (it never
    # parallelises index cleanup) and therefore keeps working, and the ONE
    # thing an operator reaches for when a table has bloated -- a manual
    # VACUUM -- is the thing that fails. A step whose whole subject is keeping
    # three write-heavy tables from bloating cannot leave the remedy
    # inoperable at the size where it is needed.
    #
    # ⚠️ NOT a knob risk `م-8` covers, on the same footing 2.5's `archive_mode`
    # already argued: `shm_size` is a CONTAINER resource ceiling, not a
    # PostgreSQL setting. It changes no plan, no cache and no cost estimate, so
    # a 0.5 baseline taken with it is the same baseline -- it only stops
    # Postgres's own configured limits from being silently cut off below their
    # value. `test_the_tuning_stays_out_of_the_command_that_carries_the`
    # `_instrument` guards the four knobs that do flatter a baseline: since
    # 2.1 they live in deploy/postgres/postgresql.conf, where
    # `POSTGRES_CONFIG_FILE` can switch them off, and that guard keeps them
    # from drifting back to a `-c` argument the switch could not reach.
    #
    # 1g rather than 128m (which would clear today's 64 MB request): step 2.1
    # declares `maintenance_work_mem=1GB`, and leaving room only for today's
    # default would make 2.1 reintroduce this exact failure as a regression
    # nobody attributes to a memory knob. tmpfs pages are allocated on use, so
    # this reserves nothing.
    #
    # ⚠️ AND THE RULE THIS COMMENT USED TO STATE FOR THE NUMBER IS WRONG --
    # measured by 2.1, the step that made it operative. It read "the segment is
    # sized to maintenance_work_mem, so shm_size > maintenance_work_mem +
    # headroom". MEASURED at `maintenance_work_mem=1GB` with `shm_size=64m`:
    # parallel VACUUM on a 460 MB heap with three indexes asked for
    # 105,858,080 bytes -- 101 MB, not 1 GB. The size is
    # `min(maintenance_work_mem, ~1798 bytes x relpages)`, so the real bound is
    # on TABLE SIZE: 1gb holds until a heap passes roughly 4.5 GB and then this
    # failure returns. The direction was right and 1gb is still the right
    # number; what was wrong is what it GUARANTEES. `08-local-runbook §2-هـ`
    # carries the corrected rule and the `relpages` query that warns first.
    shm_size: 1gb
    # ⚠️ THREE OVERRIDES, ALL THREE ABOUT OBSERVING THE SERVER, NONE ABOUT
    # TUNING IT (capacity step 0.4, docs/capacity-plan.md §5 Wave 0). The
    # tuning arrived in step 2.1 and it is in a FILE, not here --
    # deploy/postgres/postgresql.conf, selected by the `config_file` argument
    # below.
    #
    # ⭐ AND 2.1 DID NOT "DELETE THIS `command:`", WHICH IS WHAT ITS OWN TEXT
    # ASKED FOR. Everything under `command:` is either 0.4's instrument or
    # 2.5's durability, and `م-8` covers neither: a 0.5 baseline taken without
    # pg_stat_statements cannot be read, and one taken on a cluster that does
    # not archive its WAL is a baseline of a deployment nobody would operate.
    # Folding the three classes into one file gives them ONE switch, and the
    # switch `م-8` needs would then also turn archiving off. They stay here,
    # where a command-line `-c` additionally OUTRANKS the file -- measured:
    # `pg_settings.source` reads `command line` for these and `configuration
    # file` for 2.1's eight knobs.
    #
    # shared_preload_libraries is a START-time setting -- a running cluster
    # does not pick it up on reload, so an existing deployment needs
    # `docker compose up -d postgres` (a restart) after this change, and then
    # `CREATE EXTENSION` once (deploy/postgres/initdb/20-extensions.sh runs
    # only on a fresh volume; `python -m app.ops.slow_queries` prints the
    # exact one-liner for an existing one).
    #
    # max=10000 rather than the 5000 default: 10 module schemas' SQL adapters
    # plus Alembic's own DDL plus the smoke/live suites is already thousands
    # of distinct statements, and an overflow does not fail loudly -- it
    # silently discards the least-executed entries and the report reads as if
    # complete. `pg_stat_statements_info.dealloc` is what catches that, and
    # `slow_queries top` prints it on every report for exactly this reason.
    # track=top (the default, stated rather than inherited): nested statements
    # inside functions are not this codebase's cost -- every query comes from
    # a SQLAlchemy adapter at the top level.
    command:
      - postgres
      # ── capacity step 2.1: the tuning, and its `م-8` off switch ──────────
      # ⭐ `POSTGRES_CONFIG_FILE` IS WHAT UNBLOCKS THIS STEP. Risk `م-8` is
      # "tuning starts before the baseline exists", and it was recorded as a
      # BLOCKER on 2.1 because a tuned server cannot answer whether the tuning
      # helped. It is a blocker only while the tuning is irreversible. Point
      # this at the data directory's own postgresql.conf --
      #
      #   POSTGRES_CONFIG_FILE=/var/lib/postgresql/data/postgresql.conf
      #
      # -- and the server comes up on image defaults with archiving and
      # pg_stat_statements still on, which is exactly the state the 0.5
      # baseline has to be measured in. Same shape as every other `م-8`
      # subject already in this repository: `API_RATE_LIMIT_ENABLED=false`,
      # `AUTH_PRINCIPAL_CACHE_TTL_S=0`, `MAX_IN_FLIGHT_REQUESTS=0`.
      # `tests/unit/test_postgres_tuning.py` guards both positions.
      - -c
      - config_file=${POSTGRES_CONFIG_FILE:-/etc/postgresql/postgresql.conf}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=top
      # ── capacity step 2.5: durability, NOT tuning ───────────────────────
      # `hba_file` points at a REVIEWED file instead of the one initdb wrote
      # into the data volume. `pg_basebackup` opens a physical replication
      # connection, and in pg_hba.conf the keyword `all` in the database
      # column does not match one -- only the literal `replication` does. The
      # generated file has that keyword for the Unix socket and 127.0.0.1
      # only, and it is written ONCE on a fresh volume, so there is no way to
      # add the rule from the environment. See deploy/postgres/pg_hba.conf,
      # which reproduces every line initdb produces and adds exactly one.
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      # Archiving. `archive_mode` is a START-time setting, so an existing
      # deployment needs a restart (`docker compose up -d postgres`) -- the
      # same asymmetry `shared_preload_libraries` above has.
      #
      # ⚠️ NOT a knob risk `م-8` covers, and the distinction is not a
      # loophole: 2.1 sets shared_buffers/work_mem/effective_cache_size/
      # max_wal_size, which make the server FASTER and therefore make a
      # baseline measured after them unable to prove anything. Archiving
      # makes it slower, and it is what production runs with. A 0.5 baseline
      # taken on a cluster that does not archive its WAL is a baseline of a
      # deployment nobody would operate. `tests/unit/test_ops_slow_queries.py
      # ::test_the_tuning_stays_out_of_the_command_that_carries_the_instrument`
      # still guards the four knobs that matter -- since 2.1 it guards that
      # they stay REVERSIBLE rather than absent, which is the distinction
      # that step turned on.
      - -c
      - archive_mode=on
      #
      # ⚠️ INVOKED THROUGH `sh`, NOT EXECUTED. A bind mount carries the HOST's
      # permission bits, and a checkout that did not preserve the executable
      # bit (a Windows share, a `umask`, an archive export -- this repository
      # is developed on WSL) turns archiving off with a message that names
      # neither the mount nor the mode:
      #
      #     sh: 1: /usr/local/bin/archive_wal.sh: Permission denied
      #     FATAL:  archive command failed with exit code 126
      #
      # MEASURED here on the first run. Worse than the failure is what the
      # instrument said about it: after SIX consecutive failures,
      # `pg_stat_archiver` still read `archived_count=0, failed_count=0,
      # last_failed_wal=NULL` -- the exec failure never reaches the counter an
      # operator or an exporter would watch. That is why `app.ops.backup
      # status` reports `archived_count`/`last_archived_wal` and the spool
      # depth rather than `failed_count`, and why this line names `sh`: the
      # same precedent `nginx-certs` (`entrypoint: ["/bin/sh", "/gen-cert.sh"]`)
      # and `runpod/bootstrap.sh` (`bash /app/deploy/...`) already follow for
      # every mode-0644 script in this repository.
      - -c
      - archive_command=/bin/sh /usr/local/bin/archive_wal.sh %p %f
      # The RPO knob, and the only number here an operator should expect to
      # change. A segment is archived when it FILLS; on a quiet cluster the
      # last one can sit unarchived indefinitely, so this forces a switch --
      # bounding data loss at five minutes and costing one 16MB segment per
      # five minutes of idleness (compressed to a few KB by the shipper,
      # which is why the cost is bounded in object storage and not here).
      - -c
      - archive_timeout=300
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aizzak}
      # Consumed by deploy/postgres/initdb/10-roles.sh, which creates the
      # four application roles. Role creation needs cluster privilege that
      # aizzak_owner deliberately does not hold, so it belongs to init, not
      # to a migration and not to app.ops.provision (01 §6).
      AIZZAK_OWNER_PASSWORD: ${AIZZAK_OWNER_PASSWORD:?set AIZZAK_OWNER_PASSWORD in .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set APP_RW_PASSWORD in .env}
      OUTBOX_RELAY_PASSWORD: ${OUTBOX_RELAY_PASSWORD:?set OUTBOX_RELAY_PASSWORD in .env}
      # retention_sweeper (P1-5, p1-hardening-plan.md §3 step 8): SELECT/DELETE
      # on the three unbounded platform ledgers, nothing else. No standing
      # service authenticates as this role -- `python -m app.ops.retention` is
      # a manually-invoked one-shot tool (see 08-local-runbook.md §4.3) -- but
      # `app.ops.provision`'s own `_require_roles` check (run by the `migrate`
      # service below) fails fast on it BEFORE any migration if the role does
      # not already exist, so it must be created here regardless.
      RETENTION_SWEEPER_PASSWORD: ${RETENTION_SWEEPER_PASSWORD:?set RETENTION_SWEEPER_PASSWORD in .env}
      # metrics_reader (P1-3, p1-hardening-plan.md §3 step 10): SELECT-only on
      # platform.outbox, nothing else -- the `/metrics` endpoint's own read.
      # `app_rw` is INSERT-only there (provision.py), so this is a role of its
      # own rather than a widened `app_rw` grant. UNLIKE retention_sweeper,
      # this IS a standing consumer -- the `app` service below, every scrape --
      # the same footing `outbox_relay` stands on.
      METRICS_READER_PASSWORD: ${METRICS_READER_PASSWORD:?set METRICS_READER_PASSWORD in .env}
      # transit_rotator (P1-9, p1-hardening-plan.md §3 step 12): SELECT plus
      # column-scoped UPDATE (the ciphertext column alone) on the three
      # Transit-ciphertext-bearing tables, nothing else. No standing service
      # authenticates as this role -- `python -m app.ops.rotate_transit` is a
      # manually-invoked one-shot tool, the `retention_sweeper` footing -- but
      # `app.ops.provision`'s own `_require_roles` check fails fast on it
      # BEFORE any migration if the role does not already exist, so it must
      # be created here regardless.
      TRANSIT_ROTATOR_PASSWORD: ${TRANSIT_ROTATOR_PASSWORD:?set TRANSIT_ROTATOR_PASSWORD in .env}
      # workspace_purger (BE-ADM-014): SELECT/DELETE on every tenant table a
      # purged workspace's content lives in, plus column-scoped SELECT/UPDATE
      # on workspace.workspaces/workspace.users and SELECT/INSERT on
      # platform.admin_audit_log. No standing service authenticates as this
      # role -- `python -m app.ops.purge` is a manually-invoked one-shot tool,
      # the `retention_sweeper`/`transit_rotator` footing -- but
      # `app.ops.provision`'s own `_require_roles` check fails fast on it
      # BEFORE any migration if the role does not already exist, so it must
      # be created here regardless.
      WORKSPACE_PURGER_PASSWORD: ${WORKSPACE_PURGER_PASSWORD:?set WORKSPACE_PURGER_PASSWORD in .env}
      # backup_operator (capacity step 2.5): the eighth role, and the only one
      # holding REPLICATION and BYPASSRLS. `python -m app.ops.backup` is a
      # one-shot tool on the `retention_sweeper` footing, but the `wal-shipper`
      # service below IS standing -- it authenticates as nothing, though: it
      # only moves files from a volume to object storage. UNLIKE the six roles
      # above, this one is NOT in `app.ops.provision._require_roles`: no
      # migration names it in a policy, so its absence fails the backup tool
      # (by name, in `preflight`) and never a migration.
      BACKUP_OPERATOR_PASSWORD: ${BACKUP_OPERATOR_PASSWORD:?set BACKUP_OPERATOR_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
      # Read-only: the server reads its own auth rules, and a Postgres that
      # could rewrite them is a Postgres that can grant itself anything.
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # Read-only for the same reason pg_hba.conf is, and mounted
      # UNCONDITIONALLY: the `م-8` switch above changes which file the server
      # READS, not whether this one is present. A switch that removed the
      # mount would be a second thing to remember.
      - ./deploy/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./deploy/postgres/archive_wal.sh:/usr/local/bin/archive_wal.sh:ro
      # The spool `archive_command` writes into and `wal-shipper` drains. A
      # named volume rather than a bind: these segments are the difference
      # between "restore to last night" and "restore to 60 seconds ago", and
      # a bind mount would put them on whatever the host happens to offer.
      - wal-archive:/var/lib/postgresql/wal-archive
    ports:
      - "127.0.0.1:${HOST_PORT_POSTGRES:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-aizzak}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    <<: *app-logging

  # ⚠️ THE POOLER IS CONFIGURED ENTIRELY FROM THE ENVIRONMENT BELOW. There is
  # no pgbouncer.ini in this repository, and that is deliberate: edoburu's
  # entrypoint GENERATES /etc/pgbouncer/pgbouncer.ini from these variables at
  # container start, so a checked-in file would either be ignored (confusing)
  # or override them (a second source of truth). 7.3 deleted the 0-byte
  # `deploy/pgbouncer/pgbouncer.ini` that had sat here since Phase 1 --
  # referenced by nothing, mounted nowhere, and reading for all the world
  # like the pooler's configuration while containing none of it.
  #
  # ⭐ STEP 2.2's "VERIFY FIRST" IS VERIFIED, AND IT COMES OUT IN THIS
  # ARRANGEMENT'S FAVOUR. The plan warned that the image "does not necessarily
  # pass every key" and that the fallback would be a mounted ini -- "a
  # deliberate reversal of the comment above, documented there". No reversal
  # was needed: the entrypoint's template carries `${MAX_DB_CONNECTIONS:+...}`,
  # `${RESERVE_POOL_SIZE:+...}` and `${RESERVE_POOL_TIMEOUT:+...}` lines, and
  # MEASURED in the generated file, all three landed. The comment stands.
  #
  # ⚠️ BUT THE GENERATION IS `if [ ! -f pgbouncer.ini ]`, AND THE FILE LIVES
  # IN THE CONTAINER'S WRITABLE LAYER (this service mounts nothing). So
  # `docker compose restart pgbouncer` -- the obvious way to apply a change to
  # the block below -- reuses the container, finds the OLD ini, and starts the
  # pooler on it. Nothing errors and `SHOW CONFIG` reports the stale values.
  # Applying anything here is `docker compose up -d pgbouncer`, which
  # RECREATES. Worth knowing before reading a measurement off this pooler.
  pgbouncer:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    # ⭐ THE HALF OF STEP 3.1 THAT DID NOT REACH THIS SERVICE, AND THE HALF
    # STEP 2.2 CANNOT SHIP WITHOUT. Docker's inherited soft `nofile` is 1024;
    # every client connection, every server connection and every listener is
    # one descriptor. See `MAX_CLIENT_CONN` below for the measurement -- the
    # short version is that at 1024 the ceiling does not refuse, it accepts
    # into the kernel's backlog and never answers. The numbers are 3.1's own,
    # written rather than inherited for the same reason `app`, `qdrant` and
    # `k6` carry them.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    image: edoburu/pgbouncer:v1.23.1-p2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Transaction pooling (D-21). OPS-02's other half -- asyncpg's
      # statement_cache_size=0 -- is enforced in create_engine's connect
      # args for EVERY engine, so it holds for the app, the workers, the
      # relay and the migrator alike.
      DB_HOST: postgres
      DB_PORT: "5432"
      # This image listens on 5432 by default; 08 §2 fixes the pooler at
      # 6432 and every DATABASE_URL in this file names that port.
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      # ── capacity step 2.2: the pooler's capacity, and its refusals ────────
      # 500 -> 2000. It was not arbitrary slack: MEASURED client demand is
      # 420 of the old 500 (test_connection_budget), because 3.4 put three
      # `app` replicas x 4 gunicorn siblings behind it. 84% of a ceiling is
      # not a ceiling, and the next `WEB_CONCURRENCY` bump crosses it.
      #
      # ⚠️ AND THIS NUMBER IS A LIE WITHOUT THE `ulimits:` BLOCK ABOVE --
      # MEASURED, AND IT IS STEP 3.1'S FINDING FOR THE THIRD TIME. PgBouncer
      # says so itself, in a LOG line at start-up that nothing reads:
      #
      #   LOG kernel file descriptor limit: 1024 (hard: 1048576);
      #       max_client_conn: 2000, max expected fd use: 2012
      #
      # 3.1 found Docker's inherited soft `nofile` of 1024 binding on `app`,
      # `qdrant` and `k6` and wrote the number down on each. The pooler was
      # missed, and it was missed BECAUSE it fit: at 500 the same line read
      # "max expected fd use: 512". 2.2 is the step that walks it over.
      #
      # ⭐ WHAT HAPPENS AT THE WALL IS THE OPPOSITE OF WHAT THIS STEP IS FOR.
      # MEASURED against a pooler left at 1024: 1,400 client sockets all
      # connected -- `connect()` returned in 2.4 ms, zero refusals -- because
      # the KERNEL completes the handshake into the listen backlog. PgBouncer
      # logged `ERROR accept() failed: No file descriptors available` and a
      # fresh client then sat with a successful connection and NO SERVER BYTE
      # for as long as it waited. Not a refusal: a hang, one layer BELOW
      # every timeout on this service, where the pooler does not know the
      # client exists and `query_wait_timeout` cannot apply. And the operator
      # loses the diagnosis with it -- `SHOW CLIENTS` on the admin console
      # needs an fd too, and timed out.
      MAX_CLIENT_CONN: "2000"
      # 25 -> 100. `ح-3` by the number: MEASURED `app_rw` demand is 368 client
      # slots against 25 server slots, so the pooler was serialising the
      # platform's whole write path through a quarter of one replica's worth
      # of concurrency.
      #
      # ⚠️ AND 2.3'S RECORDED WARNING ABOUT THIS CHANGE HAS EXPIRED. It read:
      # "raising DEFAULT_POOL_SIZE to 100 alone moves nothing -- app_rw demand
      # is 68, min(68, 100) = 68, so the constraint just moves into the app".
      # That was measured on a ONE-REPLICA stack. 3.4 made it three replicas
      # x 4 siblings and demand is 368, so `min(368, 100) = 100`: the pooler
      # is still the binding constraint after this change, and the change is
      # worth four times what it was worth when that sentence was written.
      DEFAULT_POOL_SIZE: "100"
      # Peak absorption, ON TOP of default_pool_size rather than inside it --
      # so the real per-pool maximum is 110 and that is the number the
      # connection budget adds up (test_connection_budget._server_backends).
      # 3s rather than the plan's silence: this is the queue-jump for a burst,
      # and a reserve slot handed out after a long wait is just a slower
      # version of the wait.
      RESERVE_POOL_SIZE: "10"
      RESERVE_POOL_TIMEOUT: "3"
      # ⚠️ MEASURED: THIS IS PER DATABASE, NOT A TOTAL -- WHICH IS THE ONE
      # THING STEP 2.2 ASKS IT TO BE ("a total ceiling that stops the pools'
      # sum exceeding max_connections however many roles there are"). It does
      # bound roles: `max_db_connections` ignores the user. It does not bound
      # DATABASES, and `[databases]` here is the `*` wildcard, so the dbname
      # is the CLIENT's choice and each distinct one gets its own autodb with
      # its own copy of this ceiling. MEASURED at `MAX_DB_CONNECTIONS=2`: two
      # backends held on `aizzak` and two more on `aizzak_test` at the same
      # instant -- four, for a ceiling written as two.
      #
      # 297 is still the right number for the database that matters:
      # `max_connections` (300, step 2.1) minus `superuser_reserved_connections`
      # (3, measured on the running server) -- the plan's 2.3 note has this
      # arithmetic and 2.2's own text gives no number at all. The residual
      # exposure is recorded as a debt rather than closed here: nothing in
      # this repository reaches another database THROUGH the pooler (every
      # `aizzak_test` DSN in `.env.test.example` and `tests/integration/`
      # names port 15432, which is Postgres directly), and the fix -- naming
      # `aizzak` explicitly instead of `*` -- needs the mounted-ini fallback
      # this service deliberately does not use. `max_connections` is the
      # backstop under it, and it refuses loudly.
      MAX_DB_CONNECTIONS: "297"
      AUTH_TYPE: scram-sha-256
      # Named prepared statements are disabled application-side; leaving
      # this at 0 keeps pgbouncer from pretending otherwise.
      MAX_PREPARED_STATEMENTS: "0"
      # ── The pooler's own ceilings (capacity step 2.6) ──────────────────
      # The image's generated ini files these under a header it writes
      # itself: "# Dangerous timeouts". They are dangerous unset, which is
      # how they were: every one of the three below was at a default nobody
      # in this repository had chosen.
      #
      # These are BACKSTOPS, not the platform's budget. Every client that
      # goes through this pooler carries its own, tighter, per-path bound
      # (`DatabaseSettings`' four 2.6 fields, installed by `create_engine`);
      # what fires here is a client that has none -- a `psql`, an `app.ops.*`
      # tool, a service written next year. That ordering matters because a
      # timeout that fires HERE tells the operator almost nothing: measured
      # against a deliberately lowered ceiling, PgBouncer ends the wait by
      # closing the client socket, and asyncpg reports "connection was closed
      # in the middle of operation" -- true, and useless as a diagnosis.
      # `tests/unit/test_connection_timeouts.py` guards the ordering.
      #
      # `query_wait_timeout` is the ONE phase no client-side bound covers:
      # time spent waiting for a free SERVER slot, before any backend has
      # seen the query. `statement_timeout` cannot bound it -- measured, with
      # all 25 `app_rw` slots busy, a 26th client carrying a 5s statement
      # budget waited 7.85s and then SUCCEEDED. Nothing else cuts that wait
      # short of the edge's own `proxy_read_timeout` (300s, sized for SSE),
      # so 120s of it is a request that is gone twice over. 20s is still far
      # above every per-path EXECUTION budget, so this never pre-empts a
      # guard that could name the cause better.
      #
      # ⚠️ STEP 2.2 NAMES 15 AND THIS STAYS 20, DELIBERATELY. 2.6 chose this
      # number against the measured per-path budgets it was installing on the
      # other side of the pooler; 2.2's 15 was written before any of those
      # existed and nothing measures in its favour. What 2.2 asked this knob
      # for IS delivered and was MEASURED at a deliberately lowered ceiling: a
      # saturated pool errored at 5.15s against `QUERY_WAIT_TIMEOUT=5` -- fast,
      # not a hang. ⚠️ Fast but NOT loud, which is the half 2.6 already
      # recorded: the error the client sees is asyncpg's "connection was closed
      # in the middle of operation", because the way PgBouncer ends the wait is
      # by closing the socket. True, and useless as a diagnosis. The loudness
      # has to come from `aizzak_db_pool_*` and the pooler exporter, not here.
      QUERY_WAIT_TIMEOUT: "20"
      # `client_idle_timeout` was `0` -- disabled -- which is why step 2.6's
      # own wording ("`pool_recycle` shorter than PgBouncer's idle timeout")
      # named a timeout that did not exist. Now it does, and `pool_recycle_s`
      # (900) is half of it by construction. It also closes a real leak on
      # `MAX_CLIENT_CONN`: an abandoned client session held one of the 500
      # forever.
      CLIENT_IDLE_TIMEOUT: "1800"
      # The backstop for a connection held open with a transaction on it and
      # nothing running -- the pooler-wide twin of
      # `idle_in_transaction_session_timeout`. Above the background path's
      # 60s so a worker's own bound is what fires first.
      IDLE_TRANSACTION_TIMEOUT: "120"
      # ⚠️ `query_timeout` stays OFF (0), deliberately. It would duplicate
      # `statement_timeout` one layer higher and worse: PgBouncer kills the
      # client connection, Postgres cancels the statement and returns
      # SQLSTATE 57014 that every adapter's `_translate` already understands.
      ADMIN_USERS: ${POSTGRES_SUPERUSER:-postgres}
      AUTH_USER: ${POSTGRES_SUPERUSER:-postgres}
      AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$$1
      DB_USER: ${POSTGRES_SUPERUSER:-postgres}
      DB_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    ports:
      - "127.0.0.1:${HOST_PORT_PGBOUNCER:-16432}:6432"
    # ⚠️ IT CROSSES THE LINK (ت‑3, docs/operational-findings.md §3) -- this is
    # the `nginx` healthcheck's reasoning applied to the pooler, and it is the
    # difference that makes the edge below worth upgrading. `pg_isready -p
    # 6432` was the obvious candidate and was REJECTED after measuring it: it
    # reports "accepting connections" the moment pgbouncer's own listener is
    # up, which is barely more than the `service_started` it would replace.
    # A pooler that accepts clients while it cannot reach Postgres is the
    # exact 502-shaped failure §3.75's bug #10 taught this file to probe for,
    # so this opens a REAL server connection through the pool and runs
    # `select 1` on it.
    #
    # The credential is the pooler's OWN `AUTH_USER`/`DB_PASSWORD`, read from
    # this container's environment at check time -- `$$` keeps Compose from
    # interpolating it, so nothing sensitive enters the rendered config that
    # `docker compose config` prints. Only the database NAME is interpolated
    # here, and it is not a secret.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$$DB_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$DB_USER\" -d ${POSTGRES_DB:-aizzak} -tAc 'select 1' > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    <<: *app-logging

  # ── ح-10 · ق-4 (capacity 5.2): TWO Redis servers, because one heap cannot
  # hold two eviction contracts. ───────────────────────────────────────────
  #
  # Until this step there was ONE `redis` at `maxmemory 0` (MEASURED, live:
  # `maxmemory:0`, `maxmemory_policy:noeviction`), which is not a safety
  # property -- it is the ABSENCE of a bound. `noeviction` only means anything
  # once a ceiling exists to refuse writes at; with no ceiling the process
  # grows until the 5 GB cgroup limit kills it, and the streams, the WS
  # registry and the rate limiter go with it. The one alternative available on
  # a single instance -- `allkeys-lru` -- is worse: it makes the SAME heap
  # discard stream entries and connection records to make room for cached
  # vectors, silently. Neither option is acceptable, and that is precisely
  # what ق-4 decided by recommending two servers.
  #
  # THE ROW ABOVE DIVIDED, IT DID NOT DOUBLE (3.4's own instruction, kept):
  # 2.0 vCPU / 5g became 1.0/3g + 1.0/2g.
  redis-stream:
    deploy:
      resources:
        limits:
          # 3g of cgroup against `maxmemory 2gb`: Redis's RSS runs above its
          # own accounting (allocator fragmentation, replication/AOF buffers,
          # the COW pages a BGREWRITEAOF fork touches), so a cgroup equal to
          # `maxmemory` turns a rewrite into an OOM kill. The 1.5x is the
          # headroom, not slack.
          cpus: "1.0"
          memory: 3g
    image: redis:7
    # `--maxmemory 2gb` is DERIVED, not picked. Live measurement of this
    # stack's own entries: `stream.knowledge` holds 433 entries in 298,664
    # bytes (~690 B each) and `stream.files`/`stream.media` run ~1,000 B each
    # at real payloads. The declared worst case is four primary streams at
    # STREAM_MAXLEN=100000 (~400 MB), plus the 1.2 limiter's sliding windows
    # at the §0 peak (500 users x 120 + 200 workspaces x 2,400 = ~540k sorted
    # -set members, ~40-55 MB), plus 1,500 WS registry entries, plus consumer
    # -group PELs. ~500 MB of declared ceiling; 2 GB is 4x that.
    #
    # ⚠️ AND THE DLQs ARE NOT IN THAT 400 MB, BY DESIGN: `dead_letter`
    # (`infrastructure/messaging/redis_streams.py`) issues its XADD with NO
    # `maxlen` -- quarantined events must never be dropped to make room. So the
    # one thing on this instance that can grow without any bound at all is the
    # thing an incident produces. On `noeviction` a full instance refuses
    # WRITES, which would take the WS registry and the rate limiter down with
    # the DLQ storm that filled it. That is what `AizzakRedisStreamMemoryHigh`
    # (80%, deploy/prometheus/alerts.yml) is for, and why the ceiling here is
    # generous rather than tight.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      # The SAME volume the pre-5.2 `redis` service held. Keeping the name is
      # not cosmetic: renaming it would orphan the AOF and every stream in it
      # behind a service that no longer mounts it -- data loss dressed as a
      # rename.
      - redis-data:/data
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    <<: *app-logging

  redis-cache:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    image: redis:7
    # `--maxmemory 1gb`, and the plan's own `2gb` is the number this step
    # declines. The two ceilings are not the same kind of number: on the
    # stream instance a full heap REFUSES WRITES, on this one it evicts a cold
    # key and the caller recomputes. So the derived number belongs to the
    # instance that fails hard, and this one gets what its working set needs
    # plus an order of magnitude. That working set is small and countable: the
    # embedding cache at §0's 40 queries/s with a 600s TTL and zero repeats is
    # 24,000 live entries x (1,536 B vector + ~80 B overhead) ~= 39 MB
    # (`caching_embedding.py` packs float32, not JSON, for this reason), the
    # principal cache is 500 users x a few hundred bytes, and Exa is not wired
    # at all. 1 GB is ~25x the whole of it; 2 GB would buy nothing measurable
    # and would have to come out of the instance that cannot afford it.
    #
    # ⚠️ NO PERSISTENCE, AND THAT IS THE POINT. `--save ""` plus
    # `--appendonly no` means a restart comes back EMPTY. An empty cache is
    # correct -- every entry here is reconstructible from its source -- while a
    # restored one is a heap of `allkeys-lru` survivors chosen by nothing. It
    # also removes the fork/COW spike that `vm.overcommit_memory=1` (3.5)
    # exists to survive, on the one instance that has no reason to fork.
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "1gb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS_CACHE:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    <<: *app-logging

  minio:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    # Isolated by construction: its own volume and its own root credentials.
    # The opt-in bucket-scoped live-test account is provisioned by
    # `minio-bootstrap`; it never reuses the root identity.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${HOST_PORT_MINIO:-19000}:9000"
      - "127.0.0.1:${HOST_PORT_MINIO_CONSOLE:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    <<: *app-logging

  qdrant:
    deploy:
      resources:
        limits:
          # §6 said 10 GB and annotated it "awaiting 4.4's measurement".
          # 4.4 measured it, and the estimate is now a number -- but the
          # FIRST number it produced was the wrong one, and the difference
          # between the two is the whole reason this comment is long.
          #
          # On the full 200-workspace seed (1,000,771 points) this process
          # first held **4.36 GiB resident** by its own allocator, with the
          # container charged up to **6.36 GiB**. That was not the layout's
          # cost: all 202 collections were sitting in Qdrant's `grey` status
          # -- optimizations PENDING and not started -- carrying 1,616
          # segments (eight per collection) that no one had ever merged.
          # Qdrant starts a pending optimization on the next UPDATE to the
          # collection, not on load, so a quiet tenant stays un-merged
          # forever and the state SURVIVES a restart.
          #
          # After `python -m app.ops.qdrant_capacity optimize` (one no-op
          # re-upsert per collection, which is all it takes to trigger them)
          # the same million points hold **2.0-2.4 GiB resident** with the
          # container charged **3.84 GiB**, in **411 segments** instead of
          # 1,616. The pending state was costing **~2 GiB of RAM and 1,205
          # segments**, and it was costing it invisibly.
          #
          # 8 GB therefore keeps ~52% headroom over the measured working
          # peak. Two things follow and neither is optional: the LARGEST
          # consumer in this file is worth re-measuring after any change to
          # the corpus size, and a fleet that is never written to must be
          # swept with `optimize` or it silently drifts back to the first
          # number. Scalar quantization was NOT bought: the plan makes it
          # conditional on measured memory pressure and 3.84 of 8 GB is not
          # pressure -- it would trade recall for headroom this file already
          # has.
          cpus: "3.0"
          memory: 8g
    image: qdrant/qdrant:v1.13.4
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${HOST_PORT_QDRANT:-16333}:6333"
    # خطوة السعة 0.1 — **عُطلٌ مُقاسٌ لا احتياطٌ نظريّ.** المستأجرُ الواحد
    # مجموعةٌ مستقلّة (`kn-<workspace_id>`)، وكلُّ مجموعةٍ تفتح واصفاتِ
    # ملفّاتٍ لأجزاء RocksDB الخاصّة بها. والحدُّ الليّن داخل هذه الحاوية
    # كان **1024** (الافتراضُ الموروث عن Docker)، فسقطت أداةُ البذر عند
    # المجموعة **السابعة** بـ`Too many open files (os error 24)` — أي أنّ
    # المنصّة لم تكن تحتمل مئتَي مساحة عمل، وهو هدفُ `§0` نفسُه، ولا كان
    # لأحدٍ أن يعرف ذلك قبل أوّلِ محاولةِ استضافتها. الحدُّ الصلبُ كان
    # 1,048,576 أصلاً، فالرفعُ لا يطلب امتيازاً جديداً.
    #
    # 65536 لا «غير محدود»: توثيقُ Qdrant نفسُه يوصي بهذا المقدار، وحدٌّ
    # مرتفعٌ **معلومٌ** يُبقي الاستنفادَ خطأً يُقرأ بدل أن يُصبح استنزافاً
    # صامتاً لجدول الواصفات على المضيف.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    # ت‑3 (docs/operational-findings.md §3). `/readyz`, not `/livez`: the
    # first means "every shard can serve", the second only "the process is
    # up" -- and it is readiness the `depends_on` edges below now gate on.
    #
    # ⚠️ THE SHAPE IS FORCED BY THE IMAGE, not chosen. `qdrant/qdrant:v1.13.4`
    # ships neither `curl` nor `wget` (measured), so the probe is bash's own
    # `/dev/tcp` speaking one line of HTTP. `CMD` + explicit `bash`, never
    # `CMD-SHELL`: that would run `/bin/sh`, and `/dev/tcp` is a bash feature
    # -- a dash-backed `sh` fails it every time, which would read as an
    # unhealthy Qdrant rather than as a broken probe.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    <<: *app-logging

  # The central embedding service (2.10): loads
  # sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 ONCE and
  # serves POST /embed + GET /health over a small internal HTTP API
  # (services/embedding/app.py). INTERNAL ONLY -- `expose`, not `ports`: it
  # is never published to the host and never enters an nginx upstream, the
  # same trust boundary as Postgres/Redis/Qdrant above (tenant text crosses
  # the internal Docker network to reach it, never the public one).
  #
  # ── THREE REPLICAS BEHIND `embedding-lb` (capacity 4.1 + 4.2) ────────────
  # Scaled by REPLICAS, never by `--workers` (the Dockerfile's `CMD` comment:
  # one model load per process). Nothing reaches this name directly any more
  # except `embedding-lb`; see `EMBEDDING_SERVICE_URL` in `x-app-env` above
  # for why, and for the kill switch back to one replica.
  embedding:
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          # ⚠️ 2g → 1280m (1.25 GiB), and it is a MEASUREMENT, not a trim to
          # make three replicas fit. Sampled on this stack under saturation
          # (8 concurrent `/embed` calls, batches of 8 realistic Arabic
          # chunks):
          #
          #     381.9 MiB  resident, idle, model loaded
          #     484.1 MiB  under load, early in a run
          #     716.3 MiB  under load, after ~200 requests served
          #
          # The third number is the one this cap is set against (1.79x it),
          # and the SHAPE of those three is why it is not 1g: resident size
          # rises with requests served and then flattens -- allocator arenas,
          # not a leak that would eventually reach any ceiling -- so a cap
          # chosen from an early sample is a cap that fires an hour in. The
          # long-soak number is still owed (د-20's soak is where it comes
          # from); raising `EMB_BATCH` or `EMB_MAX_SEQ_LEN` means re-measuring
          # this, not assuming it.
          #
          # It is ALSO what keeps 4.1 inside the ledger rather than over it:
          # three replicas at 2g would put the standing total at 58.62 GB
          # against the 57.60 GB that 08 §2-ز's headroom rule allows on §6's
          # reference host, and `tests/unit/test_resource_budget.py` would
          # (correctly) refuse it.
          memory: 1280m
    image: aizzak/embedding:${EMBEDDING_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/embedding/Dockerfile
    environment:
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_DIM: "384"
      EMB_BATCH: "8"
      # The token at which the model stops reading a text. Stated here, not
      # left to the checkpoint: `paraphrase-multilingual-MiniLM-L12-v2` ships
      # `sentence_bert_config.json: max_seq_length = 128` while its
      # `config.json` reaches 512, so an unset value embeds a QUARTER of a
      # full-size chunk and silently discards the rest (measured: 79% of a
      # 354-word Arabic chunk never reached its vector). Must stay equal to
      # the adapter-side `EmbeddingServiceSettings.embedding_max_input_tokens`
      # -- unlike the model name, a drift between them raises nothing; check
      # it against `GET /health`, which reports the value in force.
      # ⚠️ Changing this invalidates every vector already indexed -- and since
      # capacity 4.5 that is a PROCEDURE rather than an accident: this value is
      # one of the three the corpus name fingerprints, so a deployment that
      # moves it reads and writes `kn-<workspace_id>-<new revision>` and can
      # reach no vector the old ceiling produced. Run
      # `python -m app.ops.embedding_migration` (build, verify, deploy, verify,
      # drop) around the change; 08 §4.17 is the whole sequence. Skipping it
      # costs no error and no data -- retrieval simply stops seeing the corpus,
      # and `AizzakVectorShadowWrites` is the only thing that says so.
      EMB_MAX_SEQ_LEN: "512"
      # ── The thread pin (capacity 4.1) ─────────────────────────────────
      # ⚠️ WITHOUT THESE THE FLEET LOSES A THIRD OF ITSELF, and torch picks
      # the wrong number with no way to see it: MEASURED inside this
      # container, it sized its intra-op pool from the HOST's core count and
      # chose **5 threads against this service's 1.0-vCPU quota** -- five
      # OpenMP workers sharing one core's worth of scheduler share, three
      # times over.
      #
      # MEASURED back to back (8 concurrent `/embed`, batches of 8 realistic
      # Arabic chunks, requests/second):
      #
      #                    one replica      three replicas
      #     unpinned       0.55 · 0.56      1.81 · 0.89
      #     pinned         1.05 · 1.05      2.72 · 2.54 · 2.87
      #
      # ⭐ AND THE SECOND ROW OF THE UNPINNED COLUMN IS THE REAL ARGUMENT:
      # two identical runs of the same unpinned fleet answered 1.81 and 0.89.
      # A fleet whose throughput halves between runs is not slow, it is
      # UNPREDICTABLE -- fifteen OpenMP threads contending for five physical
      # cores, with barrier waits burning the very quota they are waiting
      # for. The pinned column repeats to within 6%.
      #
      # TWO variables because they are read by two different things at two
      # different times: `OMP_NUM_THREADS` is read by the OpenMP runtime as
      # it initialises, BEFORE any Python code of ours runs, and
      # `EMB_TORCH_THREADS` is what `services/embedding/app.py` passes to
      # `torch.set_num_threads()` before the model loads. Setting only the
      # first leaves torch free to disagree with it; setting only the second
      # leaves the OpenMP pool already built at the wrong size.
      #
      # 1 = the `cpus` limit above. The two numbers move TOGETHER: a replica
      # given 2.0 vCPU wants 2 here, and `GET /health` reports the count that
      # actually took effect so a pin that did not can be seen from outside.
      OMP_NUM_THREADS: "1"
      EMB_TORCH_THREADS: "1"
      # ── Dynamic batching (capacity 4.3) ───────────────────────────────
      # Until 4.3, `model.encode` ran ON this process's event loop, so a
      # replica embedding one text could neither read its next request nor
      # answer its own healthcheck -- and the query path's unit of work was a
      # forward pass of ONE row, the most expensive shape this model has.
      # `_Batcher` moves the encode to a thread and folds whatever queued
      # during it into the next call.
      #
      # ⚠️ THE WINDOW IS THE FLOOR, NOT THE MECHANISM. At the §0 target of 40
      # queries/second over three replicas, 5ms catches roughly 0.07 requests
      # on its own; what fills a batch is the queue that accumulates DURING
      # the previous encode. The window is what a LONE request pays.
      #
      # `0` builds no batcher and restores the pre-4.3 inline path in this
      # same image -- the `م-8` switch, and `GET /health` reports the value in
      # force so a baseline replica is distinguishable from a batching one.
      EMB_BATCH_WINDOW_MS: ${EMB_BATCH_WINDOW_MS:-5}
      # The ceiling on how many texts one coalesced encode may carry: a
      # LATENCY bound, not a throughput knob. `EMB_BATCH` above is the
      # forward-pass width; this is the most work a single caller can end up
      # queued behind, and without it one burst blows the 400ms retrieval
      # budget by way of the mechanism meant to protect it. A single request
      # larger than this is still dispatched whole -- it bounds coalescing,
      # never a caller.
      EMB_MAX_BATCH_TEXTS: ${EMB_MAX_BATCH_TEXTS:-32}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    <<: *app-logging

  # The internal load balancer in front of `embedding` (capacity 4.2). One
  # nginx, one job: spread `/embed` across the three replicas above and write
  # down where each request went.
  #
  # ⭐ WHY A PROCESS AND NOT A CLIENT SETTING. The adapter
  # (`ExternalEmbeddingProvider`) holds a pooled `httpx.AsyncClient`; a pooled
  # connection resolves `embedding` ONCE and stays on that address, so three
  # replicas behind one DNS name are one replica and two spares -- healthy,
  # idle, and indistinguishable from a scale-out that simply did not work.
  # 4.2 names the alternative (`httpx.Limits(max_keepalive_connections=0)`)
  # and this is the other one: the fix lives in ONE place instead of three
  # composition sites, costs no handshake per call, and -- the part that
  # decides it -- logs `$upstream_addr`, which is the only way 4.2's
  # acceptance criterion («سجلّات النسخ الثلاث تُظهر توزّعاً متقارباً») can be
  # checked rather than asserted.
  #
  # INTERNAL ONLY, `expose` not `ports`: it inherits `embedding`'s trust
  # boundary exactly, because it carries the same tenant text.
  embedding-lb:
    deploy:
      resources:
        limits:
          # A proxy for ONE route whose upstream spends ~1 second of CPU per
          # request. Measured shape: 2.87 requests/second across the whole
          # fleet at saturation, 64 KB of response each, and this container
          # sitting at 0.3% CPU and 4.8 MiB while it carried them. 0.5 vCPU is
          # already an order of magnitude more than it can use; 128m is
          # nginx's own footprint plus the 256 KB of proxy buffers
          # `embedding-lb.conf` declares.
          cpus: "0.5"
          memory: 128m
    image: nginx:1.27
    depends_on:
      embedding:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/embedding-lb.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "8080"
    # ⚠️ THIS CHECK CROSSES THE LINK, the 7.3 argument applied to the second
    # proxy in this file: it leaves through nginx's own listener, is resolved
    # and proxied like any `/embed`, and comes back from a real replica. A
    # stale resolver cache, a broken `proxy_pass` or a fleet with no healthy
    # member all surface as an unhealthy BALANCER instead of a silent 502 in
    # the middle of an indexing run.
    #
    # ⚠️ AND ITS CLOCKS ARE NOT THE EDGE'S, because `/health` on this upstream
    # is not answerable while the upstream is working: `model.encode` is
    # synchronous inside an `async` route, so a replica three seconds into a
    # batch answers its own health probe only after finishing. MEASURED on the
    # first day this service ran with three replicas, in this balancer's own
    # access log: ELEVEN `499`s on `/health`, every one of them at 4.99s --
    # the 5s `timeout` of a probe copied from the edge, giving up on a replica
    # that was merely busy.
    #
    # So the timeout is 20s (longer than any batch measured here) and the
    # interval 30s, which still declares a genuinely dead fleet unhealthy
    # within three minutes. A container marked unhealthy for being BUSY is a
    # worse lie than a slow probe -- and it is the lie that would fire in the
    # middle of the indexing run this fleet exists to serve.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 20s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    <<: *app-logging

  # ⚠️ PERSISTENT `file` storage (release-blockers-plan.md §3 step 1), NOT
  # `-dev` mode. `-dev` kept KV, Transit and the AppRole entirely in memory --
  # a restart wiped them, and a regenerated Transit key cannot decrypt
  # ciphertext produced under the old one (permanent tenant-credential loss,
  # `CipherRef`/INV-C2/INV-I1). `deploy/vault/start.sh` REPLACES this image's
  # own entrypoint: it starts `vault server` itself, then drives it through
  # `operator init`/`operator unseal` in the SAME process tree before the
  # healthcheck below can ever see success -- see that script's header for
  # why this can't be done through the stock entrypoint, and for the
  # single-local-host security trade it documents (the unseal key + root
  # token live in the `vault-init` volume, plaintext, `chmod 600`; there is
  # no KMS here to auto-unseal against). NOT acceptable for real production
  # -- see docs/quickstart.md §5 for the upgrade path.
  vault:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    image: hashicorp/vault:1.18
    entrypoint: ["/bin/sh", "/vault/scripts/start.sh"]
    environment:
      # Compose is a multi-container network: the per-service CONTAINER is
      # the isolation boundary, so Vault binds 0.0.0.0 inside its own
      # container exactly like every sibling service in this stack does.
      VAULT_LISTEN_ADDR: 0.0.0.0
    volumes:
      - ./deploy/vault/server.hcl:/vault/config/server.hcl:ro
      - ./deploy/vault/start.sh:/vault/scripts/start.sh:ro
      - vault-data:/vault/data
      - vault-init:/vault/init
    ports:
      - "127.0.0.1:${HOST_PORT_VAULT:-18200}:8200"
    # ⚠️ MEANS "usable", not just "listening" (release-blockers-plan.md §3
    # step 1 requirement 3). `vault status` -- measured live against this
    # exact image (hashicorp/vault:1.18) -- exits 1 while nothing is
    # listening yet, 2 while SEALED (listening, but not usable: exactly the
    # state right after a `restart` before start.sh re-unseals it), and only
    # 0 once unsealed. So a sealed Vault genuinely reports unhealthy here,
    # which is what lets `vault-bootstrap`'s and `app`'s
    # `depends_on: {condition: service_healthy}` keep meaning what the rest
    # of this file assumes. `start_period` covers first-boot `operator init`
    # (a few seconds, measured), not steady-state re-unseal.
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    <<: *app-logging

  # ─────────────────────────── one-shot bootstrap ──────────────────────────
  # Each runs to completion and exits; `app` waits on both exits. Two
  # services rather than one because each uses its own vendor's pinned CLI
  # image -- the alternative was fetching an unversioned binary at boot,
  # which would defeat the point of pinning everything else.
  vault-bootstrap:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      # No default here on purpose: the dev root token no longer exists
      # (persistent Vault -- release-blockers-plan.md §3 step 1). Leave this
      # BLANK -- the normal case -- and bootstrap.sh reads the real root
      # token out of the vault-init volume mounted below, which start.sh
      # wrote there at `operator init` time. Set it only for a manual
      # operator override (e.g. a token minted for this one run).
      VAULT_TOKEN: ${VAULT_TOKEN-}
      AIZZAK_OWNER_PASSWORD: ${AIZZAK_OWNER_PASSWORD}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Pins the AppRole role_id so .env's VAULT_ROLE_ID cannot drift from
      # Vault's. Persistent storage means the role (and its role_id) now
      # SURVIVES a restart on its own; this pin's remaining job is the
      # first-ever boot (nothing to agree with yet) and recovering cleanly
      # if the vault-data volume is ever wiped without also editing .env.
      # role_id is non-secret (05 §2). Unset in a real deployment.
      AIZZAK_APPROLE_ROLE_ID: ${VAULT_ROLE_ID-}
    volumes:
      - ./deploy/vault/bootstrap.sh:/bootstrap.sh:ro
      - ./deploy/vault/app-policy.hcl:/app-policy.hcl:ro
      # Read-only: the root token this container needs to authenticate, but
      # never the unseal key -- bootstrap.sh has no business unsealing Vault.
      - vault-init:/vault-init:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
    <<: *app-logging

  minio-bootstrap:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-workspace-files}
      # Capacity step 2.5: the versioned backup bucket. A SEPARATE bucket, so
      # that whatever empties the file bucket cannot empty its backups too.
      BACKUP_BUCKET: ${BACKUP_BUCKET:-aizzak-backups}
      BACKUP_NONCURRENT_DAYS: ${BACKUP_NONCURRENT_DAYS:-30}
      # The live test harness's bucket + bucket-scoped service account
      # (bootstrap.sh's second half). Default OFF: a deployment must not mint
      # test credentials. A developer turns it on in `.env`.
      MINIO_TEST_ACCOUNT_ENABLED: ${MINIO_TEST_ACCOUNT_ENABLED:-false}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET:-aizzak-test}
      MINIO_TEST_ACCESS_KEY: ${MINIO_TEST_ACCESS_KEY:-aizzak_test}
      MINIO_TEST_SECRET_KEY: ${MINIO_TEST_SECRET_KEY:-aizzak-test-secret}
    volumes:
      - ./deploy/minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
    <<: *app-logging

  # Migrations + grants (01 §6's operational step). Runs as aizzak_owner,
  # DIRECTLY against postgres rather than through pgbouncer: DDL under
  # transaction pooling is a needless hazard, and this is a one-shot process
  # with exactly one connection.
  #
  # `postgres:5432` in the DSN below is now load-bearing rather than merely
  # sensible (capacity 2.9, `ح-18`). `app.ops.provision` holds a SESSION-level
  # advisory lock across the whole run so three replicas cannot race; through
  # PgBouncer in transaction pooling that lock would ride on a server
  # connection handed to another client at the next COMMIT, so it would be
  # held by, and released by, the wrong session -- a lock that reads as a lock
  # and guards nothing. `tests/unit/test_zero_downtime_migrations.py` fails
  # the build if this DSN is ever pointed at the pooler.
  migrate:
    <<: [*app-image, *app-logging]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://aizzak_owner:${AIZZAK_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-aizzak}
      # Capacity 2.9's two waits. They are two numbers and not one because
      # they answer two questions: how long a DDL statement may FREEZE a hot
      # table (every later reader queues behind its lock request -- measured
      # at 6.57s of blocked SELECT with no bound, 2.46s with this one), and
      # how long a second replica may WAIT for the first replica's entire
      # migration run. `MigrationSettings` carries both measurements.
      #
      # The first is deliberately BELOW `DB_STATEMENT_TIMEOUT_MS` (5000): a
      # request blocked behind a migration must be released by the migration
      # giving up, not by its own budget expiring -- one is a deploy that
      # failed loudly, the other is a 500 with no migration in the message.
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-3000}
      PROVISION_LOCK_WAIT_MS: ${PROVISION_LOCK_WAIT_MS:-900000}
    command: ["python", "-m", "app.ops.provision"]
    restart: "no"

  # ─────────────────────────────── app plane ───────────────────────────────
  # ── the host's Ollama, made reachable from the Compose network ───────────
  # WHY THIS EXISTS. Ollama runs as a native WSL systemd service bound to
  # 127.0.0.1:11434. A container has its own network namespace, so its
  # localhost is not the WSL host and it cannot reach that listener directly.
  #
  # This forwarder joins the WSL host namespace (`network_mode: host`) and
  # re-publishes Ollama on the docker0 gateway address that
  # `host.docker.internal` already resolves to.
  # The local WSL `.env` points `OLLAMA_BASE_URL` at this bridge; `app` and
  # every worker consume the same shared environment anchor.
  #
  # `bind=172.17.0.1` is the security-relevant half and is NOT cosmetic: the
  # obvious `TCP-LISTEN:...` on 0.0.0.0 would, under mirrored networking,
  # publish an unauthenticated Ollama to the whole LAN. Bound to the bridge
  # address, only containers on this host can reach it.
  #
  # It LISTENS ON 11435, not 11434, and that is forced rather than chosen:
  # the native WSL listener already owns 11434, so the bridge listens on
  # 11435 and forwards to 11434. The local `.env` therefore points containers
  # at `host.docker.internal:11435`; the live harness reaches native Ollama
  # directly at `127.0.0.1:11434`. The generic Compose fallback remains 11434
  # for hosts where Ollama is reachable there without this WSL bridge.
  ollama-bridge:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    image: alpine/socat:1.8.0.3
    network_mode: host
    command: >-
      TCP-LISTEN:11435,bind=172.17.0.1,fork,reuseaddr
      TCP:127.0.0.1:11434
    # ت‑3 (docs/operational-findings.md §3), and END-TO-END on purpose: it
    # enters the bridge on 11435 and comes back out of the native Ollama on
    # 11434. A socat that is listening while its target is dead forwards
    # nothing, so "the listener is up" (`nc -z`) would report the one state
    # this service has no other way of announcing as healthy.
    #
    # 📌 NOTHING gates on this being healthy, deliberately. `app` and the three
    # workers keep `condition: service_started` on this service (below):
    # Ollama is a NATIVE WSL unit outside Compose's lifecycle, and making the
    # whole stack refuse to boot because a host service is down would trade a
    # visible degradation for an invisible one. Unhealthy here means "LLM
    # calls will fail", surfaced in `docker compose ps` instead of only in a
    # request's error.
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://172.17.0.1:11435/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    <<: *app-logging
    restart: unless-stopped

  app:
    <<: [*app-image, *app-logging, *host-gateway]
    # ⭐ خطوة السعة 3.4 — ثلاثُ نسخٍ × `WEB_CONCURRENCY=4` = اثنتا عشرةَ
    # عمليّة. والرقمان ليسا اختياراً مريحاً بل **سقفُ الدفتر بالضبط**: حارسُ
    # `2.3` يحسب 3 × 4 × (30 عميلاً لـ`app_rw` + 4 لـ`metrics_reader`) + 12
    # للبقيّة = **420 مقعداً من 500** (`MAX_CLIENT_CONN`)، و`WEB_CONCURRENCY=5`
    # تعطي **522** أي فوق السقف. فالخامسةُ ممنوعةٌ حتّى ترفع `2.2` السقف، لا
    # مؤجَّلةٌ بذوق.
    #
    # ⚠️ **و`.env` يهزم هذا الافتراض بصمت.** Compose يحمّل `.env` تلقائيّاً
    # وقيمتُه تتقدّم على `${WEB_CONCURRENCY:-4}` أدناه؛ فمضيفٌ يحمل
    # `WEB_CONCURRENCY=2` في ملفّه يبقى عند ستّ عمليّات ولا شيءَ يقول ذلك.
    # `.env.example` رُفعت معها، والحارسُ يقرأ الملفَّين.
    #
    # ⚠️ **ولا `container_name` ولا `ports:` على هذه الخدمة** — وكلاهما شرطٌ
    # للنسخ: الأوّلُ اسمٌ لا يقبل التكرار، والثاني منفذُ مضيفٍ لا يقبل
    # ثلاثةَ حاجزين. الخدمةُ `expose`-only منذ البداية، والحافّةُ تصلها
    # بالاسم عبر `resolver` لا عبر `upstream` — وهو القرارُ الذي اتُّخذ في
    # `7.1` وأُعيد تأكيدُه في `3.2`، والذي جعل هذه الخطوةَ ممكنةً بلا لمسِ
    # حرفٍ في `deploy/nginx/`.
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    depends_on:
      ollama-bridge:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis-stream:
        condition: service_healthy
      # 5.2 -- `app` is the ONE process that builds a cache (the workers embed
      # chunks, never queries), so it is the one service that carries this
      # edge. Named for the §3.111 reason every edge above it is named: on a
      # full `up -d` the instance boots anyway, and the missing edge only
      # bites `docker compose up -d app` on its own.
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
      # ⚠️ THIS EDGE WAS MISSING, declared as a debt in §3.133 and again in the
      # `x-worker-service` note above ("`app` still carries the `qdrant` half
      # of that same gap; flagged, not fixed here"). It is the §3.111 shape
      # exactly: `QDRANT_URL` has named `qdrant:6333` since Phase 1 and the
      # API's RAG path reads that store, but the pooler-style edge was never
      # declared -- invisible on a full `up -d`, and a crash-loop the moment
      # an operator runs `docker compose up -d app` on its own. Closed here
      # rather than in a later step because ت‑3 is what gave `qdrant` a
      # healthcheck to depend on; adding the edge and the condition it needs
      # in two separate changes would have left one of them meaningless.
      qdrant:
        condition: service_healthy
      vault:
        condition: service_healthy
      # `embedding-lb` and not `embedding` -- see the worker anchor's copy of
      # this note (capacity 4.2).
      embedding-lb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      # app_rw: NOINHERIT, no BYPASSRLS, not a table owner -- the RLS policy
      # is what confines it (01 §3). Through pgbouncer, never port 5432.
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-aizzak}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      # capacity 2.6 -- the REQUEST path's budget, here for the same reason
      # `DB_POOL_SIZE` is: the workers and the relay do not read it. A
      # statement on this path is a person waiting, and `07 §2` gives that
      # person 150ms (read) / 250ms (write); five seconds is already twenty
      # times over, which is why it is the point at which failing is the
      # honest answer rather than a number tuned to anything.
      DB_POOL_TIMEOUT_S: ${DB_POOL_TIMEOUT_S:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-10000}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # P1-3 (p1-hardening-plan.md §3 step 10): `/metrics`'s OWN read of
      # platform.outbox -- app_rw above is INSERT-only there (provision.py),
      # so this is a SEPARATE, SELECT-only role/connection, never a widened
      # app_rw grant. Every gunicorn worker sibling (WEB_CONCURRENCY) queries
      # this independently and gets the identical answer, since it re-reads
      # Postgres fresh on each scrape rather than caching anything in-process
      # (docs/log/3.89.md's whole point).
      METRICS_DATABASE_URL: postgresql+asyncpg://metrics_reader:${METRICS_READER_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-aizzak}
      # Wave 0 step 0.2 (docs/capacity-plan.md). Set HERE and not in the
      # shared `x-app-env` block, deliberately: this switches
      # `prometheus_client` into multiprocess mode for whatever process reads
      # it, and only `app` runs several siblings behind one scrape target. The
      # four workers and the relay expose no HTTP listener at all, so the same
      # variable there would buy mmap files nobody ever reads and a directory
      # that grows for the life of the container.
      #
      # A path under /tmp, never a volume: the files describe THIS container's
      # living processes, and `deploy/gunicorn.conf.py` wipes the directory at
      # arbiter boot precisely so a restart cannot serve the sum of this run
      # and the last one.
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/aizzak-prom}
    expose:
      - "8000"
    # ⭐ خطوة السعة 3.1 — **وهذا هو العطبُ الذي وجده القياس، لا الحافّة.**
    # نصُّ الخطوة يقول إنّ `worker_connections 1024` عند الحافّة هو ما يمنع
    # 1,500 اتصال WS. والمقيس أنّ الحافّةَ حملت الـ1,500 كاملةً وفي يدها
    # فائضٌ (‏309–341 واصفاً لكلّ عامل من 1024، وصفرُ سطرٍ واحدٍ يقول
    # `worker_connections are not enough`). والذي رفض **هذه الخدمة**: عاملُ
    # gunicorn واحدٌ ثابتٌ عند **1024 واصفاً بالضبط** — حدُّه الليّن الموروث
    # عن Docker — وشقيقُه يحمل 946. المُقاس عند عرضِ 2,400 مقبساً: 1,914
    # ترقيةً و335 إعادةَ تعيينٍ و151 مقبساً قُبل ثمّ أُغلق بلا ردّ.
    #
    # ⚠️ **والرفضُ صامتٌ تماماً، وهذا أسوأُ ما فيه:** ‏`ListenOverflows=0`
    # (فطابورُ القبول لم يفض)، ولا سطرَ `Too many open files` في السجلّ، ولا
    # مقياسَ يعدّه. العميلُ يرى إعادةَ تعيين TCP، والحافّةُ تترجمها 502،
    # والتطبيقُ لا يقول شيئاً البتّة.
    #
    # ⭐ **وهذا المستودعُ شخّص هذا العطبَ مرّتَين وأصلحه على طرفَي السلك
    # وترك وسطَه:** ‏`qdrant` أعلاه (سقطت البذرةُ عند المجموعة السابعة)،
    # وخدمةُ k6 أدناه — وتعليقُها يكتب الآليّةَ بالحرف: «‏`peak` يُبقي 1,500
    # اتصال WS مفتوحاً … والحدُّ الليّنُ الموروث 1024 — فالمولّدُ يُسقط الحملَ
    # عند ثُلثَي الهدف تقريباً **ويُلقى اللومُ على المنصّة**». الجملةُ نفسُها
    # صادقةٌ على المنصّة التي تستقبلها، ولم تُرفع هنا.
    #
    # ⚠️ **ولماذا هنا وليس في `deploy/gunicorn.conf.py`:** ‏nginx يرفع حدَّه
    # بنفسه (`worker_rlimit_nofile`) لأنّه يبدأ بصلاحيّة الجذر؛ وgunicorn لا
    # يملك إعداداً مكافئاً. فنصفُ الرقم عند الحافّة في ملفِّ الحافّة، ونصفُه
    # هنا — وعلى مسار RunPod في `minfds` من `supervisord.conf`، إذ لا Compose
    # هناك. ثلاثةُ مواضعَ لرقمٍ واحد، ويحرسها `test_edge_capacity.py`.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    # ── The ACCEPT QUEUE (capacity 3.5) ──────────────────────────────────────
    # `listen(backlog)` is not the backlog. The kernel silently clamps it to
    # `net.core.somaxconn`, and that value is NAMESPACED -- a container carries
    # its own copy, and the host's is never consulted. MEASURED, by connecting
    # until the kernel started dropping and reading `TcpExtListenOverflows` on
    # either side:
    #
    #     somaxconn=4096   listen( 511) queued  512   listen(2048) queued 2049
    #     somaxconn=128    listen( 511) queued  129   listen(2048) queued  129
    #
    # gunicorn asks for 2048 (its default; nothing in this repository states
    # it). The kernel's own default for `somaxconn` has been 4096 only since
    # Linux 5.4 -- before that it was 128, and on such a host the line above
    # says exactly what this listener would become: a queue of 129 for a
    # platform whose §0 target is 1,500 sockets and a x6 login peak, with no
    # log line anywhere, because an overflowing accept queue does not refuse
    # the client. It drops the final ACK and lets the server retransmit its
    # SYN-ACK on the 1s/2s/4s schedule, so the symptom is a latency tail.
    #
    # So the number is WRITTEN rather than inherited -- the same correction 3.1
    # made to `worker_connections` (1024 x host cores, a capacity that changed
    # with the machine) and 3.1 again to `nofile`.
    #
    # ⚠️ AND IT CANNOT GO IN `deploy/host-tuning.sh`. Measured both ways:
    # `docker run --sysctl net.core.somaxconn=1024` is accepted while
    # `--sysctl vm.overcommit_memory=1` is refused outright ("is not allowed"),
    # and `/proc/sys/net/core/` inside a container holds seven entries with
    # `somaxconn` among them. That script sets only what a container cannot.
    #
    # MEASURED at this setting, through the real edge and directly at this
    # listener: 6,000 and 3,000 simultaneous connections respectively, zero
    # ListenOverflows on either, p50 0.5ms and max 5.6ms to establish.
    sysctls:
      net.core.somaxconn: "4096"
    # ⚠️ THE SHUTDOWN WINDOWS WERE NESTED THE WRONG WAY ROUND (capacity 3.3),
    # and this is the half that makes that step's acceptance criterion true.
    # gunicorn's graceful window is 30s -- its own default, so this was already
    # the case before 3.3 made the flag explicit -- and Docker's default stop
    # window is 10s. MEASURED: `docker stop` on a process that ignores SIGTERM
    # took 10.43s, and `docker inspect` on this container reported
    # `StopTimeout=<nil>` because nothing here declared one.
    #
    # So the process that knew what it was still waiting for was given a third
    # of the time of the one that did not, and the SIGKILL always came from
    # Docker. MEASURED consequence with a response in flight: at the graceful
    # deadline the stream ended in a `RemoteProtocolError` rather than an
    # ending; under the 10s outer window that lands on EVERY request still in
    # flight, mid-write, on every `up -d`.
    #
    # 45 = gunicorn's 30 plus margin. The arbiter was measured exiting 30.1-30.3s
    # after SIGTERM in the worst case and 0.45s with nothing in flight, which is
    # what a deploy actually costs: this window is only spent when there is
    # something to wait for. The same number is `stopwaitsecs=45` in
    # `deploy/runpod/supervisord.conf`, whose own default was also 10 (read out
    # of supervisor's source), and `tests/unit/test_gunicorn_flags.py` fails the
    # build if either publisher's outer window drops back below the inner one.
    #
    # ⚠️ Scoped to `app` on purpose. The workers and the relay have their own
    # in-flight semantics (a message half-handled is not a response half-written)
    # and their shutdown budget belongs to Wave 5, not here.
    stop_grace_period: 45s
    # ⭐ `/health/ready`, NOT `/health` — capacity step 7.2, and `api/health.py`
    # had said so since it was written ("readiness here is 'startup done',
    # which is the signal a rolling deploy actually needs") while this line
    # asked for the other one. `/health` is LIVENESS: it answers 200 from a
    # process that has bound its socket and finished nothing else, so a
    # container reported healthy on it may still be seconds away from serving
    # a request -- which is the state this whole step is about.
    #
    # ⚠️ It also means a DRAINING replica reports unhealthy, and that is
    # correct rather than a side effect: `POST /health/drain` flips readiness
    # false precisely to say "stop sending me work". Nothing acts on unhealthy
    # here (`restart:` reacts to exit, not to health), so the effect is that
    # `docker compose ps` tells an operator the truth during a deploy instead
    # of showing three healthy replicas while one of them is leaving.
    #
    # ⚠️ AND IT DOES NOT MAKE THE EDGE ROUTE AROUND ANYTHING. Docker's embedded
    # DNS publishes a container at `running` and does not consult health at all
    # (measured: 6-7s of in-rotation-but-starting), so this probe informs the
    # operator and `deploy/rolling-deploy.sh`, not nginx. See `د-29`.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── memory ──────────────────────────────────────────────────────────────
  # In the DEFAULT stack: `docker compose up -d` boots it with everything
  # else. Measured live, 138 s on an idle stream with RestartCount = 0
  # (docs/log/3.105.md §5-ب), after the stream-topology-plan.md step-1 fix
  # removed the 2 s socket timeout that used to kill every consumer at the
  # 5 s mark of quiet.
  worker-memory:
    <<: [*app-image, *app-logging, *host-gateway, *worker-service]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    environment:
      <<: [*app-env, *worker-env]
      WORKER: memory
      # The shared default, stated rather than inherited silently, because
      # this is the worker it fits best: one handler embeds ONE memory item
      # and upserts one vector -- milliseconds of CPU around two network
      # calls, which is the exact shape bounded concurrency is free on.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY_MEMORY:-4}
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "memory"]

  # ── knowledge ───────────────────────────────────────────────────────────
  # In the DEFAULT stack too, and this is the change docs/log/3.105.md §5-ج
  # earned: first containerised boot in the project's history, ≥ 5 minutes
  # idle with RestartCount = 0. Adapter-complete since steps 15-16 of
  # docs/deferred-adapters-plan.md (`build_knowledge_worker_from_env` binds
  # MinIO out of Vault and composes WorkerDocumentContentResolver).
  #
  # Until it booted by default, `POST /files` uploaded but never INDEXED on a
  # plain `up -d` -- the whole RAG path silently ended at the outbox.
  worker-knowledge:
    <<: [*app-image, *app-logging, *host-gateway, *worker-service]
    environment:
      <<: [*app-env, *worker-env]
      WORKER: knowledge
      # The SECOND service to raise the tolerance, for the reason `worker-
      # media` raises it and on the same arithmetic. `F-1`
      # (rag-summarization-fix-plan.md) gave the summarisation map-reduce its
      # own `Limits.summarize_timeout_s` (300 s), so ONE provider call in a
      # summary build may legitimately occupy this loop for as long as one
      # image generation occupies the media loop -- and a beat cannot land
      # while a handler is running. At 300 s here, a single map call running
      # to its full budget would be reported unhealthy for finishing exactly
      # on time.
      #
      # It is a tolerance and not a licence: `F-3` makes the build write a
      # progress row and beat before EVERY provider call, so the longest
      # legitimate silence is one call rather than a whole build, and
      # `Limits.summarize_job_max_duration_s` (1,800 s) ends a build that is
      # genuinely stuck instead of leaving this column to notice it.
      HEARTBEAT_MAX_AGE_S: ${HEARTBEAT_MAX_AGE_S_KNOWLEDGE:-600}
      # ⭐ CAPACITY 5.1 (`ح-6`) -- the worker this step is graded on, and the
      # one whose ceiling is NOT its CPU share.
      #
      # Indexing is I/O around a short CPU burst: fetch from MinIO, parse,
      # embed (a network call per batch, to `embedding-lb`), upsert to Qdrant,
      # one Postgres transaction. Four of those overlap almost perfectly on
      # `cpus: "1.0"` because at any instant three of them are waiting on a
      # socket -- which is exactly why the sequential loop this replaces was
      # leaving the machine idle rather than saturated.
      #
      # ⚠️ THE BINDING CONSTRAINT IS THE `memory` LIMIT BELOW, NOT THE CPU.
      # `Limits.max_upload_bytes` is 50 MB, and a parse holds the file plus its
      # extracted text plus its chunks; four at once is four of those. 2 GB is
      # what 3.4's ledger gave this service, and the number here is measured
      # against it (08 §4.18) rather than assumed to fit.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY_KNOWLEDGE:-4}
    # ⭐ TWO, and the only worker here that runs more than one. This is the
    # owner's answer to `summarization-scenarios-implementation-plan.md` §10
    # ق-و -- option (ب), the cheap half of `F-1` -- and it is the whole of
    # it: no second stream, no fourth worker, no change to the event
    # catalogue's binding table.
    #
    # **The defect.** `cg.knowledge` is consumed by ONE process running ONE
    # loop that handles one message at a time, and the summary handler is
    # the only handler in any of the three workers that may legitimately
    # occupy that loop for `Limits.summarize_job_max_duration_s` (1,800 s).
    # For that whole half hour nothing else on `stream.knowledge` is
    # handled -- so a file uploaded meanwhile is registered, is never
    # indexed, and is absent from every search that follows, while this
    # container stays `Up` and this healthcheck stays green (`F-3` beats
    # before every provider call, which is exactly what keeps the column
    # honest about the PROCESS while the QUEUE starves).
    #
    # **Why a replica is enough, and why it is safe here and would not have
    # been a year ago.** Redis distributes a group's entries ACROSS its
    # consumers, so the second process reads the next message while the
    # first is mid-build. Four properties have to hold, and each is a fact
    # about code elsewhere rather than a hope about this key:
    #
    #   1. Distinct identity. `workers/bootstrap._consumer_name` is
    #      `<prefix>.<hostname>.<pid>`, and Compose gives each replica its
    #      own container and hostname -- two consumers, not one name read
    #      twice.
    #   2. No stolen build. `knowledge_stale_idle_ms` (`F-4`) raises THIS
    #      worker's death threshold above the longest legitimate build, so a
    #      sibling's sweep cannot call a busy replica a corpse and
    #      `XAUTOCLAIM` its message: the double build that would otherwise
    #      follow is refused by nothing downstream (`SummaryJob.start` is
    #      deliberately re-entrant).
    #   3. No double work on redelivery. The idempotency claim is keyed
    #      `(consumer_group, event_id)` -- the GROUP, which both replicas
    #      share -- so an entry reclaimed by the other one is a clean
    #      return, not a second build.
    #   4. Independent health. The heartbeat file lives in the container's
    #      own writable layer and is never a mount
    #      (`framework/observability/heartbeat.py` says why), so each
    #      replica is judged on its own beat. A shared path would let a dead
    #      replica ride a live sibling's -- the ت-7 orphan, restored.
    #
    # `F-5` is the other precondition: at `count=1` a replica takes one
    # message and leaves the rest READABLE. Reading ten would have left the
    # sibling nothing to read and made this key decorative.
    #
    # **What it does not buy: isolation.** Two concurrent builds block
    # indexing exactly as one did. (أ) -- a dedicated stream and worker --
    # is the answer to THAT, and ق-و's own criterion for buying it is an
    # indexing lag past two minutes with both replicas active; 08 §2 carries
    # the command that reads it.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
      replicas: 2
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "knowledge"]

  # ── media ───────────────────────────────────────────────────────────────
  # In the DEFAULT stack since docs/log/3.134.md, and the profile that used to
  # sit here is gone for exactly the one reason it was ever promised to go:
  # its first containerised boot in the project's history was measured.
  # 45 min 46 s on an idle stream, RestartCount = 0, zero error-level lines,
  # and -- the part `docker ps` cannot tell you -- `XINFO CONSUMERS
  # stream.media cg.media` showed one registered consumer with `pending 0` and
  # an `idle` of ~5 s, i.e. a live XREADGROUP cycle, not a wedged process
  # holding a container `Up`.
  #
  # Adapter-complete since steps 19-20 of docs/deferred-adapters-plan.md
  # (docs/log/3.103.md · docs/log/3.104.md); .env.example's PROVIDER_ROUTING
  # routes `image` at `image:openai`, which IS wired. That was already true
  # while it stayed profiled -- capability was never the question, evidence
  # was, because this repo has twice been wrong about "should boot": `memory`
  # was documented as working while it died at five seconds of quiet, and
  # `knowledge` sat "wired" for weeks before anyone ran it.
  #
  # A missing per-workspace `image:openai` credential does NOT block the
  # boot: it is resolved per job by ResolveCredential and fails that job
  # loudly. An `image` route naming an UNWIRED provider does stop the process
  # dead at build time, on purpose.
  worker-media:
    <<: [*app-image, *app-logging, *host-gateway, *worker-service]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    environment:
      <<: [*app-env, *worker-env]
      WORKER: media
      # The ONE service that raises the tolerance, and the reason is
      # structural rather than a fudge: a beat cannot land while a handler is
      # still running, and one image-generation job may legitimately occupy
      # this loop for `Limits.media_timeout_s` (300 s). 600 keeps a busy media
      # worker from being reported unhealthy for doing its job -- a false
      # alarm here would cost more than the extra five minutes of detection
      # latency, because an operator who learns to ignore this column loses
      # the other three checks with it.
      HEARTBEAT_MAX_AGE_S: ${HEARTBEAT_MAX_AGE_S_MEDIA:-600}
      # ⭐ CAPACITY 5.1 -- TWO, and the ONE worker that does not take the
      # shared default, because the thing its handler waits on is not this
      # container's to schedule.
      #
      # A media job is one image generation against an EXTERNAL provider,
      # bounded by `Limits.media_timeout_s` (300 s). Four at once is four
      # simultaneous calls into a provider that has no concurrency ceiling and
      # no circuit breaker in front of it yet -- that is capacity step 6.1, and
      # until it ships, this key would be the only thing deciding how hard a
      # single container may lean on OpenAI. Two halves the head-of-line
      # blocking that a 300 s handler creates while staying somewhere no
      # provider's burst policy will notice.
      #
      # ⚠️ Read the OTHER half of what 5.1 changed here: this worker used to
      # read SIXTEEN entries per `XREADGROUP` and walk them one at a time, so
      # a full batch of long jobs held fifteen messages for up to eighty
      # minutes in a process that was not looking at them -- `F-1`'s defect,
      # on the worker nobody had checked for it. The COUNT is the concurrency
      # now, so it holds two.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY_MEDIA:-2}
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "media"]

  # SINGLE instance (08 §2). Consumer groups are still created at `$`
  # (stream tail, redis_streams.py:235, unchanged) -- that fact is why a
  # boot-order rule ("workers before the relay") used to be needed here at
  # all (08 §4's old rule, the live 5.1-ج lesson). It no longer is: since
  # the stream-topology-plan.md fix (log/3.107.md), build_relay_from_env
  # returns an ensure_topology() closure that this process awaits before
  # its own run_forever(), so every group exists before this relay's first
  # publish -- on Compose, RunPod, and bare `python -m` alike. See 08 §4.
  outbox-relay:
    <<: [*app-image, *app-logging]
    depends_on:
      # ⚠️ THIS EDGE WAS MISSING (§3.111, discovered live in §3.110 phase A).
      # DATABASE_URL below has named `pgbouncer:6432` since Phase 1, but the
      # pooler was never declared here -- so `docker compose up -d
      # outbox-relay` (08 §3's OWN documented command) started the relay
      # WITHOUT it and the process crash-looped on `socket.gaierror: Name or
      # service not known`. A DNS-shaped error for a boot-order cause, which
      # sends the reader hunting in the network; `restart: unless-stopped`
      # then heals it silently the moment anything else starts the pooler,
      # so it reads as intermittent. Harmless on a full `docker compose up
      # -d` (the pooler boots anyway) -- which is exactly why it survived.
      # WAS `service_started`, and the comment here used to explain why: the
      # pooler defined no healthcheck, so "started" was the strongest thing
      # this edge could say, and §3.111 refused to smuggle a new healthcheck
      # in as a rider on a different fix ("adding a pgbouncer healthcheck is a
      # separate decision"). ت‑3 made that decision on its own terms, so the
      # looseness §3.111 recorded -- started != accepting connections -- is
      # gone rather than merely documented.
      pgbouncer:
        condition: service_healthy
      redis-stream:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # NOT `worker` -- it sits behind the `workers` profile (see above), and
      # a depends_on into a disabled profile is a config error. This edge was
      # never added for a different reason too: 08 §4 used to require
      # workers-before-relay on a brand-new stream (groups born at `$`, the
      # stream tail), which this depends_on could not have guaranteed anyway
      # -- a start-order edge races a startup event, it does not sequence
      # ensure_group() before the first XADD. That rule is gone now (see the
      # comment on `outbox-relay` above); this edge remains absent simply
      # because `worker` sits behind a disabled profile.
    environment:
      <<: *app-env
      # The relay's OWN role: SELECT/UPDATE on platform.outbox and nothing
      # else -- the mirror image of app_rw's INSERT-only grant there.
      DATABASE_URL: postgresql+asyncpg://outbox_relay:${OUTBOX_RELAY_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-aizzak}
    command: ["python", "-m", "app.workers.outbox_relay"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
      replicas: 1
    # ت‑3. The relay beats on CLEAN cycles only (`OutboxRelay.run_forever`),
    # which is the whole point here: a relay that cannot reach Postgres or
    # Redis keeps looping, doubling its backoff, and staying `Up` forever --
    # the state that was previously invisible everywhere except in a log line
    # nobody reads.
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "outbox-relay"]
    restart: unless-stopped

  # ────────────────────────────── backup ──────────────────────────────────
  # Capacity step 2.5 (`ح-13`). Both services run the APPLICATION image --
  # "one image, several commands" (Dockerfile) -- which since 2.5 also
  # carries the PostgreSQL 16 client binaries, because `python -m
  # app.ops.backup` shells out to `pg_basebackup`/`pg_dump`/`pg_restore` and
  # a client older than the server refuses to dump it.
  #
  # ⚠️ `user: "999:999"` ON BOTH, and it is not a preference. `postgres`
  # writes the spool as ITS uid (999); the shipper must DELETE from that
  # directory once a segment is safely in object storage, and deleting needs
  # write permission on the DIRECTORY, not on the file. The alternatives were
  # a world-writable volume or a `chmod` in the archive command -- both of
  # them widen the permissions of live WAL to make a container's identity
  # convenient. Matching the uid instead changes nothing about the files.
  #
  # ⚠️ NEITHER goes through pgbouncer, and neither CAN. `pg_basebackup`
  # speaks the replication protocol, which the pooler does not implement;
  # `pg_dump` holds one repeatable-read snapshot across hundreds of
  # statements, which transaction pooling breaks by design. Both fail loudly
  # rather than producing a short artifact, but the DSN says `postgres:5432`
  # so neither ever has to.

  # The standing half: drains the spool into object storage. Standing rather
  # than an operator habit because the failure mode of NOT draining is not a
  # missing backup -- it is Postgres holding every unarchived segment in
  # pg_wal until the data volume fills, which is an outage of the whole
  # platform caused by the backup system.
  wal-shipper:
    <<: [*app-image, *app-logging]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    user: "999:999"
    depends_on:
      # NOT `postgres`. This service holds no database credential and opens no
      # database connection -- `wal` reads a directory and writes objects --
      # and the reason is the hour it exists for: if Postgres is in trouble,
      # its WAL still has to reach object storage. A shipper that could not
      # start without a database password would be unavailable in exactly that
      # hour, and would be carrying a credential it never uses in every other.
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      wal-archive-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      BACKUP_BUCKET: ${BACKUP_BUCKET:-aizzak-backups}
      BACKUP_SPOOL_DIR: /var/lib/postgresql/wal-archive
    volumes:
      - wal-archive:/var/lib/postgresql/wal-archive
    command:
      - python
      - -m
      - app.ops.backup
      - wal
      - --follow
      - --interval
      - ${BACKUP_WAL_INTERVAL_S:-30}
    # ت-3, and this loop is the clearest case for the heartbeat there is: its
    # failure mode is not an error but a SILENCE. A stopped shipper keeps
    # `archive_command` succeeding into a spool nobody drains, and the first
    # symptom is a full data volume taking the platform down -- caused by the
    # backup system. `Up` says nothing about that; a beat per completed
    # shipping cycle does.
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "wal-shipper"]
    restart: unless-stopped

  # The one-shot half: base backups, dumps, Qdrant snapshots, status, prune.
  # Behind a profile (the `k6` precedent from step 0.1) because it is an
  # operator command, not a service -- `docker compose up -d` must not start
  # a container whose whole job is to exit.
  backup:
    <<: [*app-image, *app-logging]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    profiles: ["backup"]
    user: "999:999"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *app-env
      BACKUP_DATABASE_URL: postgresql://backup_operator:${BACKUP_OPERATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-aizzak}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-aizzak-backups}
      BACKUP_SPOOL_DIR: /var/lib/postgresql/wal-archive
    volumes:
      - wal-archive:/var/lib/postgresql/wal-archive
    command: ["python", "-m", "app.ops.backup", "status"]
    restart: "no"

  # ─────────────────────────────── edge ───────────────────────────────────
  # Local TLS material (7.3). Same one-shot pattern as the vault/minio
  # bootstraps, on the SAME pinned image that consumes the output -- openssl
  # ships in nginx:1.27, so this needs nothing installed on the host. Skips
  # itself when a certificate is already present, which is also how an
  # operator supplies a real one: drop it in and this stays out of the way.
  nginx-certs:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    image: nginx:1.27
    volumes:
      - ./deploy/nginx/gen-cert.sh:/gen-cert.sh:ro
      - ./deploy/nginx/certs:/certs
    entrypoint: ["/bin/sh", "/gen-cert.sh"]
    restart: "no"
    <<: *app-logging

  nginx:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m
    image: nginx:1.27
    depends_on:
      app:
        condition: service_started
      nginx-certs:
        condition: service_completed_successfully
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/app-locations.conf:/etc/nginx/app-locations.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HOST_PORT_HTTP:-80}:80"
      - "${HOST_PORT_HTTPS:-443}:443"
    # ⚠️ AN EDGE HEALTHCHECK, AND IT IS MANDATORY (7.3, closing a 7.1 loose
    # end). Every other healthcheck in this file probes a service from INSIDE
    # itself -- `app`'s curls 127.0.0.1:8000 in its own container. That is
    # exactly why bug #10 (§3.75 decision (ط)) was so hard to see: nginx was
    # proxying to a dead address and answering 502 to the world while
    # `docker compose ps` reported every service healthy and the app's log
    # was full of 200s. NOTHING observed the link between the two.
    #
    # This check crosses that link. It leaves through nginx's own listener,
    # goes through the proxy configuration, reaches the app and comes back --
    # so a stale DNS resolution, a broken location block, a bad certificate
    # or a dead app all surface as an unhealthy EDGE instead of a silent 502.
    #
    # Both schemes are probed: :443 has its own certificate and TLS config
    # that :80 cannot vouch for. `-k` because the local certificate is
    # self-signed by construction -- this check asserts that TLS terminates
    # and proxies, not that a development certificate chains to a public CA.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/health && curl -fsSk https://127.0.0.1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # ── The SOURCE-PORT budget (capacity 3.2) ────────────────────────────────
    # ⚠️ THE EDGE IS A CLIENT TOO, and this is the half of that sentence this
    # file had not paid for. `app-locations.conf` proxies to a VARIABLE so the
    # name is re-resolved per request (see its header -- an `upstream` block
    # caches one address for the process lifetime and 502s forever once the app
    # moves; re-confirmed live in 3.2, below). The price of that decision is
    # that nginx has NO upstream keepalive pool at all: every proxied request is
    # its own TCP connection, opened from an ephemeral port in THIS container's
    # network namespace, and a closed one is held in TIME_WAIT for sixty
    # seconds.
    #
    # MEASURED on this stack, 300 rps (§0's target) through the real edge for
    # two minutes: 15,782 sockets in TIME_WAIT toward app:8000 and ZERO
    # ESTABLISHED at any instant -- 55.9% of Docker's default 32768-60999 range
    # (28,232 ports) consumed to serve the target rate. The ceiling that implies
    # is ~537 rps, i.e. 1.79x §0's target, and it was then reached on purpose:
    # 700 rps for 100s answered
    #
    #     [crit] connect() to 172.18.0.26:8000 failed
    #            (99: Cannot assign requested address) while connecting to upstream
    #
    # 4,090 times across 700 client connections -- 5.84% of 70,001 requests
    # failed, with 26,556 of 28,232 ports (94.1%) in TIME_WAIT. That is the
    # EADDRNOTAVAIL named in capacity 3.2's own acceptance criterion, on the
    # edge rather than on the generator.
    #
    # ⭐ AND THE GENERATOR ALREADY CARRIES THIS FIX -- see the `k6` service
    # below, whose comment describes the identical failure ("the generator
    # running out of SOURCE PORTS in its own network namespace") from a real
    # run. The thing that MEASURES the platform was hardened against port
    # exhaustion; the thing being measured, which opens one outbound connection
    # per request instead of one per iteration, was not.
    #
    # `tcp_tw_reuse` is what actually closes it, and 1 vs the kernel's default
    # of 2 is the whole point: 2 means "reuse TIME_WAIT sockets for LOOPBACK
    # only". MEASURED, paced at 300 conn/s for 20s into a deliberately narrow
    # 1,000-port range:
    #
    #     tw_reuse=2, loopback destination   6,000 of 6,000 connected
    #     tw_reuse=2, bridge destination       999 of 6,000  (5,001 EADDRNOTAVAIL)
    #     tw_reuse=1, bridge destination     6,000 of 6,000
    #     tw_reuse=0, loopback destination   1,007 of 6,000  (control)
    #
    # So `deploy/runpod/nginx.conf`, which proxies to a LITERAL 127.0.0.1:8000,
    # has been immune to this since before it was written -- and the Compose
    # path, which cannot use a literal address, never was. Reuse is gated on the
    # TIME_WAIT socket being older than one second, so this raises the recycle
    # ceiling from range/60s to roughly range/1s; it is safe because TCP
    # timestamps are on by default at both ends and it applies to OUTGOING
    # connections only (`tcp_tw_recycle`, the dangerous one, was deleted from
    # Linux in 4.12).
    #
    # ⚠️ AND NEITHER OF THESE MAY GO IN `deploy/host-tuning.sh` (step 3.5, and
    # option (أ) of 3.2 as written): both are NETWORK-NAMESPACED. The host's own
    # range on the measured machine is 56905-61000 -- 4,096 ports, SIX TIMES
    # NARROWER than the default this container already had -- and setting it
    # there would have changed nothing here while reading like a fix. Same
    # shape as 3.1's `nofile`: the number has to be written where the process
    # actually lives.
    #
    # ⚠️ `net.ipv4.tcp_fin_timeout` is deliberately NOT set here, unlike the k6
    # service. MEASURED: a TIME_WAIT entry lived 60.8s at fin_timeout=5 and
    # 60.7s at fin_timeout=60. `tcp_fin_timeout` bounds FIN_WAIT_2, not
    # TIME_WAIT, which Linux fixes at 60s in `TCP_TIMEWAIT_LEN`; the k6 service
    # sets it under a comment about the TIME_WAIT interval, and it does nothing
    # for that. Left there rather than silently removed -- it is harmless, and
    # the correction belongs next to it.
    #
    # ── The ACCEPT QUEUE (capacity 3.5) ──────────────────────────────────────
    # `net.core.somaxconn` is namespaced too, and it is stated here for the
    # reason the `app` service's copy of this note gives in full: nginx asks
    # the kernel for a backlog of 511 (its built-in default; no `listen
    # ... backlog=` in `deploy/nginx/nginx.conf` states one), and on any kernel
    # older than 5.4 the container default would clamp that to 128 without a
    # word in any log. MEASURED here at 4096: four processes opening 1,500
    # connections each -- 6,000 at once, four times §0's socket target --
    # established every one with ZERO ListenOverflows, p50 0.6ms, max 5.6ms.
    #
    # 511 is deliberately NOT raised. It is the number the measurement above
    # ran against, and nothing in this stack has been shown to overflow it;
    # this line makes sure the resource behind that promise is stated, which is
    # the half 3.1 found missing on `worker_connections`.
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.ip_local_port_range: "10000 65535"
      net.ipv4.tcp_tw_reuse: "1"
    restart: unless-stopped
    <<: *app-logging

  # ── Observability (Wave 0 step 0.3, docs/capacity-plan.md) ───────────────
  # `deploy/prometheus/alerts.yml` was written on 2026-07-30 and its own
  # header states the gap this block closes: "This is still NOT wired into
  # any running Prometheus/Alertmanager service -- no such service exists in
  # `docker-compose.yml`". Three reasoned thresholds and nothing evaluating
  # them, which is how ت-6 happened -- a DLQ gauge reading the wrong streams
  # for six weeks, invisible because nothing read the gauge.
  #
  # Five services, and only ONE publishes a host port. The trust boundary is
  # the same one `embedding` draws and `src/app/api/metrics.py`'s docstring
  # argues for: Prometheus holds operator information about the Outbox, the
  # DLQ and now every request this platform serves, so it stays on the
  # internal network with `expose`, never `ports`, and the nginx edge already
  # 404s `/metrics` before the catch-all proxy can reach it.
  prometheus:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    image: prom/prometheus:v3.13.2
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 15 days. Step 0.5's baseline is an 8-hour soak plus a 30-minute peak
      # run, and every later wave's acceptance criterion compares against it
      # -- so the window has to outlive the gap between running the baseline
      # and running the wave that cites it, while still being a bound rather
      # than the unlimited growth a default would give a machine that is
      # somebody's laptop.
      - "--storage.tsdb.retention.time=15d"
      # The rules are the point of this service; reloading them without
      # restarting it (POST /-/reload) is how an operator edits a threshold
      # during a load run without losing the series already collected.
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    <<: *app-logging

  # ⚠️ THE ONE SERVICE IN THIS BLOCK WITH A HOST PORT, and the deviation is
  # deliberate rather than drift. Step 0.3's text asks for both services to
  # be internal ("داخليّتان: `expose` لا `ports`"), which is exactly right
  # for Prometheus -- Grafana proxies it, and its /targets page is one
  # `docker compose exec` away. Applied to Grafana it would produce a
  # dashboard nobody can open, which is not a dashboard.
  #
  # So this follows the pattern this file already established for every
  # operator interface it has (postgres, pgbouncer, redis, minio, qdrant,
  # vault): bound to 127.0.0.1 with an offset port, never 0.0.0.0. That is
  # not the public edge -- the concern behind the plan's sentence -- it is
  # the "stable local operator/test interface" this file's own header names.
  # Recorded as a decision in docs/capacity-status.md, not left implicit.
  grafana:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512m
    image: grafana/grafana:13.0.8
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Defaults to Grafana's own `admin`, which is fine for a loopback-only
      # binding on a developer machine and NOT fine anywhere else. Set it in
      # .env before this is reachable from anything but 127.0.0.1.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # This platform is offline by construction elsewhere (HF_HUB_OFFLINE,
      # TRANSFORMERS_OFFLINE on `embedding`); a metrics UI that phones
      # grafana.com on every start is an outbound call nobody asked for, and
      # on an air-gapped host it is a slow start-up for no benefit.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${HOST_PORT_GRAFANA:-13000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    <<: *app-logging

  # ح-3's direct evidence, and the reason step 0.2 deferred `cl_waiting` and
  # `sv_active` rather than reading them from the app: they live behind
  # pgbouncer's ADMIN console, which `admin_users` restricts to the Postgres
  # superuser. Putting that credential into the app container would undo the
  # whole point of `app_rw` (NOINHERIT, no BYPASSRLS, confined by RLS policy)
  # for the sake of two numbers. A sidecar that holds nothing else and talks
  # to nothing else is where a superuser credential can live honestly.
  #
  # It reaches the SAME admin console the pooler's own healthcheck already
  # uses, with the same identity -- no new grant, no new role, no widening of
  # anything that exists.
  pgbouncer-exporter:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    image: prometheuscommunity/pgbouncer-exporter:v0.12.1
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      # ⚠️ `PGBOUNCER_EXPORTER_CONNECTION_STRING`, not `DATA_SOURCE_NAME`.
      # The latter is what most Prometheus exporters use and what this
      # service was first written with; v0.12.1 ignores it silently, keeps
      # its own default of `postgres://postgres:@localhost:6543/pgbouncer`,
      # and reports `pgbouncer_up 0` while logging "dial tcp [::1]:6543:
      # connect: connection refused" -- indistinguishable from a genuinely
      # dead pooler unless you read the address in the error. Caught by
      # bringing the service up rather than by reading about it; the flag's
      # own help text (`--pgBouncer.connectionString`) is the authority.
      #
      # `pgbouncer` at the end is the pooler's own virtual ADMIN database,
      # not a real one -- SHOW POOLS / SHOW STATS are answered by the pooler
      # itself and never reach Postgres.
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://${POSTGRES_SUPERUSER:-postgres}:${POSTGRES_SUPERUSER_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable
    expose:
      - "9127"
    # ⚠️ Probes the EXPORTER, deliberately not the pooler behind it. This
    # endpoint answers 200 with `pgbouncer_up 0` when pgbouncer is gone
    # (measured during step 0.3's acceptance run), and that is what has to
    # keep happening: a check that went unhealthy with the pooler would have
    # Compose restart this container mid-outage, and `AizzakPgbouncerDown`
    # reads a metric that only exists while it is running.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9127/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    <<: *app-logging

  # TWO exporters since 5.2, one pinned to each instance, because the two
  # instances need OPPOSITE alerts and a shared exporter cannot express that.
  # On `redis-stream` any eviction at all is impossible by policy, so a
  # non-zero counter there means somebody ran `CONFIG SET maxmemory-policy` by
  # hand -- a tripwire that can never fire spuriously. On `redis-cache`
  # eviction is the design working, and alerting on it would be noise.
  #
  # ⚠️ And one exporter scraping both (the `/scrape?target=` multi-target
  # mode) was considered and rejected: it makes ONE container the single point
  # of blindness for both servers, so `AizzakScrapeTargetDown` fires once for
  # a failure that has two independent causes. 0.25 vCPU / 128 MB is what
  # telling them apart costs.
  redis-stream-exporter:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    image: oliver006/redis_exporter:v1.90.0-alpine
    depends_on:
      redis-stream:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis-stream:6379
    expose:
      - "9121"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9121/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    <<: *app-logging

  redis-cache-exporter:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    image: oliver006/redis_exporter:v1.90.0-alpine
    depends_on:
      redis-cache:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis-cache:6379
    expose:
      - "9121"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9121/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    <<: *app-logging

  # ⚠️ OPT-IN, AND THE PROFILE IS A SECURITY DECISION rather than a
  # convenience. cAdvisor needs `/var/run/docker.sock` to name containers,
  # which is root-equivalent access to this host: anything that can talk to
  # that socket can start a privileged container. Step 0.5's 8-hour soak
  # genuinely needs per-container memory to see a leak's slope --
  # `process_resident_memory_bytes` is unavailable once
  # PROMETHEUS_MULTIPROC_DIR is set, by prometheus_client's design, so the
  # slope is only visible from OUTSIDE the process -- so the capability has
  # to exist. It is granted for the duration of a measurement:
  #
  #     docker compose --profile container-metrics up -d cadvisor
  #
  # and stopped again afterwards. `prometheus.yml` labels this target
  # `tier: optional` so its ordinary absence does not hold a target-down
  # alert firing forever.
  cadvisor:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    profiles: ["container-metrics"]
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      # Everything except memory/cpu is off: this exists for one panel, and
      # the disk/network collectors are what make cAdvisor expensive enough
      # to distort the very soak it is measuring.
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
      - "--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    <<: *app-logging

  # ── The log store and its collector (capacity 0.6) ────────────────────────
  # «سجلٌّ بصيغة JSON لكلّ خدمة … مجمَّعةٌ في مخزنٍ واحدٍ قابلٍ للبحث», and the
  # reason it is in the MEASUREMENT wave: when p99 rises for two minutes the
  # metric says THAT it happened and only the log says WHY, and without a
  # store that diagnosis is `docker logs` against eighteen containers whose
  # timestamps do not line up.
  #
  # Loki is `expose`-only, on the same trust boundary as `prometheus` and for
  # the same reason -- and one step stronger here, because these lines carry
  # far more than a counter does. Grafana proxies it; nothing else needs it.
  loki:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
    image: grafana/loki:3.5.7
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    healthcheck:
      # `/ready` and NOT `/metrics` or the root: Loki answers HTTP long before
      # its ingester has joined the ring, and a collector that starts pushing
      # into that window gets 5xx it will not retry forever.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    <<: *app-logging

  # The collector. Reads every container's json-file log off a READ-ONLY bind
  # and pushes to Loki -- with NO Docker socket, which is the whole design and
  # is argued in full in deploy/alloy/config.alloy's header (short version: the
  # socket is root on the host, 0.3 put cadvisor behind an opt-in profile
  # rather than grant it for free, and 0.6 cannot be opt-in).
  alloy:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512m
    image: grafana/alloy:v1.10.2
    depends_on:
      loki:
        condition: service_healthy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # ⚠️ READ-ONLY, and the only host path this container sees. Docker writes
      # every container's log to <id>/<id>-json.log under here; the service
      # name rides inside each line as `attrs` (see `x-app-logging` above), so
      # nothing needs to be asked of the Docker API.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Read positions. Without a persisted cursor, every restart re-ships the
      # whole retained history of every container and the store fills with
      # duplicates of lines it already holds.
      - alloy-data:/var/lib/alloy/data
    expose:
      - "12345"
    healthcheck:
      # ⚠️ `bash` and `/dev/tcp`, not `wget` -- the Alloy image ships NEITHER
      # wget NOR curl NOR nc (measured: the first version of this healthcheck
      # failed with `exec: "wget": executable file not found`, so the container
      # ran perfectly and reported itself unhealthy forever). `bash` IS there,
      # and its `/dev/tcp` pseudo-device is what turns it into an HTTP client;
      # `CMD-SHELL` would not work either, because /bin/sh here is dash and
      # /dev/tcp is a bash feature.
      #
      # `/-/ready` and not a bare TCP connect: Alloy binds the port before its
      # components have loaded, and a config it refuses to parse leaves a
      # process that accepts connections and collects nothing.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    <<: *app-logging

  # ── The load generator (capacity 0.1, blocker د‑3) ───────────────────────
  # `deploy/load/` was written before anything could run it: k6 is a Go binary,
  # not a dependency this project can vendor, and it did not exist on the
  # machine that wrote the harness. That single absence held the acceptance of
  # 0.1, the peak-load half of 0.4 and ALL of 0.5 -- five scenarios, a token
  # pool, a million-row seed and a threshold sheet, none of which had ever been
  # executed once.
  #
  # A profile, not a default service: this exists to be run by hand for thirty
  # minutes and then to go away again.
  #
  #     deploy/load/run.sh peak          # picks host k6 if present, else this
  #     LOAD_K6=docker deploy/load/run.sh peak
  #
  # ⚠️ It measures the platform from INSIDE the platform's own machine, which
  # a generator on separate hardware would not. Two consequences belong in
  # every report taken this way: the generator competes with the services for
  # the same CPU (a true remote client would not), and reaching `nginx`
  # directly skips the published-port hop -- the same edge, the same TLS
  # termination, one userland proxy less. Neither invalidates a baseline; both
  # change what the numbers are a baseline OF, so `run.sh` stamps which
  # generator produced each result.
  k6:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    profiles: ["load"]
    # Pinned like every other image here, and the pin is load-bearing: the
    # WebSocket scenarios import `k6/experimental/websockets`, and which name
    # that module answers to is a property of the binary, not of the script.
    # The harness imported the graduated `k6/net/websockets` for months on the
    # strength of a changelog; no released k6 provides it, and the whole run
    # aborts at init with `unknown module`. Verified against THIS tag.
    image: grafana/k6:1.3.0
    depends_on:
      # Readiness, not "started" -- the edge healthcheck crosses nginx INTO
      # the app, so a run that starts here cannot begin against a stack that
      # answers 502. The first minute of a 30-minute profile is the most
      # expensive place to discover that.
      nginx:
        condition: service_healthy
    # The same finding as `qdrant` above, for the opposite side of the wire:
    # `peak` holds 1,500 WebSockets open while driving 300 rps, and every one
    # of those is a file descriptor. Docker's inherited soft limit is 1024 --
    # the generator would shed load at roughly two thirds of the target and
    # the report would blame the platform.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    # And its other half. The first smoke run put 37,283 iterations through
    # this container in 20 seconds and started answering `dial tcp
    # 172.18.0.6:443: connect: cannot assign requested address` -- EADDRNOTAVAIL,
    # the generator running out of SOURCE PORTS in its own network namespace,
    # not the platform refusing anything. Docker's default ephemeral range is
    # ~28,000 ports and a closed socket holds one for the TIME_WAIT interval.
    # Both settings are net-namespaced, so neither touches the host.
    #
    # ⚠️ CORRECTED IN CAPACITY 3.2, not deleted: `tcp_fin_timeout` does NOT
    # shorten the TIME_WAIT interval the line above describes. MEASURED, one
    # client-closed socket watched out of /proc/net/tcp: the entry lived 60.8s
    # at fin_timeout=5 and 60.7s at fin_timeout=60. It bounds FIN_WAIT_2; Linux
    # fixes TIME_WAIT at 60s in `TCP_TIMEWAIT_LEN`, and no sysctl moves it. So
    # the widened RANGE above is what actually kept this generator alive, alone.
    # The setting is harmless and is left in place; what it is NOT is a second
    # half of the fix, and the `nginx` service therefore does not copy it.
    sysctls:
      net.ipv4.ip_local_port_range: "10000 65535"
      net.ipv4.tcp_fin_timeout: "15"
    # ONE directory, read-write, and nothing else of this repository: the
    # scripts, `tokens.json` (real credentials) and `results/`. `run.sh`
    # refuses a `LOAD_OUT` outside it rather than writing somewhere the
    # operator did not ask for.
    volumes:
      - ./deploy/load:/load
    working_dir: /load
    environment:
      # Inside this network the edge is `nginx`; `localhost` here is the
      # generator's own loopback. `run.sh` refuses the latter outright.
      LOAD_BASE_URL: ${LOAD_BASE_URL:-https://nginx}
      LOAD_TOKEN_FILE: ${LOAD_TOKEN_FILE:-/load/tokens.json}
      LOAD_OUT: ${LOAD_OUT-}
      LOAD_DURATION_S: ${LOAD_DURATION_S-}
      LOAD_WS_VUS: ${LOAD_WS_VUS-}
      LOAD_AGENT_KEY: ${LOAD_AGENT_KEY-}
      LOAD_PROMPT: ${LOAD_PROMPT-}
      LOAD_VERBOSE: ${LOAD_VERBOSE-}
      LOAD_ALLOW_PLAINTEXT: ${LOAD_ALLOW_PLAINTEXT-}
      LOAD_P95_GENERATION_S: ${LOAD_P95_GENERATION_S-}
      LOAD_STREAM_TIMEOUT_MS: ${LOAD_STREAM_TIMEOUT_MS-}
      LOAD_INDEX_POLL_S: ${LOAD_INDEX_POLL_S-}
      LOAD_INDEX_TIMEOUT_S: ${LOAD_INDEX_TIMEOUT_S-}
      LOAD_WS_HOLD_MS: ${LOAD_WS_HOLD_MS-}
      LOAD_WS_PING_MS: ${LOAD_WS_PING_MS-}
      # The seed declaration §0.1 condition (3) asks for. Empty is not a
      # default: `lib/config.js` marks the whole result invalid when these are
      # unstated, which is the point.
      LOAD_SEED_ID: ${LOAD_SEED_ID-}
      LOAD_SEED_MESSAGES: ${LOAD_SEED_MESSAGES-}
      LOAD_SEED_FILES: ${LOAD_SEED_FILES-}
      LOAD_SEED_VECTORS: ${LOAD_SEED_VECTORS-}
      LOAD_SEED_WORKSPACES: ${LOAD_SEED_WORKSPACES-}
      # Provenance `run.sh` computes on the host, where git and the Docker
      # socket are.
      RUN_COMMIT: ${RUN_COMMIT-}
      RUN_DIRTY: ${RUN_DIRTY-}
      RUN_IMAGES: ${RUN_IMAGES-}
      RUN_K6_VERSION: ${RUN_K6_VERSION-}
      RUN_HOST: ${RUN_HOST-}
      # How many source addresses this generator claims (capacity blocker
      # د‑8), and who owns the files it writes. Both are read by
      # `deploy/load/entrypoint.sh`, which explains the whole mechanism.
      LOAD_SRC_IPS: ${LOAD_SRC_IPS:-32}
      LOAD_UID: ${LOAD_UID-}
      LOAD_GID: ${LOAD_GID-}
    # ── The generator's own addresses (د‑8) ─────────────────────────────
    # The edge meters on `$$binary_remote_addr`, so a generator on ONE address
    # is metered as ONE client: the first honest peak run offered 300.1 rps and
    # the edge admitted 22.0, rejecting 92.7% with 429. That measured nginx's
    # `limit_req`, not this platform.
    #
    # `entrypoint.sh` therefore adds N secondary addresses and hands k6
    # `--local-ips`, so 300 rps from "hundreds of users" arrives from hundreds
    # of users' worth of addresses -- and NOTHING in `deploy/nginx/` changes,
    # which is what `م‑8` requires before a baseline exists. `ip addr add`
    # needs CAP_NET_ADMIN, which no unprivileged uid in this image has; the
    # entrypoint chowns `results/` back to `LOAD_UID` on the way out so the
    # bind mount is not left root-owned.
    #
    # Set LOAD_SRC_IPS=0 to run without any of it (and see the 22 rps again).
    #
    # `user: "0:0"` overrides the image's own `USER k6` (uid 12345): a granted
    # capability is only in the BOUNDING set for an unprivileged uid, so
    # `cap_add` alone still answers `RTNETLINK: Operation not permitted`.
    cap_add:
      - NET_ADMIN
    user: "0:0"
    entrypoint: ["/load/entrypoint.sh"]
    # A load run ends. `restart: "no"` is also what exempts it from the
    # healthcheck rule in `tests/unit/test_healthcheck_coverage.py`: a probe
    # on a container that exits by design reports on nothing.
    restart: "no"
    <<: *app-logging
volumes:
  postgres-data:
  # WAL segments between `archive_command` and object storage (capacity 2.5).
  # Shared by exactly two services: `postgres` writes, `wal-shipper` deletes.
  # It is a SPOOL and not an archive -- a segment lives here for seconds, and
  # a depth that grows is the shipper being down, which `python -m
  # app.ops.backup status` reports as `spool.files`.
  wal-archive:
  redis-data:
  minio-data:
  qdrant-data:
  # Vault's OWN storage (KV v2 + Transit + AppRole) -- what makes the vault
  # service survive a restart at all (release-blockers-plan.md §3 step 1).
  vault-data:
  # Prometheus's TSDB. A named volume and not a bind: the series ARE the
  # baseline once step 0.5 runs, and 15 days of them must survive a
  # `docker compose up -d --force-recreate` that nobody thought of as
  # destructive.
  prometheus-data:
  # Grafana's own SQLite (users, sessions, starred dashboards). The
  # dashboards themselves are NOT here -- they are provisioned read-only
  # from deploy/grafana/dashboards, so losing this volume loses a password,
  # never a panel.
  grafana-data:
  # Loki's chunks + index (capacity 0.6). A named volume for the same reason
  # `prometheus-data` is one: the lines explaining a failed load run must
  # survive the `docker compose up -d --force-recreate` that nobody thought of
  # as destructive. NOT a durability tier all the same -- see deploy/loki/loki.yml.
  loki-data:
  # Alloy's read positions, one entry per log file. Losing it is not data loss;
  # it is every line being shipped a second time.
  alloy-data:
  # The unseal key + root token `deploy/vault/start.sh` writes at
  # `operator init` time. DELIBERATELY a separate volume from vault-data:
  # the data directory stays exactly what Vault itself owns, and this one
  # stays exactly what the bootstrap/recovery tooling owns.
  vault-init:
