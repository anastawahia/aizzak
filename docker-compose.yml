# AIZZAK deployment topology (7.1 · 08-local-runbook §2, D-26).
#
# ── One Compose topology for deployment and the live test harness ─────
# The native PostgreSQL/PgBouncer/Redis/MinIO installations were removed by
# containerised-test-harness-plan-v2. Inside this network every service keeps
# its canonical name and port (`pgbouncer:6432`, `minio:9000`, ...); the
# offset HOST publications are the stable local operator/test interface.
# `docker-compose.test.yml` is an explicit opt-in overlay: it publishes the
# otherwise-internal embedding service and mounts the test-database script.
#
# ── Every image tag is pinned ──────────────────────────────────────────────
# The two pre-existing ad-hoc containers ran `:latest`. A deploy artifact
# whose components change underneath it between two `up`s is not one.

name: aizzak

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: aizzak/app:${APP_IMAGE_TAG:-dev}

# Every process built from the ONE image shares this environment; what
# differs per process is the command and the DATABASE_URL role.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  API_PREFIX: ${API_PREFIX:-/api/v1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: ${MINIO_BUCKET:-workspace-files}
  MINIO_SECURE: "false"
  # The address presigned URLs are SIGNED against (7.1). `minio:9000` is
  # resolvable only inside this network; SigV4 covers the host, so the URL
  # handed to a browser has to be signed against a host the browser can
  # reach. Not cosmetic and not fixable in Nginx.
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:19000}
  MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
  QDRANT_URL: http://qdrant:6333
  # 2.10 -- the central embedding service (internal-only, the SAME trust
  # boundary as Postgres/Redis/Qdrant above: tenant text crosses the
  # internal Docker network to reach it, never the public one). Only the
  # URL is env-editable here (DD-11); model/dimensions/batch/timeout are
  # pinned adapter-side defaults that must match the image this service
  # bakes its model into (`services/embedding/Dockerfile`).
  EMBEDDING_SERVICE_URL: http://embedding:8080
  VAULT_ADDR: http://vault:8200
  # ── Vault authentication mode (7.3 · D-22 · 05 §3.3) ───────────────────
  # THREE variables, and which of them is set decides the mode, because
  # `create_vault_client` prefers a token whenever one is present:
  #   VAULT_TOKEN set          -> token auth (local dev-mode root token)
  #   VAULT_TOKEN empty  AND
  #   VAULT_ROLE_ID + VAULT_SECRET_ID set -> AppRole login (D-22, MANDATORY
  #                                          for every non-local deployment)
  # So `VAULT_TOKEN=` (blank) in .env is not a missing value -- it is the
  # switch. Left unquoted-empty here rather than defaulted, precisely so a
  # blank .env entry survives into the container instead of being replaced.
  VAULT_TOKEN: ${VAULT_TOKEN-}
  VAULT_ROLE_ID: ${VAULT_ROLE_ID-}
  # NEVER put this in .env (05 §3.3: "the only sensitive one in the
  # environment"). It is read from the invoking shell -- Compose
  # interpolation consults the real environment too, and the shell wins.
  VAULT_SECRET_ID: ${VAULT_SECRET_ID-}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_JWKS_CACHE_TTL: ${FIREBASE_JWKS_CACHE_TTL:-3600}
  # capacity-plan wave 1 step 1.1 -- how long the authentication path may
  # reuse a resolved principal (workspace, user, roles, active). Every write
  # that changes one of those invalidates the entry explicitly, so this bounds
  # only how long an invalidation that FAILED may keep being wrong. `0` builds
  # NO cache at all, which is what a baseline run needs.
  AUTH_PRINCIPAL_CACHE_TTL_S: ${AUTH_PRINCIPAL_CACHE_TTL_S:-60}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  EVENT_STREAM_PREFIX: ${EVENT_STREAM_PREFIX:-stream.}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
  CONSUMER_BLOCK_MS: ${CONSUMER_BLOCK_MS:-5000}
  MAX_RETRIES_BEFORE_DLQ: ${MAX_RETRIES_BEFORE_DLQ:-5}
  OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-256}
  CONSUMER_BATCH_COUNT: ${CONSUMER_BATCH_COUNT:-16}
  # Retained length per stream, `XADD ... MAXLEN ~ N` (7.3). Streams are
  # append-only -- XACK does not delete -- so without this every
  # stream.<module> grows forever even with healthy consumers. 0 disables.
  STREAM_MAXLEN: ${STREAM_MAXLEN:-100000}
  # ت‑3: where the port-less processes stamp their liveness, and how stale
  # that stamp may get. Listed in the SHARED env block on purpose even though
  # only four services beat -- `app` and `migrate` ignore it, and the
  # alternative (two more per-service environment blocks) would be a second
  # place for the directory to drift out of agreement with the healthcheck
  # command that reads it.
  HEARTBEAT_DIR: ${HEARTBEAT_DIR:-/tmp/aizzak-heartbeat}
  HEARTBEAT_MAX_AGE_S: ${HEARTBEAT_MAX_AGE_S:-300}
  PROVIDER_ROUTING: ${PROVIDER_ROUTING:-{"llm":{"default":{"provider":"ollama","model":"gemma3:1b"}},"embedding":{"default":{"provider":"embedding-local","model":"sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"}}}}
  OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost}
  MCP_ALLOWED_TRANSPORTS: ${MCP_ALLOWED_TRANSPORTS:-http,sse}
  OAUTH_REFRESH_SKEW_S: ${OAUTH_REFRESH_SKEW_S:-60}
  USAGE_ROLLUP_PERIODS: ${USAGE_ROLLUP_PERIODS:-day,month}
  USAGE_DEFAULT_LIMITS: ${USAGE_DEFAULT_LIMITS:-{"tokens":{"month":5000000},"cost_micros":{"month":50000000}}}

x-app-logging: &app-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      # ── Capacity 0.6: the service name, carried INSIDE the log file ───────
      # The json-file driver stamps the named container labels onto every line
      # it writes, as `"attrs":{…}` next to `log`/`stream`/`time` (measured on
      # this host before the collector was designed around it). Compose already
      # applies both of these labels to every container it creates, so this ONE
      # line -- in the anchor every service in this file merges -- is what lets
      # `alloy` label each line with the service that wrote it while holding
      # nothing but a READ-ONLY bind of the log directory.
      #
      # ⚠️ The alternative is the published recipe: mount /var/run/docker.sock
      # into the collector so it can ask the API for container names. That is
      # root on the host, the same capability step 0.3 put `cadvisor` behind an
      # opt-in profile to avoid granting for free -- and 0.6, unlike container
      # metrics, cannot be opt-in. See `deploy/alloy/config.alloy`'s header.
      #
      # ⚠️ Changing a `logging:` option requires RECREATING a container; a
      # running one keeps the options it was created with. `docker compose up
      # -d` does that, `restart` does not -- a stack restarted rather than
      # recreated ships lines with no `attrs` and lands them all unlabelled.
      labels: "com.docker.compose.service,com.docker.compose.project"

# `host.docker.internal` -- which OLLAMA_BASE_URL defaults to above -- is a
# Docker DESKTOP convenience that does not exist on Linux Docker: the name has
# no resolver entry inside the container, so every LLM call died with
# `ConnectError [Errno -2] Name or service not known` while Ollama sat healthy
# on the host serving gemma3:1b. `host-gateway` is Docker's documented Linux
# equivalent -- it substitutes the bridge gateway address at container create.
#
# Applied to `app` and the three `worker-*` services only: they are the
# processes that call an LLM. `migrate` and `outbox-relay` share the same env
# block but reach nothing outside the Compose network, and a host route they
# never use is a hole for free.
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

# ── The three Streams consumers (08 §2/§4) ────────────────────────────────
# Everything the three `worker-*` services share. What differs per service is
# exactly one environment key (`WORKER`) and, for `media` alone, a profile.
#
# ⭐ This used to be ONE service parameterised by `WORKER`, which made the
# declared topology unreachable: `docker compose up -d worker` twice with two
# values is the SAME container recreated, so only one consumer could run at a
# time and "one module's backlog cannot starve another's" was true on paper
# only. Splitting was tracked as a deferred decision in
# docs/stream-topology-plan.md §6-أ with one named precondition -- a first
# MEASURED containerised boot of `knowledge` -- which docs/log/3.105.md met.
#
# ⚠️ The depends_on set below is deliberately WIDER than the old `worker`
# service's, which named neither `minio` nor `vault` even though every worker
# resolves its MinIO credentials out of Vault, and named no `qdrant` at all.
# That never showed on a full `docker compose up -d` (those services boot
# anyway, unasked) and only bites when an operator names ONE service on the
# command line -- which is exactly the §3.111 defect, found live in §3.110,
# where `pgbouncer` was missing here for the same reason. The `qdrant` half of
# that gap in `app` -- flagged here and left unfixed since §3.133 -- is closed
# in the `app` service below, in the same step that gave `qdrant` a
# healthcheck to depend on.
x-worker-service: &worker-service
  depends_on:
    ollama-bridge:
      condition: service_started
    # This edge was MISSING until §3.111 even though DATABASE_URL has named
    # `pgbouncer:6432` all along -- see the note on `outbox-relay`.
    #
    # `service_healthy` since ت‑3: the pooler had no healthcheck at all, so
    # `service_started` was the strongest condition expressible here, and
    # §3.111 recorded that looseness in writing ("started != accepting
    # connections", "adding a pgbouncer healthcheck is a separate decision").
    # That decision is now made, so the edge says what it always meant.
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    # Likewise ت‑3: `service_started` here was never a choice either -- Qdrant
    # had no healthcheck, and a container whose HTTP port is not open yet
    # satisfies "started". Every worker writes vectors, so readiness is what
    # the edge is for.
    qdrant:
      condition: service_healthy
    vault:
      condition: service_healthy
    embedding:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    vault-bootstrap:
      condition: service_completed_successfully
  command: ["python", "-m", "app.workers.main"]
  restart: unless-stopped

# Merged INTO `environment:` (not into the service), alongside *app-env.
x-worker-env: &worker-env
  DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-aizzak}

# ── liveness for the four processes that expose no port (ت‑3) ──────────────
# `worker-memory`/`worker-knowledge`/`worker-media`/`outbox-relay` run a
# blocking loop and listen on nothing, so there is no endpoint to curl. Each
# stamps a file once per completed cycle and `python -m app.ops.healthcheck
# <name>` reads its age -- see `framework/observability/heartbeat.py` for why
# a file rather than a port, and `HealthSettings` for why the default
# tolerance is 300 s rather than something that looks tighter.
#
# Only the TIMING is shared here; each service passes its own name, because a
# per-process file is precisely what stops a dead process from riding on a
# live sibling's beat (the ت‑7 orphan, which consumed happily from `cg.memory`
# while running deleted code).
#
# `start_period: 90s` covers the slowest of the four boots (the knowledge
# worker resolves MinIO credentials out of Vault before its first read), and
# failures inside it never count toward `retries`.
x-heartbeat-healthcheck: &heartbeat-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 90s

services:
  # ────────────────────────────── data plane ──────────────────────────────
  postgres:
    image: postgres:16
    # ⚠️ THREE OVERRIDES, ALL THREE ABOUT OBSERVING THE SERVER, NONE ABOUT
    # TUNING IT (capacity step 0.4, docs/capacity-plan.md §5 Wave 0). The
    # plan's step 2.1 will set shared_buffers/work_mem/max_wal_size and the
    # rest from a COMPOSED config file and delete this `command:`; those knobs
    # are deliberately absent here, because risk `م‑8` is "tuning starts
    # before the baseline exists" and a baseline measured on an already-tuned
    # server cannot answer whether the tuning helped. The instrument goes in
    # first; the knobs it justifies are turned in 2.1.
    #
    # shared_preload_libraries is a START-time setting -- a running cluster
    # does not pick it up on reload, so an existing deployment needs
    # `docker compose up -d postgres` (a restart) after this change, and then
    # `CREATE EXTENSION` once (deploy/postgres/initdb/20-extensions.sh runs
    # only on a fresh volume; `python -m app.ops.slow_queries` prints the
    # exact one-liner for an existing one).
    #
    # max=10000 rather than the 5000 default: 10 module schemas' SQL adapters
    # plus Alembic's own DDL plus the smoke/live suites is already thousands
    # of distinct statements, and an overflow does not fail loudly -- it
    # silently discards the least-executed entries and the report reads as if
    # complete. `pg_stat_statements_info.dealloc` is what catches that, and
    # `slow_queries top` prints it on every report for exactly this reason.
    # track=top (the default, stated rather than inherited): nested statements
    # inside functions are not this codebase's cost -- every query comes from
    # a SQLAlchemy adapter at the top level.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=top
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aizzak}
      # Consumed by deploy/postgres/initdb/10-roles.sh, which creates the
      # four application roles. Role creation needs cluster privilege that
      # aizzak_owner deliberately does not hold, so it belongs to init, not
      # to a migration and not to app.ops.provision (01 §6).
      AIZZAK_OWNER_PASSWORD: ${AIZZAK_OWNER_PASSWORD:?set AIZZAK_OWNER_PASSWORD in .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set APP_RW_PASSWORD in .env}
      OUTBOX_RELAY_PASSWORD: ${OUTBOX_RELAY_PASSWORD:?set OUTBOX_RELAY_PASSWORD in .env}
      # retention_sweeper (P1-5, p1-hardening-plan.md §3 step 8): SELECT/DELETE
      # on the three unbounded platform ledgers, nothing else. No standing
      # service authenticates as this role -- `python -m app.ops.retention` is
      # a manually-invoked one-shot tool (see 08-local-runbook.md §4.3) -- but
      # `app.ops.provision`'s own `_require_roles` check (run by the `migrate`
      # service below) fails fast on it BEFORE any migration if the role does
      # not already exist, so it must be created here regardless.
      RETENTION_SWEEPER_PASSWORD: ${RETENTION_SWEEPER_PASSWORD:?set RETENTION_SWEEPER_PASSWORD in .env}
      # metrics_reader (P1-3, p1-hardening-plan.md §3 step 10): SELECT-only on
      # platform.outbox, nothing else -- the `/metrics` endpoint's own read.
      # `app_rw` is INSERT-only there (provision.py), so this is a role of its
      # own rather than a widened `app_rw` grant. UNLIKE retention_sweeper,
      # this IS a standing consumer -- the `app` service below, every scrape --
      # the same footing `outbox_relay` stands on.
      METRICS_READER_PASSWORD: ${METRICS_READER_PASSWORD:?set METRICS_READER_PASSWORD in .env}
      # transit_rotator (P1-9, p1-hardening-plan.md §3 step 12): SELECT plus
      # column-scoped UPDATE (the ciphertext column alone) on the three
      # Transit-ciphertext-bearing tables, nothing else. No standing service
      # authenticates as this role -- `python -m app.ops.rotate_transit` is a
      # manually-invoked one-shot tool, the `retention_sweeper` footing -- but
      # `app.ops.provision`'s own `_require_roles` check fails fast on it
      # BEFORE any migration if the role does not already exist, so it must
      # be created here regardless.
      TRANSIT_ROTATOR_PASSWORD: ${TRANSIT_ROTATOR_PASSWORD:?set TRANSIT_ROTATOR_PASSWORD in .env}
      # workspace_purger (BE-ADM-014): SELECT/DELETE on every tenant table a
      # purged workspace's content lives in, plus column-scoped SELECT/UPDATE
      # on workspace.workspaces/workspace.users and SELECT/INSERT on
      # platform.admin_audit_log. No standing service authenticates as this
      # role -- `python -m app.ops.purge` is a manually-invoked one-shot tool,
      # the `retention_sweeper`/`transit_rotator` footing -- but
      # `app.ops.provision`'s own `_require_roles` check fails fast on it
      # BEFORE any migration if the role does not already exist, so it must
      # be created here regardless.
      WORKSPACE_PURGER_PASSWORD: ${WORKSPACE_PURGER_PASSWORD:?set WORKSPACE_PURGER_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${HOST_PORT_POSTGRES:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-aizzak}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    <<: *app-logging

  # ⚠️ THE POOLER IS CONFIGURED ENTIRELY FROM THE ENVIRONMENT BELOW. There is
  # no pgbouncer.ini in this repository, and that is deliberate: edoburu's
  # entrypoint GENERATES /etc/pgbouncer/pgbouncer.ini from these variables at
  # container start, so a checked-in file would either be ignored (confusing)
  # or override them (a second source of truth). 7.3 deleted the 0-byte
  # `deploy/pgbouncer/pgbouncer.ini` that had sat here since Phase 1 --
  # referenced by nothing, mounted nowhere, and reading for all the world
  # like the pooler's configuration while containing none of it.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Transaction pooling (D-21). OPS-02's other half -- asyncpg's
      # statement_cache_size=0 -- is enforced in create_engine's connect
      # args for EVERY engine, so it holds for the app, the workers, the
      # relay and the migrator alike.
      DB_HOST: postgres
      DB_PORT: "5432"
      # This image listens on 5432 by default; 08 §2 fixes the pooler at
      # 6432 and every DATABASE_URL in this file names that port.
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
      # Named prepared statements are disabled application-side; leaving
      # this at 0 keeps pgbouncer from pretending otherwise.
      MAX_PREPARED_STATEMENTS: "0"
      ADMIN_USERS: ${POSTGRES_SUPERUSER:-postgres}
      AUTH_USER: ${POSTGRES_SUPERUSER:-postgres}
      AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$$1
      DB_USER: ${POSTGRES_SUPERUSER:-postgres}
      DB_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    ports:
      - "127.0.0.1:${HOST_PORT_PGBOUNCER:-16432}:6432"
    # ⚠️ IT CROSSES THE LINK (ت‑3, docs/operational-findings.md §3) -- this is
    # the `nginx` healthcheck's reasoning applied to the pooler, and it is the
    # difference that makes the edge below worth upgrading. `pg_isready -p
    # 6432` was the obvious candidate and was REJECTED after measuring it: it
    # reports "accepting connections" the moment pgbouncer's own listener is
    # up, which is barely more than the `service_started` it would replace.
    # A pooler that accepts clients while it cannot reach Postgres is the
    # exact 502-shaped failure §3.75's bug #10 taught this file to probe for,
    # so this opens a REAL server connection through the pool and runs
    # `select 1` on it.
    #
    # The credential is the pooler's OWN `AUTH_USER`/`DB_PASSWORD`, read from
    # this container's environment at check time -- `$$` keeps Compose from
    # interpolating it, so nothing sensitive enters the rendered config that
    # `docker compose config` prints. Only the database NAME is interpolated
    # here, and it is not a secret.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$$DB_PASSWORD\" psql -h 127.0.0.1 -p 6432 -U \"$$DB_USER\" -d ${POSTGRES_DB:-aizzak} -tAc 'select 1' > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    <<: *app-logging

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    <<: *app-logging

  minio:
    # Isolated by construction: its own volume and its own root credentials.
    # The opt-in bucket-scoped live-test account is provisioned by
    # `minio-bootstrap`; it never reuses the root identity.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${HOST_PORT_MINIO:-19000}:9000"
      - "127.0.0.1:${HOST_PORT_MINIO_CONSOLE:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    <<: *app-logging

  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${HOST_PORT_QDRANT:-16333}:6333"
    # خطوة السعة 0.1 — **عُطلٌ مُقاسٌ لا احتياطٌ نظريّ.** المستأجرُ الواحد
    # مجموعةٌ مستقلّة (`kn-<workspace_id>`)، وكلُّ مجموعةٍ تفتح واصفاتِ
    # ملفّاتٍ لأجزاء RocksDB الخاصّة بها. والحدُّ الليّن داخل هذه الحاوية
    # كان **1024** (الافتراضُ الموروث عن Docker)، فسقطت أداةُ البذر عند
    # المجموعة **السابعة** بـ`Too many open files (os error 24)` — أي أنّ
    # المنصّة لم تكن تحتمل مئتَي مساحة عمل، وهو هدفُ `§0` نفسُه، ولا كان
    # لأحدٍ أن يعرف ذلك قبل أوّلِ محاولةِ استضافتها. الحدُّ الصلبُ كان
    # 1,048,576 أصلاً، فالرفعُ لا يطلب امتيازاً جديداً.
    #
    # 65536 لا «غير محدود»: توثيقُ Qdrant نفسُه يوصي بهذا المقدار، وحدٌّ
    # مرتفعٌ **معلومٌ** يُبقي الاستنفادَ خطأً يُقرأ بدل أن يُصبح استنزافاً
    # صامتاً لجدول الواصفات على المضيف.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    # ت‑3 (docs/operational-findings.md §3). `/readyz`, not `/livez`: the
    # first means "every shard can serve", the second only "the process is
    # up" -- and it is readiness the `depends_on` edges below now gate on.
    #
    # ⚠️ THE SHAPE IS FORCED BY THE IMAGE, not chosen. `qdrant/qdrant:v1.13.4`
    # ships neither `curl` nor `wget` (measured), so the probe is bash's own
    # `/dev/tcp` speaking one line of HTTP. `CMD` + explicit `bash`, never
    # `CMD-SHELL`: that would run `/bin/sh`, and `/dev/tcp` is a bash feature
    # -- a dash-backed `sh` fails it every time, which would read as an
    # unhealthy Qdrant rather than as a broken probe.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.1 200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    <<: *app-logging

  # The central embedding service (2.10): loads
  # sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 ONCE and
  # serves POST /embed + GET /health over a small internal HTTP API
  # (services/embedding/app.py). INTERNAL ONLY -- `expose`, not `ports`: it
  # is never published to the host and never enters an nginx upstream, the
  # same trust boundary as Postgres/Redis/Qdrant above (tenant text crosses
  # the internal Docker network to reach it, never the public one).
  embedding:
    image: aizzak/embedding:${EMBEDDING_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: services/embedding/Dockerfile
    environment:
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_DIM: "384"
      EMB_BATCH: "8"
      # The token at which the model stops reading a text. Stated here, not
      # left to the checkpoint: `paraphrase-multilingual-MiniLM-L12-v2` ships
      # `sentence_bert_config.json: max_seq_length = 128` while its
      # `config.json` reaches 512, so an unset value embeds a QUARTER of a
      # full-size chunk and silently discards the rest (measured: 79% of a
      # 354-word Arabic chunk never reached its vector). Must stay equal to
      # the adapter-side `EmbeddingServiceSettings.embedding_max_input_tokens`
      # -- unlike the model name, a drift between them raises nothing; check
      # it against `GET /health`, which reports the value in force.
      # ⚠️ Changing this invalidates every vector already indexed.
      EMB_MAX_SEQ_LEN: "512"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    <<: *app-logging

  # ⚠️ PERSISTENT `file` storage (release-blockers-plan.md §3 step 1), NOT
  # `-dev` mode. `-dev` kept KV, Transit and the AppRole entirely in memory --
  # a restart wiped them, and a regenerated Transit key cannot decrypt
  # ciphertext produced under the old one (permanent tenant-credential loss,
  # `CipherRef`/INV-C2/INV-I1). `deploy/vault/start.sh` REPLACES this image's
  # own entrypoint: it starts `vault server` itself, then drives it through
  # `operator init`/`operator unseal` in the SAME process tree before the
  # healthcheck below can ever see success -- see that script's header for
  # why this can't be done through the stock entrypoint, and for the
  # single-local-host security trade it documents (the unseal key + root
  # token live in the `vault-init` volume, plaintext, `chmod 600`; there is
  # no KMS here to auto-unseal against). NOT acceptable for real production
  # -- see docs/quickstart.md §5 for the upgrade path.
  vault:
    image: hashicorp/vault:1.18
    entrypoint: ["/bin/sh", "/vault/scripts/start.sh"]
    environment:
      # Compose is a multi-container network: the per-service CONTAINER is
      # the isolation boundary, so Vault binds 0.0.0.0 inside its own
      # container exactly like every sibling service in this stack does.
      VAULT_LISTEN_ADDR: 0.0.0.0
    volumes:
      - ./deploy/vault/server.hcl:/vault/config/server.hcl:ro
      - ./deploy/vault/start.sh:/vault/scripts/start.sh:ro
      - vault-data:/vault/data
      - vault-init:/vault/init
    ports:
      - "127.0.0.1:${HOST_PORT_VAULT:-18200}:8200"
    # ⚠️ MEANS "usable", not just "listening" (release-blockers-plan.md §3
    # step 1 requirement 3). `vault status` -- measured live against this
    # exact image (hashicorp/vault:1.18) -- exits 1 while nothing is
    # listening yet, 2 while SEALED (listening, but not usable: exactly the
    # state right after a `restart` before start.sh re-unseals it), and only
    # 0 once unsealed. So a sealed Vault genuinely reports unhealthy here,
    # which is what lets `vault-bootstrap`'s and `app`'s
    # `depends_on: {condition: service_healthy}` keep meaning what the rest
    # of this file assumes. `start_period` covers first-boot `operator init`
    # (a few seconds, measured), not steady-state re-unseal.
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    <<: *app-logging

  # ─────────────────────────── one-shot bootstrap ──────────────────────────
  # Each runs to completion and exits; `app` waits on both exits. Two
  # services rather than one because each uses its own vendor's pinned CLI
  # image -- the alternative was fetching an unversioned binary at boot,
  # which would defeat the point of pinning everything else.
  vault-bootstrap:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      # No default here on purpose: the dev root token no longer exists
      # (persistent Vault -- release-blockers-plan.md §3 step 1). Leave this
      # BLANK -- the normal case -- and bootstrap.sh reads the real root
      # token out of the vault-init volume mounted below, which start.sh
      # wrote there at `operator init` time. Set it only for a manual
      # operator override (e.g. a token minted for this one run).
      VAULT_TOKEN: ${VAULT_TOKEN-}
      AIZZAK_OWNER_PASSWORD: ${AIZZAK_OWNER_PASSWORD}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Pins the AppRole role_id so .env's VAULT_ROLE_ID cannot drift from
      # Vault's. Persistent storage means the role (and its role_id) now
      # SURVIVES a restart on its own; this pin's remaining job is the
      # first-ever boot (nothing to agree with yet) and recovering cleanly
      # if the vault-data volume is ever wiped without also editing .env.
      # role_id is non-secret (05 §2). Unset in a real deployment.
      AIZZAK_APPROLE_ROLE_ID: ${VAULT_ROLE_ID-}
    volumes:
      - ./deploy/vault/bootstrap.sh:/bootstrap.sh:ro
      - ./deploy/vault/app-policy.hcl:/app-policy.hcl:ro
      # Read-only: the root token this container needs to authenticate, but
      # never the unseal key -- bootstrap.sh has no business unsealing Vault.
      - vault-init:/vault-init:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
    <<: *app-logging

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-workspace-files}
      # The live test harness's bucket + bucket-scoped service account
      # (bootstrap.sh's second half). Default OFF: a deployment must not mint
      # test credentials. A developer turns it on in `.env`.
      MINIO_TEST_ACCOUNT_ENABLED: ${MINIO_TEST_ACCOUNT_ENABLED:-false}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET:-aizzak-test}
      MINIO_TEST_ACCESS_KEY: ${MINIO_TEST_ACCESS_KEY:-aizzak_test}
      MINIO_TEST_SECRET_KEY: ${MINIO_TEST_SECRET_KEY:-aizzak-test-secret}
    volumes:
      - ./deploy/minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"
    <<: *app-logging

  # Migrations + grants (01 §6's operational step). Runs as aizzak_owner,
  # DIRECTLY against postgres rather than through pgbouncer: DDL under
  # transaction pooling is a needless hazard, and this is a one-shot process
  # with exactly one connection.
  migrate:
    <<: [*app-image, *app-logging]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+asyncpg://aizzak_owner:${AIZZAK_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-aizzak}
    command: ["python", "-m", "app.ops.provision"]
    restart: "no"

  # ─────────────────────────────── app plane ───────────────────────────────
  # ── the host's Ollama, made reachable from the Compose network ───────────
  # WHY THIS EXISTS. Ollama runs as a native WSL systemd service bound to
  # 127.0.0.1:11434. A container has its own network namespace, so its
  # localhost is not the WSL host and it cannot reach that listener directly.
  #
  # This forwarder joins the WSL host namespace (`network_mode: host`) and
  # re-publishes Ollama on the docker0 gateway address that
  # `host.docker.internal` already resolves to.
  # The local WSL `.env` points `OLLAMA_BASE_URL` at this bridge; `app` and
  # every worker consume the same shared environment anchor.
  #
  # `bind=172.17.0.1` is the security-relevant half and is NOT cosmetic: the
  # obvious `TCP-LISTEN:...` on 0.0.0.0 would, under mirrored networking,
  # publish an unauthenticated Ollama to the whole LAN. Bound to the bridge
  # address, only containers on this host can reach it.
  #
  # It LISTENS ON 11435, not 11434, and that is forced rather than chosen:
  # the native WSL listener already owns 11434, so the bridge listens on
  # 11435 and forwards to 11434. The local `.env` therefore points containers
  # at `host.docker.internal:11435`; the live harness reaches native Ollama
  # directly at `127.0.0.1:11434`. The generic Compose fallback remains 11434
  # for hosts where Ollama is reachable there without this WSL bridge.
  ollama-bridge:
    image: alpine/socat:1.8.0.3
    network_mode: host
    command: >-
      TCP-LISTEN:11435,bind=172.17.0.1,fork,reuseaddr
      TCP:127.0.0.1:11434
    # ت‑3 (docs/operational-findings.md §3), and END-TO-END on purpose: it
    # enters the bridge on 11435 and comes back out of the native Ollama on
    # 11434. A socat that is listening while its target is dead forwards
    # nothing, so "the listener is up" (`nc -z`) would report the one state
    # this service has no other way of announcing as healthy.
    #
    # 📌 NOTHING gates on this being healthy, deliberately. `app` and the three
    # workers keep `condition: service_started` on this service (below):
    # Ollama is a NATIVE WSL unit outside Compose's lifecycle, and making the
    # whole stack refuse to boot because a host service is down would trade a
    # visible degradation for an invisible one. Unhealthy here means "LLM
    # calls will fail", surfaced in `docker compose ps` instead of only in a
    # request's error.
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://172.17.0.1:11435/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    <<: *app-logging
    restart: unless-stopped

  app:
    <<: [*app-image, *app-logging, *host-gateway]
    depends_on:
      ollama-bridge:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # ⚠️ THIS EDGE WAS MISSING, declared as a debt in §3.133 and again in the
      # `x-worker-service` note above ("`app` still carries the `qdrant` half
      # of that same gap; flagged, not fixed here"). It is the §3.111 shape
      # exactly: `QDRANT_URL` has named `qdrant:6333` since Phase 1 and the
      # API's RAG path reads that store, but the pooler-style edge was never
      # declared -- invisible on a full `up -d`, and a crash-loop the moment
      # an operator runs `docker compose up -d app` on its own. Closed here
      # rather than in a later step because ت‑3 is what gave `qdrant` a
      # healthcheck to depend on; adding the edge and the condition it needs
      # in two separate changes would have left one of them meaningless.
      qdrant:
        condition: service_healthy
      vault:
        condition: service_healthy
      embedding:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vault-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      # app_rw: NOINHERIT, no BYPASSRLS, not a table owner -- the RLS policy
      # is what confines it (01 §3). Through pgbouncer, never port 5432.
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-aizzak}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # P1-3 (p1-hardening-plan.md §3 step 10): `/metrics`'s OWN read of
      # platform.outbox -- app_rw above is INSERT-only there (provision.py),
      # so this is a SEPARATE, SELECT-only role/connection, never a widened
      # app_rw grant. Every gunicorn worker sibling (WEB_CONCURRENCY) queries
      # this independently and gets the identical answer, since it re-reads
      # Postgres fresh on each scrape rather than caching anything in-process
      # (docs/log/3.89.md's whole point).
      METRICS_DATABASE_URL: postgresql+asyncpg://metrics_reader:${METRICS_READER_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-aizzak}
      # Wave 0 step 0.2 (docs/capacity-plan.md). Set HERE and not in the
      # shared `x-app-env` block, deliberately: this switches
      # `prometheus_client` into multiprocess mode for whatever process reads
      # it, and only `app` runs several siblings behind one scrape target. The
      # four workers and the relay expose no HTTP listener at all, so the same
      # variable there would buy mmap files nobody ever reads and a directory
      # that grows for the life of the container.
      #
      # A path under /tmp, never a volume: the files describe THIS container's
      # living processes, and `deploy/gunicorn.conf.py` wipes the directory at
      # arbiter boot precisely so a restart cannot serve the sum of this run
      # and the last one.
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/aizzak-prom}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── memory ──────────────────────────────────────────────────────────────
  # In the DEFAULT stack: `docker compose up -d` boots it with everything
  # else. Measured live, 138 s on an idle stream with RestartCount = 0
  # (docs/log/3.105.md §5-ب), after the stream-topology-plan.md step-1 fix
  # removed the 2 s socket timeout that used to kill every consumer at the
  # 5 s mark of quiet.
  worker-memory:
    <<: [*app-image, *app-logging, *host-gateway, *worker-service]
    environment:
      <<: [*app-env, *worker-env]
      WORKER: memory
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "memory"]

  # ── knowledge ───────────────────────────────────────────────────────────
  # In the DEFAULT stack too, and this is the change docs/log/3.105.md §5-ج
  # earned: first containerised boot in the project's history, ≥ 5 minutes
  # idle with RestartCount = 0. Adapter-complete since steps 15-16 of
  # docs/deferred-adapters-plan.md (`build_knowledge_worker_from_env` binds
  # MinIO out of Vault and composes WorkerDocumentContentResolver).
  #
  # Until it booted by default, `POST /files` uploaded but never INDEXED on a
  # plain `up -d` -- the whole RAG path silently ended at the outbox.
  worker-knowledge:
    <<: [*app-image, *app-logging, *host-gateway, *worker-service]
    environment:
      <<: [*app-env, *worker-env]
      WORKER: knowledge
      # The SECOND service to raise the tolerance, for the reason `worker-
      # media` raises it and on the same arithmetic. `F-1`
      # (rag-summarization-fix-plan.md) gave the summarisation map-reduce its
      # own `Limits.summarize_timeout_s` (300 s), so ONE provider call in a
      # summary build may legitimately occupy this loop for as long as one
      # image generation occupies the media loop -- and a beat cannot land
      # while a handler is running. At 300 s here, a single map call running
      # to its full budget would be reported unhealthy for finishing exactly
      # on time.
      #
      # It is a tolerance and not a licence: `F-3` makes the build write a
      # progress row and beat before EVERY provider call, so the longest
      # legitimate silence is one call rather than a whole build, and
      # `Limits.summarize_job_max_duration_s` (1,800 s) ends a build that is
      # genuinely stuck instead of leaving this column to notice it.
      HEARTBEAT_MAX_AGE_S: ${HEARTBEAT_MAX_AGE_S_KNOWLEDGE:-600}
    # ⭐ TWO, and the only worker here that runs more than one. This is the
    # owner's answer to `summarization-scenarios-implementation-plan.md` §10
    # ق-و -- option (ب), the cheap half of `F-1` -- and it is the whole of
    # it: no second stream, no fourth worker, no change to the event
    # catalogue's binding table.
    #
    # **The defect.** `cg.knowledge` is consumed by ONE process running ONE
    # loop that handles one message at a time, and the summary handler is
    # the only handler in any of the three workers that may legitimately
    # occupy that loop for `Limits.summarize_job_max_duration_s` (1,800 s).
    # For that whole half hour nothing else on `stream.knowledge` is
    # handled -- so a file uploaded meanwhile is registered, is never
    # indexed, and is absent from every search that follows, while this
    # container stays `Up` and this healthcheck stays green (`F-3` beats
    # before every provider call, which is exactly what keeps the column
    # honest about the PROCESS while the QUEUE starves).
    #
    # **Why a replica is enough, and why it is safe here and would not have
    # been a year ago.** Redis distributes a group's entries ACROSS its
    # consumers, so the second process reads the next message while the
    # first is mid-build. Four properties have to hold, and each is a fact
    # about code elsewhere rather than a hope about this key:
    #
    #   1. Distinct identity. `workers/bootstrap._consumer_name` is
    #      `<prefix>.<hostname>.<pid>`, and Compose gives each replica its
    #      own container and hostname -- two consumers, not one name read
    #      twice.
    #   2. No stolen build. `knowledge_stale_idle_ms` (`F-4`) raises THIS
    #      worker's death threshold above the longest legitimate build, so a
    #      sibling's sweep cannot call a busy replica a corpse and
    #      `XAUTOCLAIM` its message: the double build that would otherwise
    #      follow is refused by nothing downstream (`SummaryJob.start` is
    #      deliberately re-entrant).
    #   3. No double work on redelivery. The idempotency claim is keyed
    #      `(consumer_group, event_id)` -- the GROUP, which both replicas
    #      share -- so an entry reclaimed by the other one is a clean
    #      return, not a second build.
    #   4. Independent health. The heartbeat file lives in the container's
    #      own writable layer and is never a mount
    #      (`framework/observability/heartbeat.py` says why), so each
    #      replica is judged on its own beat. A shared path would let a dead
    #      replica ride a live sibling's -- the ت-7 orphan, restored.
    #
    # `F-5` is the other precondition: at `count=1` a replica takes one
    # message and leaves the rest READABLE. Reading ten would have left the
    # sibling nothing to read and made this key decorative.
    #
    # **What it does not buy: isolation.** Two concurrent builds block
    # indexing exactly as one did. (أ) -- a dedicated stream and worker --
    # is the answer to THAT, and ق-و's own criterion for buying it is an
    # indexing lag past two minutes with both replicas active; 08 §2 carries
    # the command that reads it.
    deploy:
      replicas: 2
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "knowledge"]

  # ── media ───────────────────────────────────────────────────────────────
  # In the DEFAULT stack since docs/log/3.134.md, and the profile that used to
  # sit here is gone for exactly the one reason it was ever promised to go:
  # its first containerised boot in the project's history was measured.
  # 45 min 46 s on an idle stream, RestartCount = 0, zero error-level lines,
  # and -- the part `docker ps` cannot tell you -- `XINFO CONSUMERS
  # stream.media cg.media` showed one registered consumer with `pending 0` and
  # an `idle` of ~5 s, i.e. a live XREADGROUP cycle, not a wedged process
  # holding a container `Up`.
  #
  # Adapter-complete since steps 19-20 of docs/deferred-adapters-plan.md
  # (docs/log/3.103.md · docs/log/3.104.md); .env.example's PROVIDER_ROUTING
  # routes `image` at `image:openai`, which IS wired. That was already true
  # while it stayed profiled -- capability was never the question, evidence
  # was, because this repo has twice been wrong about "should boot": `memory`
  # was documented as working while it died at five seconds of quiet, and
  # `knowledge` sat "wired" for weeks before anyone ran it.
  #
  # A missing per-workspace `image:openai` credential does NOT block the
  # boot: it is resolved per job by ResolveCredential and fails that job
  # loudly. An `image` route naming an UNWIRED provider does stop the process
  # dead at build time, on purpose.
  worker-media:
    <<: [*app-image, *app-logging, *host-gateway, *worker-service]
    environment:
      <<: [*app-env, *worker-env]
      WORKER: media
      # The ONE service that raises the tolerance, and the reason is
      # structural rather than a fudge: a beat cannot land while a handler is
      # still running, and one image-generation job may legitimately occupy
      # this loop for `Limits.media_timeout_s` (300 s). 600 keeps a busy media
      # worker from being reported unhealthy for doing its job -- a false
      # alarm here would cost more than the extra five minutes of detection
      # latency, because an operator who learns to ignore this column loses
      # the other three checks with it.
      HEARTBEAT_MAX_AGE_S: ${HEARTBEAT_MAX_AGE_S_MEDIA:-600}
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "media"]

  # SINGLE instance (08 §2). Consumer groups are still created at `$`
  # (stream tail, redis_streams.py:235, unchanged) -- that fact is why a
  # boot-order rule ("workers before the relay") used to be needed here at
  # all (08 §4's old rule, the live 5.1-ج lesson). It no longer is: since
  # the stream-topology-plan.md fix (log/3.107.md), build_relay_from_env
  # returns an ensure_topology() closure that this process awaits before
  # its own run_forever(), so every group exists before this relay's first
  # publish -- on Compose, RunPod, and bare `python -m` alike. See 08 §4.
  outbox-relay:
    <<: [*app-image, *app-logging]
    depends_on:
      # ⚠️ THIS EDGE WAS MISSING (§3.111, discovered live in §3.110 phase A).
      # DATABASE_URL below has named `pgbouncer:6432` since Phase 1, but the
      # pooler was never declared here -- so `docker compose up -d
      # outbox-relay` (08 §3's OWN documented command) started the relay
      # WITHOUT it and the process crash-looped on `socket.gaierror: Name or
      # service not known`. A DNS-shaped error for a boot-order cause, which
      # sends the reader hunting in the network; `restart: unless-stopped`
      # then heals it silently the moment anything else starts the pooler,
      # so it reads as intermittent. Harmless on a full `docker compose up
      # -d` (the pooler boots anyway) -- which is exactly why it survived.
      # WAS `service_started`, and the comment here used to explain why: the
      # pooler defined no healthcheck, so "started" was the strongest thing
      # this edge could say, and §3.111 refused to smuggle a new healthcheck
      # in as a rider on a different fix ("adding a pgbouncer healthcheck is a
      # separate decision"). ت‑3 made that decision on its own terms, so the
      # looseness §3.111 recorded -- started != accepting connections -- is
      # gone rather than merely documented.
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # NOT `worker` -- it sits behind the `workers` profile (see above), and
      # a depends_on into a disabled profile is a config error. This edge was
      # never added for a different reason too: 08 §4 used to require
      # workers-before-relay on a brand-new stream (groups born at `$`, the
      # stream tail), which this depends_on could not have guaranteed anyway
      # -- a start-order edge races a startup event, it does not sequence
      # ensure_group() before the first XADD. That rule is gone now (see the
      # comment on `outbox-relay` above); this edge remains absent simply
      # because `worker` sits behind a disabled profile.
    environment:
      <<: *app-env
      # The relay's OWN role: SELECT/UPDATE on platform.outbox and nothing
      # else -- the mirror image of app_rw's INSERT-only grant there.
      DATABASE_URL: postgresql+asyncpg://outbox_relay:${OUTBOX_RELAY_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-aizzak}
    command: ["python", "-m", "app.workers.outbox_relay"]
    deploy:
      replicas: 1
    # ت‑3. The relay beats on CLEAN cycles only (`OutboxRelay.run_forever`),
    # which is the whole point here: a relay that cannot reach Postgres or
    # Redis keeps looping, doubling its backoff, and staying `Up` forever --
    # the state that was previously invisible everywhere except in a log line
    # nobody reads.
    healthcheck:
      <<: *heartbeat-healthcheck
      test: ["CMD", "python", "-m", "app.ops.healthcheck", "outbox-relay"]
    restart: unless-stopped

  # ─────────────────────────────── edge ───────────────────────────────────
  # Local TLS material (7.3). Same one-shot pattern as the vault/minio
  # bootstraps, on the SAME pinned image that consumes the output -- openssl
  # ships in nginx:1.27, so this needs nothing installed on the host. Skips
  # itself when a certificate is already present, which is also how an
  # operator supplies a real one: drop it in and this stays out of the way.
  nginx-certs:
    image: nginx:1.27
    volumes:
      - ./deploy/nginx/gen-cert.sh:/gen-cert.sh:ro
      - ./deploy/nginx/certs:/certs
    entrypoint: ["/bin/sh", "/gen-cert.sh"]
    restart: "no"
    <<: *app-logging

  nginx:
    image: nginx:1.27
    depends_on:
      app:
        condition: service_started
      nginx-certs:
        condition: service_completed_successfully
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/app-locations.conf:/etc/nginx/app-locations.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HOST_PORT_HTTP:-80}:80"
      - "${HOST_PORT_HTTPS:-443}:443"
    # ⚠️ AN EDGE HEALTHCHECK, AND IT IS MANDATORY (7.3, closing a 7.1 loose
    # end). Every other healthcheck in this file probes a service from INSIDE
    # itself -- `app`'s curls 127.0.0.1:8000 in its own container. That is
    # exactly why bug #10 (§3.75 decision (ط)) was so hard to see: nginx was
    # proxying to a dead address and answering 502 to the world while
    # `docker compose ps` reported every service healthy and the app's log
    # was full of 200s. NOTHING observed the link between the two.
    #
    # This check crosses that link. It leaves through nginx's own listener,
    # goes through the proxy configuration, reaches the app and comes back --
    # so a stale DNS resolution, a broken location block, a bad certificate
    # or a dead app all surface as an unhealthy EDGE instead of a silent 502.
    #
    # Both schemes are probed: :443 has its own certificate and TLS config
    # that :80 cannot vouch for. `-k` because the local certificate is
    # self-signed by construction -- this check asserts that TLS terminates
    # and proxies, not that a development certificate chains to a public CA.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/health && curl -fsSk https://127.0.0.1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    <<: *app-logging

  # ── Observability (Wave 0 step 0.3, docs/capacity-plan.md) ───────────────
  # `deploy/prometheus/alerts.yml` was written on 2026-07-30 and its own
  # header states the gap this block closes: "This is still NOT wired into
  # any running Prometheus/Alertmanager service -- no such service exists in
  # `docker-compose.yml`". Three reasoned thresholds and nothing evaluating
  # them, which is how ت-6 happened -- a DLQ gauge reading the wrong streams
  # for six weeks, invisible because nothing read the gauge.
  #
  # Five services, and only ONE publishes a host port. The trust boundary is
  # the same one `embedding` draws and `src/app/api/metrics.py`'s docstring
  # argues for: Prometheus holds operator information about the Outbox, the
  # DLQ and now every request this platform serves, so it stays on the
  # internal network with `expose`, never `ports`, and the nginx edge already
  # 404s `/metrics` before the catch-all proxy can reach it.
  prometheus:
    image: prom/prometheus:v3.13.2
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 15 days. Step 0.5's baseline is an 8-hour soak plus a 30-minute peak
      # run, and every later wave's acceptance criterion compares against it
      # -- so the window has to outlive the gap between running the baseline
      # and running the wave that cites it, while still being a bound rather
      # than the unlimited growth a default would give a machine that is
      # somebody's laptop.
      - "--storage.tsdb.retention.time=15d"
      # The rules are the point of this service; reloading them without
      # restarting it (POST /-/reload) is how an operator edits a threshold
      # during a load run without losing the series already collected.
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    <<: *app-logging

  # ⚠️ THE ONE SERVICE IN THIS BLOCK WITH A HOST PORT, and the deviation is
  # deliberate rather than drift. Step 0.3's text asks for both services to
  # be internal ("داخليّتان: `expose` لا `ports`"), which is exactly right
  # for Prometheus -- Grafana proxies it, and its /targets page is one
  # `docker compose exec` away. Applied to Grafana it would produce a
  # dashboard nobody can open, which is not a dashboard.
  #
  # So this follows the pattern this file already established for every
  # operator interface it has (postgres, pgbouncer, redis, minio, qdrant,
  # vault): bound to 127.0.0.1 with an offset port, never 0.0.0.0. That is
  # not the public edge -- the concern behind the plan's sentence -- it is
  # the "stable local operator/test interface" this file's own header names.
  # Recorded as a decision in docs/capacity-status.md, not left implicit.
  grafana:
    image: grafana/grafana:13.0.8
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Defaults to Grafana's own `admin`, which is fine for a loopback-only
      # binding on a developer machine and NOT fine anywhere else. Set it in
      # .env before this is reachable from anything but 127.0.0.1.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # This platform is offline by construction elsewhere (HF_HUB_OFFLINE,
      # TRANSFORMERS_OFFLINE on `embedding`); a metrics UI that phones
      # grafana.com on every start is an outbound call nobody asked for, and
      # on an air-gapped host it is a slow start-up for no benefit.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${HOST_PORT_GRAFANA:-13000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    <<: *app-logging

  # ح-3's direct evidence, and the reason step 0.2 deferred `cl_waiting` and
  # `sv_active` rather than reading them from the app: they live behind
  # pgbouncer's ADMIN console, which `admin_users` restricts to the Postgres
  # superuser. Putting that credential into the app container would undo the
  # whole point of `app_rw` (NOINHERIT, no BYPASSRLS, confined by RLS policy)
  # for the sake of two numbers. A sidecar that holds nothing else and talks
  # to nothing else is where a superuser credential can live honestly.
  #
  # It reaches the SAME admin console the pooler's own healthcheck already
  # uses, with the same identity -- no new grant, no new role, no widening of
  # anything that exists.
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.12.1
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      # ⚠️ `PGBOUNCER_EXPORTER_CONNECTION_STRING`, not `DATA_SOURCE_NAME`.
      # The latter is what most Prometheus exporters use and what this
      # service was first written with; v0.12.1 ignores it silently, keeps
      # its own default of `postgres://postgres:@localhost:6543/pgbouncer`,
      # and reports `pgbouncer_up 0` while logging "dial tcp [::1]:6543:
      # connect: connection refused" -- indistinguishable from a genuinely
      # dead pooler unless you read the address in the error. Caught by
      # bringing the service up rather than by reading about it; the flag's
      # own help text (`--pgBouncer.connectionString`) is the authority.
      #
      # `pgbouncer` at the end is the pooler's own virtual ADMIN database,
      # not a real one -- SHOW POOLS / SHOW STATS are answered by the pooler
      # itself and never reach Postgres.
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://${POSTGRES_SUPERUSER:-postgres}:${POSTGRES_SUPERUSER_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable
    expose:
      - "9127"
    # ⚠️ Probes the EXPORTER, deliberately not the pooler behind it. This
    # endpoint answers 200 with `pgbouncer_up 0` when pgbouncer is gone
    # (measured during step 0.3's acceptance run), and that is what has to
    # keep happening: a check that went unhealthy with the pooler would have
    # Compose restart this container mid-outage, and `AizzakPgbouncerDown`
    # reads a metric that only exists while it is running.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9127/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    <<: *app-logging

  # Redis holds the rate limiter's windows (wave 1), the WebSocket session
  # registry and every Stream in §7's topology. `maxmemory` is unset in this
  # deployment, so the interesting number is not "how full" but whether a key
  # was ever EVICTED -- silent data loss that surfaces much later as an
  # unexplained miss, and which nothing in this codebase currently notices.
  redis-exporter:
    image: oliver006/redis_exporter:v1.90.0-alpine
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9121/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped
    <<: *app-logging

  # ⚠️ OPT-IN, AND THE PROFILE IS A SECURITY DECISION rather than a
  # convenience. cAdvisor needs `/var/run/docker.sock` to name containers,
  # which is root-equivalent access to this host: anything that can talk to
  # that socket can start a privileged container. Step 0.5's 8-hour soak
  # genuinely needs per-container memory to see a leak's slope --
  # `process_resident_memory_bytes` is unavailable once
  # PROMETHEUS_MULTIPROC_DIR is set, by prometheus_client's design, so the
  # slope is only visible from OUTSIDE the process -- so the capability has
  # to exist. It is granted for the duration of a measurement:
  #
  #     docker compose --profile container-metrics up -d cadvisor
  #
  # and stopped again afterwards. `prometheus.yml` labels this target
  # `tier: optional` so its ordinary absence does not hold a target-down
  # alert firing forever.
  cadvisor:
    profiles: ["container-metrics"]
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      # Everything except memory/cpu is off: this exists for one panel, and
      # the disk/network collectors are what make cAdvisor expensive enough
      # to distort the very soak it is measuring.
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
      - "--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    <<: *app-logging

  # ── The log store and its collector (capacity 0.6) ────────────────────────
  # «سجلٌّ بصيغة JSON لكلّ خدمة … مجمَّعةٌ في مخزنٍ واحدٍ قابلٍ للبحث», and the
  # reason it is in the MEASUREMENT wave: when p99 rises for two minutes the
  # metric says THAT it happened and only the log says WHY, and without a
  # store that diagnosis is `docker logs` against eighteen containers whose
  # timestamps do not line up.
  #
  # Loki is `expose`-only, on the same trust boundary as `prometheus` and for
  # the same reason -- and one step stronger here, because these lines carry
  # far more than a counter does. Grafana proxies it; nothing else needs it.
  loki:
    image: grafana/loki:3.5.7
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    healthcheck:
      # `/ready` and NOT `/metrics` or the root: Loki answers HTTP long before
      # its ingester has joined the ring, and a collector that starts pushing
      # into that window gets 5xx it will not retry forever.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    <<: *app-logging

  # The collector. Reads every container's json-file log off a READ-ONLY bind
  # and pushes to Loki -- with NO Docker socket, which is the whole design and
  # is argued in full in deploy/alloy/config.alloy's header (short version: the
  # socket is root on the host, 0.3 put cadvisor behind an opt-in profile
  # rather than grant it for free, and 0.6 cannot be opt-in).
  alloy:
    image: grafana/alloy:v1.10.2
    depends_on:
      loki:
        condition: service_healthy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # ⚠️ READ-ONLY, and the only host path this container sees. Docker writes
      # every container's log to <id>/<id>-json.log under here; the service
      # name rides inside each line as `attrs` (see `x-app-logging` above), so
      # nothing needs to be asked of the Docker API.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Read positions. Without a persisted cursor, every restart re-ships the
      # whole retained history of every container and the store fills with
      # duplicates of lines it already holds.
      - alloy-data:/var/lib/alloy/data
    expose:
      - "12345"
    healthcheck:
      # ⚠️ `bash` and `/dev/tcp`, not `wget` -- the Alloy image ships NEITHER
      # wget NOR curl NOR nc (measured: the first version of this healthcheck
      # failed with `exec: "wget": executable file not found`, so the container
      # ran perfectly and reported itself unhealthy forever). `bash` IS there,
      # and its `/dev/tcp` pseudo-device is what turns it into an HTTP client;
      # `CMD-SHELL` would not work either, because /bin/sh here is dash and
      # /dev/tcp is a bash feature.
      #
      # `/-/ready` and not a bare TCP connect: Alloy binds the port before its
      # components have loaded, and a config it refuses to parse leaves a
      # process that accepts connections and collects nothing.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    <<: *app-logging

  # ── The load generator (capacity 0.1, blocker د‑3) ───────────────────────
  # `deploy/load/` was written before anything could run it: k6 is a Go binary,
  # not a dependency this project can vendor, and it did not exist on the
  # machine that wrote the harness. That single absence held the acceptance of
  # 0.1, the peak-load half of 0.4 and ALL of 0.5 -- five scenarios, a token
  # pool, a million-row seed and a threshold sheet, none of which had ever been
  # executed once.
  #
  # A profile, not a default service: this exists to be run by hand for thirty
  # minutes and then to go away again.
  #
  #     deploy/load/run.sh peak          # picks host k6 if present, else this
  #     LOAD_K6=docker deploy/load/run.sh peak
  #
  # ⚠️ It measures the platform from INSIDE the platform's own machine, which
  # a generator on separate hardware would not. Two consequences belong in
  # every report taken this way: the generator competes with the services for
  # the same CPU (a true remote client would not), and reaching `nginx`
  # directly skips the published-port hop -- the same edge, the same TLS
  # termination, one userland proxy less. Neither invalidates a baseline; both
  # change what the numbers are a baseline OF, so `run.sh` stamps which
  # generator produced each result.
  k6:
    profiles: ["load"]
    # Pinned like every other image here, and the pin is load-bearing: the
    # WebSocket scenarios import `k6/experimental/websockets`, and which name
    # that module answers to is a property of the binary, not of the script.
    # The harness imported the graduated `k6/net/websockets` for months on the
    # strength of a changelog; no released k6 provides it, and the whole run
    # aborts at init with `unknown module`. Verified against THIS tag.
    image: grafana/k6:1.3.0
    depends_on:
      # Readiness, not "started" -- the edge healthcheck crosses nginx INTO
      # the app, so a run that starts here cannot begin against a stack that
      # answers 502. The first minute of a 30-minute profile is the most
      # expensive place to discover that.
      nginx:
        condition: service_healthy
    # The same finding as `qdrant` above, for the opposite side of the wire:
    # `peak` holds 1,500 WebSockets open while driving 300 rps, and every one
    # of those is a file descriptor. Docker's inherited soft limit is 1024 --
    # the generator would shed load at roughly two thirds of the target and
    # the report would blame the platform.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    # And its other half. The first smoke run put 37,283 iterations through
    # this container in 20 seconds and started answering `dial tcp
    # 172.18.0.6:443: connect: cannot assign requested address` -- EADDRNOTAVAIL,
    # the generator running out of SOURCE PORTS in its own network namespace,
    # not the platform refusing anything. Docker's default ephemeral range is
    # ~28,000 ports and a closed socket holds one for the TIME_WAIT interval.
    # Both settings are net-namespaced, so neither touches the host.
    sysctls:
      net.ipv4.ip_local_port_range: "10000 65535"
      net.ipv4.tcp_fin_timeout: "15"
    # ONE directory, read-write, and nothing else of this repository: the
    # scripts, `tokens.json` (real credentials) and `results/`. `run.sh`
    # refuses a `LOAD_OUT` outside it rather than writing somewhere the
    # operator did not ask for.
    volumes:
      - ./deploy/load:/load
    working_dir: /load
    environment:
      # Inside this network the edge is `nginx`; `localhost` here is the
      # generator's own loopback. `run.sh` refuses the latter outright.
      LOAD_BASE_URL: ${LOAD_BASE_URL:-https://nginx}
      LOAD_TOKEN_FILE: ${LOAD_TOKEN_FILE:-/load/tokens.json}
      LOAD_OUT: ${LOAD_OUT-}
      LOAD_DURATION_S: ${LOAD_DURATION_S-}
      LOAD_WS_VUS: ${LOAD_WS_VUS-}
      LOAD_AGENT_KEY: ${LOAD_AGENT_KEY-}
      LOAD_PROMPT: ${LOAD_PROMPT-}
      LOAD_VERBOSE: ${LOAD_VERBOSE-}
      LOAD_ALLOW_PLAINTEXT: ${LOAD_ALLOW_PLAINTEXT-}
      LOAD_P95_GENERATION_S: ${LOAD_P95_GENERATION_S-}
      LOAD_STREAM_TIMEOUT_MS: ${LOAD_STREAM_TIMEOUT_MS-}
      LOAD_INDEX_POLL_S: ${LOAD_INDEX_POLL_S-}
      LOAD_INDEX_TIMEOUT_S: ${LOAD_INDEX_TIMEOUT_S-}
      LOAD_WS_HOLD_MS: ${LOAD_WS_HOLD_MS-}
      LOAD_WS_PING_MS: ${LOAD_WS_PING_MS-}
      # The seed declaration §0.1 condition (3) asks for. Empty is not a
      # default: `lib/config.js` marks the whole result invalid when these are
      # unstated, which is the point.
      LOAD_SEED_ID: ${LOAD_SEED_ID-}
      LOAD_SEED_MESSAGES: ${LOAD_SEED_MESSAGES-}
      LOAD_SEED_FILES: ${LOAD_SEED_FILES-}
      LOAD_SEED_VECTORS: ${LOAD_SEED_VECTORS-}
      LOAD_SEED_WORKSPACES: ${LOAD_SEED_WORKSPACES-}
      # Provenance `run.sh` computes on the host, where git and the Docker
      # socket are.
      RUN_COMMIT: ${RUN_COMMIT-}
      RUN_DIRTY: ${RUN_DIRTY-}
      RUN_IMAGES: ${RUN_IMAGES-}
      RUN_K6_VERSION: ${RUN_K6_VERSION-}
      RUN_HOST: ${RUN_HOST-}
      # How many source addresses this generator claims (capacity blocker
      # د‑8), and who owns the files it writes. Both are read by
      # `deploy/load/entrypoint.sh`, which explains the whole mechanism.
      LOAD_SRC_IPS: ${LOAD_SRC_IPS:-32}
      LOAD_UID: ${LOAD_UID-}
      LOAD_GID: ${LOAD_GID-}
    # ── The generator's own addresses (د‑8) ─────────────────────────────
    # The edge meters on `$$binary_remote_addr`, so a generator on ONE address
    # is metered as ONE client: the first honest peak run offered 300.1 rps and
    # the edge admitted 22.0, rejecting 92.7% with 429. That measured nginx's
    # `limit_req`, not this platform.
    #
    # `entrypoint.sh` therefore adds N secondary addresses and hands k6
    # `--local-ips`, so 300 rps from "hundreds of users" arrives from hundreds
    # of users' worth of addresses -- and NOTHING in `deploy/nginx/` changes,
    # which is what `م‑8` requires before a baseline exists. `ip addr add`
    # needs CAP_NET_ADMIN, which no unprivileged uid in this image has; the
    # entrypoint chowns `results/` back to `LOAD_UID` on the way out so the
    # bind mount is not left root-owned.
    #
    # Set LOAD_SRC_IPS=0 to run without any of it (and see the 22 rps again).
    #
    # `user: "0:0"` overrides the image's own `USER k6` (uid 12345): a granted
    # capability is only in the BOUNDING set for an unprivileged uid, so
    # `cap_add` alone still answers `RTNETLINK: Operation not permitted`.
    cap_add:
      - NET_ADMIN
    user: "0:0"
    entrypoint: ["/load/entrypoint.sh"]
    # A load run ends. `restart: "no"` is also what exempts it from the
    # healthcheck rule in `tests/unit/test_healthcheck_coverage.py`: a probe
    # on a container that exits by design reports on nothing.
    restart: "no"
    <<: *app-logging
volumes:
  postgres-data:
  redis-data:
  minio-data:
  qdrant-data:
  # Vault's OWN storage (KV v2 + Transit + AppRole) -- what makes the vault
  # service survive a restart at all (release-blockers-plan.md §3 step 1).
  vault-data:
  # Prometheus's TSDB. A named volume and not a bind: the series ARE the
  # baseline once step 0.5 runs, and 15 days of them must survive a
  # `docker compose up -d --force-recreate` that nobody thought of as
  # destructive.
  prometheus-data:
  # Grafana's own SQLite (users, sessions, starred dashboards). The
  # dashboards themselves are NOT here -- they are provisioned read-only
  # from deploy/grafana/dashboards, so losing this volume loses a password,
  # never a panel.
  grafana-data:
  # Loki's chunks + index (capacity 0.6). A named volume for the same reason
  # `prometheus-data` is one: the lines explaining a failed load run must
  # survive the `docker compose up -d --force-recreate` that nobody thought of
  # as destructive. NOT a durability tier all the same -- see deploy/loki/loki.yml.
  loki-data:
  # Alloy's read positions, one entry per log file. Losing it is not data loss;
  # it is every line being shipped a second time.
  alloy-data:
  # The unseal key + root token `deploy/vault/start.sh` writes at
  # `operator init` time. DELIBERATELY a separate volume from vault-data:
  # the data directory stays exactly what Vault itself owns, and this one
  # stays exactly what the bootstrap/recovery tooling owns.
  vault-init:
