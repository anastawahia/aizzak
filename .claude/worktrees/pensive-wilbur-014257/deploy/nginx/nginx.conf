# Nginx edge for the AIZZAK stack (08-local-runbook §2: reverse proxy · TLS ·
# WS upgrade). 7.1 built the :80 server; 7.3 added TLS termination on :443 and
# moved the shared proxy surface into app-locations.conf so the two servers
# cannot drift apart.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    # Uploads go DIRECTLY to MinIO via a presigned PUT, so no request body of
    # consequence passes through here. A small ceiling is the correct posture
    # for a JSON API.
    client_max_body_size 2m;

    # ── Rate limiting (P1-7, p1-hardening-plan.md §3 step 9) ───────────────
    # Before this, nothing sat between the internet and the agent loop except
    # the `usage` quota -- and that runs AFTER auth/authz, so an unauthenticated
    # attacker reached the auth/authz code itself with no ceiling at all.
    #
    # `zone=` directives are only legal in `http` (nginx refuses them in
    # `server`/`location`); the `limit_req`/`limit_conn` directives that
    # actually consume these zones live in app-locations.conf, included by
    # BOTH :80 and :443 below, so there is exactly one place either could
    # drift -- see that file's own header for why it is `include`d rather
    # than copied twice.
    #
    # Keyed by $binary_remote_addr. Verified LIVE against this exact stack
    # before choosing it (docs/log/3.88.md): a genuinely external connection
    # keeps the real client address through Docker's port-publish DNAT --
    # confirmed from nginx's own access log (`docker logs aizzak-nginx-1`,
    # access.log is symlinked to stdout by the base image, so `tail`ing the
    # file path directly self-deadlocks -- read it via `docker logs`, not
    # `docker exec ... tail`). Only a SAME-HOST connection -- e.g. a curl run
    # on the Docker host itself against 127.0.0.1 -- gets hairpin-NATed to the
    # bridge gateway (172.18.0.1 on this stack's `aizzak_default` network,
    # confirmed via `docker network inspect`) and would collapse into one
    # bucket. That never happens for a real client, and `/health` (the one
    # thing actually probed from the host) is excluded from rate limiting
    # regardless of hairpinning -- see app-locations.conf.
    #
    # `api_req`: 20 requests/second/IP, burst 40, `nodelay`. Generous on
    # purpose -- a shared office/carrier NAT must not be mistaken for one
    # abusive client. This is the coarse PRE-AUTH first line the plan (P1-7)
    # says does not exist yet; 07-nfr-slo's own per-USER cap (120 req/min) is
    # tighter and enforced POST-auth by `usage` -- the two are complementary,
    # not duplicates.
    limit_req_zone $binary_remote_addr zone=api_req:10m rate=20r/s;

    # `ws_conn`: bounds CONCURRENT connections, not a rate. A WebSocket
    # handshake is one request; the socket then stays open for the session,
    # so `limit_req` on it is a category error (a long-lived connection is
    # not a repeated request) -- app-locations.conf excludes `/api/v1/ws` from
    # `limit_req` entirely for exactly that reason. `limit_conn` instead caps
    # how many sockets one IP may hold open at once: well above realistic
    # legitimate concurrency behind a single NAT, purely an anti-exhaustion
    # ceiling. 07-nfr-slo's tighter 5-per-USER cap is enforced post-auth,
    # in-process (P1-8 / step 11 of this same plan, still open).
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # Match the API's own vocabulary for "too many requests" (03-api-spec's
    # `common.rate_limited` is already a 429) instead of nginx's own default
    # of 503 for a rejection at this layer. The BODY is nginx's plain default
    # error page, not an RFC 9457 `problem+json` document -- this layer never
    # reaches the app, so it cannot mint a `correlation_id` or match the
    # error catalog. A known, documented gap, not a silent one.
    limit_req_status  429;
    limit_conn_status 429;

    # ── Security headers (P1-7) ─────────────────────────────────────────────
    # ⚠️ NOT declared here — CORRECTED, not deleted, after shipping broken:
    # this comment originally said "these reach every response through both
    # server blocks without being declared twice" on the strength of "none of
    # the three locations in app-locations.conf declare an `add_header` of
    # their own" -- true, and NOT the whole rule. `add_header` is inherited by
    # a nested context ONLY IF that context defines NONE of its own, and the
    # `:443 server` block below WAS declaring one (`Strict-Transport-Security`,
    # a few lines down) -- so `:443`, the actual production path, silently
    # lost all three headers declared here, on every response. Verified live
    # (docs/log/3.88.md's correction section): a throwaway `nginx:1.27 --rm`
    # container proxying the exact broken config sent all three on :80 and
    # NONE on :443. `deploy/runpod/nginx.conf` had the identical shape with
    # only ONE server block, so it lost all three on every single request.
    #
    # The fix: all four `add_header` directives (these three + HSTS) now live
    # TOGETHER in app-locations.conf, included at `server` level by both
    # blocks below -- one declaration site, so there is no second copy for one
    # of the four to go missing from. `$hsts_header` stays defined here in
    # `map`, because `map` is only legal in `http`; only the directive that
    # CONSUMES it moved out.

    # ── HSTS (P1-7) -- a REAL setting, not a comment, gated per-HOST ────────
    # HSTS is enforced by the BROWSER per HOSTNAME, not per port or per
    # application (same reasoning as the :443 block below, restated there).
    # This exact nginx.conf runs, UNMODIFIED, on both this WSL dev box's
    # `localhost` and a real production hostname (deploy-linux-server.md §0:
    # "no special image, no restructuring" is the entire point of that
    # deployment). Baking a real `max-age` in here unconditionally would
    # poison `localhost` for every OTHER project on this machine the moment
    # this file is reused for local dev -- exactly what §3.76 already paid to
    # learn.
    #
    # `add_header` omits a header ENTIRELY when its value is the empty string
    # -- verified LIVE (docs/log/3.88.md): a throwaway `nginx:1.27 --rm`
    # container running this exact `map` sent NO `Strict-Transport-Security`
    # header at all for `Host: localhost`, and a real one for any other
    # `Host`. So the default below is true ABSENCE, not an empty/invalid
    # header a browser merely has to ignore.
    #
    # A real deployment adds ONE line here once it owns a real, STABLE
    # hostname with a real certificate (deploy-linux-server.md §10.3):
    #     "aizzak.example.com"  "max-age=63072000; includeSubDomains";
    # Nothing is listed by default -- this repository has never been deployed
    # under a hostname of its own, and inventing one here would be exactly
    # the "comment masquerading as a decision" this plan exists to close.
    map $host $hsts_header {
        default "";
    }

    # The Connection header nginx sends upstream: "upgrade" only when the
    # client actually asked for an upgrade, "close" otherwise. A blanket
    # `Connection: upgrade` on every proxied request breaks keep-alive for
    # ordinary traffic, which is why this is a map and not a constant.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS. Required for the per-request resolution that
    # app-locations.conf's variable destination depends on -- see the warning
    # at the top of that file for why an `upstream` block is not an option.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ── :80 ───────────────────────────────────────────────────────────────
    # Still serves the API rather than redirecting to :443. Local TLS uses a
    # self-signed certificate, so a blanket redirect would push every curl,
    # smoke script and container healthcheck onto a connection they must then
    # be told to distrust-but-accept -- friction with no security gain on a
    # loopback interface.
    #
    # A public deployment SHOULD redirect. That is one location, and it must
    # exclude the probe:
    #     location / { return 308 https://$host$request_uri; }
    # `/health` stays on :80 deliberately -- an L4/L7 load-balancer probe
    # chasing a redirect through TLS is a well-known way to make a healthy
    # backend look unhealthy.
    server {
        listen 80;
        server_name _;

        include /etc/nginx/app-locations.conf;
    }

    # ── :443 ──────────────────────────────────────────────────────────────
    # TLS terminates here (08 §2). The certificate is generated by the
    # `nginx-certs` one-shot service for local use; a real deployment mounts
    # its own material at the same two paths and changes nothing else.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.2 is the floor. 1.3 alone would be cleaner but still locks out
        # clients this platform has not surveyed; 1.0/1.1 are not offered at
        # all. `ssl_ciphers` is left at nginx's default, which is already
        # HIGH:!aNULL:!MD5 -- restating it here would freeze today's opinion
        # into a file nobody revisits.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Session reuse: a full handshake per connection is pure latency on an
        # API whose clients reconnect (SSE, WebSocket). Tickets are off because
        # without rotation they undermine forward secrecy.
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        # ⚠️ `add_header Strict-Transport-Security ...` does NOT live here.
        # An earlier version put it exactly here, alone, in this `server`
        # block -- which is precisely what silently deleted the three security
        # headers declared in the `http` block above from every response on
        # THIS server (nginx's `add_header` inheritance rule: declaring one in
        # a child context replaces the whole inherited set, not merges with
        # it). Verified live, corrected in docs/log/3.88.md's correction
        # section. All four `add_header` directives (HSTS + the three) now
        # live together in app-locations.conf, included below -- see that
        # file's header comment for the full mechanism and `$hsts_header`'s
        # `map` definition in the `http` block above for the per-host gate
        # itself (still legal only there).

        include /etc/nginx/app-locations.conf;
    }
}
